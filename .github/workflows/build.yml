name: Build DustinBot V11
on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - run: gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: DustinBotV11-debug
          path: app/build/outputs/apk/debug/app-debug.apk



v11_extract/README.md
# DustinBot V11 — Rune Classic

ฐานโปรเจกต์ Android สำหรับ Rune Classic โดยใช้ข้อมูล Monster ID ที่สกัดจาก `npcidentity.lub` ของ APK ที่ผู้ใช้ส่งมา

## V11 foundation
- Monster Database (`monster_database.json`)
- Target Selector
- MapScanner interface แยกจาก UI
- Accessibility gesture service
- MediaProjection capture host
- UI สำหรับค้นหา/เลือก Monster

## สิ่งที่ยังต้องต่อจาก runtime
`MapScanner` ยังเป็น boundary ไม่ใช่ตัวตรวจภาพสำเร็จรูป เพราะ APK ที่ตรวจพบข้อมูล Monster/Navigation แต่ไม่ได้มี Map→Mob spawn table แบบ text ที่อ่านได้ตรง ๆ ใน assets

ขั้นถัดไปคือ implement runtime adapter สำหรับ:
1. ตรวจ Map ปัจจุบัน
2. ตรวจ Monster ที่ปรากฏจริงบนหน้าจอ
3. map Monster ID → ตำแหน่ง x/y
4. ส่งผลให้ TargetSelector
5. ต่อ Navigation/Combat หลังจากตรวจผล scanner ได้

## V11 runtime scanner (current build)
- `RuntimeScanner` reads visible Accessibility nodes and matches them against the extracted Monster database.
- It records visible node bounds as target coordinates when the game exposes Monster names through accessibility.
- `BotController` runs a 350 ms scan loop and sends map/detected/selected-target state to the UI.
- `TargetSelector.choose()` selects a detected Monster that the user enabled.

### Important runtime limitation
If Rune Classic renders its world as a custom GPU/canvas surface and does not expose Monster names through Accessibility, `RuntimeScanner` will return no monsters. The next adapter should then consume MediaProjection frames and use verified visual/template/OCR recognition. The architecture is intentionally prepared for that adapter.



v11_extract/app/build.gradle
plugins { id 'com.android.application' }

android {
    namespace 'com.dustinbot.v11'
    compileSdk 35

    defaultConfig {
        applicationId 'com.dustinbot.v11'
        minSdk 26
        targetSdk 35
        versionCode 11
        versionName '11.0'
    }
}



v11_extract/app/src/main/AndroidManifest.xml
<manifest xmlns:android="http://schemas.android.com/apk/res/android">
    <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW" />
    <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
    <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MEDIA_PROJECTION" />

    <application android:allowBackup="false" android:label="@string/app_name" android:theme="@style/AppTheme">
        <activity android:name=".MainActivity" android:exported="true">
            <intent-filter>
                <action android:name="android.intent.action.MAIN" />
                <category android:name="android.intent.category.LAUNCHER" />
            </intent-filter>
        </activity>

        <service android:name=".BotAccessibilityService"
            android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE"
            android:exported="true">
            <intent-filter>
                <action android:name="android.accessibilityservice.AccessibilityService" />
            </intent-filter>
            <meta-data android:name="android.accessibilityservice" android:resource="@xml/accessibility_service_config" />
        </service>

        <service android:name=".CaptureService"
            android:exported="false"
            android:foregroundServiceType="mediaProjection" />
    </application>
</manifest>



