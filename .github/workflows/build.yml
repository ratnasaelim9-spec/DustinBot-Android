                          -1,
                          dp(55)
                      )
                  );

                  setContentView(root);
              }
          }
          EOF

          cat > app/src/main/java/com/dustinbot/v95/BotAccessibility.java <<'EOF'
          package com.dustinbot.v95;

          import android.accessibilityservice.AccessibilityService;
          import android.accessibilityservice.GestureDescription;

          import android.graphics.Bitmap;
          import android.graphics.ColorSpace;
          import android.graphics.Path;

          import android.hardware.HardwareBuffer;

          import android.os.Build;
          import android.os.Handler;
          import android.os.Looper;

          import android.view.Display;
          import android.view.Gravity;
          import android.view.View;
          import android.view.WindowManager;

          import android.graphics.PixelFormat;

          import android.widget.Button;
          import android.widget.LinearLayout;
          import android.widget.TextView;

          import java.util.concurrent.ExecutorService;
          import java.util.concurrent.Executors;

          public class BotAccessibility
              extends AccessibilityService {

              private final Handler handler =
                  new Handler(
                      Looper.getMainLooper()
                  );

              private final ExecutorService
                  screenshotExecutor =
                      Executors.newSingleThreadExecutor();

              private WindowManager
                  windowManager;

              private LinearLayout
                  panel;

              private TextView
                  status;

              private BotEngine
                  engine;

              @Override
              protected void onServiceConnected() {

                  super.onServiceConnected();

                  windowManager =
                      (WindowManager)
                      getSystemService(
                          WINDOW_SERVICE
                      );

                  engine =
                      new BotEngine(this);

                  createPanel();
              }

              private int dp(int value) {

                  return (int)(
                      value *
                      getResources()
                          .getDisplayMetrics()
                          .density +
                      0.5f
                  );
              }

              private void createPanel() {

                  panel =
                      new LinearLayout(this);

                  panel.setOrientation(
                      LinearLayout.VERTICAL
                  );

                  panel.setGravity(
                      Gravity.CENTER
                  );

                  panel.setPadding(
                      dp(8),
                      dp(6),
                      dp(8),
                      dp(6)
                  );

                  panel.setBackgroundColor(
                      0xEE111111
                  );

                  status =
                      new TextView(this);

                  status.setText(
                      "DUSTIN BOT V9.5\nSTOP"
                  );

                  status.setTextColor(
                      0xFFFFFFFF
                  );

                  status.setTextSize(12);

                  status.setGravity(
                      Gravity.CENTER
                  );

                  Button start =
                      new Button(this);

                  start.setText("START");

                  start.setOnClickListener(
                      v -> {

                          if (engine != null) {

                              engine.start();

                              status.setText(
                                  "DUSTIN BOT V9.5\nRUNNING"
                              );
                          }
                      }
                  );

                  Button stop =
                      new Button(this);

                  stop.setText("STOP");

                  stop.setOnClickListener(
                      v -> {

                          if (engine != null) {

                              engine.stop();

                              status.setText(
                                  "DUSTIN BOT V9.5\nSTOP"
                              );
                          }
                      }
                  );

                  Button hide =
                      new Button(this);

                  hide.setText("HIDE");

                  hide.setOnClickListener(
                      v -> {

                          if (panel != null) {

                              panel.setVisibility(
                                  View.GONE
                              );
                          }
                      }
                  );

                  panel.addView(
                      status,
                      new LinearLayout.LayoutParams(
                          dp(150),
                          dp(40)
                      )
                  );

                  panel.addView(
                      start,
                      new LinearLayout.LayoutParams(
                          dp(150),
                          dp(48)
                      )
                  );

                  panel.addView(
                      stop,
                      new LinearLayout.LayoutParams(
                          dp(150),
                          dp(48)
                      )
                  );

                  panel.addView(
                      hide,
                      new LinearLayout.LayoutParams(
                          dp(150),
                          dp(42)
                      )
                  );

                  WindowManager.LayoutParams params =
                      new WindowManager.LayoutParams(
                          dp(160),
                          dp(220),

                          WindowManager
                              .LayoutParams
                              .TYPE_ACCESSIBILITY_OVERLAY,

                          WindowManager
                              .LayoutParams
                              .FLAG_NOT_FOCUSABLE,

                          PixelFormat.TRANSLUCENT
                      );

                  /*
                   * ซ้ายบน
                   * ไม่บังเมนูเกมด้านขวา
                   */

                  params.gravity =
                      Gravity.TOP |
                      Gravity.START;

                  params.x =
                      dp(8);

                  params.y =
                      dp(70);

                  windowManager.addView(
                      panel,
                      params
                  );
              }

              public void tap(
                  float x,
                  float y
              ) {

                  Path path =
                      new Path();

                  path.moveTo(
                      x,
                      y
                  );

                  GestureDescription
                      .StrokeDescription stroke =
                          new GestureDescription
                              .StrokeDescription(
                                  path,
                                  0,
                                  70
                              );

                  GestureDescription gesture =
                      new GestureDescription
                          .Builder()
                          .addStroke(stroke)
                          .build();

                  dispatchGesture(
                      gesture,
                      null,
                      null
                  );
              }

              public void swipe(
                  float x1,
                  float y1,
                  float x2,
                  float y2,
                  long duration
              ) {

                  Path path =
                      new Path();

                  path.moveTo(
                      x1,
                      y1
                  );

                  path.lineTo(
                      x2,
                      y2
                  );

                  GestureDescription
                      .StrokeDescription stroke =
                          new GestureDescription
                              .StrokeDescription(
                                  path,
                                  0,
                                  duration
                              );

                  GestureDescription gesture =
                      new GestureDescription
                          .Builder()
                          .addStroke(stroke)
                          .build();

                  dispatchGesture(
                      gesture,
                      null,
                      null
                  );
              }

              public void screenshot(
                  ScreenshotCallback callback
              ) {

                  if (
                      Build.VERSION.SDK_INT < 30
                  ) {

                      callback.fail();

                      return;
                  }

                  takeScreenshot(
                      Display.DEFAULT_DISPLAY,
                      screenshotExecutor,

                      new TakeScreenshotCallback() {

                          @Override
                          public void onSuccess(
                              ScreenshotResult result
                          ) {

                              try {

                                  HardwareBuffer buffer =
                                      result
                                          .getHardwareBuffer();

                                  if (buffer == null) {

                                      callback.fail();

                                      return;
                                  }

                                  Bitmap temp =
                                      Bitmap
                                          .wrapHardwareBuffer(
                                              buffer,
                                              ColorSpace.get(
                                                  ColorSpace
                                                      .Named
                                                      .SRGB
                                              )
                                          );

                                  buffer.close();

                                  if (temp == null) {

                                      callback.fail();

                                      return;
                                  }

                                  Bitmap copy =
                                      temp.copy(
                                          Bitmap.Config
                                              .ARGB_8888,
                                          false
                                      );

                                  temp.recycle();

                                  if (copy == null) {

                                      callback.fail();

                                      return;
                                  }

                                  callback.ok(copy);

                              } catch (
                                  Throwable ignored
                              ) {

                                  callback.fail();
                              }
                          }

                          @Override
                          public void onFailure(
                              int errorCode
                          ) {

                              callback.fail();
                          }
                      }
                  );
              }

              public interface ScreenshotCallback {

                  void ok(Bitmap bitmap);

                  void fail();
              }

              @Override
              public void onAccessibilityEvent(
                  android.view.accessibility.AccessibilityEvent event
              ) {
              }

              @Override
              public void onInterrupt() {
              }

              @Override
              public void onDestroy() {

                  if (engine != null) {

                      engine.stop();
                  }

                  if (
                      panel != null &&
                      windowManager != null
                  ) {

                      try {

                          windowManager.removeView(
                              panel
                          );

                      } catch (
                          Throwable ignored
                      ) {
                      }
                  }

                  screenshotExecutor.shutdownNow();

                  super.onDestroy();
              }
          }
          EOF

          cat > app/src/main/java/com/dustinbot/v95/BotEngine.java <<'EOF'
          package com.dustinbot.v95;

          import android.os.Handler;
          import android.os.Looper;

          import java.util.Random;

          public class BotEngine {

              private final BotAccessibility service;

              private final Handler handler =
                  new Handler(
                      Looper.getMainLooper()
                  );

              private final Random random =
                  new Random();

              private boolean running =
                  false;

              private int W =
                  1842;

              private int H =
                  832;

              private int lastDirection =
                  -1;

              private int attackCount =
                  0;

              private int lootCount =
                  0;

              /*
               * ==================================================
               * GAME COORDINATES
               * ==================================================
               *
               * ปรับจากคลิปที่ส่งมา
               *
               * ปุ่มดาบอยู่เกือบชิดขอบขวา
               *
               */

              private static final float
                  ATTACK_X = 0.960f;

              private static final float
                  ATTACK_Y = 0.820f;

              /*
               * ปุ่มเก็บของ
               */

              private static final float
                  LOOT_X = 0.960f;

              private static final float
                  LOOT_Y = 0.925f;

              /*
               * Joystick
               *
               * จากคลิปอยู่ประมาณ
               * 20% จากซ้าย
               */

              private static final float
                  JOY_X = 0.205f;

              private static final float
                  JOY_Y = 0.820f;

              /*
               * เมนูเป้าหมาย
               *
               * ใช้เฉพาะตอน refresh target
               */

              private static final float
                  MENU_X = 0.860f;

              private static final float
                  MENU_Y = 0.150f;

              /*
               * ตัวเลือก Auto Lock
               */

              private static final float
                  AUTO_X = 0.860f;

              private static final float
                  AUTO_Y = 0.245f;


              public BotEngine(
                  BotAccessibility service
              ) {

                  this.service =
                      service;
              }


              /*
               * ==================================================
               * START
               * ==================================================
               */

              public void start() {

                  if (running) {
                      return;
                  }

                  running = true;

                  attackCount = 0;

                  lootCount = 0;

                  lastDirection = -1;

                  /*
                   * เริ่มด้วยการหาเป้า
                   */

                  later(
                      this::enableAutoLock,
                      600
                  );
              }


              /*
               * ==================================================
               * STOP
               * ==================================================
               */

              public void stop() {

                  running = false;

                  handler.removeCallbacksAndMessages(
                      null
                  );
              }


              /*
               * ==================================================
               * AUTO LOCK
               * ==================================================
               */

              private void enableAutoLock() {

                  if (!running) {
                      return;
                  }

                  /*
                   * เปิดเมนู
                   */

                  service.tap(
                      W * MENU_X,
                      H * MENU_Y
                  );

                  later(
                      () -> {

                          if (!running) {
                              return;
                          }

                          /*
                           * เลือก Auto Lock
                           */

                          service.tap(
                              W * AUTO_X,
                              H * AUTO_Y
                          );

                          later(
                              this::randomSearch,
                              500
                          );

                      },
                      350
                  );
              }


              /*
               * ==================================================
               * RANDOM SEARCH
               * ==================================================
               */

              private void randomSearch() {

                  if (!running) {
                      return;
                  }

                  int direction;

                  /*
                   * ไม่เดินทิศเดิมติดกัน
                   */

                  do {

                      direction =
                          random.nextInt(8);

                  } while (
                      direction ==
                          lastDirection
                  );

                  lastDirection =
                      direction;

                  /*
                   * 8 ทิศ
                   */

                  float[][] dirs = {

                      { 0f, -1f },

                      { 0.707f, -0.707f },

                      { 1f, 0f },

                      { 0.707f, 0.707f },

                      { 0f, 1f },

                      { -0.707f, 0.707f },

                      { -1f, 0f },

                      { -0.707f, -0.707f }

                  };

                  float dx =
                      dirs[direction][0];

                  float dy =
                      dirs[direction][1];

                  long duration =
                      450 +
                      random.nextInt(
                          800
                      );

                  joystick(
                      dx,
                      dy,
                      duration
                  );

                  /*
                   * เดินเสร็จ
                   * ลองตี
                   */

                  later(
                      this::attackSequence,
                      duration + 350
                  );
              }


              /*
               * ==================================================
               * ATTACK
               * ==================================================
               */

              private void attackSequence() {

                  if (!running) {
                      return;
                  }

                  attackCount = 0;

                  attackStep();
              }


              private void attackStep() {

                  if (!running) {
                      return;
                  }

                  attackCount++;

                  /*
                   * ปุ่มดาบ
                   *
                   * จุดสำคัญของ V9.5
                   */

                  service.tap(
                      W * ATTACK_X,
                      H * ATTACK_Y
                  );

                  /*
                   * กดซ้ำอีกครั้งหลัง 120ms
                   */

                  later(
                      () -> {

                          if (!running) {
                              return;
                          }

                          service.tap(
                              W * ATTACK_X,
                              H * ATTACK_Y
                          );

                      },
                      120
                  );

                  /*
                   * ตี 6 รอบ
                   */

                  if (
                      attackCount < 6
                  ) {

                      later(
                          this::attackStep,
                          500
                      );

                      return;
                  }

                  attackCount = 0;

                  /*
                   * เก็บของ
                   */

                  later(
                      this::lootStart,
                      700
                  );
              }


              /*
               * ==================================================
               * LOOT
               * ==================================================
               */

              private void lootStart() {

                  if (!running) {
                      return;
                  }

                  lootCount = 0;

                  lootStep();
              }


              private void lootStep() {

                  if (!running) {
                      return;
                  }

                  lootCount++;

                  /*
                   * กดปุ่มเก็บของ
                   */

                  service.tap(
                      W * LOOT_X,
                      H * LOOT_Y
                  );

                  /*
                   * ขยับเล็กน้อย
                   */

                  float dx = 0f;

                  float dy = 0f;

                  switch (
                      lootCount % 4
                  ) {

                      case 0:

                          dx = 1f;

                          break;

                      case 1:

                          dy = 1f;

                          break;

                      case 2:

                          dx = -1f;

                          break;

                      default:

                          dy = -1f;

                          break;
                  }

                  joystick(
                      dx,
                      dy,
                      130
                  );

                  if (
                      lootCount < 5
                  ) {

                      later(
                          this::lootStep,
                          300
                      );

                  } else {

                      lootCount = 0;

                      /*
                       * หา Monster ตัวต่อไป
                       */

                      later(
                          this::nextTarget,
                          600
                      );
                  }
              }


              /*
               * ==================================================
               * NEXT TARGET
               * ==================================================
               */

              private void nextTarget() {

                  if (!running) {
                      return;
                  }

                  /*
                   * เดินสุ่มต่อทันที
                   *
                   * ไม่หยุด
                   */

                  randomSearch();
              }


              /*
               * ==================================================
               * JOYSTICK
               * ==================================================
               */

              private void joystick(
                  float dx,
                  float dy,
                  long duration
              ) {

                  if (!running) {
                      return;
                  }

                  float centerX =
                      W * JOY_X;

                  float centerY =
                      H * JOY_Y;

                  float radius =
                      Math.min(
                          W,
                          H
                      ) * 0.105f;

                  float endX =
                      centerX +
                      dx * radius;

                  float endY =
                      centerY +
                      dy * radius;

                  service.swipe(
                      centerX,
                      centerY,
                      endX,
                      endY,
                      duration
                  );

                  /*
                   * ปล่อย joystick
                   */

                  later(
                      () -> {

                          if (!running) {
                              return;
                          }

                          service.tap(
                              centerX,
                              centerY
                          );

                      },
                      duration + 70
                  );
              }


              /*
               * ==================================================
               * TIMER
               * ==================================================
               */

              private void later(
                  Runnable runnable,
                  long delay
              ) {

                  if (
                      runnable == null
                  ) {

                      return;
                  }

                  handler.postDelayed(
                      runnable,
                      delay
                  );
              }
          }
          EOF

      - name: Validate project
        shell: bash
        run: |
          set -e

          echo "================================"
          echo "DUSTIN BOT V9.5"
          echo "================================"

          find app/src/main -type f | sort

          echo ""
          echo "Java files:"
          find app/src/main/java -name "*.java" -print

      - name: Build APK
        shell: bash
        run: |
          set -e

          gradle \
            :app:assembleDebug \
            --no-daemon \
            --stacktrace

      - name: Prepare APK
        shell: bash
        run: |
          set -e

          mkdir -p output

          cp \
            app/build/outputs/apk/debug/app-debug.apk \
            output/DustinBotV9.5-FULL-AUTO.apk

