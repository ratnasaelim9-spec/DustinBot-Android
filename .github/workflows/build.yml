              private TextView text(
                  String s,
                  float size
              ) {


                  TextView v =
                      new TextView(this);


                  v.setText(s);

                  v.setTextSize(size);

                  v.setTextColor(
                      Color.DKGRAY
                  );

                  v.setPadding(
                      8,
                      8,
                      8,
                      8
                  );


                  return v;

              }


              private Button button(
                  String s,
                  android.view.View.OnClickListener l
              ) {


                  Button b =
                      new Button(this);


                  b.setText(s);

                  b.setTextSize(13);

                  b.setOnClickListener(l);


                  return b;

              }


              private LinearLayout.LayoutParams
              weight() {


                  return new LinearLayout.LayoutParams(
                      0,
                      -2,
                      1
                  );

              }


              public static void status(
                  String s
              ) {


                  if (self == null)
                      return;


                  self.runOnUiThread(() -> {

                      if (
                          self.statusView != null
                      ) {

                          self.statusView.setText(
                              "● " + s
                          );

                      }

                  });

              }


              public static void log(
                  String s
              ) {


                  if (self == null)
                      return;


                  self.runOnUiThread(() -> {

                      if (
                          self.console == null
                      )
                          return;


                      TextView v =
                          self.text(
                              s,
                              13
                          );


                      self.console.addView(v);

                  });

              }

          }

