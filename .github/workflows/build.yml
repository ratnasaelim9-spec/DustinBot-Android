name: DUSTIN BOT V9.5 FULL AUTO

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Create Android Project
        shell: bash
        run: |
          set -e

          rm -rf app

          mkdir -p app/src/main/java/com/dustinbot/v95
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/xml

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(
                  RepositoriesMode.FAIL_ON_PROJECT_REPOS
              )

              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "DustinBotV95"

          include(":app")
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.6.1' apply false
          }
          EOF

          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=false
          android.nonTransitiveRClass=true
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.dustinbot.v95'

              compileSdk 35

              defaultConfig {
                  applicationId 'com.dustinbot.v95'
                  minSdk 30
                  targetSdk 35
                  versionCode 95
                  versionName '9.5'
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          EOF

          cat > app/src/main/res/values/strings.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="app_name">DUSTIN BOT V9.5</string>
              <string name="accessibility_description">DUSTIN BOT controls the visible game interface using Android Accessibility.</string>
          </resources>
          EOF

          cat > app/src/main/res/values/styles.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style
                  name="AppTheme"
                  parent="@android:style/Theme.Material.Light.NoActionBar">

                  <item name="android:fontFamily">sans</item>
                  <item name="android:windowLightStatusBar">true</item>
                  <item name="android:colorAccent">#2196F3</item>

              </style>
          </resources>
          EOF

          cat > app/src/main/res/xml/accessibility_service_config.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <accessibility-service
              xmlns:android="http://schemas.android.com/apk/res/android"
              android:accessibilityEventTypes="typeAllMask"
              android:accessibilityFeedbackType="feedbackGeneric"
              android:notificationTimeout="100"
              android:canRetrieveWindowContent="true"
              android:canPerformGestures="true"
              android:canTakeScreenshot="true"
              android:description="@string/accessibility_description"
              android:accessibilityFlags="flagDefault|flagReportViewIds|flagRetrieveInteractiveWindows" />
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <application
                  android:allowBackup="false"
                  android:label="@string/app_name"
                  android:supportsRtl="true"
                  android:theme="@style/AppTheme">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>

                  </activity>

                  <service
                      android:name=".BotAccessibility"
                      android:exported="false"
                      android:label="@string/app_name"
                      android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE">

                      <intent-filter>
                          <action android:name="android.accessibilityservice.AccessibilityService" />
                      </intent-filter>

                      <meta-data
                          android:name="android.accessibilityservice"
                          android:resource="@xml/accessibility_service_config" />

                  </service>

              </application>

          </manifest>
          EOF

          cat > app/src/main/java/com/dustinbot/v95/MainActivity.java <<'EOF'
          package com.dustinbot.v95;

          import android.app.Activity;
          import android.content.Intent;
          import android.graphics.Color;
          import android.os.Bundle;
          import android.provider.Settings;
          import android.view.Gravity;
          import android.widget.Button;
          import android.widget.LinearLayout;
          import android.widget.TextView;

          public class MainActivity extends Activity {

              private int dp(int value) {
                  return (int)(
                      value *
                      getResources()
                          .getDisplayMetrics()
                          .density +
                      0.5f
                  );
              }

              @Override
              protected void onCreate(Bundle state) {

                  super.onCreate(state);

                  LinearLayout root =
                      new LinearLayout(this);

                  root.setOrientation(
                      LinearLayout.VERTICAL
                  );

                  root.setGravity(
                      Gravity.CENTER
                  );

                  root.setPadding(
                      dp(24),
                      dp(24),
                      dp(24),
                      dp(24)
                  );

                  root.setBackgroundColor(
                      Color.rgb(20,20,24)
                  );

                  TextView title =
                      new TextView(this);

                  title.setText(
                      "DUSTIN BOT V9.5"
                  );

                  title.setTextColor(
                      Color.WHITE
                  );

                  title.setTextSize(26);

                  title.setGravity(
                      Gravity.CENTER
                  );

                  TextView info =
                      new TextView(this);

                  info.setText(
                      "FULL AUTO BOT\n\n" +
                      "เปิด Dustin RO ก่อน\n" +
                      "เปิด Accessibility\n" +
                      "กลับเข้าเกม\n" +
                      "กด START\n\n" +
                      "Random Walk\n" +
                      "Auto Target\n" +
                      "Attack\n" +
                      "Loot\n" +
                      "Repeat"
                  );

                  info.setTextColor(
                      Color.LTGRAY
                  );

                  info.setTextSize(16);

                  info.setGravity(
                      Gravity.CENTER
                  );

                  info.setPadding(
                      0,
                      dp(20),
                      0,
                      dp(20)
                  );

                  Button settings =
                      new Button(this);

                  settings.setText(
                      "เปิด Accessibility"
                  );

                  settings.setOnClickListener(
                      v -> startActivity(
                          new Intent(
                              Settings.ACTION_ACCESSIBILITY_SETTINGS
                          )
                      )
                  );

                  root.addView(
                      title,
                      new LinearLayout.LayoutParams(
                          -1,
                          dp(60)
                      )
                  );

                  root.addView(
                      info,
                      new LinearLayout.LayoutParams(
                          -1,
                          -2
                      )
                  );

                  root.addView(
                      settings,
