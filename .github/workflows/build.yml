          cat > app/src/main/java/com/dustinbot/v2/MainActivity.java <<'EOF'
          package com.dustinbot.v2;

          import android.app.Activity;
          import android.content.Intent;
          import android.graphics.Color;
          import android.os.Bundle;
          import android.provider.Settings;
          import android.view.Gravity;
          import android.view.View;
          import android.widget.Button;
          import android.widget.LinearLayout;
          import android.widget.ScrollView;
          import android.widget.TextView;

          public class MainActivity extends Activity
                  implements BotEngine.Listener {

              private TextView status;
              private TextView console;
              private TextView character;
              private TextView target;

              private BotEngine bot;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  buildUI();

                  bot = new BotEngine(
                          this,
                          this
                  );
              }

              private int dp(int value) {
                  return (int) (
                          value *
                          getResources()
                                  .getDisplayMetrics()
                                  .density
                  );
              }

              private TextView label(
                      String text
              ) {

                  TextView v = new TextView(this);

                  v.setText(text);
                  v.setTextColor(Color.WHITE);
                  v.setTextSize(18);
                  v.setPadding(
                          dp(12),
                          dp(12),
                          dp(12),
                          dp(12)
                  );

                  return v;
              }

              private Button button(
                      String text
              ) {

                  Button b = new Button(this);

                  b.setText(text);
                  b.setTextSize(14);

                  return b;
              }

              private void buildUI() {

                  LinearLayout root =
                          new LinearLayout(this);

                  root.setOrientation(
                          LinearLayout.VERTICAL
                  );

                  root.setPadding(
                          dp(10),
                          dp(10),
                          dp(10),
                          dp(10)
                  );

                  root.setBackgroundColor(
                          Color.rgb(
                                  8,
                                  13,
                                  18
                          )
                  );

                  TextView title =
                          label(
                                  "DUSTINBOT ANDROID V2"
                          );

                  title.setTextSize(24);
                  title.setGravity(
                          Gravity.CENTER
                  );

                  root.addView(title);

                  status =
                          label(
                                  "STATUS: STOP"
                          );

                  root.addView(status);

                  MapPanel map =
                          new MapPanel(this);

                  root.addView(
                          map,
                          new LinearLayout.LayoutParams(
                                  -1,
                                  dp(260)
                          )
                  );

                  character =
                          label(
                                  "CHARACTER\n" +
                                  "Level: --\n" +
                                  "Job: --\n" +
                                  "HP: --\n" +
                                  "SP: --"
                          );

                  root.addView(character);

                  target =
                          label(
                                  "TARGET\n" +
                                  "Monster: GAME LOCK\n" +
                                  "HP: --\n" +
                                  "Distance: --\n" +
                                  "State: --"
                          );

                  root.addView(target);

                  LinearLayout menu =
                          new LinearLayout(this);

                  menu.setOrientation(
                          LinearLayout.HORIZONTAL
                  );

                  Button monsters =
                          button("MONSTERS");

                  Button items =
                          button("ITEMS");

                  Button skills =
                          button("SKILLS");

                  menu.addView(
                          monsters,
                          new LinearLayout.LayoutParams(
                                  0,
                                  -2,
                                  1
                          )
                  );

                  menu.addView(
                          items,
                          new LinearLayout.LayoutParams(
                                  0,
                                  -2,
                                  1
                          )
                  );

                  menu.addView(
                          skills,
                          new LinearLayout.LayoutParams(
                                  0,
                                  -2,
                                  1
                          )
                  );

                  root.addView(menu);

                  TextView calibrationTitle =
                          label(
                                  "CALIBRATION"
                          );

                  root.addView(
                          calibrationTitle
                  );

                  Button move =
                          button(
                                  "SET MOVE POSITION"
                          );

                  move.setOnClickListener(
                          v -> openCalibration(
                                  Calibration.MODE_MOVE
                          )
                  );

                  root.addView(move);

                  Button attack =
                          button(
                                  "SET ATTACK POSITION"
                          );

                  attack.setOnClickListener(
                          v -> openCalibration(
                                  Calibration.MODE_ATTACK
                          )
                  );

                  root.addView(attack);

                  Button loot =
                          button(
                                  "SET LOOT POSITION"
                          );

                  loot.setOnClickListener(
                          v -> openCalibration(
                                  Calibration.MODE_LOOT
                          )
                  );

                  root.addView(loot);

                  Button accessibility =
                          button(
                                  "OPEN ACCESSIBILITY"
                          );

                  accessibility.setOnClickListener(
                          v -> {

                              try {

                                  Intent intent =
                                          new Intent(
                                                  Settings.ACTION_ACCESSIBILITY_SETTINGS
                                          );

                                  startActivity(intent);

                              } catch (Exception e) {

                                  appendConsole(
                                          "เปิด Accessibility ไม่สำเร็จ"
                                  );
                              }
                          }
                  );

                  root.addView(accessibility);

                  LinearLayout controls =
                          new LinearLayout(this);

                  controls.setOrientation(
                          LinearLayout.HORIZONTAL
                  );

                  Button start =
                          button("START BOT");

                  start.setOnClickListener(
                          v -> bot.start()
                  );

                  Button stop =
                          button("STOP BOT");

                  stop.setOnClickListener(
                          v -> bot.stop()
                  );

                  controls.addView(
                          start,
                          new LinearLayout.LayoutParams(
                                  0,
                                  -2,
                                  1
                          )
                  );

                  controls.addView(
                          stop,
                          new LinearLayout.LayoutParams(
                                  0,
                                  -2,
                                  1
                          )
                  );

                  root.addView(controls);

                  TextView consoleTitle =
                          label(
                                  "CONSOLE"
                          );

                  root.addView(
                          consoleTitle
                  );

                  console =
                          label(
                                  "DustinBot initialized."
                          );

                  ScrollView consoleScroll =
                          new ScrollView(this);

                  consoleScroll.addView(
                          console
                  );

                  root.addView(
                          consoleScroll,
                          new LinearLayout.LayoutParams(
                                  -1,
                                  dp(180)
                          )
                  );

                  ScrollView scroll =
                          new ScrollView(this);

                  scroll.addView(root);

                  setContentView(scroll);
              }

              private void openCalibration(
                      String mode
              ) {

                  Intent intent =
                          new Intent(
                                  this,
                                  Calibration.class
                          );

                  intent.putExtra(
                          "mode",
                          mode
                  );

                  startActivity(intent);
              }

              private void appendConsole(
                      String message
              ) {

                  if (console == null) {
                      return;
                  }

                  console.append(
                          "\n> " + message
                  );
              }

              @Override
              public void onState(
                      String state
              ) {

                  runOnUiThread(
                          () -> status.setText(
                                  "STATUS: " + state
                          )
                  );
              }

              @Override
              public void onConsole(
                      String message
              ) {

                  runOnUiThread(
                          () -> appendConsole(message)
                  );
              }

              @Override
              protected void onDestroy() {

                  if (bot != null) {
                      bot.stop();
                  }

                  super.onDestroy();
              }
          }
          EOF

      - name: Generate Gradle wrapper
        run: |
          set -e

          if [ ! -f gradlew ]; then
            curl -L \
              https://services.gradle.org/distributions/gradle-8.7-bin.zip \
              -o /tmp/gradle.zip

            mkdir -p /tmp/gradle

            unzip -q \
              /tmp/gradle.zip \
              -d /tmp/gradle

            /tmp/gradle/gradle-8.7/bin/gradle wrapper \
              --gradle-version 8.7
          fi

      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew clean assembleDebug --stacktrace

      - name: Check APK
        run: |
          echo "APK files:"
          find app/build/outputs/apk -type f -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DustinBot-Android-V2
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
