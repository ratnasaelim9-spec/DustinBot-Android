name: Build DustinBot Android V1.1

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Create project
        run: |
          mkdir -p app/src/main/java/com/dustinbot
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/xml

          cat > settings.gradle <<'EOF'
          pluginManagement {
            repositories {
              google()
              mavenCentral()
              gradlePluginPortal()
            }
          }
          dependencyResolutionManagement {
            repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
            repositories {
              google()
              mavenCentral()
            }
          }
          rootProject.name="DustinBot"
          include ":app"
          EOF

          cat > build.gradle <<'EOF'
          plugins {
            id 'com.android.application' version '8.6.1' apply false
          }
          EOF

          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m
          android.useAndroidX=true
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
            id 'com.android.application'
          }

          android {
            namespace 'com.dustinbot'
            compileSdk 35

            defaultConfig {
              applicationId 'com.dustinbot'
              minSdk 26
              targetSdk 35
              versionCode 11
              versionName '1.1'
            }
          }
          EOF

          cat > app/src/main/res/values/strings.xml <<'EOF'
          <resources>
            <string name="app_name">DustinBot</string>
            <string name="accessibility_description">DustinBot game controller</string>
          </resources>
          EOF

          cat > app/src/main/res/values/themes.xml <<'EOF'
          <resources>
            <style name="AppTheme"
              parent="android:style/Theme.Material.Light.NoActionBar">
              <item name="android:fontFamily">sans</item>
              <item name="android:colorAccent">#1976D2</item>
            </style>
          </resources>
          EOF

          cat > app/src/main/res/xml/accessibility.xml <<'EOF'
          <accessibility-service
            xmlns:android="http://schemas.android.com/apk/res/android"
            android:description="@string/accessibility_description"
            android:accessibilityEventTypes="typeWindowStateChanged|typeWindowContentChanged"
            android:accessibilityFeedbackType="feedbackGeneric"
            android:canPerformGestures="true"
            android:canRetrieveWindowContent="true"
            android:notificationTimeout="100"/>
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

            <application
              android:theme="@style/AppTheme"
              android:label="@string/app_name"
              android:allowBackup="false">

              <activity
                android:name=".MainActivity"
                android:exported="true">

                <intent-filter>
                  <action android:name="android.intent.action.MAIN"/>
                  <category android:name="android.intent.category.LAUNCHER"/>
                </intent-filter>

              </activity>

              <service
                android:name=".BotAccessibility"
                android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE"
                android:exported="false">

                <intent-filter>
                  <action android:name="android.accessibilityservice.AccessibilityService"/>
                </intent-filter>

                <meta-data
                  android:name="android.accessibilityservice"
                  android:resource="@xml/accessibility"/>

              </service>

            </application>
          </manifest>
          EOF

          cat > app/src/main/java/com/dustinbot/BotAccessibility.java <<'EOF'
          package com.dustinbot;

          import android.accessibilityservice.*;
          import android.graphics.Path;
          import android.view.accessibility.AccessibilityEvent;

          public class BotAccessibility extends AccessibilityService {

            public static BotAccessibility instance;

            @Override
            protected void onServiceConnected() {
              super.onServiceConnected();
              instance=this;
            }

            @Override
            public void onAccessibilityEvent(AccessibilityEvent e) {}

            @Override
            public void onInterrupt() {}

            public boolean tap(float x,float y) {
              Path p=new Path();
              p.moveTo(x,y);

              GestureDescription g=
                new GestureDescription.Builder()
                .addStroke(
                  new GestureDescription.StrokeDescription(
                    p,0,70))
                .build();

              return dispatchGesture(g,null,null);
            }

            public boolean swipe(
              float x1,float y1,
              float x2,float y2,
              long time) {

              Path p=new Path();
              p.moveTo(x1,y1);
              p.lineTo(x2,y2);

              GestureDescription g=
                new GestureDescription.Builder()
                .addStroke(
                  new GestureDescription.StrokeDescription(
                    p,0,time))
                .build();

              return dispatchGesture(g,null,null);
            }
          }
          EOF

          cat > app/src/main/java/com/dustinbot/MainActivity.java <<'EOF'
          package com.dustinbot;

          import android.app.*;
          import android.content.*;
          import android.graphics.Color;
          import android.os.Bundle;
          import android.provider.Settings;
          import android.view.Gravity;
          import android.widget.*;

          public class MainActivity extends Activity {

            LinearLayout root;
            TextView status;

            Button button(String text) {
              Button b=new Button(this);
              b.setText(text);
              b.setTextSize(16);
              return b;
            }

            @Override
            protected void onCreate(Bundle b) {
              super.onCreate(b);

              root=new LinearLayout(this);
              root.setOrientation(LinearLayout.VERTICAL);
              root.setPadding(25,25,25,25);
              root.setGravity(Gravity.CENTER);
              root.setBackgroundColor(Color.WHITE);

              TextView title=new TextView(this);
              title.setText("DUSTINBOT ANDROID V1.1");
              title.setTextSize(25);
              title.setTextColor(Color.BLACK);
              title.setGravity(Gravity.CENTER);
              root.addView(title);

              TextView info=new TextView(this);
              info.setText(
                "\nเดิน → เกมล็อกเป้า → ตี → เก็บของ → เดินต่อ\n");
              info.setTextSize(17);
              info.setGravity(Gravity.CENTER);
              root.addView(info);

              Button access=button("1. เปิด ACCESSIBILITY");
              access.setOnClickListener(v ->
                startActivity(
                  new Intent(Settings.ACTION_ACCESSIBILITY_SETTINGS)));
              root.addView(access);

              Button move=button("2. ตั้งปุ่มเดิน");
              move.setOnClickListener(v ->
                show("เดิน"));
              root.addView(move);

              Button attack=button("3. ตั้งปุ่มตี");
              attack.setOnClickListener(v ->
                show("ตี"));
              root.addView(attack);

              Button loot=button("4. ตั้งปุ่มเก็บของ");
              loot.setOnClickListener(v ->
                show("เก็บของ"));
              root.addView(loot);

              Button test=button("5. ทดสอบ Accessibility");
              test.setOnClickListener(v -> {

                if(BotAccessibility.instance==null) {
                  status.setText("Accessibility ยังไม่พร้อม");
                  return;
                }

                status.setText("Accessibility พร้อมใช้งาน");
              });

              root.addView(test);

              status=new TextView(this);
              status.setText("\nสถานะ: STOP");
              status.setTextSize(17);
              status.setGravity(Gravity.CENTER);
              root.addView(status);

              setContentView(root);
            }

            void show(String name) {
              if(BotAccessibility.instance==null) {
                status.setText(
                  "กรุณาเปิด Accessibility ก่อน");
                return;
              }

              status.setText(
                "พร้อมตั้งตำแหน่งปุ่ม: "+name);
            }
          }
          EOF

      - name: Build APK
        run: |
          gradle wrapper --gradle-version 8.7
          chmod +x gradlew
          ./gradlew clean assembleDebug

      - name: Check APK
        run: |
          test -f app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DustinBot-Android-V1.1
          path: app/build/outputs/apk/debug/app-debug.apk
