name: Dustin Bot V10 - Auto Move Attack Loot

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Create project
        shell: bash
        run: |
          set -e

          rm -rf app
          mkdir -p app/src/main/java/com/dustinbot/v10
          mkdir -p app/src/main/res/xml
          mkdir -p app/src/main/res/values

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "DustinBotV10"
          include(":app")
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.6.1' apply false
          }
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.dustinbot.v10'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.dustinbot.v10'
                  minSdk 30
                  targetSdk 35
                  versionCode 10
                  versionName '10.0'
              }
          }
          EOF

          cat > app/src/main/res/values/colors.xml <<'EOF'
          <resources>
              <color name="black">#000000</color>
              <color name="white">#FFFFFF</color>
          </resources>
          EOF

          cat > app/src/main/res/values/styles.xml <<'EOF'
          <resources>

              <style name="AppTheme"
                  parent="@android:style/Theme.Material.NoActionBar">

                  <item name="android:fontFamily">sans</item>
                  <item name="android:windowLightStatusBar">false</item>
                  <item name="android:statusBarColor">#101010</item>
                  <item name="android:navigationBarColor">#101010</item>
                  <item name="android:colorAccent">#00E676</item>

              </style>

          </resources>
          EOF

          cat > app/src/main/res/xml/accessibility_service_config.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>

          <accessibility-service
              xmlns:android="http://schemas.android.com/apk/res/android"

              android:accessibilityEventTypes="typeAllMask"
              android:accessibilityFeedbackType="feedbackGeneric"
              android:notificationTimeout="100"
              android:canRetrieveWindowContent="true"
              android:canPerformGestures="true"
              android:canTakeScreenshot="true"
              android:description="@string/accessibility_description" />
          EOF

          cat > app/src/main/res/values/strings.xml <<'EOF'
          <resources>

              <string name="app_name">Dustin Bot V10</string>

              <string name="accessibility_description">
                  Dustin Bot V10 screen automation
              </string>

          </resources>
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>

          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW" />

              <application
                  android:allowBackup="false"
                  android:label="@string/app_name"
                  android:theme="@style/AppTheme"
                  android:supportsRtl="true">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>

                  </activity>

                  <service
                      android:name=".BotAccessibility"
                      android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE"
                      android:exported="false">

                      <intent-filter>
                          <action android:name="android.accessibilityservice.AccessibilityService" />
                      </intent-filter>

                      <meta-data
                          android:name="android.accessibilityservice"
                          android:resource="@xml/accessibility_service_config" />

                  </service>

              </application>

          </manifest>
          EOF

          cat > app/src/main/java/com/dustinbot/v10/MainActivity.java <<'EOF'
          package com.dustinbot.v10;

          import android.app.Activity;
          import android.content.Intent;
          import android.graphics.Color;
          import android.net.Uri;
          import android.os.Bundle;
          import android.provider.Settings;
          import android.view.Gravity;
          import android.view.View;
          import android.widget.Button;
          import android.widget.LinearLayout;
          import android.widget.TextView;

          public class MainActivity extends Activity {

              private TextView status;

              @Override
              protected void onCreate(Bundle b) {
                  super.onCreate(b);

                  LinearLayout root = new LinearLayout(this);
                  root.setOrientation(LinearLayout.VERTICAL);
                  root.setPadding(30, 40, 30, 30);
                  root.setGravity(Gravity.CENTER_HORIZONTAL);
                  root.setBackgroundColor(Color.rgb(15, 15, 15));

                  TextView title = new TextView(this);
                  title.setText("DUSTIN BOT V10");
                  title.setTextColor(Color.WHITE);
                  title.setTextSize(26);
                  title.setGravity(Gravity.CENTER);
                  root.addView(title);

                  TextView info = new TextView(this);
                  info.setText(
                      "\nAUTO MOVE + AUTO ATTACK + AUTO LOOT\n\n" +
                      "1. เปิด Accessibility ให้ Dustin Bot\n" +
                      "2. เปิดเกม Dustin RO\n" +
                      "3. กด START จากแผงบอท\n"
                  );
                  info.setTextColor(Color.LTGRAY);
                  info.setTextSize(16);
                  root.addView(info);

                  Button accessibility = new Button(this);
                  accessibility.setText("เปิด Accessibility");
                  root.addView(accessibility);

                  accessibility.setOnClickListener(v -> {
                      Intent i = new Intent(
                          Settings.ACTION_ACCESSIBILITY_SETTINGS
                      );
                      startActivity(i);
                  });

                  Button overlay = new Button(this);
                  overlay.setText("เปิดแผง BOT");
                  root.addView(overlay);

                  overlay.setOnClickListener(v -> {
                      if (!Settings.canDrawOverlays(this)) {
                          Intent i = new Intent(
                              Settings.ACTION_MANAGE_OVERLAY_PERMISSION,
                              Uri.parse("package:" + getPackageName())
                          );
                          startActivity(i);
                      } else {
                          BotAccessibility.showPanel();
                      }
                  });

                  status = new TextView(this);
                  status.setTextColor(Color.GREEN);
                  status.setTextSize(15);
                  status.setGravity(Gravity.CENTER);
                  status.setPadding(10, 30, 10, 10);
                  root.addView(status);

                  status.setText(
                      "V10 พร้อมทำงาน\n" +
                      "ใช้ Screen + Accessibility"
                  );

                  setContentView(root);
              }
          }
          EOF

          cat > app/src/main/java/com/dustinbot/v10/BotAccessibility.java <<'EOF'
          package com.dustinbot.v10;

          import android.accessibilityservice.AccessibilityService;
          import android.accessibilityservice.GestureDescription;
          import android.graphics.Bitmap;
          import android.graphics.Path;
          import android.graphics.PixelFormat;
          import android.hardware.HardwareBuffer;
          import android.os.Handler;
          import android.os.Looper;
          import android.provider.Settings;
          import android.view.Gravity;
          import android.view.WindowManager;
          import android.widget.Button;
          import android.widget.LinearLayout;
          import android.widget.TextView;

          public class BotAccessibility extends AccessibilityService {

              private static BotAccessibility instance;

              private WindowManager wm;
              private LinearLayout panel;
              private TextView stateText;

              private BotEngine engine;

              public static void showPanel() {
                  if (instance != null) {
                      instance.showFloatingPanel();
                  }
              }

              @Override
              protected void onServiceConnected() {
                  super.onServiceConnected();

                  instance = this;

                  engine = new BotEngine(this);
              }

              @Override
              public void onAccessibilityEvent(
                      android.view.accessibility.AccessibilityEvent event) {
              }

              @Override
              public void onInterrupt() {
                  if (engine != null) {
                      engine.stop();
                  }
              }

              @Override
              public void onDestroy() {
                  if (engine != null) {
                      engine.stop();
                  }

                  if (panel != null && wm != null) {
                      try {
                          wm.removeView(panel);
                      } catch (Exception ignored) {
                      }
                  }

                  instance = null;

                  super.onDestroy();
              }

              private void showFloatingPanel() {

                  if (panel != null) {
                      return;
                  }

                  wm = (WindowManager)
                      getSystemService(WINDOW_SERVICE);

                  panel = new LinearLayout(this);

                  panel.setOrientation(LinearLayout.VERTICAL);
                  panel.setPadding(18, 14, 18, 14);
                  panel.setBackgroundColor(0xDD111111);

                  stateText = new TextView(this);
                  stateText.setText("DUSTIN BOT V10\nSTOP");
                  stateText.setTextColor(0xFFFFFFFF);
                  stateText.setTextSize(13);

                  panel.addView(stateText);

                  LinearLayout buttons =
                      new LinearLayout(this);

                  buttons.setOrientation(
                      LinearLayout.HORIZONTAL
                  );

                  Button start = new Button(this);
                  start.setText("START");

                  Button stop = new Button(this);
                  stop.setText("STOP");

                  Button hide = new Button(this);
                  hide.setText("HIDE");

                  buttons.addView(start);
                  buttons.addView(stop);
                  buttons.addView(hide);

                  panel.addView(buttons);

                  start.setOnClickListener(v -> {
                      if (engine != null) {
                          engine.start();
                      }
                  });

                  stop.setOnClickListener(v -> {
                      if (engine != null) {
                          engine.stop();
                      }
                  });

                  hide.setOnClickListener(v -> {
                      if (panel != null) {
                          try {
                              wm.removeView(panel);
                          } catch (Exception ignored) {
                          }

                          panel = null;
                      }
                  });

                  WindowManager.LayoutParams lp =
                      new WindowManager.LayoutParams();

                  lp.width =
                      WindowManager.LayoutParams.WRAP_CONTENT;

                  lp.height =
                      WindowManager.LayoutParams.WRAP_CONTENT;

                  lp.gravity = Gravity.TOP | Gravity.RIGHT;

                  lp.x = 15;
                  lp.y = 80;

                  lp.type =
                      WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY;

                  lp.flags =
                      WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE;

                  lp.format = PixelFormat.TRANSLUCENT;

                  wm.addView(panel, lp);
              }

              public void updateState(String text) {

                  if (stateText == null) {
                      return;
                  }

                  new Handler(Looper.getMainLooper()).post(() -> {

                      if (stateText != null) {
                          stateText.setText(
                              "DUSTIN BOT V10\n" + text
                          );
                      }

                  });
              }

              public void tap(float x, float y) {

                  Path path = new Path();
                  path.moveTo(x, y);

                  GestureDescription.StrokeDescription stroke =
                      new GestureDescription.StrokeDescription(
                          path,
                          0,
                          80
                      );

                  GestureDescription gesture =
                      new GestureDescription.Builder()
                          .addStroke(stroke)
                          .build();

                  dispatchGesture(
                      gesture,
                      null,
                      null
                  );
              }

              public void swipe(
                      float x1,
                      float y1,
                      float x2,
                      float y2,
                      long duration) {

                  Path path = new Path();

                  path.moveTo(x1, y1);
                  path.lineTo(x2, y2);

                  GestureDescription.StrokeDescription stroke =
                      new GestureDescription.StrokeDescription(
                          path,
                          0,
                          duration
                      );

                  GestureDescription gesture =
                      new GestureDescription.Builder()
                          .addStroke(stroke)
                          .build();

                  dispatchGesture(
                      gesture,
                      null,
                      null
                  );
              }

              public void screenshot(
                      android.os.Handler handler,
                      BotEngine.ScreenCallback callback) {

                  takeScreenshot(
                      android.view.Display.DEFAULT_DISPLAY,
                      getMainExecutor(),
                      new TakeScreenshotCallback() {

                          @Override
                          public void onSuccess(
                              ScreenshotResult result) {

                              HardwareBuffer buffer =
                                  result.getHardwareBuffer();

                              if (buffer == null) {
                                  callback.onBitmap(null);
                                  return;
                              }

                              Bitmap bitmap =
                                  Bitmap.wrapHardwareBuffer(
                                      buffer,
                                      result.getColorSpace()
                                  );

                              Bitmap copy = null;

                              if (bitmap != null) {
                                  copy = bitmap.copy(
                                      Bitmap.Config.ARGB_8888,
                                      false
                                  );

                                  bitmap.recycle();
                              }

                              buffer.close();

                              callback.onBitmap(copy);
                          }

                          @Override
                          public void onFailure(int errorCode) {
                              callback.onBitmap(null);
                          }
                      }
                  );
              }
          }
          EOF

          cat > app/src/main/java/com/dustinbot/v10/Vision.java <<'EOF'
          package com.dustinbot.v10;

          import android.graphics.Bitmap;
          import android.graphics.Color;

          public class Vision {

              public static class Point {
                  public float x;
                  public float y;

                  public Point(float x, float y) {
                      this.x = x;
                      this.y = y;
                  }
              }

              /*
               * Dustin game is normally landscape.
               *
               * We look for the small bright target marker
               * inside the gameplay area.
               *
               * This detector deliberately avoids the bottom UI
               * and top menu area.
               */

              public static Point findTargetArrow(Bitmap b) {

                  if (b == null) {
                      return null;
                  }

                  int w = b.getWidth();
                  int h = b.getHeight();

                  int left = (int)(w * 0.20f);
                  int right = (int)(w * 0.88f);

                  int top = (int)(h * 0.10f);
                  int bottom = (int)(h * 0.72f);

                  Point best = null;
                  double bestScore = 0;

                  /*
                   * Search small bright clusters.
                   */

                  for (int y = top; y < bottom; y += 4) {

                      for (int x = left; x < right; x += 4) {

                          int bright = 0;
                          int total = 0;

                          for (int yy = -7; yy <= 7; yy += 2) {

                              for (int xx = -10; xx <= 10; xx += 2) {

                                  int px = x + xx;
                                  int py = y + yy;

                                  if (px < 0 ||
                                      py < 0 ||
                                      px >= w ||
                                      py >= h) {
                                      continue;
                                  }

                                  int c = b.getPixel(px, py);

                                  int r = Color.red(c);
                                  int g = Color.green(c);
                                  int bl = Color.blue(c);

                                  int min =
                                      Math.min(r, Math.min(g, bl));

                                  int max =
                                      Math.max(r, Math.max(g, bl));

                                  /*
                                   * White/gray marker.
                                   */

                                  if (min > 175 &&
                                      max - min < 55) {
                                      bright++;
                                  }

                                  total++;
                              }
                          }

                          float ratio =
                              total == 0
                                  ? 0
                                  : (float)bright / total;

                          if (ratio < 0.28f ||
                              ratio > 0.82f) {
                              continue;
                          }

                          /*
                           * Check that the region below the
                           * marker is darker / more varied.
                           * This helps reject large bright UI
                           * regions and terrain.
                           */

                          int belowBright = 0;
                          int belowTotal = 0;

                          for (int yy = 5; yy <= 25; yy += 4) {

                              for (int xx = -12; xx <= 12; xx += 4) {

                                  int px = x + xx;
                                  int py = y + yy;

                                  if (px < 0 ||
                                      py < 0 ||
                                      px >= w ||
                                      py >= h) {
                                      continue;
                                  }

                                  int c = b.getPixel(px, py);

                                  int r = Color.red(c);
                                  int g = Color.green(c);
                                  int bl = Color.blue(c);

                                  if (r > 170 &&
                                      g > 170 &&
                                      bl > 170) {
                                      belowBright++;
                                  }

                                  belowTotal++;
                              }
                          }

                          float belowRatio =
                              belowTotal == 0
                                  ? 0
                                  : (float)belowBright / belowTotal;

                          double score =
                              ratio * 100.0
                              - belowRatio * 50.0;

                          /*
                           * Prefer targets near the
                           * central gameplay area.
                           */

                          float cx = w * 0.50f;
                          float distance =
                              Math.abs(x - cx) / w;

                          score -= distance * 20.0;

                          if (score > bestScore) {

                              bestScore = score;

                              /*
                               * Monster is normally
                               * directly below arrow.
                               */

                              best = new Point(
                                  x,
                                  Math.min(
                                      y + 35,
                                      bottom
                                  )
                              );
                          }
                      }
                  }

                  return best;
              }

              public static boolean screenChanged(
                      Bitmap a,
                      Bitmap b) {

                  if (a == null || b == null) {
                      return false;
                  }

                  int w =
                      Math.min(
                          a.getWidth(),
                          b.getWidth()
                      );

                  int h =
                      Math.min(
                          a.getHeight(),
                          b.getHeight()
                      );

                  long diff = 0;
                  long count = 0;

                  /*
                   * Ignore UI edges.
                   */

                  for (
                      int y = (int)(h * 0.15);
                      y < (int)(h * 0.75);
                      y += 12
                  ) {

                      for (
                          int x = (int)(w * 0.15);
                          x < (int)(w * 0.90);
                          x += 12
                      ) {

                          int ca = a.getPixel(x, y);
                          int cb = b.getPixel(x, y);

                          int ar = Color.red(ca);
                          int ag = Color.green(ca);
                          int ab = Color.blue(ca);

                          int br = Color.red(cb);
                          int bg = Color.green(cb);
                          int bb = Color.blue(cb);

                          diff +=
                              Math.abs(ar - br)
                              + Math.abs(ag - bg)
                              + Math.abs(ab - bb);

                          count++;
                      }
                  }

                  if (count == 0) {
                      return false;
                  }

                  double average =
                      (double)diff / count;

                  return average > 8.0;
              }
          }
          EOF

          cat > app/src/main/java/com/dustinbot/v10/BotEngine.java <<'EOF'
          package com.dustinbot.v10;

          import android.graphics.Bitmap;
          import android.os.Handler;
          import android.os.Looper;

          public class BotEngine {

              public interface ScreenCallback {
                  void onBitmap(Bitmap bitmap);
              }

              private final BotAccessibility service;
              private final Handler handler =
                  new Handler(Looper.getMainLooper());

              private boolean running = false;

              /*
               * Relative screen positions.
               *
               * These are based on the 1842x832
               * landscape Dustin screenshots.
               */

              private static final float JOY_X = 0.138f;
              private static final float JOY_Y = 0.785f;

              private static final float ATTACK_X = 0.850f;
              private static final float ATTACK_Y = 0.815f;

              private static final float LOOT_X = 0.965f;
              private static final float LOOT_Y = 0.840f;

              /*
               * Approximate center of player/camera.
               */

              private static final float PLAYER_X = 0.500f;
              private static final float PLAYER_Y = 0.470f;

              /*
               * Distance at which we consider the monster
               * close enough to attack.
               */

              private static final float ATTACK_DISTANCE = 0.105f;

              private int attackAttempts = 0;
              private int walkAttempts = 0;
              private int noTargetCount = 0;

              private Bitmap lastFrame = null;

              public BotEngine(BotAccessibility service) {
                  this.service = service;
              }

              public void start() {

                  if (running) {
                      return;
                  }

                  running = true;

                  attackAttempts = 0;
                  walkAttempts = 0;
                  noTargetCount = 0;

                  service.updateState(
                      "START\nLOCK TARGET"
                  );

                  /*
                   * First activate auto target.
                   *
                   * Coordinates are normalized so the
                   * bot works with different resolutions.
                   */

                  handler.postDelayed(
                      this::openAutoTarget,
                      500
                  );
              }

              public void stop() {

                  running = false;

                  handler.removeCallbacksAndMessages(null);

                  service.updateState("STOP");
              }

              private void openAutoTarget() {

                  if (!running) {
                      return;
                  }

                  int w = getEstimatedWidth();
                  int h = getEstimatedHeight();

                  /*
                   * V9 target menu position.
                   */

                  service.tap(
                      w * 0.755f,
                      h * 0.075f
                  );

                  handler.postDelayed(
                      this::pressAutoLock,
                      350
                  );
              }

              private void pressAutoLock() {

                  if (!running) {
                      return;
                  }

                  int w = getEstimatedWidth();
                  int h = getEstimatedHeight();

                  /*
                   * Menu item "ล็อคเป้าอัตโนมัติ".
                   *
                   * This is intentionally kept separate
                   * from the "ติดตาม" button.
                   */

                  service.tap(
                      w * 0.755f,
                      h * 0.155f
                  );

                  handler.postDelayed(
                      this::searchTarget,
                      700
                  );
              }

              private int getEstimatedWidth() {
                  return 1842;
              }

              private int getEstimatedHeight() {
                  return 832;
              }

              private void searchTarget() {

                  if (!running) {
                      return;
                  }

                  service.updateState(
                      "SEARCH TARGET"
                  );

                  service.screenshot(
                      handler,
                      bitmap -> {

                          if (!running) {
                              recycle(bitmap);
                              return;
                          }

                          if (bitmap == null) {

                              handler.postDelayed(
                                  this::searchTarget,
                                  500
                              );

                              return;
                          }

                          Vision.Point target =
                              Vision.findTargetArrow(bitmap);

                          if (target == null) {

                              recycle(bitmap);

                              noTargetCount++;

                              /*
                               * Re-open auto target if no
                               * target is visible for a while.
                               */

                              if (noTargetCount >= 4) {

                                  noTargetCount = 0;

                                  handler.postDelayed(
                                      this::openAutoTarget,
                                      300
                                  );

                              } else {

                                  handler.postDelayed(
                                      this::searchTarget,
                                      450
                                  );
                              }

                              return;
                          }

                          noTargetCount = 0;

                          recycle(bitmap);

                          moveOrAttack(target);
                      }
                  );
              }

              private void moveOrAttack(
                      Vision.Point target) {

                  if (!running) {
                      return;
                  }

                  int w = getEstimatedWidth();
                  int h = getEstimatedHeight();

                  float tx =
                      target.x / w;

                  float ty =
                      target.y / h;

                  float dx =
                      tx - PLAYER_X;

                  float dy =
                      ty - PLAYER_Y;

                  double distance =
                      Math.sqrt(
                          dx * dx +
                          dy * dy
                      );

                  if (
                      distance <=
                      ATTACK_DISTANCE
                  ) {

                      walkAttempts = 0;

                      attack();
                      return;
                  }

                  /*
                   * Target is farther away.
                   *
                   * Move using joystick.
                   */

                  walkTowards(dx, dy);
              }

              private void walkTowards(
                      float dx,
                      float dy) {

                  if (!running) {
                      return;
                  }

                  walkAttempts++;

                  service.updateState(
                      "MOVE TO TARGET\n" +
                      "STEP " + walkAttempts
                  );

                  float length =
                      (float)Math.sqrt(
                          dx * dx + dy * dy
                      );

                  if (length < 0.001f) {
                      handler.postDelayed(
                          this::searchTarget,
                          200
                      );
                      return;
                  }

                  dx /= length;
                  dy /= length;

                  int w = getEstimatedWidth();
                  int h = getEstimatedHeight();

                  float joyX =
                      w * JOY_X;

                  float joyY =
                      h * JOY_Y;

                  /*
                   * Joystick radius.
                   *
                   * We deliberately use short pulses
                   * instead of holding the joystick
                   * indefinitely.
                   */

                  float radius =
                      Math.min(w, h) * 0.105f;

                  float endX =
                      joyX + dx * radius;

                  float endY =
                      joyY + dy * radius;

                  /*
                   * Keep joystick movement inside
                   * the joystick control area.
                   */

                  endX = clamp(
                      endX,
                      joyX - radius,
                      joyX + radius
                  );

                  endY = clamp(
                      endY,
                      joyY - radius,
                      joyY + radius
                  );

                  service.swipe(
                      joyX,
                      joyY,
                      endX,
                      endY,
                      320
                  );

                  /*
                   * Release by tapping the joystick center
                   * after the movement pulse.
                   */

                  handler.postDelayed(
                      () -> {

                          if (!running) {
                              return;
                          }

                          service.tap(
                              joyX,
                              joyY
                          );

                          /*
                           * Re-screenshot and recalculate
                           * target position.
                           */

                          handler.postDelayed(
                              this::searchTarget,
                              350
                          );

                      },
                      360
                  );
              }

              private void attack() {

                  if (!running) {
                      return;
                  }

                  attackAttempts++;

                  service.updateState(
                      "ATTACK\n" +
                      "TRY " + attackAttempts
                  );

                  int w = getEstimatedWidth();
                  int h = getEstimatedHeight();

                  /*
                   * Save frame before attack.
                   */

                  service.screenshot(
                      handler,
                      before -> {

                          if (!running) {
                              recycle(before);
                              return;
                          }

                          lastFrame = before;

                          service.tap(
                              w * ATTACK_X,
                              h * ATTACK_Y
                          );

                          handler.postDelayed(
                              () -> checkAttackResult(
                                  lastFrame
                              ),
                              450
                          );
                      }
                  );
              }

              private void checkAttackResult(
                      Bitmap before) {

                  if (!running) {
                      recycle(before);
                      return;
                  }

                  service.screenshot(
                      handler,
                      after -> {

                          boolean changed =
                              Vision.screenChanged(
                                  before,
                                  after
                              );

                          recycle(before);
                          recycle(after);

                          if (changed) {

                              /*
                               * Damage / animation / target
                               * movement detected.
                               */

                              attackAttempts = 0;
                              walkAttempts = 0;

                              service.updateState(
                                  "COMBAT"
                              );

                              handler.postDelayed(
                                  this::attack,
                                  650
                              );

                              return;
                          }

                          /*
                           * No visible combat response.
                           *
                           * Check whether the target is still
                           * far away.
                           */

                          if (attackAttempts < 3) {

                              /*
                               * Try attacking again before
                               * deciding that movement is needed.
                               */

                              handler.postDelayed(
                                  this::attack,
                                  300
                              );

                              return;
                          }

                          attackAttempts = 0;

                          service.updateState(
                              "TARGET OUT OF RANGE\nMOVE"
                          );

                          handler.postDelayed(
                              this::searchTarget,
                              200
                          );
                      }
                  );
              }

              /*
               * Kept for future loot verification.
               *
               * Current sequence uses the game's visible
               * loot button after combat timeout.
               */

              private void loot() {

                  if (!running) {
                      return;
                  }

                  service.updateState(
                      "LOOT"
                  );

                  int w = getEstimatedWidth();
                  int h = getEstimatedHeight();

                  service.tap(
                      w * LOOT_X,
                      h * LOOT_Y
                  );

                  handler.postDelayed(
                      () -> {

                          attackAttempts = 0;
                          walkAttempts = 0;

                          searchTarget();

                      },
                      500
                  );
              }

              private float clamp(
                      float value,
                      float min,
                      float max) {

                  return Math.max(
                      min,
                      Math.min(max, value)
                  );
              }

              private void recycle(Bitmap b) {

                  if (b != null &&
                      !b.isRecycled()) {

                      b.recycle();
                  }
              }
          }
          EOF

      - name: Build APK
        shell: bash
        run: |
          set -e

          gradle --version

          gradle \
            --no-daemon \
            --stacktrace \
            :app:assembleDebug

      - name: Prepare APK
        shell: bash
        run: |
          mkdir -p output

          cp \
            app/build/outputs/apk/debug/app-debug.apk \
            output/DustinBotV10.apk

          ls -lh output/DustinBotV10.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DustinBotV10
          path: output/DustinBotV10.apk
