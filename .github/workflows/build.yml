package com.dustinbot.v11;

/**
 * Runtime map/mob detection boundary. V11 deliberately keeps this separate
 * from the UI so OCR/image recognition or a verified game-data adapter can be
 * added without changing TargetSelector or Combat.
 */
public interface MapScanner {
    String currentMap();
    java.util.List<DetectedMonster> scan();

    final class DetectedMonster {
        public final int id; public final float x; public final float y; public final float distance;
        public DetectedMonster(int id,float x,float y,float distance){this.id=id;this.x=x;this.y=y;this.distance=distance;}
    }
}



