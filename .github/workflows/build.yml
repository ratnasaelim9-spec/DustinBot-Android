name: DustinBot Android V9 AUTO COMBAT

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Create V9 project
        shell: bash
        run: |
          set -e

          mkdir -p app/src/main/java/com/dustinbot/v9
          mkdir -p app/src/main/res/xml
          mkdir -p app/src/main/res/values

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "DustinBotV9"
          include(":app")
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.6.1' apply false
          }
          EOF

          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=false
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.dustinbot.v9'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.dustinbot.v9'
                  minSdk 30
                  targetSdk 35
                  versionCode 90
                  versionName '9.0'
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          EOF

          cat > app/src/main/res/values/strings.xml <<'EOF'
          <resources>
              <string name="app_name">DustinBot V9</string>
              <string name="accessibility_description">DustinBot V9 screen automation</string>
          </resources>
          EOF

          cat > app/src/main/res/values/styles.xml <<'EOF'
          <resources>
              <style name="DustinBotTheme"
                     parent="@android:style/Theme.Material.NoActionBar">
                  <item name="android:fontFamily">sans</item>
                  <item name="android:windowNoTitle">true</item>
                  <item name="android:colorAccent">#00C853</item>
                  <item name="android:statusBarColor">#000000</item>
                  <item name="android:navigationBarColor">#000000</item>
              </style>
          </resources>
          EOF

          cat > app/src/main/res/xml/accessibility_service_config.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>

          <accessibility-service
              xmlns:android="http://schemas.android.com/apk/res/android"
              android:accessibilityEventTypes="typeWindowStateChanged|typeWindowContentChanged"
              android:accessibilityFeedbackType="feedbackGeneric"
              android:notificationTimeout="100"
              android:canRetrieveWindowContent="true"
              android:canPerformGestures="true"
              android:canTakeScreenshot="true"
              android:description="@string/accessibility_description" />
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>

          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <application
                  android:allowBackup="false"
                  android:label="@string/app_name"
                  android:theme="@style/DustinBotTheme">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>

                  </activity>

                  <service
                      android:name=".BotAccessibility"
                      android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE"
                      android:exported="false">

                      <intent-filter>
                          <action android:name="android.accessibilityservice.AccessibilityService" />
                      </intent-filter>

                      <meta-data
                          android:name="android.accessibilityservice"
                          android:resource="@xml/accessibility_service_config" />

                  </service>

              </application>

          </manifest>
          EOF

          cat > app/src/main/java/com/dustinbot/v9/GameLauncher.java <<'EOF'
          package com.dustinbot.v9;

          import android.content.Context;
          import android.content.Intent;
          import android.content.pm.PackageManager;
          import android.content.pm.ResolveInfo;

          import java.util.List;
          import java.util.Locale;

          public final class GameLauncher {

              private GameLauncher() {}

              public static boolean open(Context context) {

                  PackageManager pm =
                          context.getPackageManager();

                  Intent query =
                          new Intent(Intent.ACTION_MAIN);

                  query.addCategory(
                          Intent.CATEGORY_LAUNCHER
                  );

                  List<ResolveInfo> apps =
                          pm.queryIntentActivities(
                                  query,
                                  0
                          );

                  String fallback = null;

                  for (ResolveInfo info : apps) {

                      String label =
                              String.valueOf(
                                      info.loadLabel(pm)
                              ).toLowerCase(
                                      Locale.ROOT
                              );

                      String pkg =
                              info.activityInfo
                                      .packageName
                                      .toLowerCase(
                                              Locale.ROOT
                                      );

                      if (label.contains("dustin")
                              || pkg.contains("dustin")) {

                          return launch(
                                  context,
                                  info.activityInfo
                                          .packageName
                          );
                      }

                      if (label.contains("ragnarok")
                              || label.equals("ro")) {

                          fallback =
                                  info.activityInfo
                                          .packageName;
                      }
                  }

                  if (fallback != null) {

                      return launch(
                              context,
                              fallback
                      );
                  }

                  return false;
              }

              private static boolean launch(
                      Context context,
                      String packageName) {

                  Intent intent =
                          context.getPackageManager()
                                  .getLaunchIntentForPackage(
                                          packageName
                                  );

                  if (intent == null) {
                      return false;
                  }

                  intent.addFlags(
                          Intent.FLAG_ACTIVITY_NEW_TASK
                                  | Intent.FLAG_ACTIVITY_RESET_TASK_IF_NEEDED
                  );

                  context.startActivity(intent);

                  return true;
              }
          }
          EOF

          cat > app/src/main/java/com/dustinbot/v9/BotAccessibility.java <<'EOF'
          package com.dustinbot.v9;

          import android.accessibilityservice.AccessibilityService;
          import android.accessibilityservice.GestureDescription;

          import android.graphics.Bitmap;
          import android.graphics.ColorSpace;
          import android.graphics.Path;

          import android.hardware.HardwareBuffer;

          import android.os.Handler;
          import android.os.Looper;

          import android.view.Display;
          import android.view.accessibility.AccessibilityEvent;

          import java.util.concurrent.Executor;
          import java.util.concurrent.Executors;
          import java.util.function.Consumer;

          public class BotAccessibility
                  extends AccessibilityService {

              public static BotAccessibility instance;

              private final Handler handler =
                      new Handler(
                              Looper.getMainLooper()
                      );

              private final Executor screenshotExecutor =
                      Executors.newSingleThreadExecutor();

              private BotEngine engine;

              @Override
              protected void onServiceConnected() {

                  super.onServiceConnected();

                  instance = this;

                  engine =
                          new BotEngine(
                                  this,
                                  handler
                          );
              }

              @Override
              public void onAccessibilityEvent(
                      AccessibilityEvent event) {
              }

              @Override
              public void onInterrupt() {
              }

              public void startBot() {

                  if (engine != null) {
                      engine.start();
                  }
              }

              public void stopBot() {

                  if (engine != null) {
                      engine.stop();
                  }
              }

              public void screenshot(
                      Consumer<Bitmap> callback) {

                  try {

                      takeScreenshot(
                              Display.DEFAULT_DISPLAY,
                              screenshotExecutor,

                              new TakeScreenshotCallback() {

                                  @Override
                                  public void onSuccess(
                                          ScreenshotResult result) {

                                      Bitmap bitmap = null;
                                      HardwareBuffer buffer = null;

                                      try {

                                          buffer =
                                                  result.getHardwareBuffer();

                                          ColorSpace colorSpace =
                                                  result.getColorSpace();

                                          if (buffer == null) {
                                              callback.accept(null);
                                              return;
                                          }

                                          Bitmap hardwareBitmap =
                                                  Bitmap.wrapHardwareBuffer(
                                                          buffer,
                                                          colorSpace
                                                  );

                                          if (hardwareBitmap == null) {
                                              callback.accept(null);
                                              return;
                                          }

                                          /*
                                           * Copy to normal bitmap
                                           * before closing HardwareBuffer.
                                           */

                                          bitmap =
                                                  hardwareBitmap.copy(
                                                          Bitmap.Config.ARGB_8888,
                                                          false
                                                  );

                                          hardwareBitmap.recycle();

                                          callback.accept(bitmap);

                                      } catch (Throwable t) {

                                          if (bitmap != null
                                                  && !bitmap.isRecycled()) {

                                              bitmap.recycle();
                                          }

                                          callback.accept(null);

                                      } finally {

                                          if (buffer != null) {
                                              buffer.close();
                                          }
                                      }
                                  }

                                  @Override
                                  public void onFailure(
                                          int errorCode) {

                                      callback.accept(null);
                                  }
                              }
                      );

                  } catch (Throwable t) {

                      callback.accept(null);
                  }
              }

              public void tap(
                      int x,
                      int y) {

                  Path path =
                          new Path();

                  path.moveTo(
                          x,
                          y
                  );

                  GestureDescription.StrokeDescription stroke =
                          new GestureDescription.StrokeDescription(
                                  path,
                                  0,
                                  70
                          );

                  dispatchGesture(
                          new GestureDescription.Builder()
                                  .addStroke(stroke)
                                  .build(),
                          null,
                          null
                  );
              }

              public void swipe(
                      int x1,
                      int y1,
                      int x2,
                      int y2,
                      long duration) {

                  Path path =
                          new Path();

                  path.moveTo(
                          x1,
                          y1
                  );

                  path.lineTo(
                          x2,
                          y2
                  );

                  GestureDescription.StrokeDescription stroke =
                          new GestureDescription.StrokeDescription(
                                  path,
                                  0,
                                  Math.max(
                                          100,
                                          duration
                                  )
                          );

                  dispatchGesture(
                          new GestureDescription.Builder()
                                  .addStroke(stroke)
                                  .build(),
                          null,
                          null
                  );
              }
          }
          EOF

          cat > app/src/main/java/com/dustinbot/v9/BotEngine.java <<'EOF'
          package com.dustinbot.v9;

          import android.graphics.Bitmap;
          import android.os.Handler;

          public final class BotEngine {

              private final BotAccessibility service;
              private final Handler handler;

              private boolean running;

              /*
               * Screen size used by the game in the
               * supplied screenshots is approximately
               * 1842 x 832.
               *
               * All coordinates below are proportional,
               * so different screen sizes can still work.
               */

              private static final long GAME_WAIT = 6000;

              private static final long LOCK_MENU_WAIT = 500;

              private static final long LOCK_WAIT = 1000;

              private static final long ATTACK_INTERVAL = 1100;

              private static final long TARGET_TIMEOUT = 12000;

              private static final long LOOT_WAIT = 900;

              private static final long SEARCH_WAIT = 700;

              private static final int MAX_NO_COMBAT = 4;

              private int noCombatCount;

              private long attackStartedAt;

              private Bitmap beforeAttack;

              private boolean attackCycle;

              BotEngine(
                      BotAccessibility service,
                      Handler handler) {

                  this.service = service;
                  this.handler = handler;
              }

              public void start() {

                  if (running) {
                      return;
                  }

                  running = true;

                  noCombatCount = 0;
                  attackStartedAt = 0;
                  attackCycle = false;

                  recycle(
                          beforeAttack
                  );

                  beforeAttack = null;

                  if (!GameLauncher.open(service)) {

                      running = false;
                      return;
                  }

                  handler.postDelayed(
                          this::openTargetMenu,
                          GAME_WAIT
                  );
              }

              public void stop() {

                  running = false;

                  handler.removeCallbacksAndMessages(
                          null
                  );

                  recycle(
                          beforeAttack
                  );

                  beforeAttack = null;
              }

              /*
               * =====================================================
               * 1. เปิดเมนูเลือกเป้าหมาย
               * =====================================================
               *
               * จากภาพเกม:
               *
               * ไอคอนเลือกเป้าหมายอยู่บริเวณ
               * ด้านบนค่อนไปทางขวา
               */

              private void openTargetMenu() {

                  if (!running) {
                      return;
                  }

                  int w =
                          service.getResources()
                                  .getDisplayMetrics()
                                  .widthPixels;

                  int h =
                          service.getResources()
                                  .getDisplayMetrics()
                                  .heightPixels;

                  service.tap(
                          (int) (w * 0.696f),
                          (int) (h * 0.190f)
                  );

                  handler.postDelayed(
                          this::enableAutoTarget,
                          LOCK_MENU_WAIT
                  );
              }

              /*
               * =====================================================
               * 2. กด "ล็อคเป้าอัตโนมัติ"
               * =====================================================
               *
               * ในภาพเมนูของเกมมี:
               *
               * ล็อคเป้า
               * ล็อคเป้าอัตโนมัติ
               * ติดตาม
               * คุย NPC
               *
               */

              private void enableAutoTarget() {

                  if (!running) {
                      return;
                  }

                  int w =
                          service.getResources()
                                  .getDisplayMetrics()
                                  .widthPixels;

                  int h =
                          service.getResources()
                                  .getDisplayMetrics()
                                  .heightPixels;

                  service.tap(
                          (int) (w * 0.675f),
                          (int) (h * 0.535f)
                  );

                  handler.postDelayed(
                          this::combatLoop,
                          LOCK_WAIT
                  );
              }

              /*
               * =====================================================
               * 3. เริ่ม Combat Loop
               * =====================================================
               *
               * ไม่ต้องหา Monster ด้วยสี
               * ไม่ต้องหา Arrow
               *
               * ให้เกมเป็นคนเลือกเป้าหมาย
               */

              private void combatLoop() {

                  if (!running) {
                      return;
                  }

                  attackCycle = false;

                  noCombatCount = 0;

                  attackStartedAt =
                          System.currentTimeMillis();

                  handler.post(
                          this::attackLoop
                  );
              }

              /*
               * =====================================================
               * 4. โจมตี
               * =====================================================
               */

              private void attackLoop() {

                  if (!running) {
                      return;
                  }

                  long elapsed =
                          System.currentTimeMillis()
                                  - attackStartedAt;

                  if (elapsed >= TARGET_TIMEOUT) {

                      /*
                       * ใช้เวลานานเกินไป
                       * ถือว่าเป้าหมายนี้ไม่เหมาะ
                       * แล้วเปลี่ยนเป้า
                       */

                      releaseTargetAndSearch();

                      return;
                  }

                  captureBeforeAttack();
              }

              private void captureBeforeAttack() {

                  if (!running) {
                      return;
                  }

                  service.screenshot(
                          bitmap -> {

                              if (!running) {

                                  recycle(bitmap);
                                  return;
                              }

                              recycle(
                                      beforeAttack
                              );

                              beforeAttack =
                                      bitmap;

                              pressAttack();
                          }
                  );
              }

              /*
               * =====================================================
               * 5. ปุ่มดาบ
               * =====================================================
               *
               * ปุ่มดาบใหญ่ด้านล่างขวา
               */

              private void pressAttack() {

                  if (!running) {
                      return;
                  }

                  int w =
                          service.getResources()
                                  .getDisplayMetrics()
                                  .widthPixels;

                  int h =
                          service.getResources()
                                  .getDisplayMetrics()
                                  .heightPixels;

                  service.tap(
                          (int) (w * 0.845f),
                          (int) (h * 0.815f)
                  );

                  handler.postDelayed(
                          this::validateAttack,
                          ATTACK_INTERVAL
                  );
              }

              /*
               * =====================================================
               * 6. ตรวจว่ามีการต่อสู้จริงไหม
               * =====================================================
               *
               * ไม่ใช้ OCR
               *
               * ใช้ความเปลี่ยนแปลงของภาพบริเวณ
               * กลางหน้าจอเป็นตัวช่วย
               */

              private void validateAttack() {

                  if (!running) {
                      return;
                  }

                  service.screenshot(
                          after -> {

                              if (!running) {

                                  recycle(after);
                                  return;
                              }

                              if (after == null) {

                                  noCombatCount++;

                                  continueCombat();

                                  return;
                              }

                              boolean changed =
                                      visualChanged(
                                              beforeAttack,
                                              after
                                      );

                              recycle(
                                      beforeAttack
                              );

                              beforeAttack =
                                      after;

                              if (changed) {

                                  /*
                                   * มีความเปลี่ยนแปลง
                                   * แสดงว่าการต่อสู้ยังมีการตอบสนอง
                                   */

                                  noCombatCount = 0;

                              } else {

                                  noCombatCount++;
                              }

                              /*
                               * ถ้าไม่มีการเปลี่ยนแปลง
                               * หลายครั้งติดกัน
                               * ให้เปลี่ยนเป้าหมาย
                               */

                              if (noCombatCount
                                      >= MAX_NO_COMBAT) {

                                  releaseTargetAndSearch();

                                  return;
                              }

                              continueCombat();
                          }
                  );
              }

              private void continueCombat() {

                  if (!running) {
                      return;
                  }

                  handler.postDelayed(
                          this::captureBeforeAttack,
                          ATTACK_INTERVAL
                  );
              }

              /*
               * =====================================================
               * 7. เป้าหมายจบ / ตีไม่ได้
               * =====================================================
               */

              private void releaseTargetAndSearch() {

                  if (!running) {
                      return;
                  }

                  recycle(
                          beforeAttack
                  );

                  beforeAttack = null;

                  /*
                   * ปุ่มเก็บของ
                   *
                   * จากภาพผู้ใช้ระบุว่า
                   * ปุ่มล่างข้างดาบ = เก็บของ
                   */

                  int w =
                          service.getResources()
                                  .getDisplayMetrics()
                                  .widthPixels;

                  int h =
                          service.getResources()
                                  .getDisplayMetrics()
                                  .heightPixels;

                  service.tap(
                          (int) (w * 0.966f),
                          (int) (h * 0.820f)
                  );

                  handler.postDelayed(
                          this::searchAgain,
                          LOOT_WAIT
                  );
              }

              /*
               * =====================================================
               * 8. ล็อกเป้าใหม่
               * =====================================================
               */

              private void searchAgain() {

                  if (!running) {
                      return;
                  }

                  /*
                   * เปิดเมนูเลือกเป้า
                   * แล้วกดล็อกเป้าอัตโนมัติอีกครั้ง
                   */

                  openTargetMenu();
              }

              /*
               * =====================================================
               * Image difference
               * =====================================================
               */

              private boolean visualChanged(
                      Bitmap before,
                      Bitmap after) {

                  if (before == null
                          || after == null) {

                      return false;
                  }

                  int w =
                          Math.min(
                                  before.getWidth(),
                                  after.getWidth()
                          );

                  int h =
                          Math.min(
                                  before.getHeight(),
                                  after.getHeight()
                          );

                  /*
                   * ตรวจเฉพาะพื้นที่เล่นเกม
                   * ไม่รวมปุ่ม UI ด้านขวา
                   * และไม่รวม chat ทางซ้าย
                   */

                  int left =
                          (int) (w * 0.25f);

                  int right =
                          (int) (w * 0.72f);

                  int top =
                          (int) (h * 0.18f);

                  int bottom =
                          (int) (h * 0.75f);

                  long difference = 0;

                  long samples = 0;

                  for (
                          int y = top;
                          y < bottom;
                          y += 8
                  ) {

                      for (
                              int x = left;
                              x < right;
                              x += 8
                      ) {

                          int a =
                                  before.getPixel(
                                          x,
                                          y
                                  );

                          int b =
                                  after.getPixel(
                                          x,
                                          y
                                  );

                          difference +=
                                  Math.abs(
                                          ((a >> 16) & 255)
                                                  - ((b >> 16) & 255)
                                  );

                          difference +=
                                  Math.abs(
                                          ((a >> 8) & 255)
                                                  - ((b >> 8) & 255)
                                  );

                          difference +=
                                  Math.abs(
                                          (a & 255)
                                                  - (b & 255)
                                  );

                          samples += 3;
                      }
                  }

                  if (samples == 0) {
                      return false;
                  }

                  double average =
                          (double) difference
                                  / samples;

                  return average > 7.0;
              }

              private void recycle(
                      Bitmap bitmap) {

                  if (bitmap != null
                          && !bitmap.isRecycled()) {

                      bitmap.recycle();
                  }
              }
          }
          EOF

          cat > app/src/main/java/com/dustinbot/v9/MainActivity.java <<'EOF'
          package com.dustinbot.v9;

          import android.app.Activity;
          import android.content.Intent;
          import android.graphics.Color;
          import android.os.Bundle;
          import android.view.Gravity;

          import android.widget.Button;
          import android.widget.LinearLayout;
          import android.widget.TextView;

          public class MainActivity
                  extends Activity {

              private TextView status;

              @Override
              protected void onCreate(
                      Bundle savedInstanceState) {

                  super.onCreate(
                          savedInstanceState
                  );

                  LinearLayout root =
                          new LinearLayout(this);

                  root.setOrientation(
                          LinearLayout.VERTICAL
                  );

                  root.setGravity(
                          Gravity.CENTER
                  );

                  root.setPadding(
                          30,
                          30,
                          30,
                          30
                  );

                  root.setBackgroundColor(
                          Color.rgb(
                                  15,
                                  15,
                                  15
                          )
                  );

                  TextView title =
                          new TextView(this);

                  title.setText(
                          "DUSTIN BOT V9"
                  );

                  title.setTextColor(
                          Color.WHITE
                  );

                  title.setTextSize(28);

                  title.setGravity(
                          Gravity.CENTER
                  );

                  root.addView(
                          title
                  );

                  TextView info =
                          new TextView(this);

                  info.setText(
                          "GAME AUTO-TARGET BOT\n\n"
                                  + "ล็อกเป้าอัตโนมัติ → โจมตี → ตรวจสอบ → เก็บของ → ล็อกเป้าใหม่\n\n"
                                  + "ไม่ใช้การเดาสีของ Monster"
                  );

                  info.setTextColor(
                          Color.LTGRAY
                  );

                  info.setTextSize(16);

                  info.setGravity(
                          Gravity.CENTER
                  );

                  info.setPadding(
                          0,
                          25,
                          0,
                          25
                  );

                  root.addView(
                          info
                  );

                  Button accessibility =
                          new Button(this);

                  accessibility.setText(
                          "OPEN ACCESSIBILITY"
                  );

                  root.addView(
                          accessibility
                  );

                  Button start =
                          new Button(this);

                  start.setText(
                          "START BOT"
                  );

                  root.addView(
                          start
                  );

                  Button stop =
                          new Button(this);

                  stop.setText(
                          "STOP BOT"
                  );

                  root.addView(
                          stop
                  );

                  status =
                          new TextView(this);

                  status.setTextColor(
                          Color.WHITE
                  );

                  status.setTextSize(16);

                  status.setGravity(
                          Gravity.CENTER
                  );

                  status.setPadding(
                          0,
                          25,
                          0,
                          0
                  );

                  root.addView(
                          status
                  );

                  accessibility.setOnClickListener(
                          v -> {

                              startActivity(
                                      new Intent(
                                              "android.settings.ACCESSIBILITY_SETTINGS"
                                      )
                              );
                          }
                  );

                  start.setOnClickListener(
                          v -> {

                              if (
                                      BotAccessibility.instance
                                              == null
                              ) {

                                  status.setText(
                                          "กรุณาเปิด Accessibility ก่อน"
                                  );

                                  return;
                              }

                              BotAccessibility.instance
                                      .startBot();

                              status.setText(
                                      "V9 STARTED"
                              );
                          }
                  );

                  stop.setOnClickListener(
                          v -> {

                              if (
                                      BotAccessibility.instance
                                              != null
                              ) {

                                  BotAccessibility.instance
                                          .stopBot();
                              }

                              status.setText(
                                      "V9 STOPPED"
                              );
                          }
                  );

                  setContentView(
                          root
                  );
              }
          }
          EOF

