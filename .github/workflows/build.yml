name: DUSTIN BOT V9.4 FULL AUTO

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Create Android Project
        shell: bash
        run: |

          set -e

          rm -rf app

          mkdir -p app/src/main/java/com/dustinbot/v94
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/xml

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(
                  RepositoriesMode.FAIL_ON_PROJECT_REPOS
              )

              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "DustinBotV94"

          include(":app")
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.6.1' apply false
          }
          EOF

          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=false
          android.nonTransitiveRClass=true
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.dustinbot.v94'

              compileSdk 35

              defaultConfig {
                  applicationId 'com.dustinbot.v94'
                  minSdk 30
                  targetSdk 35
                  versionCode 94
                  versionName '9.4'
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          EOF

          cat > app/src/main/res/values/strings.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="app_name">DUSTIN BOT V9.4</string>
              <string name="accessibility_description">DUSTIN BOT controls the visible game interface.</string>
          </resources>
          EOF

          cat > app/src/main/res/values/styles.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style
                  name="AppTheme"
                  parent="@android:style/Theme.Material.Light.NoActionBar">
                  <item name="android:fontFamily">sans</item>
                  <item name="android:windowLightStatusBar">true</item>
                  <item name="android:colorAccent">#2196F3</item>
              </style>
          </resources>
          EOF

          cat > app/src/main/res/xml/accessibility_service_config.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <accessibility-service
              xmlns:android="http://schemas.android.com/apk/res/android"
              android:accessibilityEventTypes="typeAllMask"
              android:accessibilityFeedbackType="feedbackGeneric"
              android:notificationTimeout="100"
              android:canRetrieveWindowContent="true"
              android:canPerformGestures="true"
              android:canTakeScreenshot="true"
              android:description="@string/accessibility_description"
              android:accessibilityFlags="flagDefault|flagReportViewIds|flagRetrieveInteractiveWindows" />
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <application
                  android:allowBackup="false"
                  android:label="@string/app_name"
                  android:supportsRtl="true"
                  android:theme="@style/AppTheme">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>

                  </activity>

                  <service
                      android:name=".BotAccessibility"
                      android:exported="false"
                      android:label="@string/app_name"
                      android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE">

                      <intent-filter>
                          <action android:name="android.accessibilityservice.AccessibilityService" />
                      </intent-filter>

                      <meta-data
                          android:name="android.accessibilityservice"
                          android:resource="@xml/accessibility_service_config" />

                  </service>

              </application>

          </manifest>
          EOF

          cat > app/src/main/java/com/dustinbot/v94/MainActivity.java <<'EOF'
          package com.dustinbot.v94;

          import android.app.Activity;
          import android.content.Intent;
          import android.os.Bundle;
          import android.provider.Settings;
          import android.graphics.Color;
          import android.view.Gravity;
          import android.widget.Button;
          import android.widget.LinearLayout;
          import android.widget.TextView;

          public class MainActivity extends Activity {

              private int dp(int value) {
                  return (int)(
                      value *
                      getResources()
                          .getDisplayMetrics()
                          .density +
                      0.5f
                  );
              }

              @Override
              protected void onCreate(Bundle state) {

                  super.onCreate(state);

                  LinearLayout root =
                      new LinearLayout(this);

                  root.setOrientation(
                      LinearLayout.VERTICAL
                  );

                  root.setGravity(
                      Gravity.CENTER
                  );

                  root.setPadding(
                      dp(24),
                      dp(24),
                      dp(24),
                      dp(24)
                  );

                  root.setBackgroundColor(
                      Color.rgb(20,20,24)
                  );

                  TextView title =
                      new TextView(this);

                  title.setText(
                      "DUSTIN BOT V9.4"
                  );

                  title.setTextColor(
                      Color.WHITE
                  );

                  title.setTextSize(26);

                  title.setGravity(
                      Gravity.CENTER
                  );

                  TextView info =
                      new TextView(this);

                  info.setText(
                      "FULL AUTO\n\n" +
                      "เปิด Dustin RO ก่อน\n" +
                      "เปิด Accessibility\n" +
                      "กลับเข้าเกม\n" +
                      "กด START"
                  );

                  info.setTextColor(
                      Color.LTGRAY
                  );

                  info.setTextSize(16);

                  info.setGravity(
                      Gravity.CENTER
                  );

                  info.setPadding(
                      0,
                      dp(20),
                      0,
                      dp(20)
                  );

                  Button settings =
                      new Button(this);

                  settings.setText(
                      "เปิด Accessibility"
                  );

                  settings.setOnClickListener(
                      v -> startActivity(
                          new Intent(
                              Settings.ACTION_ACCESSIBILITY_SETTINGS
                          )
                      )
                  );

                  root.addView(
                      title,
                      new LinearLayout.LayoutParams(
                          -1,
                          dp(60)
                      )
                  );

                  root.addView(
                      info,
                      new LinearLayout.LayoutParams(
                          -1,
                          -2
                      )
                  );

                  root.addView(
                      settings,
                      new LinearLayout.LayoutParams(
                          -1,
                          dp(55)
                      )
                  );

                  setContentView(root);
              }
          }
          EOF

          cat > app/src/main/java/com/dustinbot/v94/BotAccessibility.java <<'EOF'
          package com.dustinbot.v94;

          import android.accessibilityservice.AccessibilityService;
          import android.accessibilityservice.GestureDescription;

          import android.graphics.Bitmap;
          import android.graphics.ColorSpace;
          import android.graphics.Path;

          import android.hardware.HardwareBuffer;

          import android.os.Build;
          import android.os.Handler;
          import android.os.Looper;

          import android.view.Display;
          import android.view.Gravity;
          import android.view.View;
          import android.view.WindowManager;

          import android.graphics.PixelFormat;

          import android.widget.Button;
          import android.widget.LinearLayout;
          import android.widget.TextView;

          import java.util.concurrent.ExecutorService;
          import java.util.concurrent.Executors;

          public class BotAccessibility
              extends AccessibilityService {

              private final Handler handler =
                  new Handler(
                      Looper.getMainLooper()
                  );

              private final ExecutorService
                  screenshotExecutor =
                      Executors.newSingleThreadExecutor();

              private WindowManager
                  windowManager;

              private LinearLayout
                  panel;

              private TextView
                  status;

              private BotEngine
                  engine;

              @Override
              protected void onServiceConnected() {

                  super.onServiceConnected();

                  windowManager =
                      (WindowManager)
                      getSystemService(
                          WINDOW_SERVICE
                      );

                  engine =
                      new BotEngine(this);

                  createPanel();
              }

              private int dp(int value) {

                  return (int)(
                      value *
                      getResources()
                          .getDisplayMetrics()
                          .density +
                      0.5f
                  );
              }

              private void createPanel() {

                  panel =
                      new LinearLayout(this);

                  panel.setOrientation(
                      LinearLayout.VERTICAL
                  );

                  panel.setGravity(
                      Gravity.CENTER
                  );

                  panel.setPadding(
                      dp(8),
                      dp(6),
                      dp(8),
                      dp(6)
                  );

                  panel.setBackgroundColor(
                      0xEE111111
                  );

                  status =
                      new TextView(this);

                  status.setText(
                      "DUSTIN BOT V9.4\nSTOP"
                  );

                  status.setTextColor(
                      0xFFFFFFFF
                  );

                  status.setTextSize(12);

                  status.setGravity(
                      Gravity.CENTER
                  );

                  Button start =
                      new Button(this);

                  start.setText("START");

                  start.setOnClickListener(
                      v -> {

                          engine.start();

                          status.setText(
                              "DUSTIN BOT V9.4\nRUNNING"
                          );
                      }
                  );

                  Button stop =
                      new Button(this);

                  stop.setText("STOP");

                  stop.setOnClickListener(
                      v -> {

                          engine.stop();

                          status.setText(
                              "DUSTIN BOT V9.4\nSTOP"
                          );
                      }
                  );

                  Button hide =
                      new Button(this);

                  hide.setText("HIDE");

                  hide.setOnClickListener(
                      v ->
                          panel.setVisibility(
                              View.GONE
                          )
                  );

                  panel.addView(
                      status,
                      new LinearLayout.LayoutParams(
                          dp(150),
                          dp(40)
                      )
                  );

                  panel.addView(
                      start,
                      new LinearLayout.LayoutParams(
                          dp(150),
                          dp(48)
                      )
                  );

                  panel.addView(
                      stop,
                      new LinearLayout.LayoutParams(
                          dp(150),
                          dp(48)
                      )
                  );

                  panel.addView(
                      hide,
                      new LinearLayout.LayoutParams(
                          dp(150),
                          dp(42)
                      )
                  );

                  WindowManager.LayoutParams params =
                      new WindowManager.LayoutParams(
                          dp(160),
                          dp(220),

                          WindowManager
                              .LayoutParams
                              .TYPE_ACCESSIBILITY_OVERLAY,

                          WindowManager
                              .LayoutParams
                              .FLAG_NOT_FOCUSABLE,

                          PixelFormat.TRANSLUCENT
                      );

                  /*
                   * ซ้ายบน
                   * ไม่บังเมนูเกมด้านขวา
                   */

                  params.gravity =
                      Gravity.TOP |
                      Gravity.START;

                  params.x = dp(8);
                  params.y = dp(70);

                  windowManager.addView(
                      panel,
                      params
                  );
              }

              public void tap(
                  float x,
                  float y
              ) {

                  Path path =
                      new Path();

                  path.moveTo(x,y);

                  GestureDescription.StrokeDescription
                      stroke =
                          new GestureDescription
                              .StrokeDescription(
                                  path,
                                  0,
                                  60
                              );

                  GestureDescription gesture =
                      new GestureDescription
                          .Builder()
                          .addStroke(stroke)
                          .build();

                  dispatchGesture(
                      gesture,
                      null,
                      null
                  );
              }

              public void swipe(
                  float x1,
                  float y1,
                  float x2,
                  float y2,
                  long duration
              ) {

                  Path path =
                      new Path();

                  path.moveTo(
                      x1,
                      y1
                  );

                  path.lineTo(
                      x2,
                      y2
                  );

                  GestureDescription.StrokeDescription
                      stroke =
                          new GestureDescription
                              .StrokeDescription(
                                  path,
                                  0,
                                  duration
                              );

                  GestureDescription gesture =
                      new GestureDescription
                          .Builder()
                          .addStroke(stroke)
                          .build();

                  dispatchGesture(
                      gesture,
                      null,
                      null
                  );
              }

              public void screenshot(
                  ScreenshotCallback callback
              ) {

                  if (
                      Build.VERSION.SDK_INT < 30
                  ) {

                      callback.fail();

                      return;
                  }

                  takeScreenshot(
                      Display.DEFAULT_DISPLAY,
                      screenshotExecutor,

                      new TakeScreenshotCallback() {

                          @Override
                          public void onSuccess(
                              ScreenshotResult result
                          ) {

                              try {

                                  HardwareBuffer buffer =
                                      result
                                          .getHardwareBuffer();

                                  if (buffer == null) {

                                      callback.fail();

                                      return;
                                  }

                                  Bitmap temp =
                                      Bitmap
                                          .wrapHardwareBuffer(
                                              buffer,
                                              ColorSpace.get(
                                                  ColorSpace
                                                      .Named
                                                      .SRGB
                                              )
                                          );

                                  buffer.close();

                                  if (temp == null) {

                                      callback.fail();

                                      return;
                                  }

                                  Bitmap copy =
                                      temp.copy(
                                          Bitmap.Config
                                              .ARGB_8888,
                                          false
                                      );

                                  temp.recycle();

                                  if (copy == null) {

                                      callback.fail();

                                      return;
                                  }

                                  callback.ok(copy);

                              } catch (
                                  Throwable ignored
                              ) {

                                  callback.fail();
                              }
                          }

                          @Override
                          public void onFailure(
                              int errorCode
                          ) {

                              callback.fail();
                          }
                      }
                  );
              }

              public interface ScreenshotCallback {

                  void ok(Bitmap bitmap);

                  void fail();
              }

              @Override
              public void onAccessibilityEvent(
                  android.view.accessibility.AccessibilityEvent event
              ) {
              }

              @Override
              public void onInterrupt() {
              }

              @Override
              public void onDestroy() {

                  if (engine != null) {
                      engine.stop();
                  }

                  if (
                      panel != null &&
                      windowManager != null
                  ) {

                      try {
                          windowManager.removeView(panel);
                      } catch (Throwable ignored) {
                      }
                  }

                  screenshotExecutor.shutdownNow();

                  super.onDestroy();
              }
          }
          EOF

          cat > app/src/main/java/com/dustinbot/v94/BotEngine.java <<'EOF'
          package com.dustinbot.v94;

          import android.os.Handler;
          import android.os.Looper;

          import java.util.Random;

          public class BotEngine {

              private final BotAccessibility service;

              private final Handler handler =
                  new Handler(
                      Looper.getMainLooper()
                  );

              private final Random random =
                  new Random();

              private boolean running =
                  false;

              private int W =
                  1842;

              private int H =
                  832;

              private int lastDirection =
                  -1;

              private int attackCount =
                  0;

              private int lootCount =
                  0;

              /*
               * ปุ่มเมนูเกม
               */

              private static final float MENU_X =
                  0.755f;

              private static final float MENU_Y =
                  0.075f;

              /*
               * ปุ่มล็อคเป้าอัตโนมัติ
               */

              private static final float AUTO_X =
                  0.755f;

              private static final float AUTO_Y =
                  0.155f;

              /*
               * ปุ่มดาบ
               */

              private static final float ATTACK_X =
                  0.850f;

              private static final float ATTACK_Y =
                  0.815f;

              /*
               * ปุ่มเก็บของ
               */

              private static final float LOOT_X =
                  0.850f;

              private static final float LOOT_Y =
                  0.915f;

              /*
               * Joystick
               */

              private static final float JOY_X =
                  0.135f;

              private static final float JOY_Y =
                  0.790f;

              public BotEngine(
                  BotAccessibility service
              ) {

                  this.service =
                      service;
              }

              public void start() {

                  if (running) {
                      return;
                  }

                  running = true;

                  attackCount = 0;

                  lootCount = 0;

                  lastDirection = -1;

                  later(
                      this::openMenu,
                      500
                  );
              }

              public void stop() {

                  running = false;

                  handler.removeCallbacksAndMessages(
                      null
                  );
              }

              private void openMenu() {

                  if (!running) {
                      return;
                  }

                  service.tap(
                      W * MENU_X,
                      H * MENU_Y
                  );

                  later(
                      this::autoLock,
                      350
                  );
              }

              private void autoLock() {

                  if (!running) {
                      return;
                  }

                  service.tap(
                      W * AUTO_X,
                      H * AUTO_Y
                  );

                  later(
                      this::search,
                      700
                  );
              }

              /*
               * เดินสุ่ม
               */

              private void search() {

                  if (!running) {
                      return;
                  }

                  randomWalk();
              }

              private void randomWalk() {

                  if (!running) {
                      return;
                  }

                  int direction;

                  do {

                      direction =
                          random.nextInt(8);

                  } while (
                      direction ==
                          lastDirection
                      &&
                      random.nextBoolean()
                  );

                  lastDirection =
                      direction;

                  float[][] dirs = {

                      { 0f, -1f },

                      { 0.707f, -0.707f },

                      { 1f, 0f },

                      { 0.707f, 0.707f },

                      { 0f, 1f },

                      { -0.707f, 0.707f },

                      { -1f, 0f },

                      { -0.707f, -0.707f }

                  };

                  float dx =
                      dirs[direction][0];

                  float dy =
                      dirs[direction][1];

                  long duration =
                      500 +
                      random.nextInt(800);

                  joystick(
                      dx,
                      dy,
                      duration
                  );

                  /*
                   * เดินเสร็จแล้วโจมตี
                   */

                  later(
                      this::attack,
                      duration + 350
                  );
              }

              /*
               * โจมตี
               */

              private void attack() {

                  if (!running) {
                      return;
                  }

                  attackCount = 0;

                  attackStep();
              }

              private void attackStep() {

                  if (!running) {
                      return;
                  }

                  attackCount++;

                  service.tap(
                      W * ATTACK_X,
                      H * ATTACK_Y
                  );

                  /*
                   * ตีต่อเนื่อง
                   */

                  if (
                      attackCount < 6
                  ) {

                      later(
                          this::attackStep,
                          450
                      );

                      return;
                  }

                  attackCount = 0;

                  /*
                   * เก็บของ
                   */

                  later(
                      this::loot,
                      500
                  );
              }

              /*
               * เก็บของ
               */

              private void loot() {

                  if (!running) {
                      return;
                  }

                  lootCount = 0;

                  lootStep();
              }

              private void lootStep() {

                  if (!running) {
                      return;
                  }

                  lootCount++;

                  service.tap(
                      W * LOOT_X,
                      H * LOOT_Y
                  );

                  float dx = 0f;
                  float dy = 0f;

                  switch (
                      lootCount % 4
                  ) {

                      case 0:
                          dx = 1f;
                          break;

                      case 1:
                          dy = 1f;
                          break;

                      case 2:
                          dx = -1f;
                          break;

                      default:
                          dy = -1f;
                          break;
                  }

                  joystick(
                      dx,
                      dy,
                      140
                  );

                  if (
                      lootCount < 5
                  ) {

                      later(
                          this::lootStep,
                          300
                      );

                  } else {

                      lootCount = 0;

                      /*
                       * กลับไปหา Monster
                       */

                      later(
                          this::refreshLock,
                          500
                      );
                  }
              }

              /*
               * เปิด Auto Lock ใหม่
               */

              private void refreshLock() {

                  if (!running) {
                      return;
                  }

                  service.tap(
                      W * MENU_X,
                      H * MENU_Y
                  );

                  later(
                      () -> {

                          if (!running) {
                              return;
                          }

                          service.tap(
                              W * AUTO_X,
                              H * AUTO_Y
                          );

                          later(
                              this::randomWalk,
                              500
                          );

                      },
                      300
                  );
              }

              /*
               * Joystick
               */

              private void joystick(
                  float dx,
                  float dy,
                  long duration
              ) {

                  if (!running) {
                      return;
                  }

                  float centerX =
                      W * JOY_X;

                  float centerY =
                      H * JOY_Y;

                  float radius =
                      Math.min(
                          W,
                          H
                      ) * 0.105f;

                  float endX =
                      centerX +
                      dx * radius;

                  float endY =
                      centerY +
                      dy * radius;

                  service.swipe(
                      centerX,
                      centerY,
                      endX,
                      endY,
                      duration
                  );

                  later(
                      () -> {

                          if (!running) {
                              return;
                          }

                          service.tap(
                              centerX,
                              centerY
                          );

                      },
                      duration + 50
                  );
              }

              /*
               * Timer
               */

              private void later(
                  Runnable runnable,
                  long delay
              ) {

                  if (
                      runnable == null
                  ) {
                      return;
                  }

                  handler.postDelayed(
                      runnable,
                      delay
                  );
              }
          }
          EOF

      - name: Validate generated files
        shell: bash
        run: |

          set -e

          echo "===== FILES ====="

          find app/src/main -type f | sort

          echo "===== JAVA FILES ====="

          find app/src/main/java -name "*.java" -print

          echo "===== XML ====="

          cat app/src/main/res/xml/accessibility_service_config.xml

      - name: Build APK
        shell: bash
        run: |

          set -e

          gradle \
            :app:assembleDebug \
            --no-daemon \
            --stacktrace

      - name: Prepare APK
        shell: bash
        run: |

          set -e

          mkdir -p output

          cp \
            app/build/outputs/apk/debug/app-debug.apk \
            output/DustinBotV9.4-FULL-AUTO.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DUSTIN-BOT-V9.4-FULL-AUTO
          path: output/DustinBotV9.4-FULL-AUTO.apk
          if-no-files-found: error
