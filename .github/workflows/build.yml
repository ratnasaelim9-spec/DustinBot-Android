          cat > app/src/main/java/com/dustinbot/v12/BotAccessibility.java <<'EOF'
          package com.dustinbot.v12;

          import android.accessibilityservice.AccessibilityService;
          import android.accessibilityservice.GestureDescription;
          import android.graphics.Bitmap;
          import android.graphics.Path;
          import android.graphics.PixelFormat;
          import android.hardware.HardwareBuffer;
          import android.os.Handler;
          import android.os.Looper;
          import android.view.Gravity;
          import android.view.WindowManager;
          import android.widget.Button;
          import android.widget.LinearLayout;
          import android.widget.TextView;

          public class BotAccessibility
              extends AccessibilityService {

              private static BotAccessibility instance;

              private WindowManager wm;

              private LinearLayout panel;

              private TextView status;

              private BotEngine engine;


              public static void showPanel() {

                  if (instance != null) {
                      instance.createPanel();
                  }
              }


              @Override
              protected void onServiceConnected() {

                  super.onServiceConnected();

                  instance = this;

                  engine =
                      new BotEngine(this);

                  new Handler(
                      Looper.getMainLooper()
                  ).postDelayed(
                      this::createPanel,
                      500
                  );
              }


              @Override
              public void onAccessibilityEvent(
                      android.view.accessibility.AccessibilityEvent event) {
              }


              @Override
              public void onInterrupt() {

                  if (engine != null) {
                      engine.stop();
                  }
              }


              @Override
              public void onDestroy() {

                  if (engine != null) {
                      engine.stop();
                  }

                  removePanel();

                  instance = null;

                  super.onDestroy();
              }


              private void createPanel() {

                  if (panel != null) {
                      return;
                  }


                  wm =
                      (WindowManager)
                      getSystemService(
                          WINDOW_SERVICE
                      );


                  panel =
                      new LinearLayout(this);

                  panel.setOrientation(
                      LinearLayout.VERTICAL
                  );

                  panel.setPadding(
                      12,
                      8,
                      12,
                      8
                  );

                  panel.setBackgroundColor(
                      0xEE111111
                  );


                  status =
                      new TextView(this);

                  status.setText(
                      "DUSTIN BOT V12\nREADY"
                  );

                  status.setTextColor(
                      0xFFFFFFFF
                  );

                  status.setTextSize(11);

                  panel.addView(status);


                  LinearLayout row =
                      new LinearLayout(this);

                  Button start =
                      new Button(this);

                  start.setText(
                      "START"
                  );


                  Button stop =
                      new Button(this);

                  stop.setText(
                      "STOP"
                  );


                  Button close =
                      new Button(this);

                  close.setText(
                      "×"
                  );


                  row.addView(start);

                  row.addView(stop);

                  row.addView(close);

                  panel.addView(row);


                  start.setOnClickListener(
                      v -> {

                          if (engine != null) {
                              engine.start();
                          }
                      }
                  );


                  stop.setOnClickListener(
                      v -> {

                          if (engine != null) {
                              engine.stop();
                          }
                      }
                  );


                  close.setOnClickListener(
                      v -> removePanel()
                  );


                  WindowManager.LayoutParams lp =
                      new WindowManager.LayoutParams();

                  lp.width =
                      WindowManager.LayoutParams.WRAP_CONTENT;

                  lp.height =
                      WindowManager.LayoutParams.WRAP_CONTENT;

                  lp.gravity =
                      Gravity.TOP |
                      Gravity.RIGHT;

                  lp.x = 10;

                  lp.y = 70;


                  lp.type =
                      WindowManager.LayoutParams
                          .TYPE_ACCESSIBILITY_OVERLAY;


                  lp.flags =
                      WindowManager.LayoutParams
                          .FLAG_NOT_FOCUSABLE;


                  lp.format =
                      PixelFormat.TRANSLUCENT;


                  try {

                      wm.addView(
                          panel,
                          lp
                      );

                  } catch (Exception e) {

                      panel = null;

                      new Handler(
                          Looper.getMainLooper()
                      ).postDelayed(
                          this::createPanel,
                          1000
                      );
                  }
              }


              private void removePanel() {

                  if (
                      panel != null &&
                      wm != null
                  ) {

                      try {

                          wm.removeView(
                              panel
                          );

                      } catch (Exception ignored) {
                      }
                  }

                  panel = null;
              }


              public void state(
                      String s) {

                  new Handler(
                      Looper.getMainLooper()
                  ).post(
                      () -> {

                          if (status != null) {

                              status.setText(
                                  "DUSTIN BOT V12\n" +
                                  s
                              );
                          }
                      }
                  );
              }


              public void tap(
                      float x,
                      float y) {

                  Path path =
                      new Path();

                  path.moveTo(
                      x,
                      y
                  );


                  GestureDescription gesture =
                      new GestureDescription.Builder()
                          .addStroke(
                              new GestureDescription
                                  .StrokeDescription(
                                      path,
                                      0,
                                      70
                                  )
                          )
                          .build();


                  dispatchGesture(
                      gesture,
                      null,
                      null
                  );
              }


              public void swipe(
                      float x1,
                      float y1,
                      float x2,
                      float y2,
                      long duration) {

                  Path path =
                      new Path();

                  path.moveTo(
                      x1,
                      y1
                  );

                  path.lineTo(
                      x2,
                      y2
                  );


                  GestureDescription gesture =
                      new GestureDescription.Builder()
                          .addStroke(
                              new GestureDescription
                                  .StrokeDescription(
                                      path,
                                      0,
                                      duration
                                  )
                          )
                          .build();


                  dispatchGesture(
                      gesture,
                      null,
                      null
                  );
              }


              public void screenshot(
                      BotEngine.ScreenCallback callback) {

                  takeScreenshot(

                      android.view.Display.DEFAULT_DISPLAY,

                      getMainExecutor(),

                      new TakeScreenshotCallback() {

                          @Override
                          public void onSuccess(
                                  ScreenshotResult result) {

                              HardwareBuffer buffer =
                                  result.getHardwareBuffer();

                              if (buffer == null) {

                                  callback.onBitmap(
                                      null
                                  );

                                  return;
                              }


                              Bitmap bitmap =
                                  Bitmap.wrapHardwareBuffer(
                                      buffer,
                                      result.getColorSpace()
                                  );


                              Bitmap copy = null;


                              if (bitmap != null) {

                                  copy =
                                      bitmap.copy(
                                          Bitmap.Config
                                              .ARGB_8888,
                                          false
                                      );

                                  bitmap.recycle();
                              }


                              buffer.close();


                              callback.onBitmap(
                                  copy
                              );
                          }


                          @Override
                          public void onFailure(
                                  int errorCode) {

                              callback.onBitmap(
                                  null
                              );
                          }
                      }
                  );
              }
          }
          EOF

          cat > app/src/main/java/com/dustinbot/v12/Vision.java <<'EOF'
          package com.dustinbot.v12;

          import android.graphics.Bitmap;
          import android.graphics.Color;

          public class Vision {

              public static class Target {

                  public float x;

                  public float y;

                  public float confidence;


                  public Target(
                          float x,
                          float y,
                          float confidence) {

                      this.x = x;

                      this.y = y;

                      this.confidence =
                          confidence;
                  }
              }


              /*
               * V12:
               *
               * ไม่กำหนด W/H ตายตัว
               *
               * ใช้ขนาด screenshot จริง
               */


              public static Target findTarget(
                      Bitmap b) {

                  if (b == null) {
                      return null;
                  }


                  int w =
                      b.getWidth();

                  int h =
                      b.getHeight();


                  /*
                   * จำกัดเฉพาะพื้นที่เล่น
                   *
                   * ไม่ตรวจ joystick
                   * ไม่ตรวจ attack button
                   * ไม่ตรวจ UI
                   */

                  int left =
                      (int)(w * 0.18f);

                  int right =
                      (int)(w * 0.84f);

                  int top =
                      (int)(h * 0.12f);

                  int bottom =
                      (int)(h * 0.72f);


                  Target best = null;

                  double bestScore = 0;


                  /*
                   * ค้นหา marker ขนาดเล็ก
                   */

                  for (
                      int y = top;
                      y < bottom;
                      y += 4
                  ) {

                      for (
                          int x = left;
                          x < right;
                          x += 4
                      ) {

                          int bright = 0;

                          int dark = 0;

                          int total = 0;


                          for (
                              int yy = -7;
                              yy <= 7;
                              yy += 2
                          ) {

                              for (
                                  int xx = -9;
                                  xx <= 9;
                                  xx += 2
                              ) {

                                  int px =
                                      x + xx;

                                  int py =
                                      y + yy;


                                  if (
                                      px < 0 ||
                                      py < 0 ||
                                      px >= w ||
                                      py >= h
                                  ) {
                                      continue;
                                  }


                                  int c =
                                      b.getPixel(
                                          px,
                                          py
                                      );


                                  int r =
                                      Color.red(c);

                                  int g =
                                      Color.green(c);

                                  int bl =
                                      Color.blue(c);


                                  int max =
                                      Math.max(
                                          r,
                                          Math.max(
                                              g,
                                              bl
                                          )
                                      );


                                  int min =
                                      Math.min(
                                          r,
                                          Math.min(
                                              g,
                                              bl
                                          )
                                      );


                                  /*
                                   * สีขาว/เทา
                                   */

                                  if (
                                      min > 190 &&
                                      max - min < 35
                                  ) {

                                      bright++;
                                  }


                                  /*
                                   * ขอบมืด
                                   */

                                  if (
                                      max < 80
                                  ) {

                                      dark++;
                                  }


                                  total++;
                              }
                          }


                          if (total == 0) {
                              continue;
                          }


                          float brightRatio =
                              (float)bright /
                              total;

                          float darkRatio =
                              (float)dark /
                              total;


                          /*
                           * ไม่เอาพื้นสว่างขนาดใหญ่
                           */

                          if (
                              brightRatio < 0.20f ||
                              brightRatio > 0.62f
                          ) {
                              continue;
                          }


                          /*
                           * marker ต้องมี contrast
                           */

                          if (
                              darkRatio < 0.035f
                          ) {
                              continue;
                          }


                          /*
                           * ตรวจรูปทรงสามเหลี่ยม:
                           *
                           * ด้านบนแคบ
                           * ด้านล่างกว้างขึ้น
                           */

                          int upper =
                              whiteCount(
                                  b,
                                  x,
                                  y - 5,
                                  7,
                                  2
                              );


                          int middle =
                              whiteCount(
                                  b,
                                  x,
                                  y,
                                  11,
                                  2
                              );


                          int lower =
                              whiteCount(
                                  b,
                                  x,
                                  y + 5,
                                  15,
                                  2
                              );


                          if (
                              upper < 1 ||
                              middle < upper ||
                              lower < middle
                          ) {
                              continue;
                          }


                          double score =
                              brightRatio * 60
                              +
                              darkRatio * 80
                              +
                              lower;


                          if (
                              score > bestScore
                          ) {

                              bestScore =
                                  score;


                              /*
                               * จุดมอนสเตอร์อยู่
                               * ใต้ marker
                               */

                              best =
                                  new Target(
                                      x,
                                      y + 35,
                                      (float)score
                                  );
                          }
                      }
                  }


                  if (
                      best == null ||
                      best.confidence < 22
                  ) {

                      return null;
                  }


                  return best;
              }


              private static int whiteCount(
                      Bitmap b,
                      int cx,
                      int cy,
                      int width,
                      int height) {

                  int count = 0;


                  for (
                      int y =
                          cy - height;

                      y <=
                          cy + height;

                      y += 2
                  ) {

                      for (
                          int x =
                              cx - width;

                          x <=
                              cx + width;

                          x += 2
                      ) {

                          if (
                              x < 0 ||
                              y < 0 ||
                              x >= b.getWidth() ||
                              y >= b.getHeight()
                          ) {
                              continue;
                          }


                          int c =
                              b.getPixel(
                                  x,
                                  y
                              );


                          int r =
                              Color.red(c);

                          int g =
                              Color.green(c);

                          int bl =
                              Color.blue(c);


                          int max =
                              Math.max(
                                  r,
                                  Math.max(
                                      g,
                                      bl
                                  )
                              );


                          int min =
                              Math.min(
                                  r,
                                  Math.min(
                                      g,
                                      bl
                                  )
                              );


                          if (
                              min > 190 &&
                              max - min < 35
                          ) {

                              count++;
                          }
                      }
                  }


                  return count;
              }


              /*
               * ตรวจว่าภาพเปลี่ยนหรือไม่
               */

              public static double difference(
                      Bitmap a,
                      Bitmap b) {

                  if (
                      a == null ||
                      b == null
                  ) {

                      return 0;
                  }


                  int w =
                      Math.min(
                          a.getWidth(),
                          b.getWidth()
                      );


                  int h =
                      Math.min(
                          a.getHeight(),
                          b.getHeight()
                      );


                  long total = 0;

                  long count = 0;


                  for (
                      int y =
                          (int)(h * 0.15f);

                      y <
                          (int)(h * 0.75f);

                      y += 12
                  ) {

                      for (
                          int x =
                              (int)(w * 0.08f);

                          x <
                              (int)(w * 0.90f);

                          x += 12
                      ) {

                          int ca =
                              a.getPixel(
                                  x,
                                  y
                              );


                          int cb =
                              b.getPixel(
                                  x,
                                  y
                              );


                          total +=
                              Math.abs(
                                  Color.red(ca)
                                  -
                                  Color.red(cb)
                              );


                          total +=
                              Math.abs(
                                  Color.green(ca)
                                  -
                                  Color.green(cb)
                              );


                          total +=
                              Math.abs(
                                  Color.blue(ca)
                                  -
                                  Color.blue(cb)
                              );


                          count += 3;
                      }
                  }


                  if (count == 0) {
                      return 0;
                  }


                  return
                      (double)total /
                      count;
              }
          }
          EOF

          cat > app/src/main/java/com/dustinbot/v12/BotEngine.java <<'EOF'
          package com.dustinbot.v12;

          import android.graphics.Bitmap;
          import android.os.Handler;
          import android.os.Looper;
          import android.util.DisplayMetrics;

          public class BotEngine {

              public interface ScreenCallback {
                  void onBitmap(Bitmap bitmap);
              }


              private final BotAccessibility service;


              private final Handler handler =
                  new Handler(
                      Looper.getMainLooper()
                  );


              private boolean running = false;


              /*
               * พิกัดเหล่านี้เป็นสัดส่วน
               * ไม่ใช่พิกเซลตายตัว
               */

              private static final float JOY_X =
                  0.138f;

              private static final float JOY_Y =
                  0.785f;


              private static final float ATTACK_X =
                  0.850f;

              private static final float ATTACK_Y =
                  0.815f;


              /*
               * ตัวละครโดยประมาณอยู่กลางจอ
               */

              private static final float PLAYER_X =
                  0.50f;

              private static final float PLAYER_Y =
                  0.47f;


              private enum State {

                  SEARCH,

                  CONFIRM,

                  MOVE,

                  ATTACK,

                  RECOVER
              }


              private State state =
                  State.SEARCH;


              private Vision.Target target;


              private int confirmCount = 0;

              private int stuckCount = 0;

              private int moveCount = 0;

              private int attackTry = 0;

              private int searchDirection = 0;

              private int searchStep = 0;


              private Bitmap beforeMove;

              private Bitmap beforeAttack;


              public BotEngine(
                      BotAccessibility service) {

                  this.service = service;
              }


              public void start() {

                  if (running) {
                      return;
                  }


                  running = true;


                  target = null;

                  confirmCount = 0;

                  stuckCount = 0;

                  moveCount = 0;

                  attackTry = 0;

                  searchDirection = 0;

                  searchStep = 0;


                  service.state(
                      "START\nAUTO LOCK"
                  );


                  later(
                      this::autoLock,
                      500
                  );
              }


              public void stop() {

                  running = false;


                  handler.removeCallbacksAndMessages(
                      null
                  );


                  recycle(
                      beforeMove
                  );


                  recycle(
                      beforeAttack
                  );


                  beforeMove = null;

                  beforeAttack = null;


                  service.state(
                      "STOP"
                  );
              }


              private void autoLock() {

                  if (!running) {
                      return;
                  }


                  service.state(
                      "AUTO LOCK"
                  );


                  /*
                   * เปิดเมนูล็อคเป้า
                   */

                  tapRatio(
                      0.755f,
                      0.075f
                  );


                  later(
                      this::selectAutoLock,
                      350
                  );
              }


              private void selectAutoLock() {

                  if (!running) {
                      return;
                  }


                  /*
                   * ล็อคเป้าอัตโนมัติ
                   *
                   * ไม่กดติดตาม
                   */

                  tapRatio(
                      0.755f,
                      0.155f
                  );


                  later(
                      this::scan,
                      700
                  );
              }


              private void scan() {

                  if (!running) {
                      return;
                  }


                  service.state(
                      "SEARCH"
                  );


                  service.screenshot(
                      bitmap -> {

                          if (!running) {

                              recycle(bitmap);

                              return;
                          }


                          if (bitmap == null) {

                              later(
                                  this::scan,
                                  350
                              );

                              return;
                          }


                          Vision.Target found =
                              Vision.findTarget(
                                  bitmap
                              );


                          recycle(bitmap);


                          if (found == null) {

                              target = null;

                              confirmCount = 0;

                              search();

                              return;
                          }


                          confirm(
                              found
                          );
                      }
                  );
              }


              private void confirm(
                      Vision.Target found) {

                  if (!running) {
                      return;
                  }


                  state =
                      State.CONFIRM;


                  if (target == null) {

                      target =
                          found;

                      confirmCount = 1;

                  } else {

                      float dx =
                          Math.abs(
                              target.x -
                              found.x
                          );


                      float dy =
                          Math.abs(
                              target.y -
                              found.y
                          );


                      /*
                       * ต้องเป็นเป้าเดิม
                       */

                      if (
                          dx <
                              foundXThreshold(
                                  target
                              )
                          &&
                          dy <
                              foundYThreshold(
                                  target
                              )
                      ) {

                          target =
                              found;

                          confirmCount++;

                      } else {

                          target =
                              found;

                          confirmCount = 1;
                      }
                  }


                  service.state(
                      "TARGET "
                      + confirmCount
                  );


                  /*
                   * ต้องเห็นเป้าต่อเนื่อง
                   * อย่างน้อย 3 รอบ
                   */

                  if (
                      confirmCount >= 3
                  ) {

                      moveCount = 0;

                      stuckCount = 0;

                      moveToTarget();

                      return;
                  }


                  later(
                      this::scan,
                      180
                  );
              }


              private float foundXThreshold(
                      Vision.Target t) {

                  return
                      Math.max(
                          20f,
                          t.x * 0.06f
                      );
              }


              private float foundYThreshold(
                      Vision.Target t) {

                  return
                      Math.max(
                          20f,
                          t.y * 0.06f
                      );
              }


              private void moveToTarget() {

                  if (
                      !running ||
                      target == null
                  ) {

                      return;
                  }


                  /*
                   * ใช้ขนาดภาพจริง
                   */

                  float targetX =
                      target.x;

                  float targetY =
                      target.y;


                  float screenW =
                      targetScreenW;

                  float screenH =
                      targetScreenH;


                  if (
                      screenW <= 0 ||
                      screenH <= 0
                  ) {

                      later(
                          this::scan,
                          150
                      );

                      return;
                  }


                  float tx =
                      targetX /
                      screenW;


                  float ty =
                      targetY /
                      screenH;


                  /*
                   * สำคัญ:
                   *
                   * x บวก = ขวา
                   * x ลบ = ซ้าย
                   *
                   * y บวก = ลง
                   * y ลบ = ขึ้น
                   */

                  float dx =
                      tx -
                      PLAYER_X;


                  float dy =
                      ty -
                      PLAYER_Y;


                  double distance =
                      Math.sqrt(
                          dx * dx +
                          dy * dy
                      );


                  /*
                   * เข้าใกล้พอแล้ว
                   */

                  if (
                      distance <
                      0.105
                  ) {

                      attackTry = 0;

                      attack();

                      return;
                  }


                  /*
                   * จำกัดจำนวนก้าว
                   */

                  moveCount++;


                  if (
                      moveCount >= 18
                  ) {

                      recover();

                      return;
                  }


                  float len =
                      (float)Math.sqrt(
                          dx * dx +
                          dy * dy
                      );


                  if (len < 0.001f) {

                      later(
                          this::scan,
                          150
                      );

                      return;
                  }


                  dx /= len;

                  dy /= len;


                  final float finalDx =
                      dx;

                  final float finalDy =
                      dy;


                  service.state(
                      "MOVE "
                      + moveCount
                      + "\n"
                      + directionName(
                          finalDx,
                          finalDy
                      )
                  );


                  recycle(
                      beforeMove
                  );


                  beforeMove = null;


                  service.screenshot(
                      bitmap -> {

                          if (!running) {

                              recycle(bitmap);

                              return;
                          }


                          beforeMove =
                              bitmap;


                          /*
                           * เดินสั้น ๆ
                           */

                          joystick(
                              finalDx,
                              finalDy,
                              240
                          );


                          later(
                              this::checkMove,
                              400
                          );
                      }
                  );
              }


              /*
               * ขนาด screenshot ล่าสุด
               */

              private float targetScreenW =
                  0;

              private float targetScreenH =
                  0;


              private void rememberScreen(
                      Bitmap b) {

                  if (b == null) {
                      return;
                  }


                  targetScreenW =
                      b.getWidth();

                  targetScreenH =
                      b.getHeight();
              }


              private void checkMove() {

                  if (!running) {
                      return;
                  }


                  service.screenshot(
                      after -> {

                          if (!running) {

                              recycle(after);

                              return;
                          }


                          if (
                              beforeMove == null ||
                              after == null
                          ) {

                              recycle(after);

                              later(
                                  this::scan,
                                  200
                              );

                              return;
                          }


                          double diff =
                              Vision.difference(
                                  beforeMove,
                                  after
                              );


                          recycle(
                              beforeMove
                          );


                          beforeMove = null;


                          /*
                           * ภาพเปลี่ยน
                           * = มีการเคลื่อนที่
                           */

                          if (
                              diff > 5.0
                          ) {

                              stuckCount = 0;


                              later(
                                  this::scan,
                                  160
                              );


                              return;
                          }


                          /*
                           * ไม่เคลื่อน
                           */

                          stuckCount++;


                          service.state(
                              "STUCK "
                              + stuckCount
                          );


                          if (
                              stuckCount >= 2
                          ) {

                              recover();

                              return;
                          }


                          later(
                              this::scan,
                              220
                          );
                      }
                  );
              }


              private void recover() {

                  if (!running) {
                      return;
                  }


                  service.state(
                      "RECOVER"
                  );


                  target = null;

                  confirmCount = 0;

                  stuckCount = 0;

                  moveCount = 0;


                  /*
                   * เปลี่ยนทิศ
                   */

                  searchDirection =
                      (
                          searchDirection +
                          4
                      ) % 8;


                  float[] d =
                      direction(
                          searchDirection
                      );


                  joystick(
                      d[0],
                      d[1],
                      400
                  );


                  later(
                      this::autoLock,
                      650
                  );
              }


              private void search() {

                  if (!running) {
                      return;
                  }


                  searchStep++;


                  float[] d =
                      direction(
                          searchDirection
                      );


                  service.state(
                      "SEARCH MOVE "
                      + searchDirection
                  );


                  joystick(
                      d[0],
                      d[1],
                      220
                  );


                  if (
                      searchStep >= 3
                  ) {

                      searchStep = 0;


                      searchDirection++;


                      if (
                          searchDirection >= 8
                      ) {

                          searchDirection = 0;
                      }


                      later(
                          this::autoLock,
                          450
                      );

                  } else {

                      later(
                          this::scan,
                          350
                      );
                  }
              }


              private void attack() {

                  if (!running) {
                      return;
                  }


                  attackTry++;


                  service.state(
                      "ATTACK "
                      + attackTry
                  );


                  recycle(
                      beforeAttack
                  );


                  beforeAttack = null;


                  service.screenshot(
                      bitmap -> {

                          if (!running) {

                              recycle(bitmap);

                              return;
                          }


                          beforeAttack =
                              bitmap;


                          tapRatio(
                              ATTACK_X,
                              ATTACK_Y
                          );


                          later(
                              this::checkAttack,
                              420
                          );
                      }
                  );
              }


              private void checkAttack() {

                  if (!running) {
                      return;
                  }


                  service.screenshot(
                      after -> {

                          if (!running) {

                              recycle(after);

                              return;
                          }


                          if (
                              beforeAttack == null ||
                              after == null
                          ) {

                              recycle(after);

                              later(
                                  this::scan,
                                  200
                              );

                              return;
                          }


                          double diff =
                              Vision.difference(
                                  beforeAttack,
                                  after
                              );


                          recycle(
                              beforeAttack
                          );


                          beforeAttack = null;


                          /*
                           * มีการตอบสนอง
                           */

                          if (
                              diff > 4.0
                          ) {

                              attackTry = 0;


                              service.state(
                                  "COMBAT"
                              );


                              later(
                                  this::attack,
                                  550
                              );


                              return;
                          }


                          /*
                           * ยังไม่เกิดอะไร
                           */

                          if (
                              attackTry < 2
                          ) {

                              later(
                                  this::attack,
                                  220
                              );

                              return;
                          }


                          /*
                           * ไม่ได้อยู่ในระยะ
                           */

                          attackTry = 0;


                          service.state(
                              "MOVE TO TARGET"
                          );


                          later(
                              this::moveOrScan,
                              150
                          );
                      }
                  );
              }


              private void moveOrScan() {

                  if (!running) {
                      return;
                  }


                  if (target != null) {

                      moveToTarget();

                  } else {

                      scan();
                  }
              }


              private void joystick(
                      float dx,
                      float dy,
                      long duration) {

                  /*
                   * ใช้ขนาดหน้าจอจริง
                   */

                  float w =
                      screenWidth();

                  float h =
                      screenHeight();


                  float cx =
                      w * JOY_X;

                  float cy =
                      h * JOY_Y;


                  /*
                   * ระยะลาก joystick
                   */

                  float radius =
                      Math.min(
                          w,
                          h
                      ) * 0.105f;


                  float ex =
                      cx +
                      dx * radius;


                  float ey =
                      cy +
                      dy * radius;


                  /*
                   * จำกัดให้อยู่ใน joystick
                   */

                  ex =
                      clamp(
                          ex,
                          cx - radius,
                          cx + radius
                      );


                  ey =
                      clamp(
                          ey,
                          cy - radius,
                          cy + radius
                      );


                  service.swipe(
                      cx,
                      cy,
                      ex,
                      ey,
                      duration
                  );


                  final float releaseX =
                      cx;

                  final float releaseY =
                      cy;

                  final long releaseDelay =
                      duration + 35;


                  /*
                   * ปล่อย joystick
                   */

                  later(
                      () ->
                          service.tap(
                              releaseX,
                              releaseY
                          ),
                      releaseDelay
                  );
              }


              private void tapRatio(
                      float x,
                      float y) {

                  float w =
                      screenWidth();

                  float h =
                      screenHeight();


                  service.tap(
                      w * x,
                      h * y
                  );
              }


              private float screenWidth() {

                  DisplayMetrics dm =
                      getDisplayMetrics();

                  return dm.widthPixels;
              }


              private float screenHeight() {

                  DisplayMetrics dm =
                      getDisplayMetrics();

                  return dm.heightPixels;
              }


              private DisplayMetrics
                      getDisplayMetrics() {

                  return
                      service
                          .getResources()
                          .getDisplayMetrics();
              }


              private String directionName(
                      float dx,
                      float dy) {

                  if (
                      Math.abs(dx) >
                      Math.abs(dy) * 1.5f
                  ) {

                      return dx > 0
                          ? "RIGHT"
                          : "LEFT";
                  }


                  if (
                      Math.abs(dy) >
                      Math.abs(dx) * 1.5f
                  ) {

                      return dy > 0
                          ? "DOWN"
                          : "UP";
                  }


                  if (
                      dx > 0 &&
                      dy > 0
                  ) {

                      return "DOWN-RIGHT";
                  }


                  if (
                      dx < 0 &&
                      dy > 0
                  ) {

                      return "DOWN-LEFT";
                  }


                  if (
                      dx < 0 &&
                      dy < 0
                  ) {

                      return "UP-LEFT";
                  }


                  return "UP-RIGHT";
              }


              private float[] direction(
                      int n) {

                  switch (n) {

                      case 0:

                          return new float[]{
                              1f,
                              0f
                          };


                      case 1:

                          return new float[]{
                              0.7f,
                              0.7f
                          };


                      case 2:

                          return new float[]{
                              0f,
                              1f
                          };


                      case 3:

                          return new float[]{
                              -0.7f,
                              0.7f
                          };


                      case 4:

                          return new float[]{
                              -1f,
                              0f
                          };


                      case 5:

                          return new float[]{
                              -0.7f,
                              -0.7f
                          };


                      case 6:

                          return new float[]{
                              0f,
                              -1f
                          };


                      default:

                          return new float[]{
                              0.7f,
                              -0.7f
                          };
                  }
              }


              private float clamp(
                      float v,
                      float min,
                      float max) {

                  return Math.max(
                      min,
                      Math.min(
                          max,
                          v
                      )
                  );
              }


              private void later(
                      Runnable r,
                      long ms) {

                  handler.postDelayed(
                      r,
                      ms
                  );
              }


              private void recycle(
                      Bitmap b) {

                  if (
                      b != null &&
                      !b.isRecycled()
                  ) {

                      b.recycle();
                  }
              }
          }
          EOF

      - name: Build APK
        shell: bash
        run: |
          set -e

          gradle \
            --no-daemon \
            --stacktrace \
            :app:assembleDebug

      - name: Prepare APK
        shell: bash
        run: |
          set -e

          mkdir -p output

          cp \
            app/build/outputs/apk/debug/app-debug.apk \
            output/DustinBotV12.apk

          ls -lh output/DustinBotV12.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DustinBotV12
          path: output/DustinBotV12.apk
