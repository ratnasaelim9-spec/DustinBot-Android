package com.dustinbot.v3;

import android.app.Activity;

import android.content.Intent;

import android.graphics.Color;

import android.os.Bundle;

import android.provider.Settings;

import android.view.Gravity;

import android.widget.Button;
import android.widget.LinearLayout;
import android.widget.TextView;

public class MainActivity
        extends Activity {

    private int dp(
            int value
    ) {

        return (int) (
                value *
                getResources()
                        .getDisplayMetrics()
                        .density
        );
    }

    private TextView text(
            String value,
            int size
    ) {

        TextView t =
                new TextView(this);

        t.setText(value);

        t.setTextColor(
                Color.WHITE
        );

        t.setTextSize(size);

        t.setPadding(
                dp(12),
                dp(12),
                dp(12),
                dp(12)
        );

        return t;
    }

    private Button button(
            String value
    ) {

        Button b =
                new Button(this);

        b.setText(value);

        return b;
    }

    @Override
    protected void onCreate(
            Bundle savedInstanceState
    ) {

        super.onCreate(
                savedInstanceState
        );

        LinearLayout root =
                new LinearLayout(this);

        root.setOrientation(
                LinearLayout.VERTICAL
        );

        root.setPadding(
                dp(16),
                dp(16),
                dp(16),
                dp(16)
        );

        root.setBackgroundColor(
                Color.rgb(
                        7,
                        11,
                        18
                )
        );

        TextView title =
                text(
                        "🤖 DUSTINBOT\nANDROID V3",
                        26
                );

        title.setGravity(
                Gravity.CENTER
        );

        root.addView(title);

        root.addView(
                text(
                        "OpenKore-style Android Bot\n\n" +
                        "Dustin RO จะยังแสดงอยู่ด้านหลัง\n" +
                        "DustinBot ทำงานเป็น Floating Overlay",
                        16
                )
        );

        Button accessibility =
                button(
                        "1. OPEN ACCESSIBILITY"
                );

        accessibility.setOnClickListener(
                v -> {

                    Intent intent =
                            new Intent(
                                    Settings
                                            .ACTION_ACCESSIBILITY_SETTINGS
                            );

                    startActivity(intent);
                }
        );

        root.addView(
                accessibility
        );

        Button show =
                button(
                        "2. SHOW BOT OVER GAME"
                );

        show.setOnClickListener(
                v -> {

                    BotAccessibility service =
                            BotAccessibility
                                    .getInstance();

                    if (service != null) {

                        service.showOverlay();

                    } else {

                        accessibility.performClick();
                    }
                }
        );

        root.addView(show);

        root.addView(
                text(
                        "วิธีใช้งาน\n\n" +
                        "1. เปิด Accessibility\n" +
                        "2. เปิด Dustin RO\n" +
                        "3. กลับมา DustinBot\n" +
                        "4. SHOW BOT OVER GAME\n" +
                        "5. หน้าต่างบอทจะลอยบนเกม\n" +
                        "6. ตั้ง MOVE / ATTACK / LOOT\n" +
                        "7. START\n\n" +
                        "เกมเป็นผู้ล็อกเป้าหมายเอง\n" +
                        "บอทควบคุมการเดิน โจมตี และเก็บของ",
                        15
                )
        );

        root.addView(
                text(
                        "STATUS\n\n" +
                        "Accessibility: READY\n" +
                        "Game: Dustin RO\n" +
                        "Target: GAME LOCK\n" +
                        "Mode: WALK / ATTACK / LOOT",
                        15
                )
        );

        setContentView(root);
    }
}
