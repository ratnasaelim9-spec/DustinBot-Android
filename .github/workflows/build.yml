      # ============================================================
      # BOT ENGINE
      # ============================================================

      - name: Create BotEngine.java
        shell: bash
        run: |
          cat > app/src/main/java/com/dustinbot/v3/BotEngine.java <<'EOF'
package com.dustinbot.v3;

import android.content.Context;
import android.os.Handler;
import android.os.Looper;

public class BotEngine {

    public interface Listener {

        void onState(
                String state
        );

        void onConsole(
                String message
        );
    }


    private final Context context;

    private final Listener listener;

    private final Handler handler =
            new Handler(
                    Looper.getMainLooper()
            );


    private boolean running;

    private boolean directionRight = true;


    public BotEngine(
            Context context,
            Listener listener
    ) {

        this.context =
                context.getApplicationContext();

        this.listener =
                listener;
    }


    // ============================================================
    // START
    // ============================================================

    public void start() {

        if (!SettingsStore.hasPoint(
                context,
                "MOVE"
        )) {

            listener.onConsole(
                    "MOVE ยังไม่ได้ตั้งค่า"
            );

            return;
        }


        if (!SettingsStore.hasPoint(
                context,
                "ATTACK"
        )) {

            listener.onConsole(
                    "ATTACK ยังไม่ได้ตั้งค่า"
            );

            return;
        }


        if (!SettingsStore.hasPoint(
                context,
                "LOOT"
        )) {

            listener.onConsole(
                    "LOOT ยังไม่ได้ตั้งค่า"
            );

            return;
        }


        if (
                BotAccessibility.getInstance()
                        == null
        ) {

            listener.onConsole(
                    "Accessibility ยังไม่ทำงาน"
            );

            return;
        }


        if (running) {
            return;
        }


        running = true;


        listener.onState(
                "RUNNING"
        );


        listener.onConsole(
                "BOT STARTED"
        );


        loop();
    }


    // ============================================================
    // STOP
    // ============================================================

    public void stop() {

        running = false;

        handler.removeCallbacksAndMessages(
                null
        );

        listener.onState(
                "STOP"
        );

        listener.onConsole(
                "BOT STOPPED"
        );
    }


    // ============================================================
    // MAIN LOOP
    // ============================================================

    private void loop() {

        if (!running) {
            return;
        }


        walk();


        handler.postDelayed(
                () -> {

                    if (!running) {
                        return;
                    }


                    attack();


                    handler.postDelayed(
                            () -> {

                                if (!running) {
                                    return;
                                }


                                loot();


                                handler.postDelayed(
                                        this::loop,
                                        1200
                                );


                            },
                            1800
                    );


                },
                2200
        );
    }


    // ============================================================
    // WALK
    // ============================================================

    private void walk() {

        BotAccessibility service =
                BotAccessibility.getInstance();


        if (service == null) {
            return;
        }


        listener.onState(
                "WALK"
        );


        listener.onConsole(
                "Walking..."
        );


        float x =
                SettingsStore.getX(
                        context,
                        "MOVE"
                );


        float y =
                SettingsStore.getY(
                        context,
                        "MOVE"
                );


        float destinationX;


        if (directionRight) {

            destinationX =
                    x + 220;

        } else {

            destinationX =
                    x - 220;
        }


        service.swipe(
                x,
                y,
                destinationX,
                y,
                1200
        );


        directionRight =
                !directionRight;
    }


    // ============================================================
    // ATTACK
    // ============================================================

    private void attack() {

        BotAccessibility service =
                BotAccessibility.getInstance();


        if (service == null) {
            return;
        }


        listener.onState(
                "ATTACK"
        );


        listener.onConsole(
                "ATTACK GAME LOCK TARGET"
        );


        float x =
                SettingsStore.getX(
                        context,
                        "ATTACK"
                );


        float y =
                SettingsStore.getY(
                        context,
                        "ATTACK"
                );


        for (
                int i = 0;
                i < 5;
                i++
        ) {

            final int index =
                    i;


            handler.postDelayed(
                    () -> {

                        if (!running) {
                            return;
                        }


                        BotAccessibility current =
                                BotAccessibility
                                        .getInstance();


                        if (current != null) {

                            current.tap(
                                    x,
                                    y
                            );
                        }

                    },
                    index * 250L
            );
        }
    }


    // ============================================================
    // LOOT
    // ============================================================

    private void loot() {

        BotAccessibility service =
                BotAccessibility.getInstance();


        if (service == null) {
            return;
        }


        listener.onState(
                "LOOT"
        );


        listener.onConsole(
                "LOOT"
        );


        float x =
                SettingsStore.getX(
                        context,
                        "LOOT"
                );


        float y =
                SettingsStore.getY(
                        context,
                        "LOOT"
                );


        service.tap(
                x,
                y
        );
    }
}
EOF


      # ============================================================
      # MAIN ACTIVITY
      # ============================================================

      - name: Create MainActivity.java
        shell: bash
        run: |
          cat > app/src/main/java/com/dustinbot/v3/MainActivity.java <<'EOF'
package com.dustinbot.v3;

import android.app.Activity;

import android.content.Intent;

import android.graphics.Color;

import android.os.Bundle;

import android.provider.Settings;

import android.view.Gravity;

import android.widget.Button;
import android.widget.LinearLayout;
import android.widget.TextView;

public class MainActivity
        extends Activity {

    private int dp(
            int value
    ) {

        return (int)
                (
                        value *
                        getResources()
                                .getDisplayMetrics()
                                .density
                );
    }


    private TextView makeText(
            String value,
            int size
    ) {

        TextView text =
                new TextView(this);

        text.setText(value);

        text.setTextColor(
                Color.WHITE
        );

        text.setTextSize(
                size
        );

        text.setPadding(
                dp(10),
                dp(10),
                dp(10),
                dp(10)
        );

        return text;
    }


    private Button makeButton(
            String value
    ) {

        Button button =
                new Button(this);

        button.setText(value);

        return button;
    }


    @Override
    protected void onCreate(
            Bundle savedInstanceState
    ) {

        super.onCreate(
                savedInstanceState
        );


        LinearLayout root =
                new LinearLayout(this);

        root.setOrientation(
                LinearLayout.VERTICAL
        );

        root.setPadding(
                dp(15),
                dp(15),
                dp(15),
                dp(15)
        );

        root.setBackgroundColor(
                Color.rgb(
                        7,
                        11,
                        18
                )
        );


        TextView title =
                makeText(
                        "🤖 DUSTINBOT\n" +
                        "ANDROID V3",
                        26
                );

        title.setGravity(
                Gravity.CENTER
        );

        root.addView(
                title
        );


        root.addView(
                makeText(
                        "OpenKore-style Android Bot\n\n" +
                        "ตัวเกม Dustin RO จะอยู่ด้านหลัง\n" +
                        "DustinBot จะทำงานเป็นหน้าต่างลอย",
                        16
                )
        );


        // ========================================================
        // ACCESSIBILITY
        // ========================================================

        Button accessibility =
                makeButton(
                        "OPEN ACCESSIBILITY"
                );


        accessibility.setOnClickListener(
                view -> {

                    Intent intent =
                            new Intent(
                                    Settings
                                            .ACTION_ACCESSIBILITY_SETTINGS
                            );

                    startActivity(intent);
                }
        );


        root.addView(
                accessibility
        );


        // ========================================================
        // SHOW BOT
        // ========================================================

        Button show =
                makeButton(
                        "SHOW BOT OVER GAME"
                );


        show.setOnClickListener(
                view -> {

                    BotAccessibility service =
                            BotAccessibility
                                    .getInstance();


                    if (service != null) {

                        service.showOverlay();

                    } else {

                        accessibility.performClick();
                    }
                }
        );


        root.addView(
                show
        );


        // ========================================================
        // INFORMATION
        // ========================================================

        root.addView(
                makeText(
                        "วิธีใช้งาน\n\n" +
                        "1. OPEN ACCESSIBILITY\n" +
                        "2. เปิดบริการ DustinBot\n" +
                        "3. เปิด Dustin RO\n" +
                        "4. กลับมา DustinBot\n" +
                        "5. SHOW BOT OVER GAME\n" +
                        "6. ตั้ง MOVE / ATTACK / LOOT\n" +
                        "7. START\n\n" +
                        "GAME LOCK = เกมล็อกเป้าหมายเอง\n\n" +
                        "BOT LOOP\n" +
                        "WALK → ATTACK → LOOT → WALK",
                        15
                )
        );


        root.addView(
                makeText(
                        "STATUS\n\n" +
                        "Mode: Accessibility\n" +
                        "Target: GAME LOCK\n" +
                        "Action: WALK / ATTACK / LOOT",
                        15
                )
        );


        setContentView(
                root
        );
    }
}
