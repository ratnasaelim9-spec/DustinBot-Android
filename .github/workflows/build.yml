name: Build DustinBot Android V1

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Create Android Project
        shell: bash
        run: |

          mkdir -p app/src/main/java/com/dustinbot/android
          mkdir -p app/src/main/res/xml
          mkdir -p app/src/main/res/values

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "DustinBotAndroid"
          include(":app")
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.6.1' apply false
          }
          EOF

          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.dustinbot.android'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.dustinbot.android'
                  minSdk 26
                  targetSdk 35
                  versionCode 1
                  versionName '1.0'
              }
          }
          EOF

          cat > app/src/main/res/values/strings.xml <<'EOF'
          <resources>
              <string name="app_name">DustinBot Android</string>
              <string name="accessibility_description">
                  DustinBot Android game controller
              </string>
          </resources>
          EOF

          cat > app/src/main/res/values/themes.xml <<'EOF'
          <resources>
              <style
                  name="AppTheme"
                  parent="android:style/Theme.Material.Light.NoActionBar">
                  <item name="android:fontFamily">sans</item>
                  <item name="android:colorAccent">#1976D2</item>
              </style>
          </resources>
          EOF

          cat > app/src/main/res/xml/accessibility_service_config.xml <<'EOF'
          <accessibility-service
              xmlns:android="http://schemas.android.com/apk/res/android"
              android:description="@string/accessibility_description"
              android:accessibilityEventTypes="typeWindowStateChanged|typeWindowContentChanged"
              android:accessibilityFeedbackType="feedbackGeneric"
              android:notificationTimeout="100"
              android:canPerformGestures="true"
              android:canRetrieveWindowContent="true" />
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest
              xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission
                  android:name="android.permission.FOREGROUND_SERVICE" />

              <uses-permission
                  android:name="android.permission.POST_NOTIFICATIONS" />

              <application
                  android:theme="@style/AppTheme"
                  android:label="@string/app_name"
                  android:allowBackup="false">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">

                      <intent-filter>
                          <action
                              android:name="android.intent.action.MAIN" />

                          <category
                              android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>

                  </activity>

                  <service
                      android:name=".BotAccessibilityService"
                      android:permission=
                          "android.permission.BIND_ACCESSIBILITY_SERVICE"
                      android:exported="false">

                      <intent-filter>
                          <action
                              android:name=
                              "android.accessibilityservice.AccessibilityService" />
                      </intent-filter>

                      <meta-data
                          android:name="android.accessibilityservice"
                          android:resource=
                              "@xml/accessibility_service_config" />

                  </service>

                  <service
                      android:name=".BotService"
                      android:exported="false" />

              </application>

          </manifest>
          EOF

          cat > app/src/main/java/com/dustinbot/android/BotAccessibilityService.java <<'EOF'
          package com.dustinbot.android;

          import android.accessibilityservice.AccessibilityService;
          import android.accessibilityservice.GestureDescription;
          import android.graphics.Path;
          import android.view.accessibility.AccessibilityEvent;

          public class BotAccessibilityService
                  extends AccessibilityService {

              public static volatile BotAccessibilityService instance;

              @Override
              protected void onServiceConnected() {
                  super.onServiceConnected();
                  instance = this;
              }

              @Override
              public void onAccessibilityEvent(
                      AccessibilityEvent event) {
              }

              @Override
              public void onInterrupt() {
              }

              public boolean tap(float x, float y) {

                  if (instance == null)
                      return false;

                  Path path = new Path();
                  path.moveTo(x, y);

                  GestureDescription gesture =
                          new GestureDescription.Builder()
                                  .addStroke(
                                          new GestureDescription.StrokeDescription(
                                                  path,
                                                  0,
                                                  80))
                                  .build();

                  return instance.dispatchGesture(
                          gesture,
                          null,
                          null);
              }

              public boolean swipe(
                      float x1,
                      float y1,
                      float x2,
                      float y2,
                      long duration) {

                  if (instance == null)
                      return false;

                  Path path = new Path();

                  path.moveTo(x1, y1);
                  path.lineTo(x2, y2);

                  GestureDescription gesture =
                          new GestureDescription.Builder()
                                  .addStroke(
                                          new GestureDescription.StrokeDescription(
                                                  path,
                                                  0,
                                                  duration))
                                  .build();

                  return instance.dispatchGesture(
                          gesture,
                          null,
                          null);
              }
          }
          EOF

          cat > app/src/main/java/com/dustinbot/android/MainActivity.java <<'EOF'
          package com.dustinbot.android;

          import android.app.Activity;
          import android.content.Intent;
          import android.graphics.Color;
          import android.os.Bundle;
          import android.provider.Settings;
          import android.view.Gravity;
          import android.widget.Button;
          import android.widget.LinearLayout;
          import android.widget.TextView;

          public class MainActivity extends Activity {

              @Override
              protected void onCreate(Bundle state) {

                  super.onCreate(state);

                  LinearLayout root =
                          new LinearLayout(this);

                  root.setOrientation(
                          LinearLayout.VERTICAL);

                  root.setPadding(
                          30, 30, 30, 30);

                  root.setGravity(
                          Gravity.CENTER_HORIZONTAL);

                  TextView title =
                          new TextView(this);

                  title.setText(
                          "DUSTINBOT ANDROID");

                  title.setTextSize(28);

                  title.setTextColor(
                          Color.BLACK);

                  title.setGravity(
                          Gravity.CENTER);

                  root.addView(title);

                  TextView description =
                          new TextView(this);

                  description.setText(
                          "\nโหมดอัตโนมัติ\n\n" +
                          "เดิน → เกมล็อกเป้า → ตี → " +
                          "เก็บของ → เดินต่อ\n\n" +
                          "ไม่ค้นหา Monster เอง");

                  description.setTextSize(17);

                  description.setGravity(
                          Gravity.CENTER);

                  root.addView(description);

                  Button accessibility =
                          new Button(this);

                  accessibility.setText(
                          "1. เปิด ACCESSIBILITY");

                  accessibility.setOnClickListener(v -> {

                      startActivity(
                              new Intent(
                                      Settings.ACTION_ACCESSIBILITY_SETTINGS));

                  });

                  root.addView(accessibility);

                  Button start =
                          new Button(this);

                  start.setText(
                          "2. START BOT");

                  start.setOnClickListener(v -> {

                      Intent intent =
                              new Intent(
                                      this,
                                      BotService.class);

                      intent.setAction(
                              BotService.START);

                      startService(intent);

                  });

                  root.addView(start);

                  Button stop =
                          new Button(this);

                  stop.setText(
                          "3. STOP BOT");

                  stop.setOnClickListener(v -> {

                      Intent intent =
                              new Intent(
                                      this,
                                      BotService.class);

                      intent.setAction(
                              BotService.STOP);

                      startService(intent);

                  });

                  root.addView(stop);

                  setContentView(root);
              }
          }
          EOF

          cat > app/src/main/java/com/dustinbot/android/BotService.java <<'EOF'
          package com.dustinbot.android;

          import android.app.Notification;
          import android.app.NotificationChannel;
          import android.app.NotificationManager;
          import android.app.Service;
          import android.content.Intent;
          import android.os.Build;
          import android.os.IBinder;

          public class BotService extends Service {

              public static final String START =
                      "DUSTINBOT_START";

              public static final String STOP =
                      "DUSTINBOT_STOP";

              private volatile boolean running = false;

              private Thread thread;

              @Override
              public int onStartCommand(
                      Intent intent,
                      int flags,
                      int startId) {

                  if (intent != null) {

                      if (START.equals(
                              intent.getAction())) {

                          startBot();
                      }

                      if (STOP.equals(
                              intent.getAction())) {

                          stopBot();
                      }
                  }

                  return START_STICKY;
              }

              private void startBot() {

                  if (running)
                      return;

                  running = true;

                  createChannel();

                  Notification notification =
                          new Notification.Builder(
                                  this,
                                  "DUSTINBOT")
                                  .setContentTitle(
                                          "DustinBot")
                                  .setContentText(
                                          "เดิน + ตี + เก็บของ")
                                  .setSmallIcon(
                                          android.R.drawable
                                                  .ic_media_play)
                                  .build();

                  startForeground(
                          1001,
                          notification);

                  thread = new Thread(
                          this::botLoop);

                  thread.start();
              }

              private void stopBot() {

                  running = false;

                  if (thread != null) {
                      thread.interrupt();
                      thread = null;
                  }

                  stopForeground(true);
                  stopSelf();
              }

              private void botLoop() {

                  boolean right = true;

                  while (running) {

                      try {

                          BotAccessibilityService bot =
                                  BotAccessibilityService
                                          .instance;

                          if (bot == null) {

                              Thread.sleep(1000);

                              continue;
                          }

                          /*
                           * ใช้สัดส่วนหน้าจอ
                           * ไม่ผูกกับมือถือรุ่นใดรุ่นหนึ่ง
                           */

                          float width =
                                  getResources()
                                          .getDisplayMetrics()
                                          .widthPixels;

                          float height =
                                  getResources()
                                          .getDisplayMetrics()
                                          .heightPixels;

                          /*
                           * ตำแหน่งควบคุมเริ่มต้น
                           *
                           * MOVE:
                           * บริเวณ joystick
                           *
                           * ATTACK:
                           * ปุ่มโจมตีด้านขวา
                           *
                           * LOOT:
                           * บริเวณกลางล่าง
                           */

                          float moveX =
                                  width * 0.50f;

                          float moveY =
                                  height * 0.90f;

                          float attackX =
                                  width * 0.90f;

                          float attackY =
                                  height * 0.84f;

                          float lootX =
                                  width * 0.50f;

                          float lootY =
                                  height * 0.78f;

                          /*
                           * WALK
                           */

                          float endX;

                          if (right) {

                              endX =
                                      width * 0.78f;

                          } else {

                              endX =
                                      width * 0.22f;
                          }

                          bot.swipe(
                                  moveX,
                                  moveY,
                                  endX,
                                  moveY,
                                  900);

                          Thread.sleep(700);

                          /*
                           * ATTACK
                           *
                           * ไม่ค้นหา Monster
                           * ใช้เป้าหมายของเกม
                           */

                          for (
                                  int i = 0;
                                  i < 3 && running;
                                  i++) {

                              bot.tap(
                                      attackX,
                                      attackY);

                              Thread.sleep(500);
                          }

                          /*
                           * WAIT
                           */

                          Thread.sleep(700);

                          /*
                           * LOOT
                           */

                          bot.tap(
                                  lootX,
                                  lootY);

                          Thread.sleep(700);

                          /*
                           * เดินต่อ
                           */

                          right = !right;

                      } catch (
                              InterruptedException e) {

                          return;

                      } catch (
                              Exception e) {

                          try {

                              Thread.sleep(1000);

                          } catch (
                                  InterruptedException ignored) {

                              return;
                          }
                      }
                  }
              }

              private void createChannel() {

                  if (Build.VERSION.SDK_INT >= 26) {

                      NotificationManager manager =
                              getSystemService(
                                      NotificationManager.class);

                      NotificationChannel channel =
                              new NotificationChannel(
                                      "DUSTINBOT",
                                      "DustinBot",
                                      NotificationManager
                                              .IMPORTANCE_LOW);

                      manager.createNotificationChannel(
                              channel);
                  }
              }

              @Override
              public IBinder onBind(
                      Intent intent) {

                  return null;
              }
          }
          EOF

      - name: Build APK
        shell: bash
        run: |
          gradle wrapper --gradle-version 8.7
          chmod +x gradlew
          ./gradlew clean assembleDebug --stacktrace

      - name: Verify APK
        shell: bash
        run: |
          test -f app/build/outputs/apk/debug/app-debug.apk
          ls -lh app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DustinBot-Android-V1
          path: app/build/outputs/apk/debug/app-debug.apk
