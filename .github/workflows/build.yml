      # ============================================================
      # GRADLE WRAPPER
      # ============================================================

      - name: Install Gradle
        shell: bash
        run: |
          set -e

          curl -L \
            https://services.gradle.org/distributions/gradle-8.7-bin.zip \
            -o /tmp/gradle.zip

          mkdir -p /tmp/gradle

          unzip -q \
            /tmp/gradle.zip \
            -d /tmp/gradle

          /tmp/gradle/gradle-8.7/bin/gradle wrapper \
            --gradle-version 8.7


      # ============================================================
      # VALIDATE XML
      # ============================================================

      - name: Validate XML
        shell: bash
        run: |
          set -e

          python3 - <<'PY'
import xml.etree.ElementTree as ET

files = [
    "app/src/main/AndroidManifest.xml",
    "app/src/main/res/values/strings.xml",
    "app/src/main/res/values/themes.xml",
    "app/src/main/res/xml/accessibility.xml"
]

for file in files:
    print("Checking:", file)

    with open(file, "rb") as f:
        data = f.read()

    ET.fromstring(data)

    print("OK:", file)
PY


      # ============================================================
      # BUILD
      # ============================================================

      - name: Build Debug APK
        shell: bash
        run: |
          set -e

          chmod +x gradlew

          ./gradlew \
            clean \
            assembleDebug \
            --stacktrace


      # ============================================================
      # FIND APK
      # ============================================================

      - name: Find APK
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "DUSTINBOT V3 APK"
          echo "======================================"

          find \
            app/build/outputs/apk/debug \
            -type f \
            -name "*.apk" \
            -print


      # ============================================================
      # UPLOAD APK
      # ============================================================

      - name: Upload APK
        uses: actions/upload-artifact@v4

        with:
          name: DustinBot-Android-V3

          path:
            app/build/outputs/apk/debug/*.apk

          if-no-files-found: error

          retention-days: 30
