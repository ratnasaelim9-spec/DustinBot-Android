name: DustinBot Android V3

on:
  push:
    branches:
      - main

  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # CHECKOUT
      # ============================================================

      - name: Checkout
        uses: actions/checkout@v4


      # ============================================================
      # JAVA 17
      # ============================================================

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'


      # ============================================================
      # CREATE DIRECTORIES
      # ============================================================

      - name: Create project directories
        shell: bash
        run: |
          set -e

          mkdir -p app/src/main/java/com/dustinbot/v3
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/xml


      # ============================================================
      # SETTINGS.GRADLE
      # ============================================================

      - name: Create settings.gradle
        shell: bash
        run: |
          cat > settings.gradle <<'EOF'
pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

dependencyResolutionManagement {
    repositoriesMode.set(
        RepositoriesMode.FAIL_ON_PROJECT_REPOS
    )

    repositories {
        google()
        mavenCentral()
    }
}

rootProject.name = "DustinBotAndroidV3"

include(":app")
EOF


      # ============================================================
      # ROOT BUILD.GRADLE
      # ============================================================

      - name: Create root build.gradle
        shell: bash
        run: |
          cat > build.gradle <<'EOF'
plugins {
    id 'com.android.application' version '8.6.1' apply false
}
EOF


      # ============================================================
      # GRADLE PROPERTIES
      # ============================================================

      - name: Create gradle.properties
        shell: bash
        run: |
          cat > gradle.properties <<'EOF'
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
android.nonTransitiveRClass=true
EOF


      # ============================================================
      # APP BUILD.GRADLE
      # ============================================================

      - name: Create app build.gradle
        shell: bash
        run: |
          cat > app/build.gradle <<'EOF'
plugins {
    id 'com.android.application'
}

android {
    namespace 'com.dustinbot.v3'

    compileSdk 35

    defaultConfig {
        applicationId 'com.dustinbot.v3'
        minSdk 26
        targetSdk 35

        versionCode 30
        versionName '3.0'
    }

    buildTypes {
        debug {
            minifyEnabled false
        }

        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.core:core:1.15.0'
}
EOF


      # ============================================================
      # STRINGS.XML
      # ============================================================

      - name: Create strings.xml
        shell: bash
        run: |
          cat > app/src/main/res/values/strings.xml <<'EOF'
<resources>
    <string name="app_name">DustinBot Android V3</string>
    <string name="accessibility_description">DustinBot Android automation service</string>
</resources>
EOF


      # ============================================================
      # THEMES.XML
      # ============================================================

      - name: Create themes.xml
        shell: bash
        run: |
          cat > app/src/main/res/values/themes.xml <<'EOF'
<resources>
    <style
        name="Theme.DustinBot"
        parent="Theme.AppCompat.NoActionBar">

        <item name="android:fontFamily">sans</item>
        <item name="android:windowLightStatusBar">false</item>
        <item name="android:statusBarColor">#070B12</item>
        <item name="android:navigationBarColor">#070B12</item>

    </style>
</resources>
EOF


      # ============================================================
      # ACCESSIBILITY.XML
      # ============================================================

      - name: Create accessibility.xml
        shell: bash
        run: |
          cat > app/src/main/res/xml/accessibility.xml <<'EOF'
<accessibility-service
    xmlns:android="http://schemas.android.com/apk/res/android"
    android:accessibilityEventTypes="typeAllMask"
    android:accessibilityFeedbackType="feedbackGeneric"
    android:accessibilityFlags="flagDefault|flagRetrieveInteractiveWindows|flagIncludeNotImportantViews"
    android:canRetrieveWindowContent="true"
    android:canPerformGestures="true"
    android:description="@string/accessibility_description"
    android:notificationTimeout="100" />
EOF


      # ============================================================
      # ANDROID MANIFEST
      # ============================================================

      - name: Create AndroidManifest.xml
        shell: bash
        run: |
          cat > app/src/main/AndroidManifest.xml <<'EOF'
<manifest xmlns:android="http://schemas.android.com/apk/res/android">

    <application
        android:allowBackup="true"
        android:label="@string/app_name"
        android:supportsRtl="true"
        android:theme="@style/Theme.DustinBot">

        <activity
            android:name=".MainActivity"
            android:exported="true">

            <intent-filter>
                <action android:name="android.intent.action.MAIN" />
                <category android:name="android.intent.category.LAUNCHER" />
            </intent-filter>

        </activity>

        <service
            android:name=".BotAccessibility"
            android:exported="true"
            android:label="@string/app_name"
            android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE">

            <intent-filter>
                <action android:name="android.accessibilityservice.AccessibilityService" />
            </intent-filter>

            <meta-data
                android:name="android.accessibilityservice"
                android:resource="@xml/accessibility" />

        </service>

    </application>

</manifest>
EOF


      # ============================================================
      # SETTINGS STORE
      # ============================================================

      - name: Create SettingsStore.java
        shell: bash
        run: |
          cat > app/src/main/java/com/dustinbot/v3/SettingsStore.java <<'EOF'
package com.dustinbot.v3;

import android.content.Context;
import android.content.SharedPreferences;

public final class SettingsStore {

    private static final String PREF =
            "dustinbot_settings";

    private SettingsStore() {
    }

    private static SharedPreferences getPrefs(
            Context context
    ) {
        return context.getSharedPreferences(
                PREF,
                Context.MODE_PRIVATE
        );
    }

    public static void savePoint(
            Context context,
            String name,
            float x,
            float y
    ) {

        getPrefs(context)
                .edit()
                .putFloat(name + "_x", x)
                .putFloat(name + "_y", y)
                .apply();
    }

    public static float getX(
            Context context,
            String name
    ) {

        return getPrefs(context)
                .getFloat(
                        name + "_x",
                        -1
                );
    }

    public static float getY(
            Context context,
            String name
    ) {

        return getPrefs(context)
                .getFloat(
                        name + "_y",
                        -1
                );
    }

    public static boolean hasPoint(
            Context context,
            String name
    ) {

        return getX(context, name) >= 0
                && getY(context, name) >= 0;
    }
}
EOF


      # ============================================================
      # BOT ACCESSIBILITY
      # ============================================================

      - name: Create BotAccessibility.java
        shell: bash
        run: |
          cat > app/src/main/java/com/dustinbot/v3/BotAccessibility.java <<'EOF'
package com.dustinbot.v3;

import android.accessibilityservice.AccessibilityService;
import android.accessibilityservice.GestureDescription;

import android.graphics.Color;
import android.graphics.Path;
import android.graphics.PixelFormat;

import android.os.Handler;
import android.os.Looper;

import android.view.Gravity;
import android.view.MotionEvent;
import android.view.View;
import android.view.WindowManager;

import android.widget.Button;
import android.widget.LinearLayout;
import android.widget.ScrollView;
import android.widget.TextView;

import android.view.accessibility.AccessibilityEvent;

public class BotAccessibility
        extends AccessibilityService {

    private static BotAccessibility instance;

    private WindowManager windowManager;

    private View overlay;

    private WindowManager.LayoutParams overlayParams;

    private final Handler handler =
            new Handler(
                    Looper.getMainLooper()
            );

    private BotEngine botEngine;

    private TextView statusText;

    private TextView characterText;

    private TextView targetText;

    private TextView aiText;

    private TextView consoleText;

    private boolean overlayVisible;


    // ============================================================
    // INSTANCE
    // ============================================================

    public static BotAccessibility getInstance() {
        return instance;
    }


    // ============================================================
    // CONNECT
    // ============================================================

    @Override
    protected void onServiceConnected() {

        super.onServiceConnected();

        instance = this;

        windowManager =
                (WindowManager)
                        getSystemService(
                                WINDOW_SERVICE
                        );

        botEngine =
                new BotEngine(
                        this,
                        new BotEngine.Listener() {

                            @Override
                            public void onState(
                                    String state
                            ) {

                                updateAI(state);
                            }

                            @Override
                            public void onConsole(
                                    String message
                            ) {

                                appendConsole(message);
                            }
                        }
                );

        showOverlay();
    }


    // ============================================================
    // ACCESSIBILITY EVENT
    // ============================================================

    @Override
    public void onAccessibilityEvent(
            AccessibilityEvent event
    ) {

        // Reserved for future screen-state reading.
        // No packet injection.
        // No client modification.
    }


    @Override
    public void onInterrupt() {

        stopBot();
    }


    @Override
    public void onDestroy() {

        stopBot();

        removeOverlay();

        instance = null;

        super.onDestroy();
    }


    // ============================================================
    // SHOW OVERLAY
    // ============================================================

    public void showOverlay() {

        handler.post(
                () -> {

                    if (overlayVisible) {
                        return;
                    }

                    createOverlay();
                }
        );
    }


    // ============================================================
    // CREATE OVERLAY
    // ============================================================

    private void createOverlay() {

        if (windowManager == null) {
            return;
        }

        LinearLayout root =
                new LinearLayout(this);

        root.setOrientation(
                LinearLayout.VERTICAL
        );

        root.setPadding(
                12,
                8,
                12,
                8
        );

        root.setBackgroundColor(
                Color.rgb(
                        9,
                        16,
                        26
                )
        );


        // --------------------------------------------------------
        // HEADER
        // --------------------------------------------------------

        LinearLayout header =
                new LinearLayout(this);

        header.setOrientation(
                LinearLayout.HORIZONTAL
        );

        TextView title =
                makeText(
                        "🤖 DUSTINBOT",
                        18
                );

        header.addView(
                title,
                new LinearLayout.LayoutParams(
                        0,
                        60,
                        1
                )
        );

        Button close =
                makeButton("×");

        header.addView(
                close,
                new LinearLayout.LayoutParams(
                        55,
                        55
                )
        );

        root.addView(header);


        // --------------------------------------------------------
        // STATUS
        // --------------------------------------------------------

        statusText =
                makeText(
                        "● STOPPED",
                        14
                );

        root.addView(statusText);


        // --------------------------------------------------------
        // CHARACTER
        // --------------------------------------------------------

        characterText =
                makeText(
                        "CHARACTER\n" +
                        "Level: --\n" +
                        "Job: --\n" +
                        "HP: --\n" +
                        "SP: --",
                        13
                );

        root.addView(characterText);


        // --------------------------------------------------------
        // TARGET
        // --------------------------------------------------------

        targetText =
                makeText(
                        "TARGET\n" +
                        "Monster: GAME LOCK\n" +
                        "HP: --\n" +
                        "Distance: --\n" +
                        "State: --",
                        13
                );

        root.addView(targetText);


        // --------------------------------------------------------
        // AI
        // --------------------------------------------------------

        aiText =
                makeText(
                        "AI STATUS\nIDLE",
                        13
                );

        root.addView(aiText);


        // --------------------------------------------------------
        // MAIN CONTROLS
        // --------------------------------------------------------

        LinearLayout controls =
                new LinearLayout(this);

        controls.setOrientation(
                LinearLayout.HORIZONTAL
        );

        Button start =
                makeButton("START");

        Button stop =
                makeButton("STOP");

        Button hide =
                makeButton("HIDE");

        controls.addView(
                start,
                new LinearLayout.LayoutParams(
                        0,
                        60,
                        1
                )
        );

        controls.addView(
                stop,
                new LinearLayout.LayoutParams(
                        0,
                        60,
                        1
                )
        );

        controls.addView(
                hide,
                new LinearLayout.LayoutParams(
                        0,
                        60,
                        1
                )
        );

        root.addView(controls);


        // --------------------------------------------------------
        // CALIBRATION
        // --------------------------------------------------------

        Button move =
                makeButton(
                        "SET MOVE POSITION"
                );

        Button attack =
                makeButton(
                        "SET ATTACK POSITION"
                );

        Button loot =
                makeButton(
                        "SET LOOT POSITION"
                );

        root.addView(move);

        root.addView(attack);

        root.addView(loot);


        // --------------------------------------------------------
        // CONSOLE
        // --------------------------------------------------------

        TextView consoleTitle =
                makeText(
                        "CONSOLE",
                        14
                );

        root.addView(consoleTitle);

        consoleText =
                makeText(
                        "DustinBot initialized.",
                        11
                );

        ScrollView consoleScroll =
                new ScrollView(this);

        consoleScroll.addView(
                consoleText
        );

        root.addView(
                consoleScroll,
                new LinearLayout.LayoutParams(
                        -1,
                        180
                )
        );


        // --------------------------------------------------------
        // BUTTON ACTIONS
        // --------------------------------------------------------

        start.setOnClickListener(
                v -> startBot()
        );

        stop.setOnClickListener(
                v -> stopBot()
        );

        hide.setOnClickListener(
                v -> minimizeOverlay()
        );

        close.setOnClickListener(
                v -> removeOverlay()
        );

        move.setOnClickListener(
                v -> CalibrationOverlay.show(
                        this,
                        "MOVE"
                )
        );

        attack.setOnClickListener(
                v -> CalibrationOverlay.show(
                        this,
                        "ATTACK"
                )
        );

        loot.setOnClickListener(
                v -> CalibrationOverlay.show(
                        this,
                        "LOOT"
                )
        );


        // --------------------------------------------------------
        // WINDOW
        // --------------------------------------------------------

        overlayParams =
                new WindowManager.LayoutParams(
                        720,
                        WindowManager.LayoutParams.WRAP_CONTENT,
                        WindowManager.LayoutParams.TYPE_ACCESSIBILITY_OVERLAY,
                        WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE,
                        PixelFormat.TRANSLUCENT
                );

        overlayParams.gravity =
                Gravity.TOP |
                Gravity.START;

        overlayParams.x = 20;

        overlayParams.y = 100;


        overlay = root;

        windowManager.addView(
                overlay,
                overlayParams
        );

        overlayVisible = true;
    }


    // ============================================================
    // MINIMIZE
    // ============================================================

    private void minimizeOverlay() {

        removeOverlay();

        LinearLayout mini =
                new LinearLayout(this);

        mini.setOrientation(
                LinearLayout.HORIZONTAL
        );

        mini.setPadding(
                10,
                5,
                5,
                5
        );

        mini.setBackgroundColor(
                Color.rgb(
                        9,
                        16,
                        26
                )
        );

        TextView title =
                makeText(
                        "🤖 DUSTINBOT",
                        13
                );

        mini.addView(
                title,
                new LinearLayout.LayoutParams(
                        0,
                        60,
                        1
                )
        );

        Button open =
                makeButton("OPEN");

        mini.addView(
                open,
                new LinearLayout.LayoutParams(
                        120,
                        60
                )
        );

        open.setOnClickListener(
                v -> {

                    removeOverlay();

                    showOverlay();
                }
        );

        overlayParams =
                new WindowManager.LayoutParams(
                        400,
                        70,
                        WindowManager.LayoutParams.TYPE_ACCESSIBILITY_OVERLAY,
                        WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE,
                        PixelFormat.TRANSLUCENT
                );

        overlayParams.gravity =
                Gravity.TOP |
                Gravity.START;

        overlayParams.x = 20;

        overlayParams.y = 100;

        overlay = mini;

        windowManager.addView(
                overlay,
                overlayParams
        );

        overlayVisible = true;
    }


    // ============================================================
    // REMOVE OVERLAY
    // ============================================================

    public void removeOverlay() {

        handler.post(
                () -> {

                    if (
                            overlay != null &&
                            windowManager != null
                    ) {

                        try {

                            windowManager.removeView(
                                    overlay
                            );

                        } catch (Exception ignored) {
                        }
                    }

                    overlay = null;

                    overlayVisible = false;
                }
        );
    }


    // ============================================================
    // START
    // ============================================================

    private void startBot() {

        if (botEngine == null) {
            return;
        }

        botEngine.start();

        if (statusText != null) {

            statusText.setText(
                    "● RUNNING"
            );
        }
    }


    // ============================================================
    // STOP
    // ============================================================

    private void stopBot() {

        if (botEngine != null) {

            botEngine.stop();
        }

        if (statusText != null) {

            statusText.setText(
                    "● STOPPED"
            );
        }
    }


    // ============================================================
    // AI
    // ============================================================

    private void updateAI(
            String state
    ) {

        handler.post(
                () -> {

                    if (aiText != null) {

                        aiText.setText(
                                "AI STATUS\n" +
                                state
                        );
                    }
                }
        );
    }


    // ============================================================
    // CONSOLE
    // ============================================================

    private void appendConsole(
            String message
    ) {

        handler.post(
                () -> {

                    if (consoleText != null) {

                        consoleText.append(
                                "\n> " +
                                message
                        );
                    }
                }
        );
    }


    // ============================================================
    // TEXT
    // ============================================================

    private TextView makeText(
            String value,
            int size
    ) {

        TextView text =
                new TextView(this);

        text.setText(value);

        text.setTextColor(
                Color.WHITE
        );

        text.setTextSize(
                size
        );

        text.setPadding(
                5,
                5,
                5,
                5
        );

        return text;
    }


    // ============================================================
    // BUTTON
    // ============================================================

    private Button makeButton(
            String value
    ) {

        Button button =
                new Button(this);

        button.setText(value);

        button.setTextSize(10);

        return button;
    }


    // ============================================================
    // TAP
    // ============================================================

    public boolean tap(
            float x,
            float y
    ) {

        Path path =
                new Path();

        path.moveTo(
                x,
                y
        );

        GestureDescription.StrokeDescription stroke =
                new GestureDescription.StrokeDescription(
                        path,
                        0,
                        80
                );

        GestureDescription gesture =
                new GestureDescription.Builder()
                        .addStroke(stroke)
                        .build();

        return dispatchGesture(
                gesture,
                null,
                null
        );
    }


    // ============================================================
    // SWIPE
    // ============================================================

    public boolean swipe(
            float x1,
            float y1,
            float x2,
            float y2,
            long duration
    ) {

        Path path =
                new Path();

        path.moveTo(
                x1,
                y1
        );

        path.lineTo(
                x2,
                y2
        );

        GestureDescription.StrokeDescription stroke =
                new GestureDescription.StrokeDescription(
                        path,
                        0,
                        duration
                );

        GestureDescription gesture =
                new GestureDescription.Builder()
                        .addStroke(stroke)
                        .build();

        return dispatchGesture(
                gesture,
                null,
                null
        );
    }
}
EOF


      # ============================================================
      # CALIBRATION OVERLAY
      # ============================================================

      - name: Create CalibrationOverlay.java
        shell: bash
        run: |
          cat > app/src/main/java/com/dustinbot/v3/CalibrationOverlay.java <<'EOF'
package com.dustinbot.v3;

import android.graphics.Color;
import android.graphics.PixelFormat;

import android.view.Gravity;
import android.view.MotionEvent;
import android.view.View;
import android.view.WindowManager;

import android.widget.Button;
import android.widget.FrameLayout;
import android.widget.LinearLayout;
import android.widget.TextView;

public final class CalibrationOverlay {

    private CalibrationOverlay() {
    }


    public static void show(
            BotAccessibility service,
            String mode
    ) {

        WindowManager wm =
                (WindowManager)
                        service.getSystemService(
                                BotAccessibility.WINDOW_SERVICE
                        );


        FrameLayout root =
                new FrameLayout(service);

        root.setBackgroundColor(
                Color.TRANSPARENT
        );


        // ========================================================
        // TOUCH LAYER
        // ========================================================

        View touchLayer =
                new View(service);

        touchLayer.setBackgroundColor(
                Color.TRANSPARENT
        );


        // ========================================================
        // INFO PANEL
        // ========================================================

        LinearLayout panel =
                new LinearLayout(service);

        panel.setOrientation(
                LinearLayout.VERTICAL
        );

        panel.setPadding(
                18,
                15,
                18,
                15
        );

        panel.setBackgroundColor(
                Color.argb(
                        235,
                        8,
                        15,
                        25
                )
        );


        TextView title =
                new TextView(service);

        title.setText(
                "SET " +
                mode +
                " POSITION"
        );

        title.setTextColor(
                Color.WHITE
        );

        title.setTextSize(
                18
        );

        panel.addView(
                title
        );


        TextView instruction =
                new TextView(service);

        instruction.setText(
                "แตะตำแหน่งที่ต้องการบนหน้าเกม\n" +
                "จากนั้นกด SAVE"
        );

        instruction.setTextColor(
                Color.WHITE
        );

        instruction.setTextSize(
                14
        );

        panel.addView(
                instruction
        );


        TextView coordinates =
                new TextView(service);

        coordinates.setText(
                "X: --   Y: --"
        );

        coordinates.setTextColor(
                Color.WHITE
        );

        coordinates.setTextSize(
                14
        );

        panel.addView(
                coordinates
        );


        LinearLayout buttons =
                new LinearLayout(service);

        buttons.setOrientation(
                LinearLayout.HORIZONTAL
        );


        Button save =
                new Button(service);

        save.setText(
                "SAVE"
        );

        save.setEnabled(
                false
        );


        Button cancel =
                new Button(service);

        cancel.setText(
                "CANCEL"
        );


        buttons.addView(
                save,
                new LinearLayout.LayoutParams(
                        0,
                        60,
                        1
                )
        );


        buttons.addView(
                cancel,
                new LinearLayout.LayoutParams(
                        0,
                        60,
                        1
                )
        );


        panel.addView(
                buttons
        );


        // ========================================================
        // STORE POINT
        // ========================================================

        final float[] point =
                new float[]{
                        -1,
                        -1
                };


        touchLayer.setOnTouchListener(
                new View.OnTouchListener() {

                    @Override
                    public boolean onTouch(
                            View view,
                            MotionEvent event
                    ) {

                        if (
                                event.getAction()
                                        == MotionEvent.ACTION_UP
                        ) {

                            point[0] =
                                    event.getRawX();

                            point[1] =
                                    event.getRawY();


                            coordinates.setText(
                                    "X: " +
                                    point[0] +
                                    "   Y: " +
                                    point[1]
                            );


                            save.setEnabled(
                                    true
                            );


                            return true;
                        }


                        return true;
                    }
                }
        );


        // ========================================================
        // SAVE
        // ========================================================

        save.setOnClickListener(
                view -> {

                    if (
                            point[0] >= 0 &&
                            point[1] >= 0
                    ) {

                        SettingsStore.savePoint(
                                service,
                                mode,
                                point[0],
                                point[1]
                        );


                        coordinates.setText(
                                "SAVED\n" +
                                "X: " +
                                point[0] +
                                "\nY: " +
                                point[1]
                        );
                    }
                }
        );


        // ========================================================
        // CANCEL
        // ========================================================

        cancel.setOnClickListener(
                view -> {

                    try {

                        wm.removeView(
                                root
                        );

                    } catch (Exception ignored) {
                    }
                }
        );


        // ========================================================
        // ROOT
        // ========================================================

        root.addView(
                touchLayer,
                new FrameLayout.LayoutParams(
                        -1,
                        -1
                )
        );


        FrameLayout.LayoutParams panelParams =
                new FrameLayout.LayoutParams(
                        650,
                        -2
                );


        panelParams.gravity =
                Gravity.TOP |
                Gravity.CENTER_HORIZONTAL;

        panelParams.topMargin =
                70;


        root.addView(
                panel,
                panelParams
        );


        // ========================================================
        // WINDOW
        // ========================================================

        WindowManager.LayoutParams params =
                new WindowManager.LayoutParams(
                        -1,
                        -1,
                        WindowManager.LayoutParams.TYPE_ACCESSIBILITY_OVERLAY,
                        WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE,
                        PixelFormat.TRANSLUCENT
                );


        params.gravity =
                Gravity.TOP |
                Gravity.START;


        wm.addView(
                root,
                params
        );
    }
}
