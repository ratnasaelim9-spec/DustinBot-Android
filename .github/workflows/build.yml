      # =====================================================
      # BUILD
      # =====================================================

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        shell: bash
        run: |
          set -e

          gradle \
            --no-daemon \
            --stacktrace \
            :app:assembleDebug

      # =====================================================
      # PREPARE APK
      # =====================================================

      - name: Prepare APK
        shell: bash
        run: |
          set -e

          mkdir -p output

          cp \
            app/build/outputs/apk/debug/app-debug.apk \
            output/DustinBotV9.1-RANDOM-LOOT.apk

          ls -lh \
            output/DustinBotV9.1-RANDOM-LOOT.apk

      # =====================================================
      # UPLOAD
      # =====================================================

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DUSTIN-BOT-V9.1-RANDOM-LOOT
          path: output/DustinBotV9.1-RANDOM-LOOT.apk
          if-no-files-found: error
