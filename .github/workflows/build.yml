name: Build DustinBot Android V2

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Create Android Project
        shell: bash
        run: |

          rm -rf app
          rm -rf build.gradle
          rm -rf settings.gradle
          rm -rf gradle.properties

          mkdir -p app/src/main/java/com/dustinbot/v2
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/xml


          # ============================================================
          # settings.gradle
          # ============================================================

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(
                  RepositoriesMode.FAIL_ON_PROJECT_REPOS
              )

              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "DustinBotAndroidV2"

          include(":app")
          EOF


          # ============================================================
          # Root build.gradle
          # ============================================================

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
                  version '8.6.1'
                  apply false
          }
          EOF


          # ============================================================
          # gradle.properties
          # ============================================================

          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          EOF


          # ============================================================
          # app/build.gradle
          # ============================================================

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.dustinbot.v2'

              compileSdk 35

              defaultConfig {
                  applicationId 'com.dustinbot.v2'

                  minSdk 26

                  targetSdk 35

                  versionCode 20

                  versionName '2.0'
              }
          }
          EOF


          # ============================================================
          # strings.xml
          # ============================================================

          cat > app/src/main/res/values/strings.xml <<'EOF'
          <resources>

              <string name="app_name">
                  DustinBot Android V2
              </string>

              <string name="accessibility_description">
                  DustinBot Android Controller
              </string>

          </resources>
          EOF


          # ============================================================
          # themes.xml
          # ============================================================

          cat > app/src/main/res/values/themes.xml <<'EOF'
          <resources>

              <style
                  name="AppTheme"
                  parent="android:style/Theme.Material.Light.NoActionBar">

                  <item name="android:fontFamily">
                      sans
                  </item>

                  <item name="android:colorAccent">
                      #1976D2
                  </item>

                  <item name="android:navigationBarColor">
                      #111111
                  </item>

                  <item name="android:statusBarColor">
                      #111111
                  </item>

              </style>

          </resources>
          EOF


          # ============================================================
          # accessibility.xml
          # ============================================================

          cat > app/src/main/res/xml/accessibility.xml <<'EOF'
          <accessibility-service
              xmlns:android="http://schemas.android.com/apk/res/android"

              android:description="@string/accessibility_description"

              android:accessibilityEventTypes="
                  typeWindowStateChanged|
                  typeWindowContentChanged
              "

              android:accessibilityFeedbackType="feedbackGeneric"

              android:notificationTimeout="100"

              android:canPerformGestures="true"

              android:canRetrieveWindowContent="true" />
          EOF


          # ============================================================
          # AndroidManifest.xml
          # ============================================================

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest
              xmlns:android="http://schemas.android.com/apk/res/android">

              <application
                  android:allowBackup="false"
                  android:label="@string/app_name"
                  android:theme="@style/AppTheme">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">

                      <intent-filter>

                          <action
                              android:name="android.intent.action.MAIN" />

                          <category
                              android:name="android.intent.category.LAUNCHER" />

                      </intent-filter>

                  </activity>


                  <service
                      android:name=".BotAccessibility"
                      android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE"
                      android:exported="false">

                      <intent-filter>

                          <action
                              android:name=
                              "android.accessibilityservice.AccessibilityService" />

                      </intent-filter>

                      <meta-data
                          android:name=
                          "android.accessibilityservice"

                          android:resource=
                          "@xml/accessibility" />

                  </service>

              </application>

          </manifest>
          EOF


          # ============================================================
          # BotAccessibility.java
          # ============================================================

          cat > app/src/main/java/com/dustinbot/v2/BotAccessibility.java <<'EOF'
          package com.dustinbot.v2;

          import android.accessibilityservice.AccessibilityService;
          import android.accessibilityservice.GestureDescription;
          import android.graphics.Path;
          import android.view.accessibility.AccessibilityEvent;

          public class BotAccessibility
              extends AccessibilityService {

              public static volatile
              BotAccessibility instance;


              @Override
              protected void onServiceConnected() {

                  super.onServiceConnected();

                  instance = this;

                  MainActivity.log(
                      "ACCESSIBILITY CONNECTED"
                  );
              }


              @Override
              public void onAccessibilityEvent(
                  AccessibilityEvent event
              ) {
              }


              @Override
              public void onInterrupt() {
              }


              public static boolean ready() {

                  return instance != null;
              }


              public static boolean tap(
                  float x,
                  float y
              ) {

                  if (instance == null)
                      return false;

                  Path path = new Path();

                  path.moveTo(x, y);

                  GestureDescription gesture =
                      new GestureDescription
                          .Builder()

                          .addStroke(
                              new GestureDescription
                                  .StrokeDescription(
                                      path,
                                      0,
                                      80
                                  )
                          )

                          .build();

                  return instance.dispatchGesture(
                      gesture,
                      null,
                      null
                  );
              }


              public static boolean swipe(
                  float x1,
                  float y1,
                  float x2,
                  float y2,
                  long duration
              ) {

                  if (instance == null)
                      return false;

                  Path path = new Path();

                  path.moveTo(x1, y1);

                  path.lineTo(x2, y2);

                  GestureDescription gesture =
                      new GestureDescription
                          .Builder()

                          .addStroke(
                              new GestureDescription
                                  .StrokeDescription(
                                      path,
                                      0,
                                      duration
                                  )
                          )

                          .build();

                  return instance.dispatchGesture(
                      gesture,
                      null,
                      null
                  );
              }
          }
          EOF


          # ============================================================
          # SettingsStore.java
          # ============================================================

          cat > app/src/main/java/com/dustinbot/v2/SettingsStore.java <<'EOF'
          package com.dustinbot.v2;

          import android.content.Context;
          import android.content.SharedPreferences;

          public class SettingsStore {

              private static final String FILE =
                  "DustinBotSettings";


              private static SharedPreferences p(
                  Context c
              ) {

                  return c.getSharedPreferences(
                      FILE,
                      Context.MODE_PRIVATE
                  );
              }


              public static void savePoint(
                  Context c,
                  String name,
                  float x,
                  float y
              ) {

                  p(c)
                      .edit()

                      .putFloat(
                          name + "_x",
                          x
                      )

                      .putFloat(
                          name + "_y",
                          y
                      )

                      .apply();
              }


              public static float x(
                  Context c,
                  String name
              ) {

                  return p(c).getFloat(
                      name + "_x",
                      -1
                  );
              }


              public static float y(
                  Context c,
                  String name
              ) {

                  return p(c).getFloat(
                      name + "_y",
                      -1
                  );
              }


              public static boolean exists(
                  Context c,
                  String name
              ) {

                  return x(c, name) >= 0
                      &&
                      y(c, name) >= 0;
              }
          }
          EOF


          # ============================================================
          # Calibration.java
          # ============================================================

          cat > app/src/main/java/com/dustinbot/v2/Calibration.java <<'EOF'
          package com.dustinbot.v2;

          import android.content.Context;
          import android.graphics.Color;
          import android.graphics.PixelFormat;
          import android.view.Gravity;
          import android.view.MotionEvent;
          import android.view.View;
          import android.view.WindowManager;
          import android.widget.TextView;

          public class Calibration {

              public static void start(
                  Context context,
                  String name
              ) {

                  if (
                      BotAccessibility.instance == null
                  ) {

                      MainActivity.log(
                          "Accessibility ยังไม่พร้อม"
                      );

                      return;
                  }


                  WindowManager wm =
                      (WindowManager)
                      context.getSystemService(
                          Context.WINDOW_SERVICE
                      );


                  TextView overlay =
                      new TextView(context);


                  overlay.setText(
                      "ตั้งปุ่ม " +
                      name +
                      "\n\n" +
                      "แตะตำแหน่งปุ่มในเกม"
                  );


                  overlay.setTextSize(22);

                  overlay.setTextColor(
                      Color.WHITE
                  );

                  overlay.setGravity(
                      Gravity.CENTER
                  );

                  overlay.setBackgroundColor(
                      0xCC000000
                  );


                  overlay.setOnTouchListener(
                      new View.OnTouchListener() {

                          @Override
                          public boolean onTouch(
                              View v,
                              MotionEvent event
                          ) {

                              if (
                                  event.getAction()
                                  ==
                                  MotionEvent.ACTION_UP
                              ) {

                                  float x =
                                      event.getRawX();

                                  float y =
                                      event.getRawY();


                                  SettingsStore.savePoint(
                                      context,
                                      name,
                                      x,
                                      y
                                  );


                                  MainActivity.log(
                                      "บันทึก " +
                                      name +
                                      " = " +
                                      (int)x +
                                      "," +
                                      (int)y
                                  );


                                  try {

                                      wm.removeView(
                                          overlay
                                      );

                                  }

                                  catch (
                                      Exception ignored
                                  ) {
                                  }


                                  return true;
                              }


                              return true;
                          }
                      }
                  );


                  WindowManager.LayoutParams lp =
                      new WindowManager.LayoutParams(

                          -1,

                          -1,

                          WindowManager
                              .LayoutParams
                              .TYPE_ACCESSIBILITY_OVERLAY,

                          WindowManager
                              .LayoutParams
                              .FLAG_LAYOUT_IN_SCREEN,

                          PixelFormat.TRANSLUCENT
                      );


                  lp.gravity =
                      Gravity.TOP |
                      Gravity.START;


                  wm.addView(
                      overlay,
                      lp
                  );
              }
          }
          EOF


          # ============================================================
          # BotEngine.java
          # ============================================================

          cat > app/src/main/java/com/dustinbot/v2/BotEngine.java <<'EOF'
          package com.dustinbot.v2;

          import android.content.Context;

          public class BotEngine {

              private static volatile boolean running;

              private static Thread thread;


              public static void start(
                  Context context
              ) {

                  if (running)
                      return;


                  if (
                      !SettingsStore.exists(
                          context,
                          "move"
                      )
                  ) {

                      MainActivity.log(
                          "ยังไม่ได้ตั้ง MOVE"
                      );

                      return;
                  }


                  if (
                      !SettingsStore.exists(
                          context,
                          "attack"
                      )
                  ) {

                      MainActivity.log(
                          "ยังไม่ได้ตั้ง ATTACK"
                      );

                      return;
                  }


                  if (
                      !SettingsStore.exists(
                          context,
                          "loot"
                      )
                  ) {

                      MainActivity.log(
                          "ยังไม่ได้ตั้ง LOOT"
                      );

                      return;
                  }


                  if (
                      !BotAccessibility.ready()
                  ) {

                      MainActivity.log(
                          "กรุณาเปิด Accessibility"
                      );

                      return;
                  }


                  running = true;


                  MainActivity.status(
                      "RUNNING"
                  );


                  MainActivity.log(
                      "AI START"
                  );


                  thread =
                      new Thread(
                          () -> loop(context),
                          "DustinBotAI"
                      );


                  thread.start();
              }


              public static void stop() {

                  running = false;


                  if (thread != null) {

                      thread.interrupt();

                      thread = null;
                  }


                  MainActivity.status(
                      "STOP"
                  );


                  MainActivity.log(
                      "AI STOP"
                  );
              }


              private static void loop(
                  Context context
              ) {

                  boolean right = true;


                  while (running) {

                      try {

                          float moveX =
                              SettingsStore.x(
                                  context,
                                  "move"
                              );

                          float moveY =
                              SettingsStore.y(
                                  context,
                                  "move"
                              );


                          float attackX =
                              SettingsStore.x(
                                  context,
                                  "attack"
                              );

                          float attackY =
                              SettingsStore.y(
                                  context,
                                  "attack"
                              );


                          float lootX =
                              SettingsStore.x(
                                  context,
                                  "loot"
                              );

                          float lootY =
                              SettingsStore.y(
                                  context,
                                  "loot"
                              );


                          /*
                           * WALK
                           */

                          MainActivity.status(
                              "WALK"
                          );

                          MainActivity.log(
                              "เดิน"
                          );


                          float width =
                              context
                                  .getResources()
                                  .getDisplayMetrics()
                                  .widthPixels;


                          float distance =
                              width * 0.25f;


                          float endX;


                          if (right) {

                              endX =
                                  moveX + distance;

                          }

                          else {

                              endX =
                                  moveX - distance;
                          }


                          BotAccessibility.swipe(
                              moveX,
                              moveY,
                              endX,
                              moveY,
                              900
                          );


                          Thread.sleep(1000);


                          /*
                           * TARGET
                           *
                           * เกมเป็นคนล็อกเป้า
                           */

                          MainActivity.status(
                              "TARGET"
                          );

                          MainActivity.log(
                              "รอเป้าหมายจากเกม"
                          );


                          Thread.sleep(700);


                          /*
                           * ATTACK
                           */

                          MainActivity.status(
                              "ATTACK"
                          );

                          MainActivity.log(
                              "โจมตี"
                          );


                          for (
                              int i = 0;
                              i < 5 && running;
                              i++
                          ) {

                              BotAccessibility.tap(
                                  attackX,
                                  attackY
                              );


                              Thread.sleep(500);
                          }


                          /*
                           * LOOT
                           */

                          MainActivity.status(
                              "LOOT"
                          );

                          MainActivity.log(
                              "เก็บของ"
                          );


                          BotAccessibility.tap(
                              lootX,
                              lootY
                          );


                          Thread.sleep(700);


                          /*
                           * CHANGE DIRECTION
                           */

                          right = !right;


                      }

                      catch (
                          InterruptedException e
                      ) {

                          Thread.currentThread()
                              .interrupt();

                          break;
                      }

                      catch (
                          Exception e
                      ) {

                          MainActivity.log(
                              "ERROR: " +
                              e.getMessage()
                          );

                          break;
                      }
                  }


                  running = false;

                  MainActivity.status(
                      "STOP"
                  );
              }
          }
          EOF


          # ============================================================
          # MainActivity.java
          # ============================================================

          cat > app/src/main/java/com/dustinbot/v2/MainActivity.java <<'EOF'
          package com.dustinbot.v2;

          import android.app.Activity;
          import android.content.Intent;
          import android.graphics.Color;
          import android.graphics.Typeface;
          import android.os.Bundle;
          import android.provider.Settings;
          import android.view.Gravity;
          import android.view.View;
          import android.widget.Button;
          import android.widget.LinearLayout;
          import android.widget.ScrollView;
          import android.widget.TextView;

          public class MainActivity
              extends Activity {

              private static MainActivity self;

              private static TextView statusView;

              private static TextView consoleView;


              @Override
              protected void onCreate(
                  Bundle savedInstanceState
              ) {

                  super.onCreate(
                      savedInstanceState
                  );

                  self = this;

                  buildUI();
              }


              private void buildUI() {

                  LinearLayout root =
                      new LinearLayout(this);

                  root.setOrientation(
                      LinearLayout.VERTICAL
                  );

                  root.setPadding(
                      16,
                      16,
                      16,
                      16
                  );

                  root.setBackgroundColor(
                      Color.rgb(
                          18,
                          18,
                          18
                      )
                  );


                  TextView title =
                      text(
                          "DUSTINBOT ANDROID V2",
                          22
                      );

                  title.setTypeface(
                      Typeface.DEFAULT_BOLD
                  );


                  root.addView(
                      title,
                      params()
                  );


                  statusView =
                      text(
                          "STOP",
                          18
                      );


                  root.addView(
                      statusView,
                      params()
                  );


                  /*
                   * MAP
                   */

                  TextView map =
                      text(
                          "MAP\n\n" +
                          "┌──────────────────────┐\n" +
                          "│                      │\n" +
                          "│       PLAYER         │\n" +
                          "│                      │\n" +
                          "│    MONSTER           │\n" +
                          "│                      │\n" +
                          "└──────────────────────┘",
                          16
                      );


                  map.setGravity(
                      Gravity.CENTER
                  );


                  root.addView(
                      map,
                      params()
                  );


                  /*
                   * CHARACTER
                   */

                  TextView character =
                      text(
                          "CHARACTER\n" +
                          "Level : --\n" +
                          "Job   : --\n" +
                          "HP    : --\n" +
                          "SP    : --",
                          16
                      );


                  root.addView(
                      character,
                      params()
                  );


                  /*
                   * TARGET
                   */

                  TextView target =
                      text(
                          "TARGET\n" +
                          "Monster : GAME LOCK\n" +
                          "HP      : --\n" +
                          "State   : --",
                          16
                      );


                  root.addView(
                      target,
                      params()
                  );


                  /*
                   * CALIBRATION
                   */

                  Button move =
                      button(
                          "SET MOVE"
                      );


                  move.setOnClickListener(
                      v ->
                          Calibration.start(
                              this,
                              "move"
                          )
                  );


                  root.addView(
                      move,
                      params()
                  );


                  Button attack =
                      button(
                          "SET ATTACK"
                      );


                  attack.setOnClickListener(
                      v ->
                          Calibration.start(
                              this,
                              "attack"
                          )
                  );


                  root.addView(
                      attack,
                      params()
                  );


                  Button loot =
                      button(
                          "SET LOOT"
                      );


                  loot.setOnClickListener(
                      v ->
                          Calibration.start(
                              this,
                              "loot"
                          )
                  );


                  root.addView(
                      loot,
                      params()
                  );


                  /*
                   * ACCESSIBILITY
                   */

                  Button access =
                      button(
                          "OPEN ACCESSIBILITY"
                      );


                  access.setOnClickListener(
                      v -> {

                          try {

                              startActivity(
                                  new Intent(
                                      Settings
                                          .ACTION_ACCESSIBILITY_SETTINGS
                                  )
                              );

                          }

                          catch (
                              Exception ignored
                          ) {
                          }
                      }
                  );


                  root.addView(
                      access,
                      params()
                  );


                  /*
                   * START
                   */

                  Button start =
                      button(
                          "START BOT"
                      );


                  start.setOnClickListener(
                      v ->
                          BotEngine.start(
                              this
                          )
                  );


                  root.addView(
                      start,
                      params()
                  );


                  /*
                   * STOP
                   */

                  Button stop =
                      button(
                          "STOP BOT"
                      );


                  stop.setOnClickListener(
                      v ->
                          BotEngine.stop()
                  );


                  root.addView(
                      stop,
                      params()
                  );


                  /*
                   * CONSOLE
                   */

                  TextView consoleTitle =
                      text(
                          "CONSOLE",
                          18
                      );


                  root.addView(
                      consoleTitle,
                      params()
                  );


                  consoleView =
                      text(
                          "Ready.",
                          13
                      );


                  ScrollView scroll =
                      new ScrollView(
                          this
                      );


                  scroll.addView(
                      consoleView
                  );


                  LinearLayout.LayoutParams
                      consoleParams =
                          params();


                  consoleParams.weight =
                      1;


                  root.addView(
                      scroll,
                      consoleParams
                  );


                  setContentView(
                      root
                  );
              }


              private TextView text(
                  String value,
                  int size
              ) {

                  TextView t =
                      new TextView(this);

                  t.setText(value);

                  t.setTextColor(
                      Color.WHITE
                  );

                  t.setTextSize(size);

                  t.setPadding(
                      8,
                      8,
                      8,
                      8
                  );

                  return t;
              }


              private Button button(
                  String value
              ) {

                  Button b =
                      new Button(this);

                  b.setText(value);

                  return b;
              }


              private LinearLayout.LayoutParams
              params() {

                  return new LinearLayout.LayoutParams(
                      LinearLayout.LayoutParams.MATCH_PARENT,
                      LinearLayout.LayoutParams.WRAP_CONTENT
                  );
              }


              public static void status(
                  String value
              ) {

                  if (
                      self == null ||
                      statusView == null
                  )
                      return;


                  self.runOnUiThread(
                      () ->
                          statusView.setText(
                              "STATUS: " +
                              value
                          )
                  );
              }


              public static void log(
                  String value
              ) {

                  if (
                      self == null ||
                      consoleView == null
                  )
                      return;


                  self.runOnUiThread(
                      () -> {

                          String old =
                              consoleView
                                  .getText()
                                  .toString();


                          consoleView.setText(
                              old +
                              "\n" +
                              value
                          );
                      }
                  );
              }
          }
          EOF


      # ================================================================
      # Setup Gradle
      # ================================================================

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
          cache-disabled: true


      # ================================================================
      # Build APK
      # ================================================================

      - name: Build Debug APK
        shell: bash
        run: |
          gradle assembleDebug --no-daemon --stacktrace


      # ================================================================
      # Verify APK
      # ================================================================

      - name: Check APK
        shell: bash
        run: |
          echo "===================================="
          echo "APK OUTPUT"
          echo "===================================="

          find app/build/outputs/apk -type f -print

          echo "===================================="

          test -f \
            app/build/outputs/apk/debug/app-debug.apk

          echo "APK FOUND"


      # ================================================================
      # Upload APK
      # ================================================================

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DustinBot-Android-V2-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
