name: DustinBot Android AUTO START

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:

  build:

    runs-on: ubuntu-latest

    steps:

      # ==========================================================
      # CHECKOUT
      # ==========================================================

      - name: Checkout
        uses: actions/checkout@v4


      # ==========================================================
      # JAVA
      # ==========================================================

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'


      # ==========================================================
      # CREATE PROJECT
      # ==========================================================

      - name: Create Android Project
        shell: bash
        run: |

          set -e

          mkdir -p app/src/main/java/com/dustinbot/auto
          mkdir -p app/src/main/res/xml
          mkdir -p app/src/main/res/values


          # ======================================================
          # SETTINGS
          # ======================================================

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)

              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "DustinBotAuto"

          include(":app")
          EOF


          # ======================================================
          # ROOT BUILD
          # ======================================================

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.6.1' apply false
          }
          EOF


          # ======================================================
          # GRADLE PROPERTIES
          # ======================================================

          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=false
          EOF


          # ======================================================
          # APP BUILD
          # ======================================================

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {

              namespace 'com.dustinbot.auto'

              compileSdk 35

              defaultConfig {

                  applicationId 'com.dustinbot.auto'

                  minSdk 30

                  targetSdk 35

                  versionCode 70

                  versionName '7.0'
              }

              compileOptions {

                  sourceCompatibility JavaVersion.VERSION_17

                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          EOF


          # ======================================================
          # STRINGS
          # ======================================================

          cat > app/src/main/res/values/strings.xml <<'EOF'
          <resources>

              <string name="app_name">
                  DustinBot AUTO
              </string>

              <string name="accessibility_description">
                  DustinBot automatic screen automation service.
              </string>

          </resources>
          EOF


          # ======================================================
          # STYLE
          # ======================================================

          cat > app/src/main/res/values/styles.xml <<'EOF'
          <resources>

              <style
                  name="DustinBotTheme"
                  parent="@android:style/Theme.Material.NoActionBar">

                  <item name="android:fontFamily">
                      sans
                  </item>

                  <item name="android:windowNoTitle">
                      true
                  </item>

                  <item name="android:colorAccent">
                      #00C853
                  </item>

                  <item name="android:statusBarColor">
                      #000000
                  </item>

                  <item name="android:navigationBarColor">
                      #000000
                  </item>

              </style>

          </resources>
          EOF


          # ======================================================
          # ACCESSIBILITY CONFIG
          # ======================================================

          cat > app/src/main/res/xml/accessibility_service_config.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>

          <accessibility-service
              xmlns:android="http://schemas.android.com/apk/res/android"

              android:accessibilityEventTypes="
                  typeWindowStateChanged|
                  typeWindowContentChanged
              "

              android:accessibilityFeedbackType="feedbackGeneric"

              android:notificationTimeout="100"

              android:canRetrieveWindowContent="true"

              android:canPerformGestures="true"

              android:canTakeScreenshot="true"

              android:description="@string/accessibility_description" />

          EOF


          # ======================================================
          # MANIFEST
          # ======================================================

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>

          <manifest
              xmlns:android="http://schemas.android.com/apk/res/android">

              <application

                  android:allowBackup="false"

                  android:label="DustinBot AUTO"

                  android:theme="@style/DustinBotTheme"

                  android:supportsRtl="true">


                  <activity

                      android:name=".MainActivity"

                      android:exported="true">

                      <intent-filter>

                          <action
                              android:name="android.intent.action.MAIN" />

                          <category
                              android:name="android.intent.category.LAUNCHER" />

                      </intent-filter>

                  </activity>


                  <service

                      android:name=".BotAccessibility"

                      android:permission="
                          android.permission.BIND_ACCESSIBILITY_SERVICE
                      "

                      android:exported="false">

                      <intent-filter>

                          <action
                              android:name="
                              android.accessibilityservice.AccessibilityService
                              " />

                      </intent-filter>


                      <meta-data

                          android:name="
                          android.accessibilityservice
                          "

                          android:resource="
                          @xml/accessibility_service_config
                          " />

                  </service>

              </application>

          </manifest>
          EOF


          # ======================================================
          # GAME LAUNCHER
          # ======================================================

          cat > app/src/main/java/com/dustinbot/auto/GameLauncher.java <<'EOF'
          package com.dustinbot.auto;

          import android.content.Context;
          import android.content.Intent;
          import android.content.pm.PackageManager;
          import android.content.pm.ResolveInfo;

          import java.util.List;
          import java.util.Locale;


          public final class GameLauncher {

              private GameLauncher() {
              }


              public static String findGame(
                      Context context) {

                  PackageManager pm =
                          context.getPackageManager();


                  Intent intent =
                          new Intent(
                                  Intent.ACTION_MAIN);


                  intent.addCategory(
                          Intent.CATEGORY_LAUNCHER);


                  List<ResolveInfo> apps =
                          pm.queryIntentActivities(
                                  intent,
                                  PackageManager.MATCH_ALL);


                  String possible = null;


                  for (ResolveInfo info : apps) {

                      String label =
                              String.valueOf(
                                      info.loadLabel(pm))
                                      .toLowerCase(
                                              Locale.ROOT);


                      String pkg =
                              info.activityInfo
                                      .packageName
                                      .toLowerCase(
                                              Locale.ROOT);


                      if (label.contains("dustin")) {

                          return info.activityInfo
                                  .packageName;
                      }


                      if (label.contains("ragnarok")) {

                          possible =
                                  info.activityInfo
                                          .packageName;
                      }


                      if (pkg.contains("dustin")) {

                          return info.activityInfo
                                  .packageName;
                      }
                  }


                  return possible;
              }


              public static boolean open(
                      Context context) {

                  String pkg =
                          findGame(context);


                  if (pkg == null) {

                      return false;
                  }


                  Intent launch =
                          context
                                  .getPackageManager()
                                  .getLaunchIntentForPackage(
                                          pkg);


                  if (launch == null) {

                      return false;
                  }


                  launch.addFlags(
                          Intent.FLAG_ACTIVITY_NEW_TASK |
                          Intent.FLAG_ACTIVITY_RESET_TASK_IF_NEEDED
                  );


                  context.startActivity(
                          launch);


                  return true;
              }
          }
          EOF


          # ======================================================
          # VISION
          # ======================================================

          cat > app/src/main/java/com/dustinbot/auto/Vision.java <<'EOF'
          package com.dustinbot.auto;

          import android.graphics.Bitmap;
          import android.graphics.Color;

          import java.util.ArrayDeque;
          import java.util.ArrayList;
          import java.util.List;


          public final class Vision {


              public static class ObjectPoint {

                  public int x;

                  public int y;

                  public int width;

                  public int height;

                  public int score;


                  public ObjectPoint(
                          int x,
                          int y,
                          int width,
                          int height,
                          int score) {

                      this.x = x;

                      this.y = y;

                      this.width = width;

                      this.height = height;

                      this.score = score;
                  }
              }


              private Vision() {
              }


              /*
               * Detect compact coloured objects
               * inside the actual game field.
               *
               * Bottom UI is excluded.
               */

              public static List<ObjectPoint> detect(
                      Bitmap bitmap) {

                  ArrayList<ObjectPoint> result =
                          new ArrayList<>();


                  if (bitmap == null) {

                      return result;
                  }


                  int width =
                          bitmap.getWidth();

                  int height =
                          bitmap.getHeight();


                  if (width < 300 ||
                      height < 500) {

                      return result;
                  }


                  int left =
                          (int)(width * 0.04f);

                  int right =
                          (int)(width * 0.96f);

                  int top =
                          (int)(height * 0.10f);

                  int bottom =
                          (int)(height * 0.70f);


                  int step =
                          Math.max(
                                  3,
                                  Math.min(
                                          width,
                                          height) / 320);


                  int gridW =
                          ((right-left)/step)+1;

                  int gridH =
                          ((bottom-top)/step)+1;


                  boolean[] active =
                          new boolean[
                                  gridW * gridH
                          ];


                  boolean[] visited =
                          new boolean[
                                  gridW * gridH
                          ];


                  for (int gy=0;
                       gy<gridH;
                       gy++) {

                      for (int gx=0;
                           gx<gridW;
                           gx++) {

                          int x =
                                  Math.min(
                                          width-1,
                                          left+gx*step);

                          int y =
                                  Math.min(
                                          height-1,
                                          top+gy*step);


                          int color =
                                  bitmap.getPixel(
                                          x,
                                          y);


                          int r =
                                  Color.red(color);

                          int g =
                                  Color.green(color);

                          int b =
                                  Color.blue(color);


                          int max =
                                  Math.max(
                                          r,
                                          Math.max(g,b));

                          int min =
                                  Math.min(
                                          r,
                                          Math.min(g,b));


                          int saturation =
                                  max-min;


                          int brightness =
                                  (r+g+b)/3;


                          /*
                           * Ignore very dark,
                           * grey and almost-white UI.
                           */

                          active[
                                  gy*gridW+gx
                          ] =
                                  saturation >= 65 &&
                                  brightness >= 35 &&
                                  brightness <= 245;
                      }
                  }


                  for (int sy=0;
                       sy<gridH;
                       sy++) {

                      for (int sx=0;
                           sx<gridW;
                           sx++) {

                          int start =
                                  sy*gridW+sx;


                          if (!active[start] ||
                              visited[start]) {

                              continue;
                          }


                          ArrayDeque<Integer> queue =
                                  new ArrayDeque<>();


                          queue.add(start);

                          visited[start] = true;


                          int count = 0;


                          int minX = sx;

                          int maxX = sx;

                          int minY = sy;

                          int maxY = sy;


                          long totalX = 0;

                          long totalY = 0;


                          while (!queue.isEmpty()) {

                              int id =
                                      queue.removeFirst();


                              int x =
                                      id % gridW;

                              int y =
                                      id / gridW;


                              count++;


                              totalX += x;

                              totalY += y;


                              minX =
                                      Math.min(
                                              minX,
                                              x);

                              maxX =
                                      Math.max(
                                              maxX,
                                              x);

                              minY =
                                      Math.min(
                                              minY,
                                              y);

                              maxY =
                                      Math.max(
                                              maxY,
                                              y);


                              for (int dy=-1;
                                   dy<=1;
                                   dy++) {

                                  for (int dx=-1;
                                       dx<=1;
                                       dx++) {

                                      if (dx==0 &&
                                          dy==0) {

                                          continue;
                                      }


                                      int nx =
                                              x+dx;

                                      int ny =
                                              y+dy;


                                      if (nx<0 ||
                                          nx>=gridW ||
                                          ny<0 ||
                                          ny>=gridH) {

                                          continue;
                                      }


                                      int next =
                                              ny*gridW+nx;


                                      if (active[next] &&
                                          !visited[next]) {

                                          visited[next] =
                                                  true;

                                          queue.addLast(
                                                  next);
                                      }
                                  }
                              }
                          }


                          int objectWidth =
                                  (maxX-minX+1)
                                  * step;


                          int objectHeight =
                                  (maxY-minY+1)
                                  * step;


                          /*
                           * Filter noise.
                           */

                          if (count < 8 ||
                              count > 700) {

                              continue;
                          }


                          if (objectWidth < 10 ||
                              objectHeight < 10) {

                              continue;
                          }


                          if (objectWidth > 180 ||
                              objectHeight > 180) {

                              continue;
                          }


                          int centerX =
                                  left +
                                  Math.round(
                                      totalX /
                                      (float)count *
                                      step);


                          int centerY =
                                  top +
                                  Math.round(
                                      totalY /
                                      (float)count *
                                      step);


                          /*
                           * Avoid character
                           * center-bottom region.
                           */

                          if (centerY >
                              height * 0.58f &&
                              Math.abs(
                                  centerX -
                                  width/2) <
                              width * 0.20f) {

                              continue;
                          }


                          int score =
                                  count;


                          result.add(
                                  new ObjectPoint(
                                          centerX,
                                          centerY,
                                          objectWidth,
                                          objectHeight,
                                          score));
                      }
                  }


                  return result;
              }


              public static ObjectPoint chooseTarget(
                      List<ObjectPoint> objects,
                      int width,
                      int height) {

                  if (objects == null ||
                      objects.isEmpty()) {

                      return null;
                  }


                  ObjectPoint best =
                          null;


                  double bestScore =
                          -999999;


                  float playerX =
                          width / 2f;

                  float playerY =
                          height * 0.48f;


                  for (ObjectPoint object :
                          objects) {

                      double dx =
                              object.x-playerX;

                      double dy =
                              object.y-playerY;


                      double distance =
                              Math.sqrt(
                                      dx*dx+
                                      dy*dy);


                      /*
                       * Prefer objects that are
                       * reasonably close and large.
                       */

                      double value =
                              object.score * 2.0
                              - distance * 0.20;


                      if (object.y >
                          height * 0.65f) {

                          value -= 200;
                      }


                      if (value >
                          bestScore) {

                          bestScore =
                                  value;

                          best =
                                  object;
                      }
                  }


                  return best;
              }
          }
          EOF


          # ======================================================
          # ACCESSIBILITY
          # ======================================================

          cat > app/src/main/java/com/dustinbot/auto/BotAccessibility.java <<'EOF'
          package com.dustinbot.auto;

          import android.accessibilityservice.AccessibilityService;
          import android.accessibilityservice.GestureDescription;

          import android.graphics.Bitmap;
          import android.graphics.Path;
          import android.graphics.PixelFormat;

          import android.hardware.HardwareBuffer;

          import android.os.Build;
          import android.os.Handler;
          import android.os.Looper;

          import android.view.Gravity;
          import android.view.WindowManager;

          import android.widget.Button;
          import android.widget.LinearLayout;
          import android.widget.TextView;

          import java.util.concurrent.ExecutorService;
          import java.util.concurrent.Executors;


          public class BotAccessibility
                  extends AccessibilityService {


              public static BotAccessibility instance;


              private final Handler handler =
                      new Handler(
                              Looper.getMainLooper());


              private final ExecutorService screenshotExecutor =
                      Executors.newSingleThreadExecutor();


              private WindowManager windowManager;

              private LinearLayout panel;

              private TextView stateText;

              private TextView targetText;


              private BotEngine engine;


              public interface ScreenshotCallback {

                  void result(Bitmap bitmap);
              }


              @Override
              protected void onServiceConnected() {

                  super.onServiceConnected();


                  instance = this;


                  engine =
                          new BotEngine(
                                  this,
                                  handler);


                  createPanel();
              }


              @Override
              public void onDestroy() {

                  if (engine != null) {

                      engine.stop();
                  }


                  if (panel != null) {

                      try {

                          windowManager
                                  .removeView(panel);

                      } catch (Exception ignored) {
                      }
                  }


                  screenshotExecutor
                          .shutdownNow();


                  instance = null;


                  super.onDestroy();
              }


              public void startBot() {

                  if (engine != null) {

                      engine.start();
                  }


                  updatePanel();
              }


              public void stopBot() {

                  if (engine != null) {

                      engine.stop();
                  }


                  updatePanel();
              }


              private void createPanel() {

                  windowManager =
                          (WindowManager)
                                  getSystemService(
                                          WINDOW_SERVICE);


                  panel =
                          new LinearLayout(this);


                  panel.setOrientation(
                          LinearLayout.VERTICAL);


                  panel.setPadding(
                          14,
                          10,
                          14,
                          10);


                  panel.setBackgroundColor(
                          0xE8202020);


                  stateText =
                          new TextView(this);


                  stateText.setTextColor(
                          0xFFFFFFFF);


                  stateText.setTextSize(14);


                  panel.addView(
                          stateText);


                  targetText =
                          new TextView(this);


                  targetText.setTextColor(
                          0xFF00FF88);


                  targetText.setTextSize(13);


                  panel.addView(
                          targetText);


                  LinearLayout buttons =
                          new LinearLayout(this);


                  Button start =
                          new Button(this);

                  start.setText(
                          "START");


                  Button stop =
                          new Button(this);

                  stop.setText(
                          "STOP");


                  buttons.addView(start);

                  buttons.addView(stop);


                  panel.addView(
                          buttons);


                  start.setOnClickListener(
                          v -> startBot());


                  stop.setOnClickListener(
                          v -> stopBot());


                  WindowManager.LayoutParams lp =

                          new WindowManager.LayoutParams(

                                  WindowManager.LayoutParams.WRAP_CONTENT,

                                  WindowManager.LayoutParams.WRAP_CONTENT,

                                  WindowManager.LayoutParams.TYPE_ACCESSIBILITY_OVERLAY,

                                  WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE |
                                  WindowManager.LayoutParams.FLAG_LAYOUT_IN_SCREEN,

                                  PixelFormat.TRANSLUCENT
                          );


                  lp.gravity =
                          Gravity.TOP |
                          Gravity.LEFT;


                  lp.x = 8;

                  lp.y = 50;


                  windowManager.addView(
                          panel,
                          lp);


                  updatePanel();
              }


              public void updatePanel() {

                  if (stateText == null ||
                      targetText == null ||
                      engine == null) {

                      return;
                  }


                  stateText.setText(
                          "DUSTIN BOT AUTO\\n" +
                          "● " +
                          (
                              engine.isRunning()
                              ? "RUNNING"
                              : "STOPPED"
                          ) +
                          "\\nSTATE: " +
                          engine.getState()
                  );


                  targetText.setText(
                          "TARGET: " +
                          engine.getTarget()
                  );
              }


              public void screenshot(
                      ScreenshotCallback callback) {

                  if (Build.VERSION.SDK_INT < 30) {

                      callback.result(null);

                      return;
                  }


                  takeScreenshot(

                          android.view.Display.DEFAULT_DISPLAY,

                          screenshotExecutor,

                          new AccessibilityService
                                  .TakeScreenshotCallback() {


                              @Override
                              public void onSuccess(
                                      ScreenshotResult result) {

                                  Bitmap bitmap =
                                          null;


                                  try {

                                      HardwareBuffer buffer =
                                              result.getHardwareBuffer();


                                      if (buffer != null) {

                                          Bitmap hardware =
                                                  Bitmap.wrapHardwareBuffer(
                                                          buffer,
                                                          result.getColorSpace()
                                                  );


                                          if (hardware != null) {

                                              bitmap =
                                                      hardware.copy(
                                                              Bitmap.Config.ARGB_8888,
                                                              false
                                                      );


                                              hardware.recycle();
                                          }


                                          buffer.close();
                                      }

                                  } catch (Exception ignored) {
                                  }


                                  Bitmap finalBitmap =
                                          bitmap;


                                  handler.post(
                                          () -> callback
                                                  .result(
                                                          finalBitmap));
                              }


                              @Override
                              public void onFailure(
                                      int errorCode) {

                                  handler.post(
                                          () -> callback
                                                  .result(
                                                          null));
                              }
                          });
              }


              public void tap(
                      int x,
                      int y) {

                  Path path =
                          new Path();


                  path.moveTo(
                          x,
                          y);


                  GestureDescription gesture =

                          new GestureDescription
                                  .Builder()

                                  .addStroke(
                                          new GestureDescription
                                                  .StrokeDescription(
                                                  path,
                                                  0,
                                                  70))

                                  .build();


                  dispatchGesture(
                          gesture,
                          null,
                          null);
              }


              public void swipe(
                      int x1,
                      int y1,
                      int x2,
                      int y2,
                      long duration) {

                  Path path =
                          new Path();


                  path.moveTo(
                          x1,
                          y1);


                  path.lineTo(
                          x2,
                          y2);


                  GestureDescription gesture =

                          new GestureDescription
                                  .Builder()

                                  .addStroke(
                                          new GestureDescription
                                                  .StrokeDescription(
                                                  path,
                                                  0,
                                                  Math.max(
                                                          120,
                                                          duration)))

                                  .build();


                  dispatchGesture(
                          gesture,
                          null,
                          null);
              }
          }
          EOF


          # ======================================================
          # BOT ENGINE
          # ======================================================

          cat > app/src/main/java/com/dustinbot/auto/BotEngine.java <<'EOF'
          package com.dustinbot.auto;

          import android.graphics.Bitmap;
          import android.os.Handler;

          import java.util.List;


          public final class BotEngine {


              private final BotAccessibility service;

              private final Handler handler;


              private volatile boolean running =
                      false;


              private String state =
                      "IDLE";


              private String target =
                      "-";


              private int noTargetCount =
                      0;


              public BotEngine(
                      BotAccessibility service,
                      Handler handler) {

                  this.service =
                          service;

                  this.handler =
                          handler;
              }


              public boolean isRunning() {

                  return running;
              }


              public String getState() {

                  return state;
              }


              public String getTarget() {

                  return target;
              }


              public void start() {

                  if (running) {

                      return;
                  }


                  running =
                          true;


                  state =
                          "OPEN DUSTIN RO";


                  target =
                          "-";


                  service.updatePanel();


                  boolean opened =
                          GameLauncher.open(
                                  service);


                  if (!opened) {

                      state =
                              "DUSTIN RO NOT FOUND";

                      running =
                              false;

                      service.updatePanel();

                      return;
                  }


                  /*
                   * Wait for the game to load.
                   */

                  handler.postDelayed(
                          this::search,
                          5000);
              }


              public void stop() {

                  running =
                          false;


                  handler.removeCallbacksAndMessages(
                          null);


                  state =
                          "STOPPED";


                  target =
                          "-";


                  service.updatePanel();
              }


              private void search() {

                  if (!running) {

                      return;
                  }


                  state =
                          "SEARCH MONSTER";


                  service.updatePanel();


                  service.screenshot(
                          bitmap -> {


                              if (!running) {

                                  recycle(bitmap);

                                  return;
                              }


                              if (bitmap == null) {

                                  retry(1000);

                                  return;
                              }


                              List<Vision.ObjectPoint>
                                      objects =
                                      Vision.detect(
                                              bitmap);


                              Vision.ObjectPoint selected =

                                      Vision.chooseTarget(

                                              objects,

                                              bitmap.getWidth(),

                                              bitmap.getHeight());


                              int width =
                                      bitmap.getWidth();

                              int height =
                                      bitmap.getHeight();


                              recycle(bitmap);


                              if (selected == null) {

                                  noTargetCount++;


                                  target =
                                          "NONE";


                                  state =
                                          "SEARCHING";


                                  service.updatePanel();


                                  /*
                                   * Move around to expose
                                   * another part of the map.
                                   *
                                   * Adaptive to screen size.
                                   */

                                  int joystickX =
                                          (int)
                                          (width * 0.16f);


                                  int joystickY =
                                          (int)
                                          (height * 0.80f);


                                  int distance =
                                          (int)
                                          (width * 0.18f);


                                  if (noTargetCount % 2 == 0) {

                                      service.swipe(

                                              joystickX,
                                              joystickY,

                                              joystickX +
                                              distance,
                                              joystickY,

                                              450);

                                  } else {

                                      service.swipe(

                                              joystickX,
                                              joystickY,

                                              joystickX -
                                              distance,
                                              joystickY,

                                              450);
                                  }


                                  retry(900);

                                  return;
                              }


                              noTargetCount =
                                      0;


                              target =
                                      selected.x +
                                      "," +
                                      selected.y;


                              state =
                                      "TARGET";


                              service.updatePanel();


                              /*
                               * Select monster.
                               */

                              service.tap(
                                      selected.x,
                                      selected.y);


                              handler.postDelayed(

                                      () -> attack(

                                              selected.x,
                                              selected.y),

                                      500);
                          });
              }


              private void attack(
                      int x,
                      int y) {

                  if (!running) {

                      return;
                  }


                  state =
                          "ATTACK";


                  target =
                          x + "," + y;


                  service.updatePanel();


                  /*
                   * Tap target.
                   */

                  service.tap(
                          x,
                          y);


                  /*
                   * Continue checking
                   * visible target.
                   */

                  handler.postDelayed(

                          () -> attackCheck(
                                  x,
                                  y),

                          650);
              }


              private void attackCheck(
                      int x,
                      int y) {

                  if (!running) {

                      return;
                  }


                  service.screenshot(
                          bitmap -> {


                              if (!running) {

                                  recycle(bitmap);

                                  return;
                              }


                              if (bitmap == null) {

                                  service.tap(
                                          x,
                                          y);

                                  retryAttack(
                                          x,
                                          y);

                                  return;
                              }


                              List<Vision.ObjectPoint>
                                      objects =
                                      Vision.detect(
                                              bitmap);


                              recycle(bitmap);


                              /*
                               * If screen no longer
                               * contains a suitable
                               * object, assume the
                               * current target changed
                               * or disappeared.
                               */

                              Vision.ObjectPoint near =
                                      nearest(
                                              objects,
                                              x,
                                              y);


                              if (near == null) {

                                  state =
                                          "LOOT";


                                  target =
                                          "-";


                                  service.updatePanel();


                                  handler.postDelayed(

                                          this::loot,

                                          600);

                                  return;
                              }


                              /*
                               * Attack again.
                               */

                              service.tap(
                                      x,
                                      y);


                              handler.postDelayed(

                                      () -> attackCheck(
                                              x,
                                              y),

                                      700);
                          });
              }


              private void retryAttack(
                      int x,
                      int y) {

                  if (!running) {

                      return;
                  }


                  handler.postDelayed(

                          () -> attackCheck(
                                  x,
                                  y),

                          900);
              }


              private Vision.ObjectPoint nearest(
                      List<Vision.ObjectPoint> list,
                      int x,
                      int y) {

                  Vision.ObjectPoint best =
                          null;


                  double distance =
                          Double.MAX_VALUE;


                  for (Vision.ObjectPoint object :
                          list) {

                      double dx =
                              object.x-x;

                      double dy =
                              object.y-y;


                      double d =
                              dx*dx+
                              dy*dy;


                      if (d <
                          distance) {

                          distance =
                                  d;

                          best =
                                  object;
                      }
                  }


                  /*
                   * Don't consider a completely
                   * unrelated object a target.
                   */

                  if (best != null &&
                      distance < 180*180) {

                      return best;
                  }


                  return null;
              }


              private void loot() {

                  if (!running) {

                      return;
                  }


                  state =
                          "LOOT";


                  service.updatePanel();


                  /*
                   * Tap several adaptive pickup
                   * positions instead of requiring
                   * manual calibration.
                   */

                  int width =
                          service
                                  .getResources()
                                  .getDisplayMetrics()
                                  .widthPixels;


                  int height =
                          service
                                  .getResources()
                                  .getDisplayMetrics()
                                  .heightPixels;


                  int centerX =
                          width/2;


                  int lower =
                          (int)(
                                  height*0.72f);


                  service.tap(
                          centerX,
                          lower);


                  handler.postDelayed(

                          () -> {

                              if (!running) {

                                  return;
                              }


                              service.tap(
                                      centerX,
                                      (int)(
                                          height*0.64f));


                              handler.postDelayed(

                                      () -> {

                                          if (!running) {

                                              return;
                                          }


                                          state =
                                                  "SEARCH MONSTER";


                                          service.updatePanel();


                                          retry(700);

                                      },

                                      450);

                          },

                          400);
              }


              private void retry(
                      long delay) {

                  if (!running) {

                      return;
                  }


                  handler.postDelayed(
                          this::search,
                          delay);
              }


              private void recycle(
                      Bitmap bitmap) {

                  if (bitmap != null &&
                      !bitmap.isRecycled()) {

                      bitmap.recycle();
                  }
              }
          }
          EOF


