name: Build DustinBot Android V1.3

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Create Android project
        shell: bash
        run: |

          rm -rf app build.gradle settings.gradle gradle.properties

          mkdir -p app/src/main/java/com/dustinbot
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/xml

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)

              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "DustinBotAndroid"

          include(":app")
          EOF


          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.6.1' apply false
          }
          EOF


          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          EOF


          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.dustinbot'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.dustinbot'
                  minSdk 26
                  targetSdk 35
                  versionCode 13
                  versionName '1.3'
              }
          }
          EOF


          cat > app/src/main/res/values/strings.xml <<'EOF'
          <resources>

              <string name="app_name">DustinBot Android</string>

              <string name="accessibility_description">
                  DustinBot controls Dustin RO using Android Accessibility
              </string>

          </resources>
          EOF


          cat > app/src/main/res/values/themes.xml <<'EOF'
          <resources>

              <style
                  name="AppTheme"
                  parent="android:style/Theme.Material.Light.NoActionBar">

                  <item name="android:fontFamily">sans</item>
                  <item name="android:colorAccent">#1976D2</item>

              </style>

          </resources>
          EOF


          cat > app/src/main/res/xml/accessibility.xml <<'EOF'
          <accessibility-service
              xmlns:android="http://schemas.android.com/apk/res/android"
              android:description="@string/accessibility_description"
              android:accessibilityEventTypes="typeWindowStateChanged|typeWindowContentChanged"
              android:accessibilityFeedbackType="feedbackGeneric"
              android:notificationTimeout="100"
              android:canPerformGestures="true"
              android:canRetrieveWindowContent="true" />
          EOF


          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest
              xmlns:android="http://schemas.android.com/apk/res/android">

              <application
                  android:allowBackup="false"
                  android:label="@string/app_name"
                  android:theme="@style/AppTheme">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">

                      <intent-filter>

                          <action
                              android:name="android.intent.action.MAIN" />

                          <category
                              android:name="android.intent.category.LAUNCHER" />

                      </intent-filter>

                  </activity>


                  <service
                      android:name=".BotAccessibility"
                      android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE"
                      android:exported="false">

                      <intent-filter>

                          <action
                              android:name="android.accessibilityservice.AccessibilityService" />

                      </intent-filter>

                      <meta-data
                          android:name="android.accessibilityservice"
                          android:resource="@xml/accessibility" />

                  </service>

              </application>

          </manifest>
          EOF


          cat > app/src/main/java/com/dustinbot/BotAccessibility.java <<'EOF'
          package com.dustinbot;

          import android.accessibilityservice.AccessibilityService;
          import android.accessibilityservice.GestureDescription;
          import android.graphics.Color;
          import android.graphics.Path;
          import android.graphics.PixelFormat;
          import android.view.Gravity;
          import android.view.MotionEvent;
          import android.view.View;
          import android.view.WindowManager;
          import android.view.accessibility.AccessibilityEvent;
          import android.widget.TextView;

          public class BotAccessibility extends AccessibilityService {

              public static volatile BotAccessibility instance;

              private WindowManager windowManager;

              private View calibrationView;

              @Override
              protected void onServiceConnected() {

                  super.onServiceConnected();

                  instance = this;
              }


              @Override
              public void onAccessibilityEvent(
                      AccessibilityEvent event) {
              }


              @Override
              public void onInterrupt() {
              }


              public static boolean ready() {

                  return instance != null;
              }


              public static void calibrate(
                      String key) {

                  if (instance != null) {

                      instance.showCalibration(key);
                  }
              }


              private void showCalibration(
                      String key) {

                  removeCalibration();

                  windowManager =
                          (WindowManager)
                          getSystemService(WINDOW_SERVICE);


                  TextView overlay =
                          new TextView(this);


                  String text;


                  if (key.equals("move")) {

                      text =
                          "ตั้งปุ่มเดิน\n\n" +
                          "แตะตรงกลาง Joystick";

                  } else if (key.equals("attack")) {

                      text =
                          "ตั้งปุ่มตี\n\n" +
                          "แตะปุ่มโจมตี";

                  } else {

                      text =
                          "ตั้งปุ่มเก็บของ\n\n" +
                          "แตะปุ่มเก็บของ";
                  }


                  overlay.setText(text);

                  overlay.setTextSize(22);

                  overlay.setTextColor(Color.WHITE);

                  overlay.setGravity(Gravity.CENTER);

                  overlay.setBackgroundColor(
                          0xCC000000);


                  overlay.setOnTouchListener(
                          (v, event) -> {

                      if (
                          event.getAction()
                              == MotionEvent.ACTION_UP
                      ) {

                          float x =
                              event.getRawX();

                          float y =
                              event.getRawY();


                          getSharedPreferences(
                                  "DustinBot",
                                  MODE_PRIVATE)

                              .edit()

                              .putFloat(
                                  key + "_x",
                                  x)

                              .putFloat(
                                  key + "_y",
                                  y)

                              .apply();


                          removeCalibration();

                          return true;
                      }


                      return true;
                  });


                  WindowManager.LayoutParams params =
                          new WindowManager.LayoutParams(

                              -1,

                              -1,

                              WindowManager
                                  .LayoutParams
                                  .TYPE_ACCESSIBILITY_OVERLAY,

                              WindowManager
                                  .LayoutParams
                                  .FLAG_LAYOUT_IN_SCREEN,

                              PixelFormat.TRANSLUCENT
                          );


                  params.gravity =
                          Gravity.TOP |
                          Gravity.START;


                  windowManager.addView(
                          overlay,
                          params);


                  calibrationView = overlay;
              }


              private void removeCalibration() {

                  if (
                      windowManager != null &&
                      calibrationView != null
                  ) {

                      try {

                          windowManager.removeView(
                                  calibrationView);

                      } catch (Exception ignored) {
                      }


                      calibrationView = null;
                  }
              }


              private float getX(
                      String key) {

                  return getSharedPreferences(
                          "DustinBot",
                          MODE_PRIVATE)

                      .getFloat(
                          key + "_x",
                          -1);
              }


              private float getY(
                      String key) {

                  return getSharedPreferences(
                          "DustinBot",
                          MODE_PRIVATE)

                      .getFloat(
                          key + "_y",
                          -1);
              }


              public static boolean configured(
                      String key) {

                  if (instance == null) {

                      return false;
                  }


                  return
                      instance.getX(key) >= 0 &&
                      instance.getY(key) >= 0;
              }


              public static boolean tap(
                      String key) {

                  if (
                      instance == null ||
                      !configured(key)
                  ) {

                      return false;
                  }


                  return instance.tapXY(
                          instance.getX(key),
                          instance.getY(key));
              }


              public static boolean move(
                      boolean right) {

                  if (
                      instance == null ||
                      !configured("move")
                  ) {

                      return false;
                  }


                  float x =
                      instance.getX("move");

                  float y =
                      instance.getY("move");


                  float width =
                      instance
                          .getResources()
                          .getDisplayMetrics()
                          .widthPixels;


                  float distance =
                      width * 0.22f;


                  float endX;


                  if (right) {

                      endX =
                          Math.min(
                              width - 10,
                              x + distance);

                  } else {

                      endX =
                          Math.max(
                              10,
                              x - distance);
                  }


                  return instance.swipeXY(
                          x,
                          y,
                          endX,
                          y,
                          900);
              }


              private boolean tapXY(
                      float x,
                      float y) {

                  Path path =
                          new Path();

                  path.moveTo(x, y);


                  GestureDescription gesture =
                          new GestureDescription
                              .Builder()

                              .addStroke(
                                  new GestureDescription
                                      .StrokeDescription(
                                          path,
                                          0,
                                          80))

                              .build();


                  return dispatchGesture(
                          gesture,
                          null,
                          null);
              }


              private boolean swipeXY(
                      float x1,
                      float y1,
                      float x2,
                      float y2,
                      long duration) {

                  Path path =
                          new Path();

                  path.moveTo(
                          x1,
                          y1);

                  path.lineTo(
                          x2,
                          y2);


                  GestureDescription gesture =
                          new GestureDescription
                              .Builder()

                              .addStroke(
                                  new GestureDescription
                                      .StrokeDescription(
                                          path,
                                          0,
                                          duration))

                              .build();


                  return dispatchGesture(
                          gesture,
                          null,
                          null);
              }
          }
          EOF


          cat > app/src/main/java/com/dustinbot/BotEngine.java <<'EOF'
          package com.dustinbot;

          public class BotEngine {

              private static volatile boolean running;

              private static Thread worker;


              public static void start() {

                  if (running) {

                      return;
                  }


                  if (
                      !BotAccessibility.ready()
                  ) {

                      return;
                  }


                  if (
                      !BotAccessibility.configured("move") ||
                      !BotAccessibility.configured("attack") ||
                      !BotAccessibility.configured("loot")
                  ) {

                      return;
                  }


                  running = true;


                  worker =
                      new Thread(
                          BotEngine::loop,
                          "DustinBot-AI");


                  worker.start();
              }


              public static void stop() {

                  running = false;


                  if (worker != null) {

                      worker.interrupt();

                      worker = null;
                  }
              }


              public static boolean isRunning() {

                  return running;
              }


              private static void loop() {

                  boolean right = true;


                  while (running) {

                      try {

                          /*
                           * WALK
                           *
                           * เกมจัดการ Target เอง
                           */

                          BotAccessibility.move(
                                  right);


                          Thread.sleep(1100);


                          /*
                           * ATTACK
                           */

                          for (
                              int i = 0;
                              i < 6 && running;
                              i++
                          ) {

                              BotAccessibility.tap(
                                      "attack");

                              Thread.sleep(550);
                          }


                          /*
                           * WAIT
                           */

                          Thread.sleep(800);


                          /*
                           * LOOT
                           */

                          BotAccessibility.tap(
                                  "loot");


                          Thread.sleep(700);


                          /*
                           * เดินกลับอีกด้าน
                           */

                          right = !right;


                      } catch (
                          InterruptedException e
                      ) {

                          return;


                      } catch (
                          Exception e
                      ) {

                          try {

                              Thread.sleep(1000);

                          } catch (
                              InterruptedException ignored
                          ) {

                              return;
                          }
                      }
                  }
              }
          }
          EOF


          cat > app/src/main/java/com/dustinbot/MainActivity.java <<'EOF'
          package com.dustinbot;

          import android.app.Activity;
          import android.content.Intent;
          import android.graphics.Color;
          import android.os.Bundle;
          import android.provider.Settings;
          import android.view.Gravity;
          import android.widget.Button;
          import android.widget.LinearLayout;
          import android.widget.TextView;

          public class MainActivity extends Activity {

              private TextView status;


              @Override
              protected void onCreate(
                      Bundle state) {

                  super.onCreate(state);


                  LinearLayout root =
                          new LinearLayout(this);

                  root.setOrientation(
                          LinearLayout.VERTICAL);

                  root.setPadding(
                          25,
                          25,
                          25,
                          25);

                  root.setGravity(
                          Gravity.CENTER_HORIZONTAL);

                  root.setBackgroundColor(
                          Color.WHITE);


                  TextView title =
                          new TextView(this);

                  title.setText(
                          "DUSTINBOT ANDROID V1.3");

                  title.setTextSize(26);

                  title.setTextColor(
                          Color.BLACK);

                  title.setGravity(
                          Gravity.CENTER);

                  root.addView(title);


                  TextView info =
                          new TextView(this);

                  info.setText(
                      "\nเดิน → เกมล็อกเป้า → ตี → " +
                      "เก็บของ → เดินต่อ\n");

                  info.setTextSize(17);

                  info.setGravity(
                          Gravity.CENTER);

                  root.addView(info);


                  Button access =
                          button(
                              "1. เปิด ACCESSIBILITY");

                  access.setOnClickListener(
                          v -> {

                      startActivity(
                          new Intent(
                              Settings
                                  .ACTION_ACCESSIBILITY_SETTINGS));

                  });

                  root.addView(access);


                  Button move =
                          button(
                              "2. ตั้งปุ่มเดิน");

                  move.setOnClickListener(
                          v -> {

                      BotAccessibility.calibrate(
                              "move");

                      status.setText(
                          "กำลังตั้งปุ่มเดิน");

                  });

                  root.addView(move);


                  Button attack =
                          button(
                              "3. ตั้งปุ่มตี");

                  attack.setOnClickListener(
                          v -> {

                      BotAccessibility.calibrate(
                              "attack");

                      status.setText(
                          "กำลังตั้งปุ่มตี");

                  });

                  root.addView(attack);


                  Button loot =
                          button(
                              "4. ตั้งปุ่มเก็บของ");

                  loot.setOnClickListener(
                          v -> {

                      BotAccessibility.calibrate(
                              "loot");

                      status.setText(
                          "กำลังตั้งปุ่มเก็บของ");

                  });

                  root.addView(loot);


                  Button testMove =
                          button(
                              "5. ทดสอบเดิน");

                  testMove.setOnClickListener(
                          v -> {

                      if (!ready())
                          return;

                      BotAccessibility.move(
                              true);

                      status.setText(
                          "ส่งคำสั่งเดินแล้ว");

                  });

                  root.addView(testMove);


                  Button testAttack =
                          button(
                              "6. ทดสอบตี");

                  testAttack.setOnClickListener(
                          v -> {

                      if (!ready())
                          return;

                      BotAccessibility.tap(
                              "attack");

                      status.setText(
                          "ส่งคำสั่งตีแล้ว");

                  });

                  root.addView(testAttack);


                  Button testLoot =
                          button(
                              "7. ทดสอบเก็บของ");

                  testLoot.setOnClickListener(
                          v -> {

                      if (!ready())
                          return;

                      BotAccessibility.tap(
                              "loot");

                      status.setText(
                          "ส่งคำสั่งเก็บแล้ว");

                  });

                  root.addView(testLoot);


                  Button start =
                          button(
                              "8. START BOT");

                  start.setOnClickListener(
                          v -> {

                      if (!ready())
                          return;


                      if (
                          !BotAccessibility.configured(
                              "move") ||
                          !BotAccessibility.configured(
                              "attack") ||
                          !BotAccessibility.configured(
                              "loot")
                      ) {

                          status.setText(
                              "ต้องตั้ง เดิน / ตี / เก็บของ ก่อน");

                          return;
                      }


                      BotEngine.start();


                      status.setText(
                              "สถานะ: RUNNING");

                  });

                  root.addView(start);


                  Button stop =
                          button(
                              "9. STOP BOT");

                  stop.setOnClickListener(
                          v -> {

                      BotEngine.stop();

                      status.setText(
                              "สถานะ: STOP");

                  });

                  root.addView(stop);


                  status =
                          new TextView(this);

                  status.setText(
                          "\nสถานะ: STOP");

                  status.setTextSize(18);

                  status.setGravity(
                          Gravity.CENTER);

                  root.addView(status);


                  setContentView(root);
              }


              private boolean ready() {

                  if (
                      !BotAccessibility.ready()
                  ) {

                      status.setText(
                          "Accessibility ยังไม่พร้อม");

                      return false;
                  }


                  return true;
              }


              private Button button(
                      String text) {

                  Button b =
                          new Button(this);

                  b.setText(text);

                  b.setTextSize(16);

                  return b;
              }
          }
          EOF


      - name: Build APK
        shell: bash
        run: |

          gradle wrapper --gradle-version 8.7

          chmod +x gradlew

          ./gradlew clean assembleDebug --stacktrace


      - name: Verify APK
        shell: bash
        run: |

          test -f app/build/outputs/apk/debug/app-debug.apk

          ls -lh app/build/outputs/apk/debug/app-debug.apk


      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DustinBot-Android-V1.3
          path: app/build/outputs/apk/debug/app-debug.apk
