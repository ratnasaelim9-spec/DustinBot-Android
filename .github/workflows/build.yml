          package com.dustinbot.v2;


          import android.content.Context;

          import android.graphics.Canvas;

          import android.graphics.Color;

          import android.graphics.Paint;

          import android.view.View;


          public class MapPanel
              extends View {


              private Paint p =
                  new Paint(
                      Paint.ANTI_ALIAS_FLAG
                  );


              public MapPanel(
                  Context c
              ) {

                  super(c);

                  setBackgroundColor(
                      Color.rgb(
                          218,
                          224,
                          212
                      )
                  );

              }


              @Override
              protected void onDraw(
                  Canvas c
              ) {


                  super.onDraw(c);


                  int w =
                      getWidth();


                  int h =
                      getHeight();


                  p.setColor(
                      Color.rgb(
                          190,
                          197,
                          184
                      )
                  );


                  p.setStrokeWidth(
                      2
                  );


                  for (
                      int x = 0;
                      x < w;
                      x += 45
                  ) {

                      c.drawLine(
                          x,
                          0,
                          x,
                          h,
                          p
                      );

                  }


                  for (
                      int y = 0;
                      y < h;
                      y
