      # =========================================================
      # GENERATE GRADLE WRAPPER
      # =========================================================

      - name: Generate Gradle wrapper
        shell: bash
        run: |

          set -e

          curl -L \
            https://services.gradle.org/distributions/gradle-8.7-bin.zip \
            -o /tmp/gradle.zip

          mkdir -p /tmp/gradle

          unzip -q \
            /tmp/gradle.zip \
            -d /tmp/gradle

          /tmp/gradle/gradle-8.7/bin/gradle wrapper \
            --gradle-version 8.7


      # =========================================================
      # BUILD
      # =========================================================

      - name: Build APK
        shell: bash
        run: |

          set -e

          chmod +x gradlew

          ./gradlew \
            clean \
            assembleDebug \
            --stacktrace


      # =========================================================
      # CHECK APK
      # =========================================================

      - name: Check APK
        shell: bash
        run: |

          echo "=================================="

          echo "DUSTINBOT V3 APK"

          echo "=================================="

          find \
            app/build/outputs/apk \
            -type f \
            -print


      # =========================================================
      # UPLOAD APK
      # =========================================================

      - name: Upload APK
        uses: actions/upload-artifact@v4

        with:

          name: DustinBot-Android-V3

          path:
            app/build/outputs/apk/debug/*.apk

          if-no-files-found:
            error

          retention-days:
            30
