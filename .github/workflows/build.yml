      - name: Generate Gradle wrapper
        shell: bash
        run: |
          set -e

          curl -L \
            https://services.gradle.org/distributions/gradle-8.7-bin.zip \
            -o /tmp/gradle.zip

          mkdir -p /tmp/gradle

          unzip -q \
            /tmp/gradle.zip \
            -d /tmp/gradle

          /tmp/gradle/gradle-8.7/bin/gradle wrapper \
            --gradle-version 8.7

      - name: Validate XML files
        shell: bash
        run: |
          set -e

          echo "Checking XML files..."

          for file in \
            app/src/main/AndroidManifest.xml \
            app/src/main/res/values/strings.xml \
            app/src/main/res/values/themes.xml \
            app/src/main/res/xml/accessibility.xml
          do
            echo "Checking $file"
            python3 - "$file" <<'PY'
import sys
import xml.etree.ElementTree as ET

file = sys.argv[1]

with open(file, "rb") as f:
    data = f.read()

ET.fromstring(data)

print("OK:", file)
PY
          done

      - name: Build APK
        shell: bash
        run: |
          set -e

          chmod +x gradlew

          ./gradlew \
            clean \
            assembleDebug \
            --stacktrace

      - name: Check APK
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "DUSTINBOT ANDROID V3 APK"
          echo "======================================"

          find \
            app/build/outputs/apk \
            -type f \
            -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DustinBot-Android-V3
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
