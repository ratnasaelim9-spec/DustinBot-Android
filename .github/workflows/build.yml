          # ========================================================
          # VISION DETECTOR
          # ========================================================

          cat > app/src/main/java/com/dustinbot/v6/VisionDetector.java <<'EOF'
          package com.dustinbot.v6;

          import android.graphics.Bitmap;
          import android.graphics.Color;

          import java.util.ArrayDeque;
          import java.util.ArrayList;
          import java.util.List;


          public final class VisionDetector {


              public static final class Target {

                  public final int x;

                  public final int y;

                  public final int size;


                  public Target(
                          int x,
                          int y,
                          int size) {

                      this.x = x;

                      this.y = y;

                      this.size = size;
                  }
              }


              private VisionDetector() {
              }


              public static List<Target> find(
                      Bitmap bitmap) {

                  ArrayList<Target> result =
                          new ArrayList<>();


                  if (bitmap == null) {

                      return result;
                  }


                  int w =
                          bitmap.getWidth();

                  int h =
                          bitmap.getHeight();


                  if (w < 200 ||
                      h < 300) {

                      return result;
                  }


                  /*
                   * Playable area.
                   */

                  int left =
                          (int)(w * 0.06f);

                  int right =
                          (int)(w * 0.94f);

                  int top =
                          (int)(h * 0.12f);

                  int bottom =
                          (int)(h * 0.76f);


                  int step =
                          Math.max(
                                  3,
                                  Math.min(w,h) / 300);


                  int gw =
                          ((right-left)/step)+1;

                  int gh =
                          ((bottom-top)/step)+1;


                  boolean[] active =
                          new boolean[gw * gh];


                  boolean[] visited =
                          new boolean[gw * gh];


                  /*
                   * Find compact colored objects.
                   */

                  for (int gy=0;
                       gy<gh;
                       gy++) {

                      for (int gx=0;
                           gx<gw;
                           gx++) {

                          int x =
                                  Math.min(
                                          w-1,
                                          left + gx*step);

                          int y =
                                  Math.min(
                                          h-1,
                                          top + gy*step);


                          int c =
                                  bitmap.getPixel(
                                          x,
                                          y);


                          int r =
                                  Color.red(c);

                          int g =
                                  Color.green(c);

                          int b =
                                  Color.blue(c);


                          int max =
                                  Math.max(
                                          r,
                                          Math.max(g,b));

                          int min =
                                  Math.min(
                                          r,
                                          Math.min(g,b));


                          int saturation =
                                  max-min;


                          int brightness =
                                  (r+g+b)/3;


                          active[
                                  gy*gw+gx
                          ] =
                                  saturation >= 55 &&
                                  brightness >= 40 &&
                                  brightness <= 235;
                      }
                  }


                  /*
                   * Connected components.
                   */

                  for (int sy=0;
                       sy<gh;
                       sy++) {

                      for (int sx=0;
                           sx<gw;
                           sx++) {

                          int start =
                                  sy*gw+sx;


                          if (!active[start] ||
                              visited[start]) {

                              continue;
                          }


                          ArrayDeque<Integer> queue =
                                  new ArrayDeque<>();


                          queue.add(start);

                          visited[start] = true;


                          int count = 0;

                          int minX = sx;

                          int maxX = sx;

                          int minY = sy;

                          int maxY = sy;


                          long sumX = 0;

                          long sumY = 0;


                          while (!queue.isEmpty()) {

                              int id =
                                      queue.removeFirst();


                              int x =
                                      id % gw;

                              int y =
                                      id / gw;


                              count++;


                              sumX += x;

                              sumY += y;


                              minX =
                                      Math.min(
                                              minX,
                                              x);

                              maxX =
                                      Math.max(
                                              maxX,
                                              x);

                              minY =
                                      Math.min(
                                              minY,
                                              y);

                              maxY =
                                      Math.max(
                                              maxY,
                                              y);


                              for (int dy=-1;
                                   dy<=1;
                                   dy++) {

                                  for (int dx=-1;
                                       dx<=1;
                                       dx++) {

                                      if (dx==0 &&
                                          dy==0) {

                                          continue;
                                      }


                                      int nx =
                                              x+dx;

                                      int ny =
                                              y+dy;


                                      if (nx<0 ||
                                          nx>=gw ||
                                          ny<0 ||
                                          ny>=gh) {

                                          continue;
                                      }


                                      int ni =
                                              ny*gw+nx;


                                      if (active[ni] &&
                                          !visited[ni]) {

                                          visited[ni] =
                                                  true;

                                          queue.addLast(
                                                  ni);
                                      }
                                  }
                              }
                          }


                          int bw =
                                  (maxX-minX+1)
                                  * step;

                          int bh =
                                  (maxY-minY+1)
                                  * step;


                          /*
                           * Noise filtering.
                           */

                          if (count < 7 ||
                              count > 500) {

                              continue;
                          }


                          if (bw < 8 ||
                              bh < 8) {

                              continue;
                          }


                          if (bw > 150 ||
                              bh > 150) {

                              continue;
                          }


                          int centerX =
                                  left +
                                  Math.round(
                                      sumX/(float)count
                                      * step);


                          int centerY =
                                  top +
                                  Math.round(
                                      sumY/(float)count
                                      * step);


                          result.add(
                                  new Target(
                                          centerX,
                                          centerY,
                                          Math.max(
                                              bw,
                                              bh)));
                      }
                  }


                  return result;
              }


              public static Target nearest(
                      List<Target> targets,
                      int width,
                      int height) {

                  if (targets == null ||
                      targets.isEmpty()) {

                      return null;
                  }


                  float centerX =
                          width / 2f;


                  float centerY =
                          height * 0.48f;


                  Target best = null;

                  double bestDistance =
                          Double.MAX_VALUE;


                  for (Target t :
                          targets) {

                      double dx =
                              t.x-centerX;

                      double dy =
                              t.y-centerY;


                      double distance =
                              dx*dx +
                              dy*dy;


                      if (distance <
                          bestDistance) {

                          bestDistance =
                                  distance;

                          best = t;
                      }
                  }


                  return best;
              }
          }
          EOF


          # ========================================================
          # ACCESSIBILITY SERVICE
          # ========================================================

          cat > app/src/main/java/com/dustinbot/v6/BotAccessibility.java <<'EOF'
          package com.dustinbot.v6;

          import android.accessibilityservice.AccessibilityService;
          import android.accessibilityservice.GestureDescription;

          import android.graphics.Bitmap;
          import android.graphics.Path;
          import android.graphics.PixelFormat;

          import android.hardware.HardwareBuffer;

          import android.os.Build;
          import android.os.Handler;
          import android.os.Looper;

          import android.view.Gravity;
          import android.view.WindowManager;

          import android.widget.Button;
          import android.widget.LinearLayout;
          import android.widget.TextView;

          import java.util.concurrent.ExecutorService;
          import java.util.concurrent.Executors;


          public class BotAccessibility
                  extends AccessibilityService {


              public static BotAccessibility instance;


              private final Handler handler =
                      new Handler(
                              Looper.getMainLooper());


              private final ExecutorService screenshotExecutor =
                      Executors.newSingleThreadExecutor();


              private WindowManager windowManager;

              private LinearLayout panel;

              private TextView stateText;

              private TextView targetText;


              BotEngine engine;


              public interface ScreenshotCallback {

                  void onBitmap(Bitmap bitmap);
              }


              @Override
              protected void onServiceConnected() {

                  super.onServiceConnected();


                  instance = this;


                  engine =
                          new BotEngine(
                                  this,
                                  handler);


                  showPanel();
              }


              @Override
              public void onDestroy() {

                  if (engine != null) {

                      engine.stop();
                  }


                  if (panel != null) {

                      try {

                          windowManager
                                  .removeView(panel);

                      } catch (Exception ignored) {
                      }
                  }


                  screenshotExecutor
                          .shutdownNow();


                  instance = null;


                  super.onDestroy();
              }


              public void startBot() {

                  if (engine != null) {

                      engine.start();
                  }


                  refreshPanel();
              }


              public void stopBot() {

                  if (engine != null) {

                      engine.stop();
                  }


                  refreshPanel();
              }


              private void showPanel() {

                  windowManager =
                          (WindowManager)
                                  getSystemService(
                                          WINDOW_SERVICE);


                  panel =
                          new LinearLayout(this);


                  panel.setOrientation(
                          LinearLayout.VERTICAL);


                  panel.setPadding(
                          14,
                          10,
                          14,
                          10);


                  panel.setBackgroundColor(
                          0xE8202020);


                  stateText =
                          new TextView(this);


                  stateText.setTextColor(
                          0xFFFFFFFF);


                  stateText.setTextSize(14);


                  panel.addView(
                          stateText);


                  targetText =
                          new TextView(this);


                  targetText.setTextColor(
                          0xFF00FF88);


                  targetText.setTextSize(13);


                  panel.addView(
                          targetText);


                  LinearLayout row =
                          new LinearLayout(this);


                  Button start =
                          new Button(this);


                  start.setText(
                          "START");


                  Button stop =
                          new Button(this);


                  stop.setText(
                          "STOP");


                  row.addView(start);

                  row.addView(stop);


                  panel.addView(row);


                  start.setOnClickListener(
                          v -> startBot());


                  stop.setOnClickListener(
                          v -> stopBot());


                  WindowManager.LayoutParams lp =
                          new WindowManager.LayoutParams(

                                  WindowManager.LayoutParams.WRAP_CONTENT,

                                  WindowManager.LayoutParams.WRAP_CONTENT,

                                  WindowManager.LayoutParams.TYPE_ACCESSIBILITY_OVERLAY,

                                  WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE |
                                  WindowManager.LayoutParams.FLAG_LAYOUT_IN_SCREEN,

                                  PixelFormat.TRANSLUCENT
                          );


                  lp.gravity =
                          Gravity.TOP |
                          Gravity.LEFT;


                  lp.x = 8;

                  lp.y = 55;


                  windowManager.addView(
                          panel,
                          lp);


                  refreshPanel();
              }


              public void refreshPanel() {

                  if (stateText == null ||
                      targetText == null ||
                      engine == null) {

                      return;
                  }


                  stateText.setText(
                          "DUSTIN BOT V6\\n" +
                          "● " +
                          (engine.isRunning()
                                  ? "RUNNING"
                                  : "STOPPED") +
                          "\\nSTATE: " +
                          engine.getState());


                  targetText.setText(
                          "TARGET: " +
                          engine.getTargetInfo());
              }


              public void takeScreen(
                      ScreenshotCallback callback) {

                  if (Build.VERSION.SDK_INT < 30) {

                      callback.onBitmap(null);

                      return;
                  }


                  takeScreenshot(

                          android.view.Display.DEFAULT_DISPLAY,

                          screenshotExecutor,

                          new AccessibilityService
                                  .TakeScreenshotCallback() {


                              @Override
                              public void onSuccess(
                                      ScreenshotResult result) {

                                  Bitmap bitmap =
                                          null;


                                  try {

                                      HardwareBuffer buffer =
                                              result.getHardwareBuffer();


                                      if (buffer != null) {

                                          Bitmap hardware =
                                                  Bitmap.wrapHardwareBuffer(

                                                          buffer,

                                                          result.getColorSpace()
                                                  );


                                          if (hardware != null) {

                                              bitmap =
                                                      hardware.copy(

                                                              Bitmap.Config.ARGB_8888,

                                                              false
                                                      );


                                              hardware.recycle();
                                          }


                                          buffer.close();
                                      }

                                  } catch (Exception ignored) {
                                  }


                                  Bitmap finalBitmap =
                                          bitmap;


                                  handler.post(
                                          () -> callback
                                                  .onBitmap(
                                                          finalBitmap));
                              }


                              @Override
                              public void onFailure(
                                      int errorCode) {

                                  handler.post(
                                          () -> callback
                                                  .onBitmap(
                                                          null));
                              }
                          });
              }


              public void tap(
                      int x,
                      int y) {

                  Path path =
                          new Path();


                  path.moveTo(
                          x,
                          y);


                  GestureDescription.StrokeDescription stroke =

                          new GestureDescription
                                  .StrokeDescription(

                                  path,

                                  0,

                                  70
                          );


                  GestureDescription gesture =

                          new GestureDescription
                                  .Builder()

                                  .addStroke(stroke)

                                  .build();


                  dispatchGesture(
                          gesture,
                          null,
                          null);
              }


              public void swipe(
                      int x1,
                      int y1,
                      int x2,
                      int y2,
                      long duration) {

                  Path path =
                          new Path();


                  path.moveTo(
                          x1,
                          y1);


                  path.lineTo(
                          x2,
                          y2);


                  GestureDescription.StrokeDescription stroke =

                          new GestureDescription
                                  .StrokeDescription(

                                  path,

                                  0,

                                  Math.max(
                                          120,
                                          duration)
                          );


                  GestureDescription gesture =

                          new GestureDescription
                                  .Builder()

                                  .addStroke(stroke)

                                  .build();


                  dispatchGesture(
                          gesture,
                          null,
                          null);
              }
          }
          EOF


          # ========================================================
          # BOT ENGINE
          # ========================================================

          cat > app/src/main/java/com/dustinbot/v6/BotEngine.java <<'EOF'
          package com.dustinbot.v6;

          import android.graphics.Bitmap;
          import android.os.Handler;

          import java.util.List;


          public final class BotEngine {


              private final BotAccessibility service;

              private final Handler handler;


              volatile boolean running =
                      false;


              private String state =
                      "IDLE";


              private String targetInfo =
                      "-";


              private int searchMisses =
                      0;


              public BotEngine(
                      BotAccessibility service,
                      Handler handler) {

                  this.service =
                          service;

                  this.handler =
                          handler;
              }


              public boolean isRunning() {

                  return running;
              }


              public String getState() {

                  return state;
              }


              public String getTargetInfo() {

                  return targetInfo;
              }


              public void start() {

                  if (running) {

                      return;
                  }


                  running = true;


                  state =
                          "OPEN GAME";


                  targetInfo =
                          "-";


                  service.refreshPanel();


                  boolean opened =
                          GameLauncher.launch(
                                  service);


                  if (!opened) {

                      state =
                              "GAME NOT FOUND";

                      running =
                              false;

                      service.refreshPanel();

                      return;
                  }


                  /*
                   * Wait for the game to appear.
                   */

                  handler.postDelayed(
                          this::search,
                          4000);
              }


              public void stop() {

                  running =
                          false;


                  handler.removeCallbacksAndMessages(
                          null);


                  state =
                          "STOPPED";


                  targetInfo =
                          "-";


                  service.refreshPanel();
              }


              private void search() {

                  if (!running) {

                      return;
                  }


                  state =
                          "SEARCH MONSTER";


                  service.refreshPanel();


                  service.takeScreen(
                          bitmap -> {


                              if (!running) {

                                  recycle(bitmap);

                                  return;
                              }


                              if (bitmap == null) {

                                  retry(1000);

                                  return;
                              }


                              List<VisionDetector.Target>
                                      targets =

                                      VisionDetector.find(
                                              bitmap);


                              VisionDetector.Target target =

                                      VisionDetector.nearest(

                                              targets,

                                              bitmap.getWidth(),

                                              bitmap.getHeight()
                                      );


                              int width =
                                      bitmap.getWidth();


                              int height =
                                      bitmap.getHeight();


                              recycle(bitmap);


                              if (target == null) {

                                  searchMisses++;


                                  targetInfo =
                                          "NOT FOUND";


                                  service.refreshPanel();


                                  /*
                                   * Change visible field
                                   * slightly.
                                   */

                                  int cx =
                                          width / 2;


                                  int cy =
                                          (int)
                                          (height * 0.82f);


                                  if (searchMisses % 2 == 0) {

                                      service.swipe(

                                              cx,
                                              cy,

                                              cx + 220,
                                              cy,

                                              450);

                                  } else {

                                      service.swipe(

                                              cx,
                                              cy,

                                              cx - 220,
                                              cy,

                                              450);
                                  }


                                  retry(900);

                                  return;
                              }


                              searchMisses =
                                      0;


                              targetInfo =
                                      target.x +
                                      "," +
                                      target.y;


                              state =
                                      "TARGET";


                              service.refreshPanel();


                              /*
                               * Select target.
                               */

                              service.tap(
                                      target.x,
                                      target.y);


                              handler.postDelayed(

                                      () -> attack(

                                              target.x,
                                              target.y),

                                      500);
                          });
              }


              private void attack(
                      int x,
                      int y) {

                  if (!running) {

                      return;
                  }


                  state =
                          "ATTACK";


                  targetInfo =
                          x + "," + y;


                  service.refreshPanel();


                  service.tap(
                          x,
                          y);


                  /*
                   * Repeated visible attack
                   * until the visual target disappears.
                   */

                  handler.postDelayed(

                          () -> checkTarget(
                                  x,
                                  y),

                          700);
              }


              private void checkTarget(
                      int x,
                      int y) {

                  if (!running) {

                      return;
                  }


                  service.takeScreen(
                          bitmap -> {


                              if (!running) {

                                  recycle(bitmap);

                                  return;
                              }


                              if (bitmap == null) {

                                  retryAttack(
                                          x,
                                          y);

                                  return;
                              }


                              List<VisionDetector.Target>
                                      targets =

                                      VisionDetector.find(
                                              bitmap);


                              recycle(bitmap);


                              /*
                               * If nothing is detected,
                               * go to loot.
                               */

                              if (targets.isEmpty()) {

                                  state =
                                          "LOOT";


                                  service.refreshPanel();


                                  handler.postDelayed(

                                          this::loot,

                                          500);

                                  return;
                              }


                              /*
                               * Continue attack cycle.
                               */

                              service.tap(
                                      x,
                                      y);


                              handler.postDelayed(

                                      () -> checkTarget(
                                              x,
                                              y),

                                      700);
                          });
              }


              private void retryAttack(
                      int x,
                      int y) {

                  if (!running) {

                      return;
                  }


                  service.tap(
                          x,
                          y);


                  handler.postDelayed(

                          () -> checkTarget(
                                  x,
                                  y),

                          900);
              }


              private void loot() {

                  if (!running) {

                      return;
                  }


                  state =
                          "LOOT";


                  targetInfo =
                          "-";


                  service.refreshPanel();


                  /*
                   * Lower-center area.
                   *
                   * This is intentionally only
                   * visible screen interaction.
                   */

                  int height =
                          service
                                  .getResources()
                                  .getDisplayMetrics()
                                  .heightPixels;


                  service.tap(
                          540,
                          (int)
                          (height * 0.82f));


                  handler.postDelayed(

                          () -> {

                              if (!running) {

                                  return;
                              }


                              state =
                                      "SEARCH MONSTER";


                              service.refreshPanel();


                              retry(800);

                          },

                          600);
              }


              private void retry(
                      long delay) {

                  if (!running) {

                      return;
                  }


                  handler.postDelayed(
                          this::search,
                          delay);
              }


              private void recycle(
                      Bitmap bitmap) {

                  if (bitmap != null &&
                      !bitmap.isRecycled()) {

                      bitmap.recycle();
                  }
              }
          }
          EOF


          # ========================================================
          # BUILD
          # ========================================================

          gradle wrapper \
            --gradle-version 8.10.2 \
            --distribution-type bin


          chmod +x gradlew


          ./gradlew \
            assembleDebug \
            --stacktrace


      # ============================================================
      # UPLOAD APK
      # ============================================================

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DustinBot-V6-debug
          path: app/build/outputs/apk/debug/app-debug.apk
