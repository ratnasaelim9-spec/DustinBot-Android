name: Build DustinBot APK

on:
  workflow_dispatch:
  push:
    branches: ["main", "master"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build APK
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DustinBot-PinkDetect-V1
          path: app/build/outputs/apk/debug/app-debug.apk


app/build.gradle
plugins {
    id 'com.android.application'
}

android {
    namespace 'com.dustinbot.runeclassic'
    compileSdk 35

    defaultConfig {
        applicationId "com.dustinbot.runeclassic"
        minSdk 30
        targetSdk 35
        versionCode 1
        versionName "1.0.0"
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
        release {
            minifyEnabled false
            shrinkResources false
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
}


app/src/main/AndroidManifest.xml
<?xml version="1.0" encoding="utf-8"?>
<manifest xmlns:android="http://schemas.android.com/apk/res/android">
    <application
        android:allowBackup="false"
        android:label="@string/app_name"
        android:theme="@style/Theme.DustinBot"
        android:usesCleartextTraffic="false">
        <activity android:name=".MainActivity" android:exported="true">
            <intent-filter>
                <action android:name="android.intent.action.MAIN"/>
                <category android:name="android.intent.category.LAUNCHER"/>
            </intent-filter>
        </activity>
        <service
            android:name=".BotAccessibilityService"
            android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE"
            android:exported="false">
            <intent-filter>
                <action android:name="android.accessibilityservice.AccessibilityService"/>
            </intent-filter>
            <meta-data
                android:name="android.accessibilityservice"
                android:resource="@xml/accessibility_service_config"/>
        </service>
    </application>
</manifest>


app/src/main/java/com/dustinbot/runeclassic/BotAccessibilityService.java
package com.dustinbot.runeclassic;

import android.accessibilityservice.AccessibilityService;
import android.accessibilityservice.GestureDescription;
import android.graphics.Bitmap;
import android.graphics.Color;
import android.graphics.Path;
import android.os.Build;
import android.os.Handler;
import android.os.Looper;
import android.view.Display;
import android.view.accessibility.AccessibilityEvent;

public class BotAccessibilityService extends AccessibilityService {
    private static BotAccessibilityService instance;
    private static volatile boolean botEnabled = false;
    private static volatile float pinkThreshold = 0.525f;

    private final Handler handler = new Handler(Looper.getMainLooper());
    private long lastTap = 0L;
    private long lastScan = 0L;

    public static void setBotEnabled(boolean enabled) {
        botEnabled = enabled;
        if (instance != null) {
            if (enabled) instance.scheduleScan(200);
            else instance.handler.removeCallbacksAndMessages(null);
        }
    }

    public static void setPinkThreshold(float value) {
        pinkThreshold = Math.max(0.25f, Math.min(0.75f, value));
    }

    @Override
    protected void onServiceConnected() {
        super.onServiceConnected();
        instance = this;
        if (botEnabled) scheduleScan(200);
    }

    @Override
    public void onAccessibilityEvent(AccessibilityEvent event) {}

    @Override
    public void onInterrupt() {
        botEnabled = false;
    }

    @Override
    public void onDestroy() {
        botEnabled = false;
        handler.removeCallbacksAndMessages(null);
        instance = null;
        super.onDestroy();
    }

    private void scheduleScan(long delay) {
        handler.postDelayed(this::scanOnce, delay);
    }

    private void scanOnce() {
        if (!botEnabled || Build.VERSION.SDK_INT < 30) return;

        long now = System.currentTimeMillis();
        if (now - lastScan < 450) {
            scheduleScan(250);
            return;
        }
        lastScan = now;

        takeScreenshot(Display.DEFAULT_DISPLAY, getMainExecutor(),
                new TakeScreenshotCallback() {
                    @Override
                    public void onSuccess(ScreenshotResult result) {
                        Bitmap bitmap = Bitmap.wrapHardwareBuffer(
                                result.getHardwareBuffer(), result.getColorSpace());

                        if (bitmap == null) {
                            result.getHardwareBuffer().close();
                            scheduleScan(600);
                            return;
                        }

                        Bitmap copy = bitmap.copy(Bitmap.Config.ARGB_8888, false);
                        bitmap.recycle();
                        result.getHardwareBuffer().close();

                        Detection d = detectPinkTarget(copy);
                        copy.recycle();

                        if (d != null && System.currentTimeMillis() - lastTap >= 1400) {
                            tap(d.x, d.y);
                            lastTap = System.currentTimeMillis();
                        }

                        if (botEnabled) scheduleScan(500);
                    }

                    @Override
                    public void onFailure(int errorCode) {
                        if (botEnabled) scheduleScan(800);
                    }
                });
    }

    private static class Detection {
        final int x, y, area;
        final float score;
        Detection(int x, int y, int area, float score) {
            this.x = x; this.y = y; this.area = area; this.score = score;
        }
    }

    private Detection detectPinkTarget(Bitmap bmp) {
        int w = bmp.getWidth(), h = bmp.getHeight();
        if (w < 100 || h < 100) return null;

        int left = (int)(w * 0.08f);
        int right = (int)(w * 0.92f);
        int top = (int)(h * 0.10f);
        int bottom = (int)(h * 0.90f);

        int step = Math.max(2, Math.min(w, h) / 360);
        int gw = (right - left + step - 1) / step;
        int gh = (bottom - top + step - 1) / step;

        boolean[] mask = new boolean[gw * gh];
        int pinkCount = 0;

        for (int gy = 0; gy < gh; gy++) {
            int py = Math.min(bottom - 1, top + gy * step + step / 2);
            for (int gx = 0; gx < gw; gx++) {
                int px = Math.min(right - 1, left + gx * step + step / 2);
                int c = bmp.getPixel(px, py);

                float[] hsv = new float[3];
                Color.colorToHSV(c, hsv);

                float hue = hsv[0];
                boolean hueOk = hue >= 300f || hue <= 15f;
                boolean satOk = hsv[1] >= pinkThreshold;
                boolean valOk = hsv[2] >= 0.35f;

                if (hueOk && satOk && valOk) {
                    mask[gy * gw + gx] = true;
                    pinkCount++;
                }
            }
        }

        if (pinkCount < 18) return null;

        boolean[] seen = new boolean[mask.length];
        int[] q = new int[mask.length];
        Detection best = null;

        for (int sy = 0; sy < gh; sy++) {
            for (int sx = 0; sx < gw; sx++) {
                int start = sy * gw + sx;
                if (!mask[start] || seen[start]) continue;

                int head = 0, tail = 0;
                q[tail++] = start;
                seen[start] = true;

                int count = 0;
                long sumX = 0, sumY = 0;
                int minX = sx, maxX = sx, minY = sy, maxY = sy;

                while (head < tail) {
                    int cur = q[head++];
                    int cy = cur / gw, cx = cur % gw;
                    count++;
                    sumX += cx;
                    sumY += cy;
                    minX = Math.min(minX, cx);
                    maxX = Math.max(maxX, cx);
                    minY = Math.min(minY, cy);
                    maxY = Math.max(maxY, cy);

                    for (int dy = -1; dy <= 1; dy++) {
                        for (int dx = -1; dx <= 1; dx++) {
                            if (dx == 0 && dy == 0) continue;
                            int nx = cx + dx, ny = cy + dy;
                            if (nx < 0 || nx >= gw || ny < 0 || ny >= gh) continue;
                            int ni = ny * gw + nx;
                            if (mask[ni] && !seen[ni]) {
                                seen[ni] = true;
                                q[tail++] = ni;
                            }
                        }
                    }
                }

                if (count < 18 || count > 5000) continue;

                float aspect = (maxX - minX + 1f) / (maxY - minY + 1f);
                float compact = Math.min(1f, count / 250f);
                float shape = (aspect > 0.25f && aspect < 4.0f) ? 1f : 0.25f;
                float score = compact * 0.7f + shape * 0.3f;

                int cx = left + Math.round((sumX / (float)count) * step);
                int cy = top + Math.round((sumY / (float)count) * step);

                Detection d = new Detection(cx, cy, count, score);
                if (best == null || d.score > best.score ||
                        (Math.abs(d.score - best.score) < 0.05f && d.area > best.area)) {
                    best = d;
                }
            }
        }
        return best;
    }

    private void tap(float x, float y) {
        Path path = new Path();
        path.moveTo(x, y);

        GestureDescription gesture = new GestureDescription.Builder()
                .addStroke(new GestureDescription.StrokeDescription(path, 0, 60))
                .build();

        dispatchGesture(gesture, null, null);
    }
}


app/src/main/java/com/dustinbot/runeclassic/MainActivity.java
package com.dustinbot.runeclassic;

import android.accessibilityservice.AccessibilityServiceInfo;
import android.content.ComponentName;
import android.content.Context;
import android.content.Intent;
import android.graphics.Color;
import android.os.Bundle;
import android.provider.Settings;
import android.view.Gravity;
import android.view.accessibility.AccessibilityManager;
import android.widget.Button;
import android.widget.LinearLayout;
import android.widget.SeekBar;
import android.widget.TextView;

import androidx.appcompat.app.AppCompatActivity;

public class MainActivity extends AppCompatActivity {
    private TextView status;

    @Override
    protected void onCreate(Bundle savedInstanceState) {
        super.onCreate(savedInstanceState);
        buildUi();
    }

    private void buildUi() {
        LinearLayout root = new LinearLayout(this);
        root.setOrientation(LinearLayout.VERTICAL);
        root.setPadding(28, 28, 28, 28);
        root.setBackgroundColor(Color.rgb(248,248,250));

        TextView title = new TextView(this);
        title.setText("DustinBot — Pink Detect V1");
        title.setTextSize(24);
        title.setTextColor(Color.rgb(35,35,40));
        title.setGravity(Gravity.CENTER);
        root.addView(title, new LinearLayout.LayoutParams(-1, 80));

        status = new TextView(this);
        status.setTextSize(16);
        status.setPadding(0, 16, 0, 16);
        root.addView(status);

        Button settings = new Button(this);
        settings.setText("1. เปิด Accessibility Service");
        settings.setOnClickListener(v ->
                startActivity(new Intent(Settings.ACTION_ACCESSIBILITY_SETTINGS)));
        root.addView(settings);

        Button start = new Button(this);
        start.setText("2. เริ่มตรวจจับ");
        start.setOnClickListener(v -> {
            if (!isAccessibilityEnabled()) {
                status.setText("กรุณาเปิด Accessibility ก่อน");
                return;
            }
            BotAccessibilityService.setBotEnabled(true);
            status.setText("กำลังตรวจจับเป้าหมายสีชมพู...");
        });
        root.addView(start);

        Button stop = new Button(this);
        stop.setText("หยุดบอท");
        stop.setOnClickListener(v -> {
            BotAccessibilityService.setBotEnabled(false);
            status.setText("หยุดแล้ว");
        });
        root.addView(stop);

        TextView label = new TextView(this);
        label.setText("ความเข้มสีชมพู");
        root.addView(label);

        SeekBar threshold = new SeekBar(this);
        threshold.setMax(100);
        threshold.setProgress(55);
        threshold.setOnSeekBarChangeListener(new SeekBar.OnSeekBarChangeListener() {
            public void onProgressChanged(SeekBar s, int p, boolean fromUser) {
                BotAccessibilityService.setPinkThreshold(0.25f + p / 200f);
            }
            public void onStartTrackingTouch(SeekBar s) {}
            public void onStopTrackingTouch(SeekBar s) {}
        });
        root.addView(threshold);

        TextView info = new TextView(this);
        info.setText("\nV1 ทำเฉพาะ: ภาพหน้าจอ → ตรวจสีชมพู → แตะ\n"
                + "ยังไม่อ่าน Monster ID และยังไม่เดิน/โจมตี");
        info.setTextSize(15);
        root.addView(info, new LinearLayout.LayoutParams(-1, 0, 1));

        Button refresh = new Button(this);
        refresh.setText("รีเฟรชสถานะ");
        refresh.setOnClickListener(v -> updateStatus());
        root.addView(refresh);

        setContentView(root);
        updateStatus();
    }

    private boolean isAccessibilityEnabled() {
        AccessibilityManager am =
                (AccessibilityManager) getSystemService(Context.ACCESSIBILITY_SERVICE);
        if (am == null) return false;
        for (AccessibilityServiceInfo info : am.getEnabledAccessibilityServiceList(
                AccessibilityServiceInfo.FEEDBACK_ALL_MASK)) {
            ComponentName c = new ComponentName(this, BotAccessibilityService.class);
            if (info.getResolveInfo().serviceInfo.packageName.equals(c.getPackageName())
                    && info.getResolveInfo().serviceInfo.name.equals(c.getClassName())) {
                return true;
            }
        }
        return false;
    }

    private void updateStatus() {
        status.setText(isAccessibilityEnabled()
                ? "Accessibility: เปิดแล้ว"
                : "Accessibility: ยังไม่เปิด");
    }
}


