name: DustinBot Android V6

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # CHECKOUT
      # ============================================================

      - name: Checkout
        uses: actions/checkout@v4


      # ============================================================
      # JAVA 17
      # ============================================================

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'


      # ============================================================
      # CREATE PROJECT
      # ============================================================

      - name: Create Android Project
        shell: bash
        run: |

          set -e

          mkdir -p app/src/main/java/com/dustinbot/v6
          mkdir -p app/src/main/res/xml
          mkdir -p app/src/main/res/values


          # ========================================================
          # SETTINGS
          # ========================================================

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)

              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "DustinBotV6"

          include(":app")
          EOF


          # ========================================================
          # ROOT BUILD
          # ========================================================

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.6.1' apply false
          }
          EOF


          # ========================================================
          # GRADLE PROPERTIES
          # ========================================================

          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=false
          EOF


          # ========================================================
          # APP BUILD
          # ========================================================

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {

              namespace 'com.dustinbot.v6'

              compileSdk 35

              defaultConfig {

                  applicationId 'com.dustinbot.v6'

                  minSdk 30

                  targetSdk 35

                  versionCode 60

                  versionName '6.0'
              }

              compileOptions {

                  sourceCompatibility JavaVersion.VERSION_17

                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          EOF


          # ========================================================
          # COLORS
          # ========================================================

          cat > app/src/main/res/values/colors.xml <<'EOF'
          <resources>

              <color name="black">
                  #000000
              </color>

              <color name="white">
                  #FFFFFF
              </color>

          </resources>
          EOF


          # ========================================================
          # STYLE
          # ========================================================

          cat > app/src/main/res/values/styles.xml <<'EOF'
          <resources>

              <style
                  name="DustinBotTheme"
                  parent="@android:style/Theme.Material.NoActionBar">

                  <item name="android:fontFamily">
                      sans
                  </item>

                  <item name="android:windowNoTitle">
                      true
                  </item>

                  <item name="android:colorAccent">
                      #00C853
                  </item>

                  <item name="android:statusBarColor">
                      #000000
                  </item>

                  <item name="android:navigationBarColor">
                      #000000
                  </item>

              </style>

          </resources>
          EOF


          # ========================================================
          # STRINGS
          # ========================================================

          cat > app/src/main/res/values/strings.xml <<'EOF'
          <resources>

              <string name="app_name">
                  DustinBot V6
              </string>

              <string name="accessibility_description">
                  DustinBot controls the game using visible screen interaction.
              </string>

          </resources>
          EOF


          # ========================================================
          # ACCESSIBILITY CONFIG
          # ========================================================

          cat > app/src/main/res/xml/accessibility_service_config.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>

          <accessibility-service
              xmlns:android="http://schemas.android.com/apk/res/android"

              android:accessibilityEventTypes="
                  typeWindowStateChanged|
                  typeWindowContentChanged
              "

              android:accessibilityFeedbackType="feedbackGeneric"

              android:notificationTimeout="100"

              android:canRetrieveWindowContent="true"

              android:canPerformGestures="true"

              android:canTakeScreenshot="true"

              android:description="@string/accessibility_description" />

          EOF


          # ========================================================
          # MANIFEST
          # ========================================================

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>

          <manifest
              xmlns:android="http://schemas.android.com/apk/res/android">

              <application

                  android:allowBackup="false"

                  android:label="DustinBot V6"

                  android:theme="@style/DustinBotTheme"

                  android:supportsRtl="true">

                  <activity

                      android:name=".MainActivity"

                      android:exported="true">

                      <intent-filter>

                          <action
                              android:name="android.intent.action.MAIN" />

                          <category
                              android:name="android.intent.category.LAUNCHER" />

                      </intent-filter>

                  </activity>


                  <service

                      android:name=".BotAccessibility"

                      android:permission="
                          android.permission.BIND_ACCESSIBILITY_SERVICE
                      "

                      android:exported="false">

                      <intent-filter>

                          <action
                              android:name="
                              android.accessibilityservice.AccessibilityService
                              " />

                      </intent-filter>


                      <meta-data

                          android:name="
                          android.accessibilityservice
                          "

                          android:resource="
                          @xml/accessibility_service_config
                          " />

                  </service>

              </application>

          </manifest>
          EOF


          # ========================================================
          # GAME LAUNCHER
          # ========================================================

          cat > app/src/main/java/com/dustinbot/v6/GameLauncher.java <<'EOF'
          package com.dustinbot.v6;

          import android.content.Context;
          import android.content.Intent;
          import android.content.pm.PackageManager;
          import android.content.pm.ResolveInfo;

          import java.util.List;
          import java.util.Locale;


          public final class GameLauncher {

              private GameLauncher() {
              }


              public static String findGamePackage(
                      Context context) {

                  PackageManager pm =
                          context.getPackageManager();


                  Intent intent =
                          new Intent(Intent.ACTION_MAIN);

                  intent.addCategory(
                          Intent.CATEGORY_LAUNCHER);


                  List<ResolveInfo> apps =
                          pm.queryIntentActivities(
                                  intent,
                                  PackageManager.MATCH_ALL);


                  String fallback = null;


                  for (ResolveInfo info : apps) {

                      String label =
                              String.valueOf(
                                      info.loadLabel(pm))
                                      .toLowerCase(
                                              Locale.ROOT);


                      String pkg =
                              info.activityInfo
                                      .packageName
                                      .toLowerCase(
                                              Locale.ROOT);


                      if (label.contains("dustin") ||
                          pkg.contains("dustin")) {

                          return info.activityInfo.packageName;
                      }


                      if (label.contains("ragnarok") ||
                          label.equals("ro")) {

                          fallback =
                                  info.activityInfo.packageName;
                      }
                  }


                  return fallback;
              }


              public static boolean launch(
                      Context context) {

                  String pkg =
                          findGamePackage(context);


                  if (pkg == null) {

                      return false;
                  }


                  Intent launch =
                          context
                                  .getPackageManager()
                                  .getLaunchIntentForPackage(pkg);


                  if (launch == null) {

                      return false;
                  }


                  launch.addFlags(
                          Intent.FLAG_ACTIVITY_NEW_TASK |
                          Intent.FLAG_ACTIVITY_RESET_TASK_IF_NEEDED
                  );


                  context.startActivity(launch);

                  return true;
              }
          }
          EOF


          # ========================================================
          # MAIN ACTIVITY
          # ========================================================

          cat > app/src/main/java/com/dustinbot/v6/MainActivity.java <<'EOF'
