name: DUSTIN BOT V12.1 - FULL AUTO

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Create Android Project
        shell: bash
        run: |
          set -e

          rm -rf app
          rm -f build.gradle settings.gradle gradle.properties

          mkdir -p app/src/main/java/com/dustinbot/v121
          mkdir -p app/src/main/res/xml
          mkdir -p app/src/main/res/values

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "DustinBotV121"
          include(":app")
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.6.1' apply false
          }
          EOF

          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=false
          android.nonTransitiveRClass=true
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.dustinbot.v121'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.dustinbot.v121'
                  minSdk 30
                  targetSdk 35
                  versionCode 121
                  versionName '12.1.0'
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }

              buildTypes {
                  release {
                      minifyEnabled false
                      shrinkResources false
                  }
              }
          }
          EOF

          cat > app/src/main/res/values/colors.xml <<'EOF'
          <resources>
              <color name="black">#000000</color>
              <color name="white">#FFFFFF</color>
          </resources>
          EOF

          cat > app/src/main/res/values/styles.xml <<'EOF'
          <resources>
              <style name="AppTheme" parent="@android:style/Theme.Material.NoActionBar">
                  <item name="android:fontFamily">sans</item>
                  <item name="android:colorAccent">#00FF88</item>
                  <item name="android:windowLightStatusBar">false</item>
                  <item name="android:statusBarColor">#000000</item>
                  <item name="android:navigationBarColor">#000000</item>
              </style>
          </resources>
          EOF

          cat > app/src/main/res/xml/accessibility_service_config.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <accessibility-service
              xmlns:android="http://schemas.android.com/apk/res/android"
              android:description="@string/accessibility_description"
              android:accessibilityEventTypes="typeAllMask"
              android:accessibilityFeedbackType="feedbackGeneric"
              android:notificationTimeout="100"
              android:canRetrieveWindowContent="true"
              android:canPerformGestures="true"
              android:canTakeScreenshot="true"
              android:accessibilityFlags="flagDefault|flagReportViewIds|flagRetrieveInteractiveWindows" />
          EOF

          cat > app/src/main/res/values/strings.xml <<'EOF'
          <resources>
              <string name="app_name">DUSTIN BOT V12.1</string>
              <string name="accessibility_description">DUSTIN BOT screen automation service</string>
          </resources>
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET" />

              <application
                  android:allowBackup="false"
                  android:label="DUSTIN BOT V12.1"
                  android:theme="@style/AppTheme"
                  android:supportsRtl="true">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>

                  </activity>

                  <service
                      android:name=".BotAccessibility"
                      android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE"
                      android:exported="false">

                      <intent-filter>
                          <action android:name="android.accessibilityservice.AccessibilityService" />
                      </intent-filter>

                      <meta-data
                          android:name="android.accessibilityservice"
                          android:resource="@xml/accessibility_service_config" />

                  </service>

              </application>

          </manifest>
          EOF

          cat > app/src/main/java/com/dustinbot/v121/MainActivity.java <<'EOF'
          package com.dustinbot.v121;

          import android.app.Activity;
          import android.os.Bundle;
          import android.content.Intent;
          import android.provider.Settings;
          import android.graphics.Color;
          import android.view.Gravity;
          import android.view.View;
          import android.widget.Button;
          import android.widget.LinearLayout;
          import android.widget.TextView;

          public class MainActivity extends Activity {

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  LinearLayout root = new LinearLayout(this);
                  root.setOrientation(LinearLayout.VERTICAL);
                  root.setPadding(35, 50, 35, 35);
                  root.setGravity(Gravity.CENTER);

                  TextView title = new TextView(this);
                  title.setText("DUSTIN BOT V12.1");
                  title.setTextSize(28);
                  title.setTextColor(Color.WHITE);
                  title.setGravity(Gravity.CENTER);
                  title.setPadding(0, 0, 0, 25);

                  TextView info = new TextView(this);
                  info.setText(
                      "AUTO LOCK\\n" +
                      "AUTO MOVE\\n" +
                      "AUTO ATTACK\\n" +
                      "AUTO LOOT\\n\\n" +
                      "ต้องเปิด Accessibility Service ก่อน"
                  );
                  info.setTextSize(17);
                  info.setTextColor(Color.WHITE);
                  info.setGravity(Gravity.CENTER);
                  info.setPadding(0, 0, 0, 30);

                  Button accessibility = new Button(this);
                  accessibility.setText("เปิด Accessibility");

                  Button game = new Button(this);
                  game.setText("เปิด Dustin RO");

                  Button start = new Button(this);
                  start.setText("START BOT");

                  accessibility.setOnClickListener(v -> {
                      try {
                          startActivity(new Intent(Settings.ACTION_ACCESSIBILITY_SETTINGS));
                      } catch (Exception ignored) {}
                  });

                  game.setOnClickListener(v -> {
                      BotAccessibility.openGame(this);
                  });

                  start.setOnClickListener(v -> {
                      if (BotAccessibility.getInstance() != null) {
                          BotAccessibility.getInstance().startBot();
                      } else {
                          try {
                              startActivity(new Intent(Settings.ACTION_ACCESSIBILITY_SETTINGS));
                          } catch (Exception ignored) {}
                      }
                  });

                  root.addView(title);
                  root.addView(info);

                  root.addView(accessibility,
                      new LinearLayout.LayoutParams(
                          LinearLayout.LayoutParams.MATCH_PARENT,
                          LinearLayout.LayoutParams.WRAP_CONTENT));

                  root.addView(game,
                      new LinearLayout.LayoutParams(
                          LinearLayout.LayoutParams.MATCH_PARENT,
                          LinearLayout.LayoutParams.WRAP_CONTENT));

                  root.addView(start,
                      new LinearLayout.LayoutParams(
                          LinearLayout.LayoutParams.MATCH_PARENT,
                          LinearLayout.LayoutParams.WRAP_CONTENT));

                  root.setBackgroundColor(Color.rgb(18, 18, 18));

                  setContentView(root);
              }
          }
          EOF

          cat > app/src/main/java/com/dustinbot/v121/BotAccessibility.java <<'EOF'
          package com.dustinbot.v121;

          import android.accessibilityservice.AccessibilityService;
          import android.accessibilityservice.GestureDescription;
          import android.accessibilityservice.AccessibilityService.ScreenshotResult;
          import android.graphics.Bitmap;
          import android.graphics.ColorSpace;
          import android.graphics.Path;
          import android.graphics.PixelFormat;
          import android.hardware.HardwareBuffer;
          import android.os.Build;
          import android.os.Handler;
          import android.os.Looper;
          import android.content.Context;
          import android.content.Intent;
          import android.net.Uri;
          import android.view.Display;
          import android.view.Gravity;
          import android.view.WindowManager;
          import android.view.View;
          import android.widget.LinearLayout;
          import android.widget.TextView;
          import android.widget.Button;
          import android.graphics.Color;
          import android.graphics.drawable.GradientDrawable;
          import android.view.accessibility.AccessibilityEvent;

          import java.util.concurrent.Executor;
          import java.util.concurrent.Executors;

          public class BotAccessibility extends AccessibilityService {

              private static BotAccessibility instance;

              private final Handler handler = new Handler(Looper.getMainLooper());
              private final Executor screenshotExecutor = Executors.newSingleThreadExecutor();

              private WindowManager windowManager;
              private LinearLayout panel;
              private TextView statusText;

              private BotEngine engine;

              public static BotAccessibility getInstance() {
                  return instance;
              }

              @Override
              protected void onServiceConnected() {
                  super.onServiceConnected();

                  instance = this;

                  windowManager = (WindowManager) getSystemService(WINDOW_SERVICE);

                  createOverlay();

                  engine = new BotEngine(this);

                  setStatus("READY");
              }

              private void createOverlay() {

                  if (panel != null) {
                      try {
                          windowManager.removeView(panel);
                      } catch (Exception ignored) {}
                  }

                  panel = new LinearLayout(this);
                  panel.setOrientation(LinearLayout.VERTICAL);
                  panel.setPadding(12, 10, 12, 10);

                  GradientDrawable bg = new GradientDrawable();
                  bg.setColor(Color.argb(225, 0, 0, 0));
                  bg.setCornerRadius(18);
                  panel.setBackground(bg);

                  statusText = new TextView(this);
                  statusText.setText("DUSTIN BOT V12.1\\nREADY");
                  statusText.setTextColor(Color.WHITE);
                  statusText.setTextSize(11);
                  statusText.setGravity(Gravity.CENTER);
                  statusText.setPadding(8, 4, 8, 7);

                  LinearLayout buttons = new LinearLayout(this);
                  buttons.setOrientation(LinearLayout.HORIZONTAL);

                  Button start = new Button(this);
                  start.setText("START");
                  start.setTextSize(9);

                  Button stop = new Button(this);
                  stop.setText("STOP");
                  stop.setTextSize(9);

                  Button game = new Button(this);
                  game.setText("GAME");
                  game.setTextSize(9);

                  Button hide = new Button(this);
                  hide.setText("×");
                  hide.setTextSize(12);

                  start.setOnClickListener(v -> startBot());

                  stop.setOnClickListener(v -> stopBot());

                  game.setOnClickListener(v -> openGame(this));

                  hide.setOnClickListener(v -> {
                      try {
                          windowManager.removeView(panel);
                      } catch (Exception ignored) {}
                  });

                  buttons.addView(start);
                  buttons.addView(stop);
                  buttons.addView(game);
                  buttons.addView(hide);

                  panel.addView(statusText);
                  panel.addView(buttons);

                  WindowManager.LayoutParams lp =
                      new WindowManager.LayoutParams(
                          WindowManager.LayoutParams.WRAP_CONTENT,
                          WindowManager.LayoutParams.WRAP_CONTENT,
                          WindowManager.LayoutParams.TYPE_ACCESSIBILITY_OVERLAY,
                          WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE |
                          WindowManager.LayoutParams.FLAG_LAYOUT_NO_LIMITS,
                          PixelFormat.TRANSLUCENT
                      );

                  lp.gravity = Gravity.TOP | Gravity.RIGHT;
                  lp.x = 8;
                  lp.y = 35;

                  try {
                      windowManager.addView(panel, lp);
                  } catch (Exception ignored) {}
              }

              public void setStatus(String text) {

                  handler.post(() -> {
                      if (statusText != null) {
                          statusText.setText("DUSTIN BOT V12.1\\n" + text);
                      }
                  });
              }

              public void startBot() {

                  if (engine == null) {
                      engine = new BotEngine(this);
                  }

                  engine.start();
              }

              public void stopBot() {

                  if (engine != null) {
                      engine.stop();
                  }

                  setStatus("STOPPED");
              }

              public void screenshot() {

                  if (Build.VERSION.SDK_INT < 30) {
                      return;
                  }

                  takeScreenshot(
                      Display.DEFAULT_DISPLAY,
                      screenshotExecutor,
                      new TakeScreenshotCallback() {

                          @Override
                          public void onSuccess(ScreenshotResult result) {

                              try {

                                  HardwareBuffer buffer = result.getHardwareBuffer();

                                  if (buffer == null) {
                                      return;
                                  }

                                  Bitmap wrapped =
                                      Bitmap.wrapHardwareBuffer(
                                          buffer,
                                          ColorSpace.get(ColorSpace.Named.SRGB)
                                      );

                                  if (wrapped == null) {
                                      buffer.close();
                                      return;
                                  }

                                  Bitmap bitmap =
                                      wrapped.copy(
                                          Bitmap.Config.ARGB_8888,
                                          false
                                      );

                                  wrapped.recycle();
                                  buffer.close();

                                  if (bitmap != null) {
                                      if (engine != null) {
                                          engine.processScreenshot(bitmap);
                                      } else {
                                          bitmap.recycle();
                                      }
                                  }

                              } catch (Throwable ignored) {}
                          }

                          @Override
                          public void onFailure(int errorCode) {
                              if (engine != null) {
                                  engine.screenshotFailed();
                              }
                          }
                      }
                  );
              }

              public void tap(float x, float y) {

                  Path path = new Path();
                  path.moveTo(x, y);

                  GestureDescription.StrokeDescription stroke =
                      new GestureDescription.StrokeDescription(
                          path,
                          0,
                          60
                      );

                  GestureDescription gesture =
                      new GestureDescription.Builder()
                          .addStroke(stroke)
                          .build();

                  dispatchGesture(
                      gesture,
                      null,
                      null
                  );
              }

              public void swipe(
                  float startX,
                  float startY,
                  float endX,
                  float endY,
                  long duration
              ) {

                  Path path = new Path();
                  path.moveTo(startX, startY);
                  path.lineTo(endX, endY);

                  GestureDescription.StrokeDescription stroke =
                      new GestureDescription.StrokeDescription(
                          path,
                          0,
                          duration
                      );

                  GestureDescription gesture =
                      new GestureDescription.Builder()
                          .addStroke(stroke)
                          .build();

                  dispatchGesture(
                      gesture,
                      null,
                      null
                  );
              }

              public void holdSwipe(
                  float startX,
                  float startY,
                  float endX,
                  float endY,
                  long duration
              ) {

                  Path path = new Path();

                  path.moveTo(startX, startY);
                  path.lineTo(endX, endY);

                  GestureDescription.StrokeDescription stroke =
                      new GestureDescription.StrokeDescription(
                          path,
                          0,
                          duration
                      );

                  GestureDescription gesture =
                      new GestureDescription.Builder()
                          .addStroke(stroke)
                          .build();

                  dispatchGesture(
                      gesture,
                      new GestureResultCallback() {
                          @Override
                          public void onCompleted(
                              GestureDescription gestureDescription
                          ) {}

                          @Override
                          public void onCancelled(
                              GestureDescription gestureDescription
                          ) {}
                      },
                      null
                  );
              }

              public static void openGame(Context context) {

                  try {

                      Intent intent =
                          new Intent(
                              Intent.ACTION_VIEW,
                              Uri.parse("https://dustin-ro.com/")
                          );

                      intent.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);

                      context.startActivity(intent);

                  } catch (Exception ignored) {}
              }

              @Override
              public void onAccessibilityEvent(
                  AccessibilityEvent event
              ) {}

              @Override
              public void onInterrupt() {}

              @Override
              public void onDestroy() {

                  try {
                      if (panel != null && windowManager != null) {
                          windowManager.removeView(panel);
                      }
                  } catch (Exception ignored) {}

                  if (engine != null) {
                      engine.stop();
                  }

                  instance = null;

                  super.onDestroy();
              }
          }
          EOF

          cat > app/src/main/java/com/dustinbot/v121/BotEngine.java <<'EOF'
          package com.dustinbot.v121;

          import android.graphics.Bitmap;
          import android.graphics.Color;

          import java.util.ArrayList;
          import java.util.List;

          public class BotEngine {

              private final BotAccessibility service;

              private boolean running = false;

              private int screenW = 0;
              private int screenH = 0;

              private long lastTargetTime = 0;
              private long lastAttackTime = 0;
              private long lastLootTime = 0;
              private long lastAutoLockTime = 0;
              private long lastSearchMove = 0;

              private int searchDirection = 1;
              private int searchStep = 0;

              private int noTargetCount = 0;
              private int attackCount = 0;

              private Point lastTarget = null;

              private static final int STATE_SEARCH = 0;
              private static final int STATE_MOVE = 1;
              private static final int STATE_ATTACK = 2;
              private static final int STATE_LOOT = 3;

              private int state = STATE_SEARCH;

              public BotEngine(BotAccessibility service) {
                  this.service = service;
              }

              public void start() {

                  if (running) {
                      return;
                  }

                  running = true;

                  state = STATE_SEARCH;
                  noTargetCount = 0;
                  attackCount = 0;
                  searchStep = 0;
                  searchDirection = 1;

                  service.setStatus("STARTING...");

                  service.handlerPost(() -> {
                      openAutoLock();
                  }, 700);
              }

              public void stop() {

                  running = false;

                  lastTarget = null;

                  service.setStatus("STOPPED");
              }

              private void later(Runnable r, long delay) {
                  service.handlerPost(r, delay);
              }

              private void openAutoLock() {

                  if (!running) {
                      return;
                  }

                  service.setStatus("AUTO LOCK");

                  tapRatio(0.755f, 0.075f);

                  later(() -> {

                      if (!running) {
                          return;
                      }

                      tapRatio(0.755f, 0.155f);

                      later(() -> {
                          scan();
                      }, 450);

                  }, 250);
              }

              private void scan() {

                  if (!running) {
                      return;
                  }

                  service.setStatus("SEARCH");

                  service.screenshot();
              }

              public void processScreenshot(Bitmap bitmap) {

                  if (!running) {
                      bitmap.recycle();
                      return;
                  }

                  screenW = bitmap.getWidth();
                  screenH = bitmap.getHeight();

                  Point target = Vision.findTarget(bitmap);

                  bitmap.recycle();

                  if (!running) {
                      return;
                  }

                  long now = System.currentTimeMillis();

                  if (target != null) {

                      lastTarget = target;
                      lastTargetTime = now;
                      noTargetCount = 0;

                      float dx =
                          target.x - (screenW * 0.50f);

                      float dy =
                          target.y - (screenH * 0.47f);

                      float distance =
                          (float)Math.sqrt(
                              dx * dx + dy * dy
                          );

                      if (distance < screenW * 0.105f) {

                          state = STATE_ATTACK;

                          attack();

                      } else {

                          state = STATE_MOVE;

                          moveToTarget(target);
                      }

                      return;
                  }

                  lastTarget = null;
                  noTargetCount++;

                  if (now - lastAutoLockTime > 1800) {

                      lastAutoLockTime = now;

                      openAutoLock();

                      return;
                  }

                  if (state == STATE_ATTACK) {

                      if (now - lastAttackTime > 2200) {

                          attackCount++;

                          if (attackCount >= 3) {

                              attackCount = 0;

                              state = STATE_LOOT;

                              loot();

                              return;
                          }

                          attack();

                          return;
                      }
                  }

                  if (noTargetCount >= 3) {

                      state = STATE_SEARCH;

                      searchMove();

                      return;
                  }

                  later(() -> {
                      scan();
                  }, 250);
              }

              public void screenshotFailed() {

                  if (!running) {
                      return;
                  }

                  later(() -> {
                      scan();
                  }, 500);
              }

              private void moveToTarget(Point target) {

                  if (!running) {
                      return;
                  }

                  if (screenW <= 0 || screenH <= 0) {
                      later(() -> scan(), 250);
                      return;
                  }

                  float playerX = screenW * 0.50f;
                  float playerY = screenH * 0.47f;

                  float dx = target.x - playerX;
                  float dy = target.y - playerY;

                  float absX = Math.abs(dx);
                  float absY = Math.abs(dy);

                  service.setStatus(
                      "MOVE  " +
                      Math.round(target.x) +
                      "," +
                      Math.round(target.y)
                  );

                  float joystickX = screenW * 0.135f;
                  float joystickY = screenH * 0.785f;

                  float moveX = joystickX;
                  float moveY = joystickY;

                  float length =
                      (float)Math.sqrt(
                          dx * dx +
                          dy * dy
                      );

                  if (length < 1) {
                      later(() -> scan(), 200);
                      return;
                  }

                  float nx = dx / length;
                  float ny = dy / length;

                  float radius = Math.min(screenW, screenH) * 0.075f;

                  if (absX > absY * 0.65f) {
                      moveX += nx * radius;
                  }

                  if (absY > absX * 0.65f) {
                      moveY += ny * radius;
                  }

                  moveX =
                      Math.max(
                          10,
                          Math.min(screenW - 10, moveX)
                      );

                  moveY =
                      Math.max(
                          10,
                          Math.min(screenH - 10, moveY)
                      );

                  final float fx = moveX;
                  final float fy = moveY;

                  service.holdSwipe(
                      joystickX,
                      joystickY,
                      fx,
                      fy,
                      280
                  );

                  later(() -> {

                      if (!running) {
                          return;
                      }

                      if (System.currentTimeMillis() -
                          lastAttackTime > 900) {

                          attack();
                      }

                      later(() -> scan(), 250);

                  }, 330);
              }

              private void attack() {

                  if (!running) {
                      return;
                  }

                  state = STATE_ATTACK;

                  lastAttackTime =
                      System.currentTimeMillis();

                  attackCount++;

                  service.setStatus(
                      "ATTACK #" + attackCount
                  );

                  /*
                   * ตำแหน่งปุ่มดาบจากหน้าจอจริงของเกม
                   * ใช้ ratio เพื่อรองรับความละเอียดต่างกัน
                   */
                  tapRatio(
                      0.850f,
                      0.815f
                  );

                  later(() -> {

                      if (!running) {
                          return;
                      }

                      if (attackCount >= 8) {

                          attackCount = 0;

                          state = STATE_LOOT;

                          loot();

                          return;
                      }

                      scan();

                  }, 700);
              }

              private void loot() {

                  if (!running) {
                      return;
                  }

                  long now =
                      System.currentTimeMillis();

                  if (now - lastLootTime < 900) {
                      scan();
                      return;
                  }

                  lastLootTime = now;

                  state = STATE_LOOT;

                  service.setStatus("LOOT");

                  /*
                   * ปุ่มเก็บของอยู่ด้านล่างใกล้ปุ่มดาบ
                   */
                  tapRatio(
                      0.795f,
                      0.900f
                  );

                  later(() -> {

                      if (!running) {
                          return;
                      }

                      attackCount = 0;

                      openAutoLock();

                  }, 700);
              }

              private void searchMove() {

                  if (!running) {
                      return;
                  }

                  long now =
                      System.currentTimeMillis();

                  if (now - lastSearchMove < 900) {
                      later(() -> scan(), 300);
                      return;
                  }

                  lastSearchMove = now;

                  searchStep++;

                  /*
                   * สำคัญ:
                   * ไม่เดินซ้ายค้าง
                   *
                   * 1 = ขวา
                   * -1 = ซ้าย
                   *
                   * สลับทิศทุกช่วง
                   */
                  if (searchStep % 2 == 0) {
                      searchDirection *= -1;
                  }

                  float joystickX =
                      screenW * 0.135f;

                  float joystickY =
                      screenH * 0.785f;

                  float distance =
                      Math.min(screenW, screenH) * 0.075f;

                  float endX =
                      joystickX +
                      (distance * searchDirection);

                  float endY =
                      joystickY;

                  service.setStatus(
                      searchDirection > 0
                      ? "SEARCH →"
                      : "SEARCH ←"
                  );

                  service.holdSwipe(
                      joystickX,
                      joystickY,
                      endX,
                      endY,
                      500
                  );

                  later(() -> {

                      if (!running) {
                          return;
                      }

                      openAutoLock();

                  }, 650);
              }

              private void tapRatio(
                  float xRatio,
                  float yRatio
              ) {

                  if (screenW <= 0 || screenH <= 0) {
                      return;
                  }

                  float x =
                      screenW * xRatio;

                  float y =
                      screenH * yRatio;

                  service.tap(x, y);
              }

              private static class Point {

                  final float x;
                  final float y;

                  Point(float x, float y) {
                      this.x = x;
                      this.y = y;
                  }
              }

              private static class Vision {

                  static Point findTarget(Bitmap bmp) {

                      int w = bmp.getWidth();
                      int h = bmp.getHeight();

                      if (w < 200 || h < 200) {
                          return null;
                      }

                      /*
                       * 1. หา marker ลูกศรสีขาว
                       */
                      Point arrow =
                          findWhiteTargetMarker(
                              bmp
                          );

                      if (arrow != null) {
                          return arrow;
                      }

                      /*
                       * 2. fallback:
                       * หา object สีสดที่ไม่ใช่
                       * ตัวละครตรงกลาง
                       */
                      return findColoredTarget(
                          bmp
                      );
                  }

                  private static Point findWhiteTargetMarker(
                      Bitmap bmp
                  ) {

                      int w = bmp.getWidth();
                      int h = bmp.getHeight();

                      int step =
                          Math.max(
                              2,
                              Math.min(w, h) / 420
                          );

                      boolean[][] visited =
                          new boolean[
                              (h + step - 1) / step
                          ][
                              (w + step - 1) / step
                          ];

                      ArrayList<Point> candidates =
                          new ArrayList<>();

                      for (int y = (int)(h * 0.18f);
                           y < (int)(h * 0.82f);
                           y += step) {

                          for (int x = (int)(w * 0.05f);
                               x < (int)(w * 0.95f);
                               x += step) {

                              int gx = x / step;
                              int gy = y / step;

                              if (gy >= visited.length ||
                                  gx >= visited[0].length) {
                                  continue;
                              }

                              if (visited[gy][gx]) {
                                  continue;
                              }

                              int c =
                                  bmp.getPixel(
                                      x,
                                      y
                                  );

                              if (!isBrightNeutral(c)) {
                                  visited[gy][gx] = true;
                                  continue;
                              }

                              Component comp =
                                  floodWhite(
                                      bmp,
                                      x,
                                      y,
                                      step,
                                      visited
                                  );

                              if (comp == null) {
                                  continue;
                              }

                              if (comp.area < 5 ||
                                  comp.area > 900) {
                                  continue;
                              }

                              int cw =
                                  comp.maxX -
                                  comp.minX + 1;

                              int ch =
                                  comp.maxY -
                                  comp.minY + 1;

                              if (cw < 3 ||
                                  cw > 70 ||
                                  ch < 3 ||
                                  ch > 55) {
                                  continue;
                              }

                              float ratio =
                                  cw /
                                  (float)ch;

                              if (ratio < 0.15f ||
                                  ratio > 4.0f) {
                                  continue;
                              }

                              if (comp.cx <
                                  w * 0.10f ||
                                  comp.cx >
                                  w * 0.90f) {
                                  continue;
                              }

                              if (comp.cy <
                                  h * 0.20f ||
                                  comp.cy >
                                  h * 0.78f) {
                                  continue;
                              }

                              /*
                               * ลูกศรเหนือ monster
                               * มักมีขนาดเล็กและหนาแน่น
                               */
                              float density =
                                  comp.area /
                                  (float)(cw * ch);

                              if (density < 0.12f) {
                                  continue;
                              }

                              candidates.add(
                                  new Point(
                                      comp.cx,
                                      comp.cy + ch * 1.2f
                                  )
                              );
                          }
                      }

                      if (candidates.isEmpty()) {
                          return null;
                      }

                      /*
                       * เลือก candidate ที่อยู่ใกล้
                       * บริเวณตัวละครมากที่สุด
                       */
                      float px = w * 0.50f;
                      float py = h * 0.47f;

                      Point best = null;
                      float bestDistance =
                          Float.MAX_VALUE;

                      for (Point p : candidates) {

                          float dx =
                              p.x - px;

                          float dy =
                              p.y - py;

                          float d =
                              dx * dx +
                              dy * dy;

                          /*
                           * ไม่เลือกตัวหนังสือ UI
                           * ที่อยู่ใกล้ขอบบน
                           */
                          if (p.y < h * 0.25f) {
                              continue;
                          }

                          if (d < bestDistance) {
                              bestDistance = d;
                              best = p;
                          }
                      }

                      return best;
                  }

                  private static Component floodWhite(
                      Bitmap bmp,
                      int sx,
                      int sy,
                      int step,
                      boolean[][] visited
                  ) {

                      int w = bmp.getWidth();
                      int h = bmp.getHeight();

                      ArrayList<int[]> queue =
                          new ArrayList<>();

                      queue.add(
                          new int[]{sx, sy}
                      );

                      int head = 0;

                      int area = 0;

                      int minX = sx;
                      int maxX = sx;
                      int minY = sy;
                      int maxY = sy;

                      float sumX = 0;
                      float sumY = 0;

                      while (
                          head < queue.size() &&
                          area < 1200
                      ) {

                          int[] p =
                              queue.get(head++);

                          int x = p[0];
                          int y = p[1];

                          int gx = x / step;
                          int gy = y / step;

                          if (gy < 0 ||
                              gy >= visited.length ||
                              gx < 0 ||
                              gx >= visited[0].length) {
                              continue;
                          }

                          if (visited[gy][gx]) {
                              continue;
                          }

                          visited[gy][gx] = true;

                          int c =
                              bmp.getPixel(
                                  Math.min(w - 1, x),
                                  Math.min(h - 1, y)
                              );

                          if (!isBrightNeutral(c)) {
                              continue;
                          }

                          area++;

                          sumX += x;
                          sumY += y;

                          minX =
                              Math.min(minX, x);

                          maxX =
                              Math.max(maxX, x);

                          minY =
                              Math.min(minY, y);

                          maxY =
                              Math.max(maxY, y);

                          queue.add(
                              new int[]{
                                  x + step,
                                  y
                              }
                          );

                          queue.add(
                              new int[]{
                                  x - step,
                                  y
                              }
                          );

                          queue.add(
                              new int[]{
                                  x,
                                  y + step
                              }
                          );

                          queue.add(
                              new int[]{
                                  x,
                                  y - step
                              }
                          );
                      }

                      if (area == 0) {
                          return null;
                      }

                      Component c =
                          new Component();

                      c.area = area;
                      c.minX = minX;
                      c.maxX = maxX;
                      c.minY = minY;
                      c.maxY = maxY;
                      c.cx = sumX / area;
                      c.cy = sumY / area;

                      return c;
                  }

                  private static boolean isBrightNeutral(
                      int color
                  ) {

                      int r =
                          Color.red(color);

                      int g =
                          Color.green(color);

                      int b =
                          Color.blue(color);

                      int max =
                          Math.max(
                              r,
                              Math.max(g, b)
                          );

                      int min =
                          Math.min(
                              r,
                              Math.min(g, b)
                          );

                      return
                          max >= 215 &&
                          (max - min) <= 45;
                  }

                  private static Point findColoredTarget(
                      Bitmap bmp
                  ) {

                      int w = bmp.getWidth();
                      int h = bmp.getHeight();

                      int step =
                          Math.max(
                              3,
                              Math.min(w, h) / 260
                          );

                      float px =
                          w * 0.50f;

                      float py =
                          h * 0.47f;

                      Point best = null;

                      float bestScore =
                          Float.MAX_VALUE;

                      for (
                          int y = (int)(h * 0.25f);
                          y < (int)(h * 0.80f);
                          y += step
                      ) {

                          for (
                              int x = (int)(w * 0.08f);
                              x < (int)(w * 0.92f);
                              x += step
                          ) {

                              /*
                               * ไม่เลือกบริเวณตัวละคร
                               */
                              if (
                                  Math.abs(x - px) <
                                  w * 0.08f &&
                                  Math.abs(y - py) <
                                  h * 0.12f
                              ) {
                                  continue;
                              }

                              int c =
                                  bmp.getPixel(
                                      x,
                                      y
                                  );

                              int r =
                                  Color.red(c);

                              int g =
                                  Color.green(c);

                              int b =
                                  Color.blue(c);

                              int max =
                                  Math.max(
                                      r,
                                      Math.max(g, b)
                                  );

                              int min =
                                  Math.min(
                                      r,
                                      Math.min(g, b)
                                  );

                              int saturation =
                                  max - min;

                              if (saturation < 65) {
                                  continue;
                              }

                              if (max < 95) {
                                  continue;
                              }

                              /*
                               * ให้ความสำคัญกับ
                               * object ขนาดเล็กที่อยู่
                               * ในสนาม
                               */
                              float dx =
                                  x - px;

                              float dy =
                                  y - py;

                              float distance =
                                  (float)Math.sqrt(
                                      dx * dx +
                                      dy * dy
                                  );

                              if (
                                  distance <
                                  w * 0.09f
                              ) {
                                  continue;
                              }

                              /*
                               * ไม่ให้ติดขอบ UI
                               */
                              if (
                                  y < h * 0.28f ||
                                  y > h * 0.78f
                              ) {
                                  continue;
                              }

                              float score =
                                  distance;

                              if (score <
                                  bestScore) {

                                  bestScore =
                                      score;

                                  best =
                                      new Point(
                                          x,
                                          y
                                      );
                              }
                          }
                      }

                      return best;
                  }

                  private static class Component {

                      int area;

                      int minX;
                      int maxX;

                      int minY;
                      int maxY;

                      float cx;
                      float cy;
                  }
              }
          }
