name: Build DustinBot Android V2

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Create Android project
        shell: bash
        run: |
          set -e

          mkdir -p app/src/main/java/com/dustinbot/v2
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/xml

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "DustinBotAndroidV2"
          include(":app")
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.6.1' apply false
          }
          EOF

          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.dustinbot.v2'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.dustinbot.v2'
                  minSdk 26
                  targetSdk 35
                  versionCode 20
                  versionName '2.0'
              }

              buildTypes {
                  release {
                      minifyEnabled false
                  }

                  debug {
                      minifyEnabled false
                  }
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }

          dependencies {
              implementation 'androidx.appcompat:appcompat:1.7.0'
              implementation 'com.google.android.material:material:1.12.0'
              implementation 'androidx.core:core:1.15.0'
          }
          EOF

          cat > app/src/main/res/values/strings.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="app_name">DustinBot Android V2</string>
              <string name="accessibility_description">DustinBot automation service</string>
          </resources>
          EOF

          cat > app/src/main/res/values/themes.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>

              <style name="Theme.DustinBot" parent="Theme.Material3.DayNight.NoActionBar">
                  <item name="android:fontFamily">sans</item>
                  <item name="android:windowLightStatusBar">false</item>
                  <item name="android:statusBarColor">#101820</item>
                  <item name="android:navigationBarColor">#101820</item>
              </style>

          </resources>
          EOF

          cat > app/src/main/res/xml/accessibility.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>

          <accessibility-service
              xmlns:android="http://schemas.android.com/apk/res/android"
              android:accessibilityEventTypes="typeAllMask"
              android:accessibilityFeedbackType="feedbackGeneric"
              android:accessibilityFlags="flagDefault"
              android:canRetrieveWindowContent="true"
              android:description="@string/accessibility_description"
              android:notificationTimeout="100"
              android:settingsActivity="com.dustinbot.v2.MainActivity" />
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>

          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW" />

              <application
                  android:allowBackup="true"
                  android:label="@string/app_name"
                  android:supportsRtl="true"
                  android:theme="@style/Theme.DustinBot">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>

                  </activity>

                  <service
                      android:name=".BotAccessibility"
                      android:exported="false"
                      android:label="@string/app_name"
                      android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE">

                      <intent-filter>
                          <action android:name="android.accessibilityservice.AccessibilityService" />
                      </intent-filter>

                      <meta-data
                          android:name="android.accessibilityservice"
                          android:resource="@xml/accessibility" />

                  </service>

              </application>

          </manifest>
          EOF

          cat > app/src/main/java/com/dustinbot/v2/SettingsStore.java <<'EOF'
          package com.dustinbot.v2;

          import android.content.Context;
          import android.content.SharedPreferences;

          public final class SettingsStore {

              private static final String PREF = "dustinbot_settings";

              private SettingsStore() {
              }

              private static SharedPreferences prefs(Context context) {
                  return context.getSharedPreferences(PREF, Context.MODE_PRIVATE);
              }

              public static void savePoint(
                      Context context,
                      String key,
                      float x,
                      float y
              ) {
                  prefs(context)
                          .edit()
                          .putFloat(key + "_x", x)
                          .putFloat(key + "_y", y)
                          .apply();
              }

              public static float getX(
                      Context context,
                      String key
              ) {
                  return prefs(context).getFloat(key + "_x", -1);
              }

              public static float getY(
                      Context context,
                      String key
              ) {
                  return prefs(context).getFloat(key + "_y", -1);
              }

              public static boolean hasPoint(
                      Context context,
                      String key
              ) {
                  return getX(context, key) >= 0
                          && getY(context, key) >= 0;
              }
          }
          EOF

          cat > app/src/main/java/com/dustinbot/v2/BotAccessibility.java <<'EOF'
          package com.dustinbot.v2;

          import android.accessibilityservice.AccessibilityService;
          import android.accessibilityservice.GestureDescription;
          import android.graphics.Path;
          import android.view.accessibility.AccessibilityEvent;

          public class BotAccessibility extends AccessibilityService {

              private static BotAccessibility instance;

              public static BotAccessibility getInstance() {
                  return instance;
              }

              @Override
              protected void onServiceConnected() {
                  super.onServiceConnected();
                  instance = this;
              }

              @Override
              public void onAccessibilityEvent(AccessibilityEvent event) {
                  // Game-state reading can be added later.
              }

              @Override
              public void onInterrupt() {
              }

              @Override
              public void onDestroy() {
                  if (instance == this) {
                      instance = null;
                  }
                  super.onDestroy();
              }

              public boolean tap(float x, float y) {
                  Path path = new Path();
                  path.moveTo(x, y);

                  GestureDescription.StrokeDescription stroke =
                          new GestureDescription.StrokeDescription(
                                  path,
                                  0,
                                  80
                          );

                  GestureDescription gesture =
                          new GestureDescription.Builder()
                                  .addStroke(stroke)
                                  .build();

                  return dispatchGesture(
                          gesture,
                          null,
                          null
                  );
              }

              public boolean swipe(
                      float x1,
                      float y1,
                      float x2,
                      float y2,
                      long duration
              ) {
                  Path path = new Path();

                  path.moveTo(x1, y1);
                  path.lineTo(x2, y2);

                  GestureDescription.StrokeDescription stroke =
                          new GestureDescription.StrokeDescription(
                                  path,
                                  0,
                                  duration
                          );

                  GestureDescription gesture =
                          new GestureDescription.Builder()
                                  .addStroke(stroke)
                                  .build();

                  return dispatchGesture(
                          gesture,
                          null,
                          null
                  );
              }
          }
          EOF

          cat > app/src/main/java/com/dustinbot/v2/Calibration.java <<'EOF'
          package com.dustinbot.v2;

          import android.app.Activity;
          import android.graphics.Color;
          import android.os.Bundle;
          import android.view.MotionEvent;
          import android.view.View;
          import android.widget.TextView;

          public class Calibration extends Activity {

              public static final String MODE_MOVE = "MOVE";
              public static final String MODE_ATTACK = "ATTACK";
              public static final String MODE_LOOT = "LOOT";

              private String mode;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  mode = getIntent().getStringExtra("mode");

                  TextView text = new TextView(this);

                  text.setText(
                          "DUSTINBOT CALIBRATION\n\n" +
                          "MODE: " + mode + "\n\n" +
                          "แตะตำแหน่งบนหน้าจอเกม\n" +
                          "เพื่อบันทึกตำแหน่ง\n\n" +
                          "แตะ BACK เพื่อออก"
                  );

                  text.setTextColor(Color.WHITE);
                  text.setTextSize(20);
                  text.setGravity(17);
                  text.setBackgroundColor(Color.argb(220, 10, 20, 30));

                  text.setOnTouchListener(
                          new View.OnTouchListener() {
                              @Override
                              public boolean onTouch(
                                      View v,
                                      MotionEvent event
                              ) {
                                  if (event.getAction()
                                          == MotionEvent.ACTION_UP) {

                                      String key = mode;

                                      SettingsStore.savePoint(
                                              Calibration.this,
                                              key,
                                              event.getRawX(),
                                              event.getRawY()
                                      );

                                      text.setText(
                                              "SAVED\n\n" +
                                              "MODE: " + mode + "\n\n" +
                                              "X = " + event.getRawX() +
                                              "\n" +
                                              "Y = " + event.getRawY() +
                                              "\n\n" +
                                              "กด Back เพื่อกลับ"
                                      );

                                      return true;
                                  }

                                  return true;
                              }
                          }
                  );

                  setContentView(text);
              }
          }
          EOF

          cat > app/src/main/java/com/dustinbot/v2/BotEngine.java <<'EOF'
          package com.dustinbot.v2;

          import android.content.Context;
          import android.os.Handler;
          import android.os.Looper;

          public class BotEngine {

              public interface Listener {
                  void onState(String state);
                  void onConsole(String message);
              }

              private final Context context;
              private final Listener listener;
              private final Handler handler =
                      new Handler(Looper.getMainLooper());

              private boolean running = false;
              private boolean directionRight = true;

              public BotEngine(
                      Context context,
                      Listener listener
              ) {
                  this.context = context.getApplicationContext();
                  this.listener = listener;
              }

              public boolean isRunning() {
                  return running;
              }

              public void start() {

                  if (!SettingsStore.hasPoint(
                          context,
                          Calibration.MODE_MOVE)) {

                      listener.onConsole(
                              "MOVE ยังไม่ได้ตั้งค่า"
                      );

                      return;
                  }

                  if (!SettingsStore.hasPoint(
                          context,
                          Calibration.MODE_ATTACK)) {

                      listener.onConsole(
                              "ATTACK ยังไม่ได้ตั้งค่า"
                      );

                      return;
                  }

                  if (!SettingsStore.hasPoint(
                          context,
                          Calibration.MODE_LOOT)) {

                      listener.onConsole(
                              "LOOT ยังไม่ได้ตั้งค่า"
                      );

                      return;
                  }

                  if (BotAccessibility.getInstance()
                          == null) {

                      listener.onConsole(
                              "Accessibility Service ยังไม่ทำงาน"
                      );

                      return;
                  }

                  running = true;

                  listener.onConsole(
                          "BOT START"
                  );

                  loop();
              }

              public void stop() {

                  running = false;

                  handler.removeCallbacksAndMessages(null);

                  listener.onState("STOP");
                  listener.onConsole("BOT STOP");
              }

              private void loop() {

                  if (!running) {
                      return;
                  }

                  walk();

                  handler.postDelayed(
                          new Runnable() {
                              @Override
                              public void run() {

                                  if (!running) {
                                      return;
                                  }

                                  attack();

                                  handler.postDelayed(
                                          new Runnable() {
                                              @Override
                                              public void run() {

                                                  if (!running) {
                                                      return;
                                                  }

                                                  loot();

                                                  handler.postDelayed(
                                                          new Runnable() {
                                                              @Override
                                                              public void run() {
                                                                  loop();
                                                              }
                                                          },
                                                          900
                                                  );
                                              }
                                          },
                                          1000
                                  );
                              }
                          },
                          1800
                  );
              }

              private void walk() {

                  BotAccessibility service =
                          BotAccessibility.getInstance();

                  if (service == null) {
                      return;
                  }

                  listener.onState("WALK");

                  float x =
                          SettingsStore.getX(
                                  context,
                                  Calibration.MODE_MOVE
                          );

                  float y =
                          SettingsStore.getY(
                                  context,
                                  Calibration.MODE_MOVE
                          );

                  float x2 =
                          directionRight
                                  ? x + 220
                                  : x - 220;

                  service.swipe(
                          x,
                          y,
                          x2,
                          y,
                          1200
                  );

                  directionRight = !directionRight;
              }

              private void attack() {

                  BotAccessibility service =
                          BotAccessibility.getInstance();

                  if (service == null) {
                      return;
                  }

                  listener.onState("ATTACK");

                  float x =
                          SettingsStore.getX(
                                  context,
                                  Calibration.MODE_ATTACK
                          );

                  float y =
                          SettingsStore.getY(
                                  context,
                                  Calibration.MODE_ATTACK
                          );

                  for (int i = 0; i < 5; i++) {

                      final int index = i;

                      handler.postDelayed(
                              new Runnable() {
                                  @Override
                                  public void run() {

                                      if (running) {

                                          BotAccessibility current =
                                                  BotAccessibility
                                                          .getInstance();

                                          if (current != null) {
                                              current.tap(x, y);
                                          }
                                      }
                                  }
                              },
                              index * 220L
                      );
                  }
              }

              private void loot() {

                  BotAccessibility service =
                          BotAccessibility.getInstance();

                  if (service == null) {
                      return;
                  }

                  listener.onState("LOOT");

                  float x =
                          SettingsStore.getX(
                                  context,
                                  Calibration.MODE_LOOT
                          );

                  float y =
                          SettingsStore.getY(
                                  context,
                                  Calibration.MODE_LOOT
                          );

                  service.tap(x, y);
              }
          }
          EOF

          cat > app/src/main/java/com/dustinbot/v2/MapPanel.java <<'EOF'
          package com.dustinbot.v2;

