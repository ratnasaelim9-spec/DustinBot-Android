package com.dustinbot.v93;

import android.graphics.Bitmap;

import android.os.Handler;
import android.os.Looper;

import java.util.Random;

public class BotEngine {

    private final BotAccessibility
        service;

    private final Handler
        handler =
            new Handler(
                Looper.getMainLooper()
            );

    private final Random
        random =
            new Random();

    private boolean
        running =
            false;

    private int
        W =
            1842;

    private int
        H =
            832;

    private int
        lastDirection =
            -1;

    private int
        attackCount =
            0;

    private int
        lootCount =
            0;

    /*
     * -------------------------------
     * GAME BUTTONS
     * -------------------------------
     */

    /*
     * ปุ่มเมนูด้านขวาบน
     */

    private static final float
        MENU_X =
            0.755f;

    private static final float
        MENU_Y =
            0.075f;

    /*
     * ปุ่ม "ล็อคเป้าอัตโนมัติ"
     */

    private static final float
        AUTO_LOCK_X =
            0.755f;

    private static final float
        AUTO_LOCK_Y =
            0.155f;

    /*
     * ปุ่มดาบ
     */

    private static final float
        ATTACK_X =
            0.850f;

    private static final float
        ATTACK_Y =
            0.815f;

    /*
     * ปุ่มเก็บของ
     */

    private static final float
        LOOT_X =
            0.850f;

    private static final float
        LOOT_Y =
            0.915f;

    /*
     * Joystick
     */

    private static final float
        JOY_X =
            0.135f;

    private static final float
        JOY_Y =
            0.790f;

    /*
     * -------------------------------
     * CONSTRUCTOR
     * -------------------------------
     */

    public BotEngine(
        BotAccessibility service
    ) {

        this.service =
            service;
    }

    /*
     * -------------------------------
     * START
     * -------------------------------
     */

    public void start() {

        if (running) {
            return;
        }

        running =
            true;

        attackCount =
            0;

        lootCount =
            0;

        lastDirection =
            -1;

        /*
         * เปิด Auto Lock
         */

        later(
            this::openMenu,
            500
        );
    }

    /*
     * -------------------------------
     * STOP
     * -------------------------------
     */

    public void stop() {

        running =
            false;

        handler.removeCallbacksAndMessages(
            null
        );
    }

    /*
     * -------------------------------
     * AUTO LOCK
     * -------------------------------
     */

    private void openMenu() {

        if (!running) {
            return;
        }

        /*
         * เปิดเมนูเกม
         */

        service.tap(
            W * MENU_X,
            H * MENU_Y
        );

        later(
            this::enableAutoLock,
            350
        );
    }

    private void enableAutoLock() {

        if (!running) {
            return;
        }

        /*
         * ล็อคเป้าอัตโนมัติ
         */

        service.tap(
            W * AUTO_LOCK_X,
            H * AUTO_LOCK_Y
        );

        /*
         * รอเกมทำงาน
         */

        later(
            this::beginSearch,
            700
        );
    }

    /*
     * -------------------------------
     * SEARCH
     * -------------------------------
     */

    private void beginSearch() {

        if (!running) {
            return;
        }

        /*
         * เดินสุ่มก่อน
         *
         * Auto Lock ของเกมจะช่วย
         * หา Monster ที่อยู่ในระยะ
         */

        randomWalk();
    }

    /*
     * -------------------------------
     * RANDOM WALK
     * -------------------------------
     */

    private void randomWalk() {

        if (!running) {
            return;
        }

        int direction;

        do {

            direction =
                random.nextInt(8);

        } while (
            direction ==
                lastDirection
            &&
            random.nextBoolean()
        );

        lastDirection =
            direction;

        /*
         * 8 ทิศ
         */

        float[][] directions = {

            /*
             * 0
             * ขึ้น
             */

            {
                0f,
                -1f
            },

            /*
             * 1
             * ขึ้นขวา
             */

            {
                0.707f,
                -0.707f
            },

            /*
             * 2
             * ขวา
             */

            {
                1f,
                0f
            },

            /*
             * 3
             * ลงขวา
             */

            {
                0.707f,
                0.707f
            },

            /*
             * 4
             * ลง
             */

            {
                0f,
                1f
            },

            /*
             * 5
             * ลงซ้าย
             */

            {
                -0.707f,
                0.707f
            },

            /*
             * 6
             * ซ้าย
             */

            {
                -1f,
                0f
            },

            /*
             * 7
             * ขึ้นซ้าย
             */

            {
                -0.707f,
                -0.707f
            }
        };

        float dx =
            directions[direction][0];

        float dy =
            directions[direction][1];

        long duration =
            650 +
            random.nextInt(
                900
            );

        /*
         * เดิน
         */

        joystick(
            dx,
            dy,
            duration
        );

        /*
         * หลังจากเดิน
         * ให้พยายามโจมตีทันที
         */

        later(
            this::combat,
            duration + 350
        );
    }

    /*
     * -------------------------------
     * COMBAT
     * -------------------------------
     *
     * จุดสำคัญของ V9.3:
     *
     * ไม่รอ Vision หา Monster
     *
     * Auto Lock ของเกมเป็นคนเลือก Monster
     *
     * บอทกดปุ่มดาบเอง
     */

    private void combat() {

        if (!running) {
            return;
        }

        attackCount =
            0;

        attackStep();
    }

    private void attackStep() {

        if (!running) {
            return;
        }

        attackCount++;

        /*
         * กดปุ่มดาบ
         */

        service.tap(
            W * ATTACK_X,
            H * ATTACK_Y
        );

        /*
         * โจมตีต่อเนื่อง
         */

        if (
            attackCount <
            6
        ) {

            later(
                this::attackStep,
                450
            );

            return;
        }

        /*
         * จบชุดโจมตี
         */

        attackCount =
            0;

        /*
         * ไปเก็บของ
         */

        later(
            this::startLoot,
            500
        );
    }

    /*
     * -------------------------------
     * LOOT
     * -------------------------------
     */

    private void startLoot() {

        if (!running) {
            return;
        }

        lootCount =
            0;

        lootStep();
    }

    private void lootStep() {

        if (!running) {
            return;
        }

        lootCount++;

        /*
         * กดเก็บของ
         */

        service.tap(
            W * LOOT_X,
            H * LOOT_Y
        );

        /*
         * ขยับรอบตัว
         */

        float dx =
            0f;

        float dy =
            0f;

        switch (
            lootCount % 4
        ) {

            case 0:

                dx =
                    1f;

                break;

            case 1:

                dy =
                    1f;

                break;

            case 2:

                dx =
                    -1f;

                break;

            case 3:

                dy =
                    -1f;

                break;
        }

        joystick(
            dx,
            dy,
            150
        );

        /*
         * เก็บหลายครั้ง
         */

        if (
            lootCount <
            6
        ) {

            later(
                this::lootStep,
                300
            );

            return;
        }

        /*
         * จบการเก็บ
         */

        lootCount =
            0;

        /*
         * เปิด Auto Lock ใหม่
         * แล้วหา Monster ต่อ
         */

        later(
            this::refreshAutoLock,
            500
        );
    }

    /*
     * -------------------------------
     * REFRESH AUTO LOCK
     * -------------------------------
     */

    private void refreshAutoLock() {

        if (!running) {
            return;
        }

        /*
         * เปิดเมนู
         */

        service.tap(
            W * MENU_X,
            H * MENU_Y
        );

        later(
            () -> {

                if (!running) {
                    return;
                }

                /*
                 * เปิด Auto Lock
                 */

                service.tap(
                    W * AUTO_LOCK_X,
                    H * AUTO_LOCK_Y
                );

                /*
                 * เดินหา Monster ใหม่
                 */

                later(
                    this::randomWalk,
                    450
                );

            },
            300
        );
    }

    /*
     * -------------------------------
     * JOYSTICK
     * -------------------------------
     */

    private void joystick(
        float dx,
        float dy,
        long duration
    ) {

        if (!running) {
            return;
        }

        float centerX =
            W * JOY_X;

        float centerY =
            H * JOY_Y;

        float radius =
            Math.min(
                W,
                H
            ) * 0.105f;

        float endX =
            centerX +
            dx * radius;

        float endY =
            centerY +
            dy * radius;

        /*
         * กด joystick
         */

        service.swipe(
            centerX,
            centerY,
            endX,
            endY,
            duration
        );

        /*
         * ปล่อย joystick
         */

        later(
            () -> {

                if (!running) {
                    return;
                }

                service.tap(
                    centerX,
                    centerY
                );

            },
            duration + 60
        );
    }

    /*
     * -------------------------------
     * TIMER
     * -------------------------------
     */

    private void later(
        Runnable runnable,
        long delay
    ) {

        if (
            runnable == null
        ) {

            return;
        }

        handler.postDelayed(
            runnable,
            delay
        );
    }
}
