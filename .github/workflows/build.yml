name: Dustin Bot V11 - Smart Move

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Create Android project
        shell: bash
        run: |
          set -e

          rm -rf app

          mkdir -p app/src/main/java/com/dustinbot/v11
          mkdir -p app/src/main/res/xml
          mkdir -p app/src/main/res/values

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "DustinBotV11"
          include(":app")
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.6.1' apply false
          }
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.dustinbot.v11'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.dustinbot.v11'
                  minSdk 30
                  targetSdk 35
                  versionCode 11
                  versionName '11.0'
              }
          }
          EOF

          cat > app/src/main/res/values/strings.xml <<'EOF'
          <resources>
              <string name="app_name">Dustin Bot V11</string>
              <string name="accessibility_description">
                  Dustin Bot V11 screen automation
              </string>
          </resources>
          EOF

          cat > app/src/main/res/values/styles.xml <<'EOF'
          <resources>

              <style name="AppTheme"
                  parent="@android:style/Theme.Material.NoActionBar">

                  <item name="android:fontFamily">sans</item>
                  <item name="android:windowLightStatusBar">false</item>
                  <item name="android:statusBarColor">#101010</item>
                  <item name="android:navigationBarColor">#101010</item>
                  <item name="android:colorAccent">#00E676</item>

              </style>

          </resources>
          EOF

          cat > app/src/main/res/xml/accessibility_service_config.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>

          <accessibility-service
              xmlns:android="http://schemas.android.com/apk/res/android"
              android:accessibilityEventTypes="typeAllMask"
              android:accessibilityFeedbackType="feedbackGeneric"
              android:notificationTimeout="100"
              android:canRetrieveWindowContent="true"
              android:canPerformGestures="true"
              android:canTakeScreenshot="true"
              android:description="@string/accessibility_description" />
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>

          <manifest
              xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission
                  android:name="android.permission.SYSTEM_ALERT_WINDOW" />

              <application
                  android:allowBackup="false"
                  android:label="@string/app_name"
                  android:theme="@style/AppTheme">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>

                  </activity>

                  <service
                      android:name=".BotAccessibility"
                      android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE"
                      android:exported="false">

                      <intent-filter>
                          <action android:name="android.accessibilityservice.AccessibilityService" />
                      </intent-filter>

                      <meta-data
                          android:name="android.accessibilityservice"
                          android:resource="@xml/accessibility_service_config" />

                  </service>

              </application>

          </manifest>
          EOF

          cat > app/src/main/java/com/dustinbot/v11/MainActivity.java <<'EOF'
          package com.dustinbot.v11;

          import android.app.Activity;
          import android.content.Intent;
          import android.graphics.Color;
          import android.os.Bundle;
          import android.provider.Settings;
          import android.view.Gravity;
          import android.widget.Button;
          import android.widget.LinearLayout;
          import android.widget.TextView;

          public class MainActivity extends Activity {

              @Override
              protected void onCreate(Bundle b) {
                  super.onCreate(b);

                  LinearLayout root = new LinearLayout(this);
                  root.setOrientation(LinearLayout.VERTICAL);
                  root.setPadding(30, 40, 30, 30);
                  root.setGravity(Gravity.CENTER_HORIZONTAL);
                  root.setBackgroundColor(Color.rgb(15,15,15));

                  TextView title = new TextView(this);
                  title.setText("DUSTIN BOT V11");
                  title.setTextColor(Color.WHITE);
                  title.setTextSize(26);
                  title.setGravity(Gravity.CENTER);

                  root.addView(title);

                  TextView info = new TextView(this);
                  info.setText(
                      "\nSMART AUTO BOT\n\n" +
                      "AUTO LOCK\n" +
                      "TARGET CONFIRM\n" +
                      "SMART MOVE\n" +
                      "STUCK RECOVERY\n" +
                      "AUTO ATTACK\n" +
                      "AUTO SEARCH\n"
                  );

                  info.setTextColor(Color.LTGRAY);
                  info.setTextSize(16);
                  root.addView(info);

                  Button accessibility = new Button(this);
                  accessibility.setText("เปิด Accessibility");
                  root.addView(accessibility);

                  accessibility.setOnClickListener(v -> {
                      startActivity(
                          new Intent(
                              Settings.ACTION_ACCESSIBILITY_SETTINGS
                          )
                      );
                  });

                  Button panel = new Button(this);
                  panel.setText("เปิดแผง BOT");
                  root.addView(panel);

                  panel.setOnClickListener(v -> {
                      BotAccessibility.showPanel();
                  });

                  setContentView(root);
              }
          }
          EOF

          cat > app/src/main/java/com/dustinbot/v11/BotAccessibility.java <<'EOF'
          package com.dustinbot.v11;

          import android.accessibilityservice.AccessibilityService;
          import android.accessibilityservice.GestureDescription;
          import android.graphics.Bitmap;
          import android.graphics.Path;
          import android.graphics.PixelFormat;
          import android.hardware.HardwareBuffer;
          import android.os.Handler;
          import android.os.Looper;
          import android.view.Gravity;
          import android.view.WindowManager;
          import android.widget.Button;
          import android.widget.LinearLayout;
          import android.widget.TextView;

          public class BotAccessibility extends AccessibilityService {

              private static BotAccessibility instance;

              private WindowManager wm;
              private LinearLayout panel;
              private TextView status;

              private BotEngine engine;

              public static void showPanel() {

                  if (instance != null) {
                      instance.createPanel();
                  }
              }

              @Override
              protected void onServiceConnected() {

                  super.onServiceConnected();

                  instance = this;
                  engine = new BotEngine(this);
              }

              @Override
              public void onAccessibilityEvent(
                      android.view.accessibility.AccessibilityEvent event) {
              }

              @Override
              public void onInterrupt() {

                  if (engine != null) {
                      engine.stop();
                  }
              }

              @Override
              public void onDestroy() {

                  if (engine != null) {
                      engine.stop();
                  }

                  if (panel != null && wm != null) {

                      try {
                          wm.removeView(panel);
                      } catch (Exception ignored) {
                      }
                  }

                  instance = null;

                  super.onDestroy();
              }

              private void createPanel() {

                  if (panel != null) {
                      return;
                  }

                  wm = (WindowManager)
                      getSystemService(WINDOW_SERVICE);

                  panel = new LinearLayout(this);
                  panel.setOrientation(LinearLayout.VERTICAL);
                  panel.setPadding(14, 10, 14, 10);
                  panel.setBackgroundColor(0xDD111111);

                  status = new TextView(this);
                  status.setText("DUSTIN BOT V11\nSTOP");
                  status.setTextColor(0xFFFFFFFF);
                  status.setTextSize(12);

                  panel.addView(status);

                  LinearLayout row =
                      new LinearLayout(this);

                  Button start = new Button(this);
                  start.setText("START");

                  Button stop = new Button(this);
                  stop.setText("STOP");

                  Button hide = new Button(this);
                  hide.setText("HIDE");

                  row.addView(start);
                  row.addView(stop);
                  row.addView(hide);

                  panel.addView(row);

                  start.setOnClickListener(v -> {
                      if (engine != null) {
                          engine.start();
                      }
                  });

                  stop.setOnClickListener(v -> {
                      if (engine != null) {
                          engine.stop();
                      }
                  });

                  hide.setOnClickListener(v -> {

                      try {
                          wm.removeView(panel);
                      } catch (Exception ignored) {
                      }

                      panel = null;
                  });

                  WindowManager.LayoutParams lp =
                      new WindowManager.LayoutParams();

                  lp.width =
                      WindowManager.LayoutParams.WRAP_CONTENT;

                  lp.height =
                      WindowManager.LayoutParams.WRAP_CONTENT;

                  lp.gravity =
                      Gravity.TOP | Gravity.RIGHT;

                  lp.x = 10;
                  lp.y = 70;

                  lp.type =
                      WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY;

                  lp.flags =
                      WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE;

                  lp.format =
                      PixelFormat.TRANSLUCENT;

                  wm.addView(panel, lp);
              }

              public void state(String s) {

                  new Handler(
                      Looper.getMainLooper()
                  ).post(() -> {

                      if (status != null) {
                          status.setText(
                              "DUSTIN BOT V11\n" + s
                          );
                      }

                  });
              }

              public void tap(float x, float y) {

                  Path path = new Path();
                  path.moveTo(x, y);

                  GestureDescription gesture =
                      new GestureDescription.Builder()
                          .addStroke(
                              new GestureDescription.StrokeDescription(
                                  path,
                                  0,
                                  70
                              )
                          )
                          .build();

                  dispatchGesture(
                      gesture,
                      null,
                      null
                  );
              }

              public void swipe(
                      float x1,
                      float y1,
                      float x2,
                      float y2,
                      long duration) {

                  Path path = new Path();

                  path.moveTo(x1, y1);
                  path.lineTo(x2, y2);

                  GestureDescription gesture =
                      new GestureDescription.Builder()
                          .addStroke(
                              new GestureDescription.StrokeDescription(
                                  path,
                                  0,
                                  duration
                              )
                          )
                          .build();

                  dispatchGesture(
                      gesture,
                      null,
                      null
                  );
              }

              public void screenshot(
                      BotEngine.ScreenCallback callback) {

                  takeScreenshot(
                      android.view.Display.DEFAULT_DISPLAY,
                      getMainExecutor(),
                      new TakeScreenshotCallback() {

                          @Override
                          public void onSuccess(
                                  ScreenshotResult result) {

                              HardwareBuffer buffer =
                                  result.getHardwareBuffer();

                              if (buffer == null) {
                                  callback.onBitmap(null);
                                  return;
                              }

                              Bitmap b =
                                  Bitmap.wrapHardwareBuffer(
                                      buffer,
                                      result.getColorSpace()
                                  );

                              Bitmap copy = null;

                              if (b != null) {

                                  copy =
                                      b.copy(
                                          Bitmap.Config.ARGB_8888,
                                          false
                                      );

                                  b.recycle();
                              }

                              buffer.close();

                              callback.onBitmap(copy);
                          }

                          @Override
                          public void onFailure(
                                  int errorCode) {

                              callback.onBitmap(null);
                          }
                      }
                  );
              }
          }
          EOF

          cat > app/src/main/java/com/dustinbot/v11/Vision.java <<'EOF'
          package com.dustinbot.v11;

          import android.graphics.Bitmap;
          import android.graphics.Color;

          public class Vision {

              public static class Target {

                  public float x;
                  public float y;
                  public float confidence;

                  public Target(
                          float x,
                          float y,
                          float confidence) {

                      this.x = x;
                      this.y = y;
                      this.confidence = confidence;
                  }
              }

              /*
               * IMPORTANT:
               *
               * V10 accepted almost any bright area.
               *
               * V11 requires a small compact marker AND
               * local contrast AND a stable position.
               */

              public static Target findMarker(Bitmap b) {

                  if (b == null) {
                      return null;
                  }

                  int w = b.getWidth();
                  int h = b.getHeight();

                  int left = (int)(w * 0.25f);
                  int right = (int)(w * 0.82f);

                  int top = (int)(h * 0.12f);
                  int bottom = (int)(h * 0.67f);

                  Target best = null;

                  double bestScore = 0;

                  for (
                      int y = top;
                      y < bottom;
                      y += 5
                  ) {

                      for (
                          int x = left;
                          x < right;
                          x += 5
                      ) {

                          int bright = 0;
                          int dark = 0;
                          int total = 0;

                          for (
                              int yy = -8;
                              yy <= 8;
                              yy += 2
                          ) {

                              for (
                                  int xx = -10;
                                  xx <= 10;
                                  xx += 2
                              ) {

                                  int px = x + xx;
                                  int py = y + yy;

                                  if (
                                      px < 0 ||
                                      py < 0 ||
                                      px >= w ||
                                      py >= h
                                  ) {
                                      continue;
                                  }

                                  int c =
                                      b.getPixel(px, py);

                                  int r =
                                      Color.red(c);

                                  int g =
                                      Color.green(c);

                                  int bl =
                                      Color.blue(c);

                                  int max =
                                      Math.max(
                                          r,
                                          Math.max(g, bl)
                                      );

                                  int min =
                                      Math.min(
                                          r,
                                          Math.min(g, bl)
                                      );

                                  if (
                                      min > 185 &&
                                      max - min < 45
                                  ) {
                                      bright++;
                                  }

                                  if (max < 90) {
                                      dark++;
                                  }

                                  total++;
                              }
                          }

                          if (total == 0) {
                              continue;
                          }

                          float br =
                              (float)bright / total;

                          float dr =
                              (float)dark / total;

                          /*
                           * Reject huge bright terrain.
                           */

                          if (
                              br < 0.18f ||
                              br > 0.68f
                          ) {
                              continue;
                          }

                          /*
                           * A marker should have some
                           * contrast around it.
                           */

                          if (dr < 0.04f) {
                              continue;
                          }

                          /*
                           * Look below marker.
                           */

                          int lowerColorChanges = 0;

                          for (
                              int yy = 10;
                              yy <= 32;
                              yy += 4
                          ) {

                              int previous = -1;

                              for (
                                  int xx = -12;
                                  xx <= 12;
                                  xx += 4
                              ) {

                                  int px = x + xx;
                                  int py = y + yy;

                                  if (
                                      px < 0 ||
                                      py < 0 ||
                                      px >= w ||
                                      py >= h
                                  ) {
                                      continue;
                                  }

                                  int c =
                                      b.getPixel(px, py);

                                  int v =
                                      (
                                          Color.red(c)
                                          +
                                          Color.green(c)
                                          +
                                          Color.blue(c)
                                      ) / 3;

                                  if (
                                      previous >= 0 &&
                                      Math.abs(v - previous) > 35
                                  ) {
                                      lowerColorChanges++;
                                  }

                                  previous = v;
                              }
                          }

                          if (lowerColorChanges < 2) {
                              continue;
                          }

                          double score =
                              br * 50
                              +
                              dr * 80
                              +
                              lowerColorChanges * 2;

                          if (score > bestScore) {

                              bestScore = score;

                              /*
                               * Monster is below marker.
                               */

                              best =
                                  new Target(
                                      x,
                                      Math.min(
                                          y + 35,
                                          bottom
                                      ),
                                      (float)score
                                  );
                          }
                      }
                  }

                  if (
                      best == null ||
                      best.confidence < 20
                  ) {
                      return null;
                  }

                  return best;
              }

              public static double difference(
                      Bitmap a,
                      Bitmap b) {

                  if (a == null || b == null) {
                      return 0;
                  }

                  int w =
                      Math.min(
                          a.getWidth(),
                          b.getWidth()
                      );

                  int h =
                      Math.min(
                          a.getHeight(),
                          b.getHeight()
                      );

                  long total = 0;
                  long count = 0;

                  for (
                      int y = (int)(h * 0.18f);
                      y < (int)(h * 0.75f);
                      y += 16
                  ) {

                      for (
                          int x = (int)(w * 0.10f);
                          x < (int)(w * 0.90f);
                          x += 16
                      ) {

                          int ca =
                              a.getPixel(x, y);

                          int cb =
                              b.getPixel(x, y);

                          total +=
                              Math.abs(
                                  Color.red(ca)
                                  -
                                  Color.red(cb)
                              );

                          total +=
                              Math.abs(
                                  Color.green(ca)
                                  -
                                  Color.green(cb)
                              );

                          total +=
                              Math.abs(
                                  Color.blue(ca)
                                  -
                                  Color.blue(cb)
                              );

                          count += 3;
                      }
                  }

                  if (count == 0) {
                      return 0;
                  }

                  return (double)total / count;
              }
          }
          EOF

          cat > app/src/main/java/com/dustinbot/v11/BotEngine.java <<'EOF'
          package com.dustinbot.v11;

          import android.graphics.Bitmap;
          import android.os.Handler;
          import android.os.Looper;

          public class BotEngine {

              public interface ScreenCallback {
                  void onBitmap(Bitmap bitmap);
              }

              private final BotAccessibility service;

              private final Handler handler =
                  new Handler(Looper.getMainLooper());

              private boolean running = false;

              /*
               * Game screenshot coordinates are treated
               * as 1842 x 832 landscape.
               */

              private static final int W = 1842;
              private static final int H = 832;

              /*
               * Joystick.
               */

              private static final float JOY_X = 0.138f;
              private static final float JOY_Y = 0.785f;

              /*
               * Attack.
               */

              private static final float ATTACK_X = 0.850f;
              private static final float ATTACK_Y = 0.815f;

              /*
               * Loot.
               */

              private static final float LOOT_X = 0.965f;
              private static final float LOOT_Y = 0.840f;

              /*
               * Camera/player center.
               */

              private static final float PLAYER_X = 0.50f;
              private static final float PLAYER_Y = 0.47f;

              /*
               * State.
               */

              private enum State {

                  SEARCH,
                  CONFIRM,
                  MOVE,
                  ATTACK,
                  RECOVER
              }

              private State state =
                  State.SEARCH;

              /*
               * Target confirmation.
               */

              private Vision.Target confirmedTarget;

              private int confirmCount = 0;

              /*
               * Search direction.
               *
               * 0 = right
               * 1 = down-right
               * 2 = down
               * 3 = down-left
               * 4 = left
               * 5 = up-left
               * 6 = up
               * 7 = up-right
               */

              private int searchDirection = 0;

              private int searchStep = 0;

              /*
               * Stuck protection.
               */

              private int stuckCount = 0;

              private int moveCount = 0;

              private long lastMoveTime = 0;

              private Bitmap beforeMove = null;

              /*
               * Attack.
               */

              private int attackTry = 0;

              private Bitmap beforeAttack = null;

              public BotEngine(
                      BotAccessibility service) {

                  this.service = service;
              }

              public void start() {

                  if (running) {
                      return;
                  }

                  running = true;

                  state = State.SEARCH;

                  confirmedTarget = null;

                  confirmCount = 0;

                  searchStep = 0;

                  stuckCount = 0;

                  moveCount = 0;

                  attackTry = 0;

                  service.state(
                      "START\nSEARCH"
                  );

                  handler.postDelayed(
                      this::autoLock,
                      500
                  );
              }

              public void stop() {

                  running = false;

                  handler.removeCallbacksAndMessages(
                      null
                  );

                  recycle(beforeMove);
                  recycle(beforeAttack);

                  beforeMove = null;
                  beforeAttack = null;

                  service.state("STOP");
              }

              /*
               * Open the target menu.
               */

              private void autoLock() {

                  if (!running) {
                      return;
                  }

                  state = State.SEARCH;

                  service.state(
                      "AUTO LOCK"
                  );

                  service.tap(
                      W * 0.755f,
                      H * 0.075f
                  );

                  handler.postDelayed(
                      this::selectAutoLock,
                      300
                  );
              }

              private void selectAutoLock() {

                  if (!running) {
                      return;
                  }

                  /*
                   * Only AUTO LOCK.
                   *
                   * Never use FOLLOW.
                   */

                  service.tap(
                      W * 0.755f,
                      H * 0.155f
                  );

                  handler.postDelayed(
                      this::scan,
                      700
                  );
              }

              private void scan() {

                  if (!running) {
                      return;
                  }

                  state = State.SEARCH;

                  service.screenshot(
                      bitmap -> {

                          if (!running) {
                              recycle(bitmap);
                              return;
                          }

                          if (bitmap == null) {

                              later(
                                  this::scan,
                                  400
                              );

                              return;
                          }

                          Vision.Target t =
                              Vision.findMarker(bitmap);

                          recycle(bitmap);

                          if (t == null) {

                              confirmCount = 0;

                              search();

                              return;
                          }

                          /*
                           * Do NOT immediately move.
                           *
                           * Require stable target.
                           */

                          confirmTarget(t);
                      }
                  );
              }

              private void confirmTarget(
                      Vision.Target t) {

                  if (!running) {
                      return;
                  }

                  state = State.CONFIRM;

                  if (confirmedTarget == null) {

                      confirmedTarget = t;
                      confirmCount = 1;

                  } else {

                      float dx =
                          Math.abs(
                              confirmedTarget.x - t.x
                          );

                      float dy =
                          Math.abs(
                              confirmedTarget.y - t.y
                          );

                      /*
                       * Same target must remain near
                       * previous position.
                       */

                      if (
                          dx < W * 0.055f &&
                          dy < H * 0.055f
                      ) {

                          confirmedTarget =
                              new Vision.Target(
                                  (
                                      confirmedTarget.x
                                      + t.x
                                  ) / 2,
                                  (
                                      confirmedTarget.y
                                      + t.y
                                  ) / 2,
                                  Math.max(
                                      confirmedTarget.confidence,
                                      t.confidence
                                  )
                              );

                          confirmCount++;

                      } else {

                          confirmedTarget = t;
                          confirmCount = 1;
                      }
                  }

                  service.state(
                      "TARGET CONFIRM "
                      + confirmCount
                  );

                  if (confirmCount >= 3) {

                      moveCount = 0;
                      stuckCount = 0;

                      moveToTarget(
                          confirmedTarget
                      );

                      return;
                  }

                  later(
                      this::scan,
                      180
                  );
              }

              /*
               * Search mode.
               *
               * Short movement pulses only.
               */

              private void search() {

                  if (!running) {
                      return;
                  }

                  service.state(
                      "SEARCH MOVE "
                      + searchDirection
                  );

                  float[] dir =
                      direction(searchDirection);

                  joystickPulse(
                      dir[0],
                      dir[1],
                      260
                  );

                  searchStep++;

                  /*
                   * After every few pulses,
                   * try auto lock again.
                   */

                  if (searchStep >= 3) {

                      searchStep = 0;

                      searchDirection++;

                      if (searchDirection >= 8) {
                          searchDirection = 0;
                      }

                      later(
                          this::autoLock,
                          350
                      );

                  } else {

                      later(
                          this::scan,
                          400
                      );
                  }
              }

              /*
               * Move toward confirmed target.
               */

              private void moveToTarget(
                      Vision.Target t) {

                  if (!running) {
                      return;
                  }

                  float tx =
                      t.x / W;

                  float ty =
                      t.y / H;

                  float dx =
                      tx - PLAYER_X;

                  float dy =
                      ty - PLAYER_Y;

                  double distance =
                      Math.sqrt(
                          dx * dx
                          +
                          dy * dy
                      );

                  /*
                   * Close enough.
                   */

                  if (distance < 0.115) {

                      state =
                          State.ATTACK;

                      attackTry = 0;

                      attack();

                      return;
                  }

                  /*
                   * Target is not close.
                   */

                  float length =
                      (float)Math.sqrt(
                          dx * dx
                          +
                          dy * dy
                      );

                  if (length < 0.001f) {

                      later(
                          this::scan,
                          200
                      );

                      return;
                  }

                  dx /= length;
                  dy /= length;

                  moveCount++;

                  if (moveCount > 20) {

                      /*
                       * Never allow infinite walking.
                       */

                      recover();

                      return;
                  }

                  state =
                      State.MOVE;

                  service.state(
                      "MOVE "
                      + moveCount
                  );

                  moveAndCheck(
                      dx,
                      dy
                  );
              }

              /*
               * Move with joystick and then verify
               * that the screen actually changed.
               */

              private void moveAndCheck(
                      float dx,
                      float dy) {

                  recycle(beforeMove);

                  beforeMove = null;

                  service.screenshot(
                      bitmap -> {

                          if (!running) {
                              recycle(bitmap);
                              return;
                          }

                          beforeMove = bitmap;

                          joystickPulse(
                              dx,
                              dy,
                              280
                          );

                          later(
                              this::checkMovement,
                              420
                          );
                      }
                  );
              }

              private void checkMovement() {

                  if (!running) {
                      return;
                  }

                  service.screenshot(
                      after -> {

                          if (!running) {
                              recycle(after);
                              return;
                          }

                          double diff =
                              Vision.difference(
                                  beforeMove,
                                  after
                              );

                          recycle(beforeMove);
                          beforeMove = null;

                          /*
                           * Screen changed enough.
                           *
                           * Character is probably moving.
                           */

                          if (diff > 7.0) {

                              stuckCount = 0;

                              /*
                               * Re-scan because camera and
                               * target position changed.
                               */

                              later(
                                  this::scan,
                                  180
                              );

                              return;
                          }

                          /*
                           * No movement.
                           */

                          stuckCount++;

                          service.state(
                              "STUCK "
                              + stuckCount
                          );

                          if (stuckCount >= 2) {

                              recover();

                              return;
                          }

                          /*
                           * One more short attempt.
                           */

                          later(
                              this::scan,
                              250
                          );
                      }
                  );
              }

              /*
               * Stuck recovery.
               *
               * Stop repeating the same direction.
               */

              private void recover() {

                  if (!running) {
                      return;
                  }

                  state =
                      State.RECOVER;

                  service.state(
                      "RECOVER"
                  );

                  stuckCount = 0;
                  moveCount = 0;
                  confirmCount = 0;
                  confirmedTarget = null;

                  /*
                   * Change direction by 180 degrees.
                   */

                  searchDirection =
                      (searchDirection + 4) % 8;

                  float[] d =
                      direction(searchDirection);

                  joystickPulse(
                      d[0],
                      d[1],
                      450
                  );

                  later(
                      this::autoLock,
                      650
                  );
              }

              /*
               * Attack.
               */

              private void attack() {

                  if (!running) {
                      return;
                  }

                  state =
                      State.ATTACK;

                  attackTry++;

                  service.state(
                      "ATTACK "
                      + attackTry
                  );

                  recycle(beforeAttack);

                  beforeAttack = null;

                  service.screenshot(
                      bitmap -> {

                          if (!running) {
                              recycle(bitmap);
                              return;
                          }

                          beforeAttack = bitmap;

                          service.tap(
                              W * ATTACK_X,
                              H * ATTACK_Y
                          );

                          later(
                              this::checkAttack,
                              450
                          );
                      }
                  );
              }

              private void checkAttack() {

                  if (!running) {
                      return;
                  }

                  service.screenshot(
                      after -> {

                          if (!running) {
                              recycle(after);
                              return;
                          }

                          double diff =
                              Vision.difference(
                                  beforeAttack,
                                  after
                              );

                          recycle(beforeAttack);
                          beforeAttack = null;

                          /*
                           * Combat animation/damage/
                           * target movement.
                           */

                          if (diff > 5.5) {

                              attackTry = 0;

                              service.state(
                                  "COMBAT"
                              );

                              later(
                                  this::attack,
                                  600
                              );

                              return;
                          }

                          /*
                           * No combat response.
                           */

                          if (attackTry < 2) {

                              later(
                                  this::attack,
                                  250
                              );

                              return;
                          }

                          /*
                           * Probably out of range.
                           */

                          attackTry = 0;

                          service.state(
                              "OUT OF RANGE"
                          );

                          later(
                              this::scan,
                              250
                          );
                      }
                  );
              }

              /*
               * Joystick movement.
               */

              private void joystickPulse(
                      float dx,
                      float dy,
                      long duration) {

                  float cx =
                      W * JOY_X;

                  float cy =
                      H * JOY_Y;

                  float radius =
                      Math.min(W, H) * 0.105f;

                  float ex =
                      cx + dx * radius;

                  float ey =
                      cy + dy * radius;

                  ex =
                      clamp(
                          ex,
                          cx - radius,
                          cx + radius
                      );

                  ey =
                      clamp(
                          ey,
                          cy - radius,
                          cy + radius
                      );

                  service.swipe(
                      cx,
                      cy,
                      ex,
                      ey,
                      duration
                  );

                  /*
                   * Release joystick.
                   */

                  later(
                      () -> service.tap(cx, cy),
                      duration + 30
                  );
              }

              /*
               * Search directions.
               */

              private float[] direction(
                      int n) {

                  switch (n) {

                      case 0:
                          return new float[]{
                              1f, 0f
                          };

                      case 1:
                          return new float[]{
                              0.7f, 0.7f
                          };

                      case 2:
                          return new float[]{
                              0f, 1f
                          };

                      case 3:
                          return new float[]{
                              -0.7f, 0.7f
                          };

                      case 4:
                          return new float[]{
                              -1f, 0f
                          };

                      case 5:
                          return new float[]{
                              -0.7f, -0.7f
                          };

                      case 6:
                          return new float[]{
                              0f, -1f
                          };

                      default:
                          return new float[]{
                              0.7f, -0.7f
                          };
                  }
              }

              private void later(
                      Runnable r,
                      long ms) {

                  handler.postDelayed(
                      r,
                      ms
                  );
              }

              private float clamp(
                      float v,
                      float min,
                      float max) {

                  return Math.max(
                      min,
                      Math.min(max, v)
                  );
              }

              private void recycle(Bitmap b) {

                  if (
                      b != null &&
                      !b.isRecycled()
                  ) {
                      b.recycle();
                  }
              }
          }
          EOF

      - name: Build APK
        shell: bash
        run: |
          set -e

          gradle \
            --no-daemon \
            --stacktrace \
            :app:assembleDebug

      - name: Prepare APK
        shell: bash
        run: |
          mkdir -p output

          cp \
            app/build/outputs/apk/debug/app-debug.apk \
            output/DustinBotV11.apk

          ls -lh output/DustinBotV11.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DustinBotV11
          path: output/DustinBotV11.apk
