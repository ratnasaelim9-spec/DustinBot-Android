          cat > app/src/main/java/com/dustinbot/v2/BotEngine.java <<'EOF'

          package com.dustinbot.v2;


          import android.content.Context;


          public class BotEngine {


              private static volatile boolean running;


              private static Thread thread;


              public static void start(
                  Context context
              ) {


                  if (running)
                      return;


                  if (
                      !SettingsStore.exists(
                          context,
                          "move"
                      )
                  ) return;


                  if (
                      !SettingsStore.exists(
                          context,
                          "attack"
                      )
                  ) return;


                  if (
                      !SettingsStore.exists(
                          context,
                          "loot"
                      )
                  ) return;


                  running = true;


                  MainActivity.status(
                      "RUNNING"
                  );


                  MainActivity.log(
                      "AI START"
                  );


                  thread =
                      new Thread(

                          () -> loop(context),

                          "DustinBotAI"

                      );


                  thread.start();

              }


              public static void stop() {


                  running = false;


                  if (thread != null) {

                      thread.interrupt();

                      thread = null;

                  }


                  MainActivity.status(
                      "STOP"
                  );


                  MainActivity.log(
                      "AI STOP"
                  );

              }


              private static void loop(
                  Context context
              ) {


                  boolean right = true;


                  while (running) {


                      try {


                          float moveX =
                              SettingsStore.x(
                                  context,
                                  "move"
                              );


                          float moveY =
                              SettingsStore.y(
                                  context,
                                  "move"
                              );


                          float attackX =
                              SettingsStore.x(
                                  context,
                                  "attack"
                              );


                          float attackY =
                              SettingsStore.y(
                                  context,
                                  "attack"
                              );


                          float lootX =
                              SettingsStore.x(
                                  context,
                                  "loot"
                              );


                          float lootY =
                              SettingsStore.y(
                                  context,
                                  "loot"
                              );


                          /*
                           *
                           * WALK
                           *
                           */


                          MainActivity.status(
                              "WALK"
                          );


                          MainActivity.log(
                              "เดิน"
                          );


                          float width =

                              context
                                  .getResources()
                                  .getDisplayMetrics()
                                  .widthPixels;


                          float distance =
                              width * 0.25f;


                          float endX;


                          if (right) {

                              endX =
                                  moveX + distance;

                          }

                          else {

                              endX =
                                  moveX - distance;

                          }


                          BotAccessibility.swipe(

                              moveX,

                              moveY,

                              endX,

                              moveY,

                              900

                          );


                          Thread.sleep(
                              1000
                          );


                          /*
                           *
                           * TARGET
                           *
                           * เกมเป็นคนล็อกเป้า
                           *
                           */


                          MainActivity.status(
                              "TARGET"
                          );


                          MainActivity.log(
                              "รอเป้าหมายจากเกม"
                          );


                          Thread.sleep(
                              700
                          );


                          /*
                           *
                           * ATTACK
                           *
                           */


                          MainActivity.status(
                              "ATTACK"
                          );


                          MainActivity.log(
                              "โจมตี"
                          );


                          for (

                              int i = 0;

                              i < 5 &&
                              running;

                              i++

                          ) {


                              BotAccessibility.tap(

                                  attackX,

                                  attackY

                              );


                              Thread.sleep(
                                  500
                              );

                          }


                          /*
                           *
                           * WAIT
                           *
                           */


                          Thread.sleep(
                              800
                          );


                          /*
                           *
                           * LOOT
                           *
                           */


                          MainActivity.status(
                              "LOOT"
                          );


                          MainActivity.log(
                              "เก็บของ"
                          );


                          BotAccessibility.tap(

                              lootX,

                              lootY

                          );


                          Thread.sleep(
                              800
                          );


                          /*
                           *
                           * NEXT WALK
                           *
                           */


                          right = !right;


                      }


                      catch (
                          InterruptedException e
                      ) {

                          return;

                      }


                      catch (
                          Exception e
                      ) {

                          MainActivity.log(
                              "AI ERROR"
                          );

                          try {

                              Thread.sleep(
                                  1000
                              );

                          }

                          catch (
                              InterruptedException ignored
                          ) {

                              return;

                          }

                      }

                  }

              }

          }

          EOF


