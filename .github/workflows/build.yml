          cat > app/src/main/java/com/dustinbot/v91/BotEngine.java <<'EOF'
          package com.dustinbot.v91;

          import android.graphics.Bitmap;

          import android.os.Handler;
          import android.os.Looper;

          import java.util.Random;

          public class BotEngine {

              public interface ScreenCallback {
                  void onBitmap(Bitmap bitmap);
              }

              private final BotAccessibility service;

              private final Handler handler =
                  new Handler(
                      Looper.getMainLooper()
                  );

              private final Random random =
                  new Random();

              private boolean running =
                  false;

              /*
               * หน้าจอเกมที่ใช้จาก V9
               */
              private static final int W = 1842;
              private static final int H = 832;

              /*
               * joystick
               */
              private static final float JOY_X =
                  0.138f;

              private static final float JOY_Y =
                  0.785f;

              /*
               * ปุ่มดาบ
               */
              private static final float ATTACK_X =
                  0.850f;

              private static final float ATTACK_Y =
                  0.815f;

              /*
               * ปุ่มเก็บของ
               *
               * จากตำแหน่งที่ผู้ใช้ชี้ให้ดู
               */
              private static final float LOOT_X =
                  0.795f;

              private static final float LOOT_Y =
                  0.900f;

              private static final float PLAYER_X =
                  0.50f;

              private static final float PLAYER_Y =
                  0.47f;

              private Vision.Target target;

              private int confirmCount = 0;

              private int moveCount = 0;

              private int attackTry = 0;

              private int noTargetCount = 0;

              private int lootCount = 0;

              private int searchDirection = -1;

              private int lastDirection = -99;

              private boolean hadCombat = false;

              private boolean looting = false;

              private boolean moving = false;

              private boolean attacking = false;

              private Bitmap beforeMove;

              private Bitmap beforeAttack;

              private enum State {

                  SEARCH,

                  CONFIRM,

                  MOVE,

                  ATTACK,

                  LOOT
              }

              private State state =
                  State.SEARCH;

              public BotEngine(
                  BotAccessibility service
              ) {

                  this.service =
                      service;
              }

              public void start() {

                  if (running) {
                      return;
                  }

                  running = true;

                  target = null;

                  confirmCount = 0;

                  moveCount = 0;

                  attackTry = 0;

                  noTargetCount = 0;

                  lootCount = 0;

                  hadCombat = false;

                  looting = false;

                  moving = false;

                  attacking = false;

                  searchDirection =
                      random.nextInt(8);

                  lastDirection = -99;

                  service.state(
                      "START"
                  );

                  later(
                      this::autoLock,
                      500
                  );
              }

              public void stop() {

                  running = false;

                  handler.removeCallbacksAndMessages(
                      null
                  );

                  recycle(
                      beforeMove
                  );

                  recycle(
                      beforeAttack
                  );

                  beforeMove = null;

                  beforeAttack = null;

                  target = null;

                  moving = false;

                  attacking = false;

                  looting = false;

                  service.state(
                      "STOP"
                  );
              }

              private void autoLock() {

                  if (!running) {
                      return;
                  }

                  /*
                   * ถ้ากำลังเก็บของ
                   * ห้าม auto lock
                   */
                  if (looting) {
                      return;
                  }

                  service.state(
                      "AUTO LOCK"
                  );

                  /*
                   * เปิดเมนูล็อคเป้า
                   */
                  tap(
                      0.755f,
                      0.075f
                  );

                  later(
                      () -> {

                          if (!running) {
                              return;
                          }

                          /*
                           * ล็อคเป้าอัตโนมัติ
                           *
                           * ไม่ใช้ "ติดตาม"
                           */
                          tap(
                              0.755f,
                              0.155f
                          );

                          later(
                              this::scan,
                              650
                          );

                      },
                      300
                  );
              }

              private void scan() {

                  if (!running) {
                      return;
                  }

                  if (looting) {
                      return;
                  }

                  service.state(
                      "SEARCH"
                  );

                  service.screenshot(
                      bitmap -> {

                          if (!running) {

                              recycle(bitmap);

                              return;
                          }

                          if (bitmap == null) {

                              later(
                                  this::scan,
                                  400
                              );

                              return;
                          }

                          Vision.Target found =
                              Vision.findMarker(
                                  bitmap
                              );

                          recycle(bitmap);

                          if (!running) {
                              return;
                          }

                          if (found == null) {

                              target = null;

                              confirmCount = 0;

                              noTargetCount++;

                              /*
                               * ถ้ากำลังต่อสู้มาก่อน
                               * และเป้าหมายหาย
                               *
                               * ให้ถือว่ามอนสเตอร์ตาย
                               * แล้วเข้า LOOT
                               */
                              if (
                                  hadCombat &&
                                  !looting &&
                                  (
                                      state ==
                                          State.ATTACK ||
                                      state ==
                                          State.MOVE
                                  )
                              ) {

                                  hadCombat = false;

                                  attackTry = 0;

                                  loot();

                                  return;
                              }

                              /*
                               * ถ้ายังไม่ได้ต่อสู้
                               * เดินสุ่มหา
                               */
                              if (
                                  noTargetCount >= 2
                              ) {

                                  randomSearch();

                                  return;
                              }

                              later(
                                  this::scan,
                                  250
                              );

                              return;
                          }

                          noTargetCount = 0;

                          confirm(found);
                      }
                  );
              }

              private void confirm(
                  Vision.Target found
              ) {

                  if (!running) {
                      return;
                  }

                  state =
                      State.CONFIRM;

                  if (target == null) {

                      target = found;

                      confirmCount = 1;

                  } else {

                      float dx =
                          Math.abs(
                              target.x -
                              found.x
                          );

                      float dy =
                          Math.abs(
                              target.y -
                              found.y
                          );

                      if (
                          dx < W * 0.055f &&
                          dy < H * 0.055f
                      ) {

                          target = found;

                          confirmCount++;

                      } else {

                          target = found;

                          confirmCount = 1;
                      }
                  }

                  service.state(
                      "TARGET " +
                      confirmCount
                  );

                  /*
                   * ต้องเห็นเป้าหมาย
                   * ต่อเนื่องก่อนสั่งเดิน
                   */
                  if (
                      confirmCount >= 2
                  ) {

                      moveCount = 0;

                      moveToTarget();

                      return;
                  }

                  later(
                      this::scan,
                      180
                  );
              }

              private void moveToTarget() {

                  if (
                      !running ||
                      target == null
                  ) {
                      return;
                  }

                  if (looting) {
                      return;
                  }

                  float tx =
                      target.x / W;

                  float ty =
                      target.y / H;

                  float dx =
                      tx -
                      PLAYER_X;

                  float dy =
                      ty -
                      PLAYER_Y;

                  double distance =
                      Math.sqrt(
                          dx * dx +
                          dy * dy
                      );

                  /*
                   * เข้าใกล้แล้ว
                   */
                  if (
                      distance < 0.115
                  ) {

                      moving = false;

                      attackTry = 0;

                      attack();

                      return;
                  }

                  moveCount++;

                  /*
                   * เดินเข้าเป้าได้สูงสุด
                   * 15 รอบแล้วตรวจใหม่
                   */
                  if (
                      moveCount >= 15
                  ) {

                      target = null;

                      confirmCount = 0;

                      randomSearch();

                      return;
                  }

                  float length =
                      (float)Math.sqrt(
                          dx * dx +
                          dy * dy
                      );

                  if (
                      length < 0.001f
                  ) {

                      later(
                          this::scan,
                          200
                      );

                      return;
                  }

                  dx /= length;
                  dy /= length;

                  service.state(
                      "MOVE " +
                      moveCount
                  );

                  moving = true;

                  /*
                   * เดินไปตามทิศของเป้าหมาย
                   */
                  joystick(
                      dx,
                      dy,
                      260
                  );

                  later(
                      () -> {

                          moving = false;

                          if (running) {

                              later(
                                  this::scan,
                                  180
                              );
                          }

                      },
                      330
                  );
              }

              private void attack() {

                  if (!running) {
                      return;
                  }

                  if (looting) {
                      return;
                  }

                  attackTry++;

                  attacking = true;

                  hadCombat = true;

                  state =
                      State.ATTACK;

                  service.state(
                      "ATTACK " +
                      attackTry
                  );

                  /*
                   * ใช้พิกัดโจมตีของ V9
                   */
                  tap(
                      ATTACK_X,
                      ATTACK_Y
                  );

                  /*
                   * ให้เกมมีเวลาตอบสนอง
                   */
                  later(
                      () -> {

                          if (!running) {
                              return;
                          }

                          /*
                           * ไม่ได้กำหนดว่า
                           * ตีครบกี่ครั้ง = ตาย
                           *
                           * แต่จะ scan ดูเป้าหมายต่อ
                           */

                          if (
                              attackTry >= 12
                          ) {

                              attackTry = 0;

                              /*
                               * ถ้ายังตีไม่ตาย
                               * ให้ลองค้นหาเป้าใหม่
                               * แทนการตีอากาศไม่จบ
                               */

                              target = null;

                              confirmCount = 0;

                              hadCombat = false;

                              randomSearch();

                              return;
                          }

                          scan();

                      },
                      650
                  );
              }

              private void loot() {

                  if (!running) {
                      return;
                  }

                  if (looting) {
                      return;
                  }

                  looting = true;

                  state =
                      State.LOOT;

                  lootCount = 0;

                  service.state(
                      "LOOT"
                  );

                  /*
                   * เก็บของหลายครั้ง
                   *
                   * ไม่ใช่กดครั้งเดียว
                   */
                  lootStep();
              }

              private void lootStep() {

                  if (!running) {
                      return;
                  }

                  if (!looting) {
                      return;
                  }

                  lootCount++;

                  service.state(
                      "LOOT " +
                      lootCount +
                      "/5"
                  );

                  /*
                   * ปุ่มเก็บของ
                   */
                  tap(
                      LOOT_X,
                      LOOT_Y
                  );

                  /*
                   * ขยับเล็กน้อยรอบตำแหน่งเดิม
                   * เพื่อช่วยกรณีของอยู่เยื้องจากตัวละคร
                   */
                  if (
                      lootCount == 2
                  ) {

                      lootNudge(
                          1f,
                          0f
                      );

                  } else if (
                      lootCount == 3
                  ) {

                      lootNudge(
                          -1f,
                          0f
                      );

                  } else if (
                      lootCount == 4
                  ) {

                      lootNudge(
                          0f,
                          1f
                      );

                  }

                  if (
                      lootCount >= 5
                  ) {

                      later(
                          this::finishLoot,
                          700
                      );

                      return;
                  }

                  later(
                      this::lootStep,
                      450
                  );
              }

              private void finishLoot() {

                  if (!running) {
                      return;
                  }

                  looting = false;

                  target = null;

                  confirmCount = 0;

                  noTargetCount = 0;

                  attackTry = 0;

                  moveCount = 0;

                  hadCombat = false;

                  service.state(
                      "LOOT DONE"
                  );

                  /*
                   * หลังเก็บเสร็จ
                   * สุ่มเดินหาใหม่
                   */
                  later(
                      this::randomSearch,
                      300
                  );
              }

              private void lootNudge(
                  float dx,
                  float dy
              ) {

                  if (!running) {
                      return;
                  }

                  float length =
                      (float)Math.sqrt(
                          dx * dx +
                          dy * dy
                      );

                  if (length <= 0) {
                      return;
                  }

                  dx /= length;
                  dy /= length;

                  joystick(
                      dx,
                      dy,
                      180
                  );
              }

              /*
               * =====================================================
               * RANDOM ROAMING
               * =====================================================
               *
               * ไม่มีเป้าหมาย:
               *
               * - สุ่ม 8 ทิศ
               * - ห้ามทิศเดิมซ้ำ
               * - สุ่มระยะเวลา
               * - เดินสั้น
               * - ตรวจใหม่
               */

              private void randomSearch() {

                  if (!running) {
                      return;
                  }

                  if (looting) {
                      return;
                  }

                  state =
                      State.SEARCH;

                  target = null;

                  confirmCount = 0;

                  noTargetCount = 0;

                  int direction;

                  /*
                   * สุ่มทิศใหม่
                   *
                   * ไม่ให้ซ้ำกับครั้งก่อน
                   */
                  do {

                      direction =
                          random.nextInt(8);

                  } while (
                      direction ==
                      lastDirection
                  );

                  lastDirection =
                      direction;

                  searchDirection =
                      direction;

                  float[] d =
                      directionVector(
                          direction
                      );

                  /*
                   * สุ่มระยะเวลา
                   *
                   * ประมาณ 0.55 - 1.50 วินาที
                   */
                  long duration =
                      550 +
                      random.nextInt(
                          951
                      );

                  service.state(
                      "RANDOM " +
                      directionName(
                          direction
                      )
                  );

                  joystick(
                      d[0],
                      d[1],
                      duration
                  );

                  /*
                   * เดินเสร็จแล้วตรวจ
                   */
                  later(
                      () -> {

                          if (!running) {
                              return;
                          }

                          service.state(
                              "CHECK"
                          );

                          scan();

                      },
                      duration + 180
                  );
              }

              private float[] directionVector(
                  int n
              ) {

                  switch (n) {

                      case 0:
                          return new float[]{
                              1f,
                              0f
                          };

                      case 1:
                          return new float[]{
                              0.707f,
                              0.707f
                          };

                      case 2:
                          return new float[]{
                              0f,
                              1f
                          };

                      case 3:
                          return new float[]{
                              -0.707f,
                              0.707f
                          };

                      case 4:
                          return new float[]{
                              -1f,
                              0f
                          };

                      case 5:
                          return new float[]{
                              -0.707f,
                              -0.707f
                          };

                      case 6:
                          return new float[]{
                              0f,
                              -1f
                          };

                      default:
                          return new float[]{
                              0.707f,
                              -0.707f
                          };
                  }
              }

              private String directionName(
                  int n
              ) {

                  switch (n) {

                      case 0:
                          return "RIGHT";

                      case 1:
                          return "DOWN-RIGHT";

                      case 2:
                          return "DOWN";

                      case 3:
                          return "DOWN-LEFT";

                      case 4:
                          return "LEFT";

                      case 5:
                          return "UP-LEFT";

                      case 6:
                          return "UP";

                      default:
                          return "UP-RIGHT";
                  }
              }

              private void joystick(
                  float dx,
                  float dy,
                  long duration
              ) {

                  float cx =
                      W * JOY_X;

                  float cy =
                      H * JOY_Y;

                  float radius =
                      Math.min(
                          W,
                          H
                      ) * 0.105f;

                  float ex =
                      cx +
                      dx * radius;

                  float ey =
                      cy +
                      dy * radius;

                  ex =
                      clamp(
                          ex,
                          cx - radius,
                          cx + radius
                      );

                  ey =
                      clamp(
                          ey,
                          cy - radius,
                          cy + radius
                      );

                  service.swipe(
                      cx,
                      cy,
                      ex,
                      ey,
                      duration
                  );

                  /*
                   * ปล่อย joystick
                   */
                  later(
                      () -> {

                          if (running) {

                              service.tap(
                                  cx,
                                  cy
                              );
                          }

                      },
                      duration + 40
                  );
              }

              private float clamp(
                  float value,
                  float min,
                  float max
              ) {

                  return Math.max(
                      min,
                      Math.min(
                          max,
                          value
                      )
                  );
              }

              private void tap(
                  float xRatio,
                  float yRatio
              ) {

                  service.tap(
                      W * xRatio,
                      H * yRatio
                  );
              }

              private void recycle(
                  Bitmap bitmap
              ) {

                  if (
                      bitmap != null &&
                      !bitmap.isRecycled()
                  ) {

                      try {
                          bitmap.recycle();
                      } catch (Exception ignored) {
                      }
                  }
              }
          }
