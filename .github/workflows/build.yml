          cat > app/src/main/java/com/dustinbot/v11/BotAccessibility.java <<'EOF'
          package com.dustinbot.v11;

          import android.accessibilityservice.AccessibilityService;
          import android.accessibilityservice.GestureDescription;
          import android.graphics.Bitmap;
          import android.graphics.Path;
          import android.graphics.PixelFormat;
          import android.hardware.HardwareBuffer;
          import android.os.Handler;
          import android.os.Looper;
          import android.view.Gravity;
          import android.view.WindowManager;
          import android.widget.Button;
          import android.widget.LinearLayout;
          import android.widget.TextView;

          public class BotAccessibility
              extends AccessibilityService {

              private static BotAccessibility instance;

              private WindowManager windowManager;

              private LinearLayout panel;

              private TextView status;

              private BotEngine engine;


              public static void showPanel() {

                  if (instance != null) {

                      instance.createPanel();
                  }
              }


              @Override
              protected void onServiceConnected() {

                  super.onServiceConnected();

                  instance = this;

                  engine =
                      new BotEngine(this);

                  /*
                   * สำคัญ:
                   *
                   * เมื่อ Accessibility ON
                   * ให้เปิดแผง BOT เอง
                   */

                  new Handler(
                      Looper.getMainLooper()
                  ).postDelayed(
                      this::createPanel,
                      500
                  );
              }


              @Override
              public void onAccessibilityEvent(
                      android.view.accessibility.AccessibilityEvent event) {
              }


              @Override
              public void onInterrupt() {

                  if (engine != null) {

                      engine.stop();
                  }
              }


              @Override
              public void onDestroy() {

                  if (engine != null) {

                      engine.stop();
                  }

                  removePanel();

                  instance = null;

                  super.onDestroy();
              }


              private void createPanel() {

                  if (panel != null) {

                      return;
                  }


                  windowManager =
                      (WindowManager)
                      getSystemService(
                          WINDOW_SERVICE
                      );


                  panel =
                      new LinearLayout(this);

                  panel.setOrientation(
                      LinearLayout.VERTICAL
                  );

                  panel.setPadding(
                      14,
                      10,
                      14,
                      10
                  );

                  panel.setBackgroundColor(
                      0xEE111111
                  );


                  status =
                      new TextView(this);

                  status.setText(
                      "DUSTIN BOT V11.1\nREADY"
                  );

                  status.setTextColor(
                      0xFFFFFFFF
                  );

                  status.setTextSize(12);

                  status.setPadding(
                      5,
                      3,
                      5,
                      3
                  );

                  panel.addView(
                      status
                  );


                  LinearLayout row =
                      new LinearLayout(this);

                  row.setOrientation(
                      LinearLayout.HORIZONTAL
                  );


                  Button start =
                      new Button(this);

                  start.setText(
                      "START"
                  );


                  Button stop =
                      new Button(this);

                  stop.setText(
                      "STOP"
                  );


                  Button close =
                      new Button(this);

                  close.setText(
                      "×"
                  );


                  row.addView(start);

                  row.addView(stop);

                  row.addView(close);

                  panel.addView(row);


                  start.setOnClickListener(
                      v -> {

                          if (engine != null) {

                              engine.start();
                          }
                      }
                  );


                  stop.setOnClickListener(
                      v -> {

                          if (engine != null) {

                              engine.stop();
                          }
                      }
                  );


                  close.setOnClickListener(
                      v -> {

                          removePanel();
                      }
                  );


                  WindowManager.LayoutParams lp =
                      new WindowManager.LayoutParams();

                  lp.width =
                      WindowManager.LayoutParams.WRAP_CONTENT;

                  lp.height =
                      WindowManager.LayoutParams.WRAP_CONTENT;

                  lp.gravity =
                      Gravity.TOP |
                      Gravity.RIGHT;

                  lp.x = 10;

                  lp.y = 70;


                  /*
                   * สำคัญที่สุดของ V11.1
                   *
                   * ใช้ Accessibility Overlay
                   * ไม่ใช้ Application Overlay
                   */

                  lp.type =
                      WindowManager.LayoutParams
                          .TYPE_ACCESSIBILITY_OVERLAY;


                  lp.flags =
                      WindowManager.LayoutParams
                          .FLAG_NOT_FOCUSABLE;


                  lp.format =
                      PixelFormat.TRANSLUCENT;


                  try {

                      windowManager.addView(
                          panel,
                          lp
                      );

                  } catch (Exception e) {

                      panel = null;

                      /*
                       * ถ้าเพิ่มไม่ได้ให้ลองใหม่
                       */

                      new Handler(
                          Looper.getMainLooper()
                      ).postDelayed(
                          this::createPanel,
                          1000
                      );
                  }
              }


              private void removePanel() {

                  if (
                      panel != null &&
                      windowManager != null
                  ) {

                      try {

                          windowManager.removeView(
                              panel
                          );

                      } catch (Exception ignored) {
                      }
                  }

                  panel = null;
              }


              public void state(
                      String text) {

                  new Handler(
                      Looper.getMainLooper()
                  ).post(
                      () -> {

                          if (status != null) {

                              status.setText(
                                  "DUSTIN BOT V11.1\n"
                                  + text
                              );
                          }
                      }
                  );
              }


              public void tap(
                      float x,
                      float y) {

                  Path path =
                      new Path();

                  path.moveTo(
                      x,
                      y
                  );


                  GestureDescription gesture =
                      new GestureDescription.Builder()
                          .addStroke(
                              new GestureDescription
                                  .StrokeDescription(
                                      path,
                                      0,
                                      70
                                  )
                          )
                          .build();


                  dispatchGesture(
                      gesture,
                      null,
                      null
                  );
              }


              public void swipe(
                      float x1,
                      float y1,
                      float x2,
                      float y2,
                      long duration) {

                  Path path =
                      new Path();

                  path.moveTo(
                      x1,
                      y1
                  );

                  path.lineTo(
                      x2,
                      y2
                  );


                  GestureDescription gesture =
                      new GestureDescription.Builder()
                          .addStroke(
                              new GestureDescription
                                  .StrokeDescription(
                                      path,
                                      0,
                                      duration
                                  )
                          )
                          .build();


                  dispatchGesture(
                      gesture,
                      null,
                      null
                  );
              }


              public void screenshot(
                      BotEngine.ScreenCallback callback) {

                  takeScreenshot(

                      android.view.Display.DEFAULT_DISPLAY,

                      getMainExecutor(),

                      new TakeScreenshotCallback() {

                          @Override
                          public void onSuccess(
                                  ScreenshotResult result) {

                              HardwareBuffer buffer =
                                  result.getHardwareBuffer();

                              if (buffer == null) {

                                  callback.onBitmap(
                                      null
                                  );

                                  return;
                              }


                              Bitmap bitmap =
                                  Bitmap.wrapHardwareBuffer(
                                      buffer,
                                      result.getColorSpace()
                                  );


                              Bitmap copy = null;


                              if (bitmap != null) {

                                  copy =
                                      bitmap.copy(
                                          Bitmap.Config
                                              .ARGB_8888,
                                          false
                                      );

                                  bitmap.recycle();
                              }


                              buffer.close();


                              callback.onBitmap(
                                  copy
                              );
                          }


                          @Override
                          public void onFailure(
                                  int errorCode) {

                              callback.onBitmap(
                                  null
                              );
                          }
                      }
                  );
              }
          }
          EOF

          cat > app/src/main/java/com/dustinbot/v11/Vision.java <<'EOF'
          package com.dustinbot.v11;

          import android.graphics.Bitmap;
          import android.graphics.Color;

          public class Vision {

              public static class Target {

                  public float x;

                  public float y;

                  public float confidence;


                  public Target(
                          float x,
                          float y,
                          float confidence) {

                      this.x = x;

                      this.y = y;

                      this.confidence =
                          confidence;
                  }
              }


              public static Target findMarker(
                      Bitmap b) {

                  if (b == null) {

                      return null;
                  }


                  int w =
                      b.getWidth();

                  int h =
                      b.getHeight();


                  int left =
                      (int)(w * 0.25f);

                  int right =
                      (int)(w * 0.82f);

                  int top =
                      (int)(h * 0.12f);

                  int bottom =
                      (int)(h * 0.67f);


                  Target best = null;

                  double bestScore = 0;


                  for (
                      int y = top;
                      y < bottom;
                      y += 5
                  ) {

                      for (
                          int x = left;
                          x < right;
                          x += 5
                      ) {

                          int bright = 0;

                          int dark = 0;

                          int total = 0;


                          for (
                              int yy = -8;
                              yy <= 8;
                              yy += 2
                          ) {

                              for (
                                  int xx = -10;
                                  xx <= 10;
                                  xx += 2
                              ) {

                                  int px =
                                      x + xx;

                                  int py =
                                      y + yy;


                                  if (
                                      px < 0 ||
                                      py < 0 ||
                                      px >= w ||
                                      py >= h
                                  ) {

                                      continue;
                                  }


                                  int c =
                                      b.getPixel(
                                          px,
                                          py
                                      );


                                  int r =
                                      Color.red(c);

                                  int g =
                                      Color.green(c);

                                  int bl =
                                      Color.blue(c);


                                  int max =
                                      Math.max(
                                          r,
                                          Math.max(
                                              g,
                                              bl
                                          )
                                      );


                                  int min =
                                      Math.min(
                                          r,
                                          Math.min(
                                              g,
                                              bl
                                          )
                                      );


                                  if (
                                      min > 185 &&
                                      max - min < 45
                                  ) {

                                      bright++;
                                  }


                                  if (
                                      max < 90
                                  ) {

                                      dark++;
                                  }


                                  total++;
                              }
                          }


                          if (total == 0) {

                              continue;
                          }


                          float br =
                              (float)bright /
                              total;

                          float dr =
                              (float)dark /
                              total;


                          if (
                              br < 0.18f ||
                              br > 0.68f
                          ) {

                              continue;
                          }


                          if (
                              dr < 0.04f
                          ) {

                              continue;
                          }


                          int changes = 0;


                          for (
                              int yy = 10;
                              yy <= 32;
                              yy += 4
                          ) {

                              int previous =
                                  -1;


                              for (
                                  int xx = -12;
                                  xx <= 12;
                                  xx += 4
                              ) {

                                  int px =
                                      x + xx;

                                  int py =
                                      y + yy;


                                  if (
                                      px < 0 ||
                                      py < 0 ||
                                      px >= w ||
                                      py >= h
                                  ) {

                                      continue;
                                  }


                                  int c =
                                      b.getPixel(
                                          px,
                                          py
                                      );


                                  int v =
                                      (
                                          Color.red(c)
                                          +
                                          Color.green(c)
                                          +
                                          Color.blue(c)
                                      ) / 3;


                                  if (
                                      previous >= 0 &&
                                      Math.abs(
                                          v - previous
                                      ) > 35
                                  ) {

                                      changes++;
                                  }


                                  previous = v;
                              }
                          }


                          if (
                              changes < 2
                          ) {

                              continue;
                          }


                          double score =
                              br * 50
                              +
                              dr * 80
                              +
                              changes * 2;


                          if (
                              score > bestScore
                          ) {

                              bestScore =
                                  score;


                              best =
                                  new Target(
                                      x,
                                      Math.min(
                                          y + 35,
                                          bottom
                                      ),
                                      (float)score
                                  );
                          }
                      }
                  }


                  if (
                      best == null ||
                      best.confidence < 20
                  ) {

                      return null;
                  }


                  return best;
              }


              public static double difference(
                      Bitmap a,
                      Bitmap b) {

                  if (
                      a == null ||
                      b == null
                  ) {

                      return 0;
                  }


                  int w =
                      Math.min(
                          a.getWidth(),
                          b.getWidth()
                      );

                  int h =
                      Math.min(
                          a.getHeight(),
                          b.getHeight()
                      );


                  long total = 0;

                  long count = 0;


                  for (
                      int y =
                          (int)(h * 0.18f);

                      y <
                          (int)(h * 0.75f);

                      y += 16
                  ) {

                      for (
                          int x =
                              (int)(w * 0.10f);

                          x <
                              (int)(w * 0.90f);

                          x += 16
                      ) {

                          int ca =
                              a.getPixel(
                                  x,
                                  y
                              );

                          int cb =
                              b.getPixel(
                                  x,
                                  y
                              );


                          total +=
                              Math.abs(
                                  Color.red(ca)
                                  -
                                  Color.red(cb)
                              );


                          total +=
                              Math.abs(
                                  Color.green(ca)
                                  -
                                  Color.green(cb)
                              );


                          total +=
                              Math.abs(
                                  Color.blue(ca)
                                  -
                                  Color.blue(cb)
                              );


                          count += 3;
                      }
                  }


                  if (count == 0) {

                      return 0;
                  }


                  return
                      (double)total /
                      count;
              }
          }
          EOF

          cat > app/src/main/java/com/dustinbot/v11/BotEngine.java <<'EOF'
          package com.dustinbot.v11;

          import android.graphics.Bitmap;
          import android.os.Handler;
          import android.os.Looper;

          public class BotEngine {

              public interface ScreenCallback {
                  void onBitmap(Bitmap bitmap);
              }


              private final BotAccessibility service;


              private final Handler handler =
                  new Handler(
                      Looper.getMainLooper()
                  );


              private boolean running =
                  false;


              private static final int W =
                  1842;

              private static final int H =
                  832;


              private static final float JOY_X =
                  0.138f;

              private static final float JOY_Y =
                  0.785f;


              private static final float ATTACK_X =
                  0.850f;

              private static final float ATTACK_Y =
                  0.815f;


              private static final float PLAYER_X =
                  0.50f;

              private static final float PLAYER_Y =
                  0.47f;


              private enum State {

                  SEARCH,

                  CONFIRM,

                  MOVE,

                  ATTACK,

                  RECOVER
              }


              private State state =
                  State.SEARCH;


              private Vision.Target target;


              private int confirmCount =
                  0;


              private int stuckCount =
                  0;


              private int moveCount =
                  0;


              private int attackTry =
                  0;


              private int searchDirection =
                  0;


              private int searchStep =
                  0;


              private Bitmap beforeMove;


              private Bitmap beforeAttack;


              public BotEngine(
                      BotAccessibility service) {

                  this.service =
                      service;
              }


              public void start() {

                  if (running) {

                      return;
                  }


                  running = true;


                  target = null;

                  confirmCount = 0;

                  stuckCount = 0;

                  moveCount = 0;

                  attackTry = 0;

                  searchStep = 0;


                  service.state(
                      "START\nAUTO LOCK"
                  );


                  later(
                      this::autoLock,
                      500
                  );
              }


              public void stop() {

                  running = false;


                  handler.removeCallbacksAndMessages(
                      null
                  );


                  recycle(
                      beforeMove
                  );

                  recycle(
                      beforeAttack
                  );


                  beforeMove = null;

                  beforeAttack = null;


                  service.state(
                      "STOP"
                  );
              }


              private void autoLock() {

                  if (!running) {

                      return;
                  }


                  service.state(
                      "AUTO LOCK"
                  );


                  /*
                   * เปิดเมนูล็อคเป้า
                   */

                  service.tap(
                      W * 0.755f,
                      H * 0.075f
                  );


                  later(
                      this::lock,
                      350
                  );
              }


              private void lock() {

                  if (!running) {

                      return;
                  }


                  /*
                   * ล็อคเป้าอัตโนมัติ
                   *
                   * ไม่กด "ติดตาม"
                   */

                  service.tap(
                      W * 0.755f,
                      H * 0.155f
                  );


                  later(
                      this::scan,
                      700
                  );
              }


              private void scan() {

                  if (!running) {

                      return;
                  }


                  service.state(
                      "SEARCH"
                  );


                  service.screenshot(
                      bitmap -> {

                          if (!running) {

                              recycle(bitmap);

                              return;
                          }


                          if (bitmap == null) {

                              later(
                                  this::scan,
                                  400
                              );

                              return;
                          }


                          Vision.Target found =
                              Vision.findMarker(
                                  bitmap
                              );


                          recycle(bitmap);


                          if (found == null) {

                              target = null;

                              confirmCount = 0;

                              search();

                              return;
                          }


                          confirm(found);
                      }
                  );
              }


              private void confirm(
                      Vision.Target found) {

                  if (!running) {

                      return;
                  }


                  state =
                      State.CONFIRM;


                  if (target == null) {

                      target = found;

                      confirmCount = 1;

                  } else {

                      float dx =
                          Math.abs(
                              target.x -
                              found.x
                          );

                      float dy =
                          Math.abs(
                              target.y -
                              found.y
                          );


                      if (
                          dx < W * 0.055f &&
                          dy < H * 0.055f
                      ) {

                          target =
                              found;

                          confirmCount++;

                      } else {

                          target =
                              found;

                          confirmCount = 1;
                      }
                  }


                  service.state(
                      "TARGET "
                      + confirmCount
                  );


                  if (
                      confirmCount >= 3
                  ) {

                      moveCount = 0;

                      stuckCount = 0;

                      moveToTarget();

                      return;
                  }


                  later(
                      this::scan,
                      180
                  );
              }


              private void moveToTarget() {

                  if (
                      !running ||
                      target == null
                  ) {

                      return;
                  }


                  float tx =
                      target.x / W;

                  float ty =
                      target.y / H;


                  float dx =
                      tx -
                      PLAYER_X;

                  float dy =
                      ty -
                      PLAYER_Y;


                  double distance =
                      Math.sqrt(
                          dx * dx +
                          dy * dy
                      );


                  /*
                   * เข้าใกล้พอแล้ว
                   */

                  if (
                      distance < 0.115
                  ) {

                      attackTry = 0;

                      attack();

                      return;
                  }


                  moveCount++;


                  /*
                   * ห้ามเดินตลอดไป
                   */

                  if (
                      moveCount >= 20
                  ) {

                      recover();

                      return;
                  }


                  float length =
                      (float)Math.sqrt(
                          dx * dx +
                          dy * dy
                      );


                  if (
                      length < 0.001f
                  ) {

                      later(
                          this::scan,
                          200
                      );

                      return;
                  }


                  dx /= length;

                  dy /= length;


                  service.state(
                      "MOVE "
                      + moveCount
                  );


                  recycle(
                      beforeMove
                  );


                  beforeMove = null;


                  service.screenshot(
                      bitmap -> {

                          if (!running) {

                              recycle(bitmap);

                              return;
                          }


                          beforeMove =
                              bitmap;


                          joystick(
                              dx,
                              dy,
                              280
                          );


                          later(
                              this::checkMove,
                              430
                          );
                      }
                  );
              }


              private void checkMove() {

                  if (!running) {

                      return;
                  }


                  service.screenshot(
                      after -> {

                          if (!running) {

                              recycle(after);

                              return;
                          }


                          double d =
                              Vision.difference(
                                  beforeMove,
                                  after
                              );


                          recycle(
                              beforeMove
                          );

                          beforeMove = null;


                          if (d > 7.0) {

                              stuckCount = 0;

                              later(
                                  this::scan,
                                  180
                              );

                              return;
                          }


                          stuckCount++;


                          service.state(
                              "STUCK "
                              + stuckCount
                          );


                          if (
                              stuckCount >= 2
                          ) {

                              recover();

                              return;
                          }


                          later(
                              this::scan,
                              250
                          );
                      }
                  );
              }


              private void recover() {

                  if (!running) {

                      return;
                  }


                  service.state(
                      "RECOVER"
                  );


                  target = null;

                  confirmCount = 0;

                  stuckCount = 0;

                  moveCount = 0;


                  /*
                   * เปลี่ยนทิศตรงข้าม
                   */

                  searchDirection =
                      (
                          searchDirection +
                          4
                      ) % 8;


                  float[] d =
                      direction(
                          searchDirection
                      );


                  joystick(
                      d[0],
                      d[1],
                      450
                  );


                  later(
                      this::autoLock,
                      700
                  );
              }


              private void search() {

                  if (!running) {

                      return;
                  }


                  searchStep++;


                  service.state(
                      "SEARCH MOVE "
                      + searchDirection
                  );


                  float[] d =
                      direction(
                          searchDirection
                      );


                  joystick(
                      d[0],
                      d[1],
                      250
                  );


                  if (
                      searchStep >= 3
                  ) {

                      searchStep = 0;


                      searchDirection++;


                      if (
                          searchDirection >= 8
                      ) {

                          searchDirection = 0;
                      }


                      later(
                          this::autoLock,
                          450
                      );

                  } else {

                      later(
                          this::scan,
                          400
                      );
                  }
              }


              private void attack() {

                  if (!running) {

                      return;
                  }


                  attackTry++;


                  service.state(
                      "ATTACK "
                      + attackTry
                  );


                  recycle(
                      beforeAttack
                  );


                  beforeAttack = null;


                  service.screenshot(
                      bitmap -> {

                          if (!running) {

                              recycle(bitmap);

                              return;
                          }


                          beforeAttack =
                              bitmap;


                          service.tap(
                              W * ATTACK_X,
                              H * ATTACK_Y
                          );


                          later(
                              this::checkAttack,
                              450
                          );
                      }
                  );
              }


              private void checkAttack() {

                  if (!running) {

                      return;
                  }


                  service.screenshot(
                      after -> {

                          if (!running) {

                              recycle(after);

                              return;
                          }


                          double d =
                              Vision.difference(
                                  beforeAttack,
                                  after
                              );


                          recycle(
                              beforeAttack
                          );

                          beforeAttack = null;


                          if (d > 5.5) {

                              attackTry = 0;


                              service.state(
                                  "COMBAT"
                              );


                              later(
                                  this::attack,
                                  600
                              );


                              return;
                          }


                          if (
                              attackTry < 2
                          ) {

                              later(
                                  this::attack,
                                  250
                              );

                              return;
                          }


                          attackTry = 0;


                          service.state(
                              "OUT OF RANGE"
                          );


                          later(
                              this::scan,
                              250
                          );
                      }
                  );
              }


              private void joystick(
                      float dx,
                      float dy,
                      long duration) {

                  float cx =
                      W * JOY_X;

                  float cy =
                      H * JOY_Y;


                  float radius =
                      Math.min(
                          W,
                          H
                      ) * 0.105f;


                  float ex =
                      cx +
                      dx * radius;

                  float ey =
                      cy +
                      dy * radius;


                  ex =
                      clamp(
                          ex,
                          cx - radius,
                          cx + radius
                      );


                  ey =
                      clamp(
                          ey,
                          cy - radius,
                          cy + radius
                      );


                  service.swipe(
                      cx,
                      cy,
                      ex,
                      ey,
                      duration
                  );


                  later(
                      () -> service.tap(
                          cx,
                          cy
                      ),
                      duration + 30
                  );
              }


              private float[] direction(
                      int n) {

                  switch (n) {

                      case 0:
                          return new float[]{
                              1f,
                              0f
                          };

                      case 1:
                          return new float[]{
                              0.7f,
                              0.7f
                          };

                      case 2:
                          return new float[]{
                              0f,
                              1f
                          };

                      case 3:
                          return new float[]{
                              -0.7f,
                              0.7f
                          };

                      case 4:
                          return new float[]{
                              -1f,
                              0f
                          };

                      case 5:
                          return new float[]{
                              -0.7f,
                              -0.7f
                          };

                      case 6:
                          return new float[]{
                              0f,
                              -1f
                          };

                      default:
                          return new float[]{
                              0.7f,
                              -0.7f
                          };
                  }
              }


              private float clamp(
                      float v,
                      float min,
                      float max) {

                  return Math.max(
                      min,
                      Math.min(
                          max,
                          v
                      )
                  );
              }


              private void later(
                      Runnable r,
                      long ms) {

                  handler.postDelayed(
                      r,
                      ms
                  );
              }


              private void recycle(
                      Bitmap b) {

                  if (
                      b != null &&
                      !b.isRecycled()
                  ) {

                      b.recycle();
                  }
              }
          }
          EOF

      - name: Build APK
        shell: bash
        run: |
          set -e

          gradle \
            --no-daemon \
            --stacktrace \
            :app:assembleDebug

      - name: Prepare APK
        shell: bash
        run: |
          mkdir -p output

          cp \
            app/build/outputs/apk/debug/app-debug.apk \
            output/DustinBotV11.1.apk

          ls -lh output/DustinBotV11.1.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DustinBotV11.1
          path: output/DustinBotV11.1.apk
