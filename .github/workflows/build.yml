package com.dustinbot.v93;

import android.accessibilityservice.AccessibilityService;
import android.accessibilityservice.GestureDescription;

import android.graphics.Bitmap;
import android.graphics.ColorSpace;
import android.graphics.Path;

import android.hardware.HardwareBuffer;

import android.os.Build;
import android.os.Handler;
import android.os.Looper;

import android.view.Display;
import android.view.Gravity;
import android.view.View;
import android.view.WindowManager;

import android.graphics.PixelFormat;

import android.widget.Button;
import android.widget.LinearLayout;
import android.widget.TextView;

import java.util.concurrent.ExecutorService;
import java.util.concurrent.Executors;

public class BotAccessibility
    extends AccessibilityService {

    private final Handler handler =
        new Handler(
            Looper.getMainLooper()
        );

    private final ExecutorService
        screenshotExecutor =
            Executors.newSingleThreadExecutor();

    private WindowManager
        windowManager;

    private LinearLayout
        panel;

    private TextView
        status;

    private BotEngine
        engine;

    @Override
    protected void onServiceConnected() {

        super.onServiceConnected();

        windowManager =
            (WindowManager)
            getSystemService(
                WINDOW_SERVICE
            );

        engine =
            new BotEngine(
                this
            );

        createPanel();
    }

    private int dp(int value) {

        return (int)(
            value *
            getResources()
                .getDisplayMetrics()
                .density
            + 0.5f
        );
    }

    private void createPanel() {

        if (panel != null) {
            return;
        }

        panel =
            new LinearLayout(
                this
            );

        panel.setOrientation(
            LinearLayout.VERTICAL
        );

        panel.setGravity(
            Gravity.CENTER
        );

        panel.setPadding(
            dp(8),
            dp(6),
            dp(8),
            dp(6)
        );

        panel.setBackgroundColor(
            0xEE111111
        );

        status =
            new TextView(
                this
            );

        status.setText(
            "DUSTIN BOT V9.3\nSTOP"
        );

        status.setTextColor(
            0xFFFFFFFF
        );

        status.setTextSize(
            12
        );

        status.setGravity(
            Gravity.CENTER
        );

        Button start =
            new Button(
                this
            );

        start.setText(
            "START"
        );

        start.setOnClickListener(
            v -> {

                if (engine != null) {

                    engine.start();

                    setStatus(
                        true
                    );
                }
            }
        );

        Button stop =
            new Button(
                this
            );

        stop.setText(
            "STOP"
        );

        stop.setOnClickListener(
            v -> {

                if (engine != null) {

                    engine.stop();

                    setStatus(
                        false
                    );
                }
            }
        );

        Button hide =
            new Button(
                this
            );

        hide.setText(
            "HIDE"
        );

        hide.setOnClickListener(
            v -> {

                if (panel != null) {

                    panel.setVisibility(
                        View.GONE
                    );
                }
            }
        );

        panel.addView(
            status,
            new LinearLayout.LayoutParams(
                dp(150),
                dp(40)
            )
        );

        panel.addView(
            start,
            new LinearLayout.LayoutParams(
                dp(150),
                dp(48)
            )
        );

        panel.addView(
            stop,
            new LinearLayout.LayoutParams(
                dp(150),
                dp(48)
            )
        );

        panel.addView(
            hide,
            new LinearLayout.LayoutParams(
                dp(150),
                dp(42)
            )
        );

        WindowManager.LayoutParams
            params =
                new WindowManager.LayoutParams(
                    dp(160),
                    dp(220),

                    WindowManager
                        .LayoutParams
                        .TYPE_ACCESSIBILITY_OVERLAY,

                    WindowManager
                        .LayoutParams
                        .FLAG_NOT_FOCUSABLE,

                    PixelFormat.TRANSLUCENT
                );

        /*
         * IMPORTANT:
         *
         * ไม่วางแผงด้านขวาบน
         * เพราะเมนู Lock Target
         * ของเกมอยู่ตรงนั้น
         */

        params.gravity =
            Gravity.TOP |
            Gravity.START;

        params.x =
            dp(8);

        params.y =
            dp(70);

        windowManager.addView(
            panel,
            params
        );
    }

    private void setStatus(
        boolean running
    ) {

        if (status == null) {
            return;
        }

        status.setText(
            running
                ? "DUSTIN BOT V9.3\nAI กำลังทำงาน"
                : "DUSTIN BOT V9.3\nSTOP"
        );
    }

    public void tap(
        float x,
        float y
    ) {

        Path path =
            new Path();

        path.moveTo(
            x,
            y
        );

        GestureDescription
            .StrokeDescription stroke =
                new GestureDescription
                    .StrokeDescription(
                        path,
                        0,
                        60
                    );

        GestureDescription gesture =
            new GestureDescription.Builder()
                .addStroke(
                    stroke
                )
                .build();

        dispatchGesture(
            gesture,
            null,
            null
        );
    }

    public void swipe(
        float x1,
        float y1,
        float x2,
        float y2,
        long duration
    ) {

        Path path =
            new Path();

        path.moveTo(
            x1,
            y1
        );

        path.lineTo(
            x2,
            y2
        );

        GestureDescription
            .StrokeDescription stroke =
                new GestureDescription
                    .StrokeDescription(
                        path,
                        0,
                        duration
                    );

        GestureDescription gesture =
            new GestureDescription.Builder()
                .addStroke(
                    stroke
                )
                .build();

        dispatchGesture(
            gesture,
            null,
            null
        );
    }

    public void screenshot(
        ScreenshotCallback callback
    ) {

        if (
            Build.VERSION.SDK_INT < 30
        ) {

            callback.fail();

            return;
        }

        takeScreenshot(
            Display.DEFAULT_DISPLAY,
            screenshotExecutor,

            new TakeScreenshotCallback() {

                @Override
                public void onSuccess(
                    ScreenshotResult result
                ) {

                    try {

                        HardwareBuffer
                            hardwareBuffer =
                                result
                                    .getHardwareBuffer();

                        if (
                            hardwareBuffer
                            == null
                        ) {

                            callback.fail();

                            return;
                        }

                        Bitmap temp =
                            Bitmap
                                .wrapHardwareBuffer(
                                    hardwareBuffer,
                                    ColorSpace.get(
                                        ColorSpace
                                            .Named
                                            .SRGB
                                    )
                                );

                        hardwareBuffer.close();

                        if (temp == null) {

                            callback.fail();

                            return;
                        }

                        Bitmap copy =
                            temp.copy(
                                Bitmap.Config
                                    .ARGB_8888,
                                false
                            );

                        temp.recycle();

                        if (copy == null) {

                            callback.fail();

                            return;
                        }

                        callback.ok(
                            copy
                        );

                    } catch (
                        Throwable ignored
                    ) {

                        callback.fail();
                    }
                }

                @Override
                public void onFailure(
                    int errorCode
                ) {

                    callback.fail();
                }
            }
        );
    }

    public interface ScreenshotCallback {

        void ok(
            Bitmap bitmap
        );

        void fail();
    }

    @Override
    public void onAccessibilityEvent(
        android.view.accessibility.AccessibilityEvent event
    ) {
    }

    @Override
    public void onInterrupt() {
    }

    @Override
    public void onDestroy() {

        if (engine != null) {

            engine.stop();
        }

        if (
            panel != null &&
            windowManager != null
        ) {

            try {

                windowManager.removeView(
                    panel
                );

            } catch (
                Throwable ignored
            ) {
            }
        }

        screenshotExecutor.shutdownNow();

        super.onDestroy();
    }
}
