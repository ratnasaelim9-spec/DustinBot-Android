name: Build DustinBot Android V2

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Create Android project
        shell: bash
        run: |
          rm -rf app build.gradle settings.gradle gradle.properties
          mkdir -p app/src/main/java/com/dustinbot/v2
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/xml

          cat > settings.gradle <<'EOF'
          pluginManagement {
            repositories {
              google()
              mavenCentral()
              gradlePluginPortal()
            }
          }
          dependencyResolutionManagement {
            repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
            repositories {
              google()
              mavenCentral()
            }
          }
          rootProject.name="DustinBotV2"
          include ":app"
          EOF

          cat > build.gradle <<'EOF'
          plugins {
            id 'com.android.application' version '8.6.1' apply false
          }
          EOF

          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
            id 'com.android.application'
          }

          android {
            namespace 'com.dustinbot.v2'
            compileSdk 35

            defaultConfig {
              applicationId 'com.dustinbot.v2'
              minSdk 26
              targetSdk 35
              versionCode 20
              versionName '2.0'
            }
          }
          EOF

          cat > app/src/main/res/values/strings.xml <<'EOF'
          <resources>
            <string name="app_name">DustinBot Android V2</string>
            <string name="accessibility_description">DustinBot Android UI automation service</string>
          </resources>
          EOF

          cat > app/src/main/res/values/themes.xml <<'EOF'
          <resources>
            <style name="AppTheme" parent="android:style/Theme.Material.Light.NoActionBar">
              <item name="android:fontFamily">sans</item>
              <item name="android:colorAccent">#1976D2</item>
              <item name="android:navigationBarColor">#101318</item>
              <item name="android:statusBarColor">#101318</item>
            </style>
          </resources>
          EOF

          cat > app/src/main/res/xml/accessibility.xml <<'EOF'
          <accessibility-service
            xmlns:android="http://schemas.android.com/apk/res/android"
            android:description="@string/accessibility_description"
            android:accessibilityEventTypes="typeWindowStateChanged|typeWindowContentChanged"
            android:accessibilityFeedbackType="feedbackGeneric"
            android:notificationTimeout="100"
            android:canPerformGestures="true"
            android:canRetrieveWindowContent="true" />
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <application
              android:allowBackup="false"
              android:label="@string/app_name"
              android:theme="@style/AppTheme">

              <activity
                android:name=".MainActivity"
                android:exported="true">
                <intent-filter>
                  <action android:name="android.intent.action.MAIN"/>
                  <category android:name="android.intent.category.LAUNCHER"/>
                </intent-filter>
              </activity>

              <service
                android:name=".BotAccessibility"
                android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE"
                android:exported="false">
                <intent-filter>
                  <action android:name="android.accessibilityservice.AccessibilityService"/>
                </intent-filter>
                <meta-data
                  android:name="android.accessibilityservice"
                  android:resource="@xml/accessibility"/>
              </service>
            </application>
          </manifest>
          EOF

          cat > app/src/main/java/com/dustinbot/v2/BotAccessibility.java <<'EOF'
          package com.dustinbot.v2;

          import android.accessibilityservice.AccessibilityService;
          import android.accessibilityservice.GestureDescription;
          import android.graphics.Path;
          import android.view.accessibility.AccessibilityEvent;

          public class BotAccessibility extends AccessibilityService {
            public static volatile BotAccessibility instance;

            @Override
            protected void onServiceConnected() {
              super.onServiceConnected();
              instance = this;
              MainActivity.postStatus("ACCESSIBILITY: CONNECTED");
            }

            @Override public void onAccessibilityEvent(AccessibilityEvent event) {}
            @Override public void onInterrupt() {}

            public static boolean ready() {
              return instance != null;
            }

            public static boolean tap(float x, float y) {
              if (instance == null) return false;
              Path p = new Path();
              p.moveTo(x, y);
              GestureDescription g =
                new GestureDescription.Builder()
                  .addStroke(new GestureDescription.StrokeDescription(p, 0, 70))
                  .build();
              return instance.dispatchGesture(g, null, null);
            }

            public static boolean swipe(float x1,float y1,float x2,float y2,long ms) {
              if (instance == null) return false;
              Path p = new Path();
              p.moveTo(x1,y1);
              p.lineTo(x2,y2);
              GestureDescription g =
                new GestureDescription.Builder()
                  .addStroke(new GestureDescription.StrokeDescription(p,0,ms))
                  .build();
              return instance.dispatchGesture(g,null,null);
            }
          }
          EOF

          cat > app/src/main/java/com/dustinbot/v2/MainActivity.java <<'EOF'
          package com.dustinbot.v2;

          import android.app.Activity;
          import android.content.Intent;
          import android.graphics.Color;
          import android.os.Bundle;
          import android.os.Handler;
          import android.os.Looper;
          import android.provider.Settings;
          import android.view.Gravity;
          import android.widget.*;

          public class MainActivity extends Activity {
            static TextView status;
            static LinearLayout logBox;
            static Handler ui = new Handler(Looper.getMainLooper());

            @Override
            protected void onCreate(Bundle b) {
              super.onCreate(b);

              LinearLayout root = new LinearLayout(this);
              root.setOrientation(LinearLayout.VERTICAL);
              root.setPadding(18,18,18,18);
              root.setBackgroundColor(Color.rgb(245,246,248));

              TextView title = tv("DUSTINBOT  V2", 25, Color.BLACK);
              title.setGravity(Gravity.CENTER);
              root.addView(title);

              status = tv("● STOP", 17, Color.DKGRAY);
              status.setPadding(0,10,0,10);
              root.addView(status);

              MapView map = new MapView(this);
              LinearLayout.LayoutParams mp =
                new LinearLayout.LayoutParams(-1,0,1.5f);
              root.addView(map,mp);

              LinearLayout info = new LinearLayout(this);
              info.setOrientation(LinearLayout.HORIZONTAL);

              TextView ch = tv(
                "CHARACTER\nLv. --\nHP  -- / --\nSP  -- / --\nJOB  --",
                15, Color.DKGRAY);
              TextView target = tv(
                "TARGET\nMonster: --\nHP: --\nDistance: --\nState: SEARCH",
                15, Color.DKGRAY);

              info.addView(ch,new LinearLayout.LayoutParams(0,-2,1));
              info.addView(target,new LinearLayout.LayoutParams(0,-2,1));
              root.addView(info);

              LinearLayout buttons = new LinearLayout(this);
              buttons.setOrientation(LinearLayout.HORIZONTAL);

              Button access = btn("ACCESSIBILITY");
              access.setOnClickListener(v ->
                startActivity(new Intent(Settings.ACTION_ACCESSIBILITY_SETTINGS)));
              buttons.addView(access,new LinearLayout.LayoutParams(0,-2,1));

              Button start = btn("START");
              start.setOnClickListener(v -> {
                if (!BotAccessibility.ready()) {
                  postStatus("ACCESSIBILITY: NOT CONNECTED");
                  return;
                }
                BotEngine.start();
              });
              buttons.addView(start,new LinearLayout.LayoutParams(0,-2,1));

              Button stop = btn("STOP");
              stop.setOnClickListener(v -> BotEngine.stop());
              buttons.addView(stop,new LinearLayout.LayoutParams(0,-2,1));

              root.addView(buttons);

              TextView consoleTitle = tv("CONSOLE",16,Color.BLACK);
              root.addView(consoleTitle);

              ScrollView scroll = new ScrollView(this);
              logBox = new LinearLayout(this);
              logBox.setOrientation(LinearLayout.VERTICAL);
              scroll.addView(logBox);
              root.addView(scroll,new LinearLayout.LayoutParams(-1,0,1));

              postStatus("READY — เปิดเกมแล้วค่อย START");
              log("System ready.");
              log("V2 architecture: MAP / CHARACTER / TARGET / AI / LOOT");

              setContentView(root);
            }

            static TextView tv(String s,float size
