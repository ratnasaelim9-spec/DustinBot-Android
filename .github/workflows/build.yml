      # =========================================================
      # BOT ENGINE
      # =========================================================

      - name: Create BotEngine.java
        shell: bash
        run: |

          cat > app/src/main/java/com/dustinbot/v3/BotEngine.java <<'EOF'

          package com.dustinbot.v3;

          import android.content.Context;
          import android.os.Handler;
          import android.os.Looper;


          public class BotEngine {

              public interface Listener {

                  void onState(
                      String state
                  );

                  void onConsole(
                      String message
                  );

              }


              private final Context context;

              private final Listener listener;

              private final Handler handler =
                      new Handler(
                          Looper.getMainLooper()
                      );


              private boolean running =
                      false;


              private boolean directionRight =
                      true;


              public BotEngine(
                      Context context,
                      Listener listener
              ) {

                  this.context =
                      context.getApplicationContext();

                  this.listener =
                      listener;

              }


              public boolean isRunning() {

                  return running;

              }


              // =================================================
              // START
              // =================================================

              public void start() {

                  if (!SettingsStore.hasPoint(
                          context,
                          "MOVE"
                  )) {

                      listener.onConsole(
                          "กรุณาตั้ง MOVE ก่อน"
                      );

                      return;

                  }


                  if (!SettingsStore.hasPoint(
                          context,
                          "ATTACK"
                  )) {

                      listener.onConsole(
                          "กรุณาตั้ง ATTACK ก่อน"
                      );

                      return;

                  }


                  if (!SettingsStore.hasPoint(
                          context,
                          "LOOT"
                  )) {

                      listener.onConsole(
                          "กรุณาตั้ง LOOT ก่อน"
                      );

                      return;

                  }


                  if (
                      BotAccessibility.getInstance()
                      == null
                  ) {

                      listener.onConsole(
                          "Accessibility Service ยังไม่ทำงาน"
                      );

                      return;

                  }


                  running =
                      true;


                  listener.onConsole(
                      "BOT STARTED"
                  );


                  loop();

              }


              // =================================================
              // STOP
              // =================================================

              public void stop() {

                  running =
                      false;


                  handler.removeCallbacksAndMessages(
                      null
                  );


                  listener.onState(
                      "STOP"
                  );


                  listener.onConsole(
                      "BOT STOPPED"
                  );

              }


              // =================================================
              // LOOP
              // =================================================

              private void loop() {

                  if (!running) {
                      return;
                  }


                  walk();


                  handler.postDelayed(
                      () -> {

                          if (!running) {
                              return;
                          }


                          attack();


                          handler.postDelayed(
                              () -> {

                                  if (!running) {
                                      return;
                                  }


                                  loot();


                                  handler.postDelayed(
                                      this::loop,
                                      1200
                                  );


                              },
                              1600
                          );


                      },
                      2200
                  );

              }


              // =================================================
              // WALK
              // =================================================

              private void walk() {

                  BotAccessibility service =
                          BotAccessibility.getInstance();


                  if (service == null) {
                      return;
                  }


                  listener.onState(
                      "WALK"
                  );


                  listener.onConsole(
                      "Walking..."
                  );


                  float x =
                      SettingsStore.getX(
                          context,
                          "MOVE"
                      );


                  float y =
                      SettingsStore.getY(
                          context,
                          "MOVE"
                      );


                  float x2;


                  if (directionRight) {

                      x2 =
                          x + 220;

                  } else {

                      x2 =
                          x - 220;

                  }


                  service.swipe(
                      x,
                      y,
                      x2,
                      y,
                      1200
                  );


                  directionRight =
                      !directionRight;

              }


              // =================================================
              // ATTACK
              // =================================================

              private void attack() {

                  BotAccessibility service =
                          BotAccessibility.getInstance();


                  if (service == null) {
                      return;
                  }


                  listener.onState(
                      "ATTACK"
                  );


                  listener.onConsole(
                      "Attacking game locked target..."
                  );


                  float x =
                      SettingsStore.getX(
                          context,
                          "ATTACK"
                      );


                  float y =
                      SettingsStore.getY(
                          context,
                          "ATTACK"
                      );


                  for (
                      int i = 0;
                      i < 5;
                      i++
                  ) {

                      final int index =
                              i;


                      handler.postDelayed(
                          () -> {

                              if (!running) {
                                  return;
                              }


                              BotAccessibility current =
                                      BotAccessibility
                                          .getInstance();


                              if (current != null) {

                                  current.tap(
                                      x,
                                      y
                                  );

                              }

                          },
                          index * 250L
                      );

                  }

              }


              // =================================================
              // LOOT
              // =================================================

              private void loot() {

                  BotAccessibility service =
                          BotAccessibility.getInstance();


                  if (service == null) {
                      return;
                  }


                  listener.onState(
                      "LOOT"
                  );


                  listener.onConsole(
                      "Loot..."
                  );


                  float x =
                      SettingsStore.getX(
                          context,
                          "LOOT"
                      );


                  float y =
                      SettingsStore.getY(
                          context,
                          "LOOT"
                      );


                  service.tap(
                      x,
                      y
                  );

              }

          }

          EOF


      # =========================================================
      # MAIN ACTIVITY
      # =========================================================

      - name: Create MainActivity.java
        shell: bash
        run: |

          cat > app/src/main/java/com/dustinbot/v3/MainActivity.java <<'EOF'

          package com.dustinbot.v3;

          import android.app.Activity;

          import android.content.Intent;

          import android.graphics.Color;

          import android.os.Bundle;

          import android.provider.Settings;

          import android.view.Gravity;

          import android.widget.Button;

          import android.widget.LinearLayout;

          import android.widget.TextView;


          public class MainActivity
                  extends Activity {


              private int dp(
                      int value
              ) {

                  return (int)(
                      value *
                      getResources()
                          .getDisplayMetrics()
                          .density
                  );

              }


              private TextView text(
                      String value,
                      int size
              ) {

                  TextView t =
                          new TextView(this);

                  t.setText(
                      value
                  );

                  t.setTextColor(
                      Color.WHITE
                  );

                  t.setTextSize(
                      size
                  );

                  t.setPadding(
                      dp(12),
                      dp(12),
                      dp(12),
                      dp(12)
                  );

                  return t;

              }


              private Button button(
                      String value
              ) {

                  Button b =
                          new Button(this);

                  b.setText(
                      value
                  );

                  return b;

              }


              @Override
              protected void onCreate(
                      Bundle savedInstanceState
              ) {

                  super.onCreate(
                      savedInstanceState
                  );


                  LinearLayout root =
                          new LinearLayout(this);

                  root.setOrientation(
                      LinearLayout.VERTICAL
                  );

                  root.setPadding(
                      dp(16),
                      dp(16),
                      dp(16),
                      dp(16)
                  );

                  root.setBackgroundColor(
                      Color.rgb(
                          7,
                          11,
                          18
                      )
                  );


                  TextView title =
                          text(
                              "🤖 DUSTINBOT\n" +
                              "ANDROID V3",
                              27
                          );

                  title.setGravity(
                      Gravity.CENTER
                  );


                  root.addView(
                      title
                  );


                  root.addView(
                      text(
                          "OpenKore-style Android Bot\n\n" +
                          "ตัวเกมจะแสดงอยู่ด้านหลัง\n" +
                          "DustinBot จะทำงานเป็น Floating Overlay",
                          16
                      )
                  );


                  Button accessibility =
                          button(
                              "1. OPEN ACCESSIBILITY"
                          );


                  accessibility.setOnClickListener(
                      v -> {

                          Intent intent =
                              new Intent(
                                  Settings
                                      .ACTION_ACCESSIBILITY_SETTINGS
                              );

                          startActivity(
                              intent
                          );

                      }
                  );


                  root.addView(
                      accessibility
                  );


                  Button overlay =
                          button(
                              "2. SHOW BOT OVER GAME"
                          );


                  overlay.setOnClickListener(
                      v -> {

                          BotAccessibility service =
                              BotAccessibility
                                  .getInstance();


                          if (service != null) {

                              service.showOverlay();

                          } else {

                              accessibility.performClick();

                          }

                      }
                  );


                  root.addView(
                      overlay
                  );


                  root.addView(
                      text(
                          "วิธีใช้งาน\n\n" +
                          "① เปิด Accessibility\n" +
                          "② เปิดเกม Dustin RO\n" +
                          "③ กลับมาเปิด DustinBot\n" +
                          "④ กด SHOW BOT OVER GAME\n" +
                          "⑤ หน้าต่างบอทจะลอยบนเกม\n" +
                          "⑥ ตั้ง MOVE / ATTACK / LOOT\n" +
                          "⑦ กด START\n\n" +
                          "เกมเป็นผู้ล็อกมอนสเตอร์เอง\n" +
                          "บอทควบคุมการเดิน โจมตี และเก็บของ",
                          15
                      )
                  );


                  root.addView(
                      text(
                          "STATUS\n" +
                          "Accessibility Overlay: READY\n" +
                          "Game control: Accessibility\n" +
                          "Target: GAME LOCK",
                          15
                      )
                  );


                  setContentView(
                      root
                  );

              }

          }

