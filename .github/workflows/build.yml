name: Build DustinBot Android V3

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Create project folders
        shell: bash
        run: |
          set -e

          mkdir -p app/src/main/java/com/dustinbot/v3
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/xml

      - name: Create settings.gradle
        shell: bash
        run: |
          cat > settings.gradle <<'EOF'
pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

dependencyResolutionManagement {
    repositoriesMode.set(
        RepositoriesMode.FAIL_ON_PROJECT_REPOS
    )

    repositories {
        google()
        mavenCentral()
    }
}

rootProject.name = "DustinBotAndroidV3"

include(":app")
EOF

      - name: Create root build.gradle
        shell: bash
        run: |
          cat > build.gradle <<'EOF'
plugins {
    id 'com.android.application' version '8.6.1' apply false
}
EOF

      - name: Create gradle.properties
        shell: bash
        run: |
          cat > gradle.properties <<'EOF'
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
android.nonTransitiveRClass=true
EOF

      - name: Create app build.gradle
        shell: bash
        run: |
          cat > app/build.gradle <<'EOF'
plugins {
    id 'com.android.application'
}

android {
    namespace 'com.dustinbot.v3'

    compileSdk 35

    defaultConfig {
        applicationId 'com.dustinbot.v3'
        minSdk 26
        targetSdk 35
        versionCode 30
        versionName '3.0'
    }

    buildTypes {
        debug {
            minifyEnabled false
        }

        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.core:core:1.15.0'
    implementation 'com.google.android.material:material:1.12.0'
}
EOF

      - name: Create strings.xml
        shell: bash
        run: |
          cat > app/src/main/res/values/strings.xml <<'EOF'
<resources>
    <string name="app_name">DustinBot Android V3</string>
    <string name="accessibility_description">DustinBot automation service</string>
</resources>
EOF

      - name: Create themes.xml
        shell: bash
        run: |
          cat > app/src/main/res/values/themes.xml <<'EOF'
<resources>
    <style
        name="Theme.DustinBot"
        parent="Theme.Material3.DayNight.NoActionBar">

        <item name="android:fontFamily">sans</item>
        <item name="android:windowLightStatusBar">false</item>
        <item name="android:statusBarColor">#070B12</item>
        <item name="android:navigationBarColor">#070B12</item>

    </style>
</resources>
EOF

      - name: Create accessibility.xml
        shell: bash
        run: |
          cat > app/src/main/res/xml/accessibility.xml <<'EOF'
<accessibility-service
    xmlns:android="http://schemas.android.com/apk/res/android"
    android:accessibilityEventTypes="typeAllMask"
    android:accessibilityFeedbackType="feedbackGeneric"
    android:accessibilityFlags="flagDefault|flagRetrieveInteractiveWindows|flagIncludeNotImportantViews"
    android:canRetrieveWindowContent="true"
    android:canPerformGestures="true"
    android:description="@string/accessibility_description"
    android:notificationTimeout="100" />
EOF

      - name: Create AndroidManifest.xml
        shell: bash
        run: |
          cat > app/src/main/AndroidManifest.xml <<'EOF'
<manifest xmlns:android="http://schemas.android.com/apk/res/android">

    <application
        android:allowBackup="true"
        android:label="@string/app_name"
        android:supportsRtl="true"
        android:theme="@style/Theme.DustinBot">

        <activity
            android:name=".MainActivity"
            android:exported="true">

            <intent-filter>
                <action android:name="android.intent.action.MAIN" />
                <category android:name="android.intent.category.LAUNCHER" />
            </intent-filter>

        </activity>

        <service
            android:name=".BotAccessibility"
            android:exported="true"
            android:label="@string/app_name"
            android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE">

            <intent-filter>
                <action android:name="android.accessibilityservice.AccessibilityService" />
            </intent-filter>

            <meta-data
                android:name="android.accessibilityservice"
                android:resource="@xml/accessibility" />

        </service>

    </application>

</manifest>
EOF

      - name: Create SettingsStore.java
        shell: bash
        run: |
          cat > app/src/main/java/com/dustinbot/v3/SettingsStore.java <<'EOF'
package com.dustinbot.v3;

import android.content.Context;
import android.content.SharedPreferences;

public final class SettingsStore {

    private static final String PREF =
            "dustinbot_v3_settings";

    private SettingsStore() {
    }

    private static SharedPreferences prefs(
            Context context
    ) {
        return context.getSharedPreferences(
                PREF,
                Context.MODE_PRIVATE
        );
    }

    public static void savePoint(
            Context context,
            String key,
            float x,
            float y
    ) {
        prefs(context)
                .edit()
                .putFloat(key + "_x", x)
                .putFloat(key + "_y", y)
                .apply();
    }

    public static float getX(
            Context context,
            String key
    ) {
        return prefs(context)
                .getFloat(key + "_x", -1);
    }

    public static float getY(
            Context context,
            String key
    ) {
        return prefs(context)
                .getFloat(key + "_y", -1);
    }

    public static boolean hasPoint(
            Context context,
            String key
    ) {
        return getX(context, key) >= 0
                && getY(context, key) >= 0;
    }
}
EOF

      - name: Create BotAccessibility.java
        shell: bash
        run: |
          cat > app/src/main/java/com/dustinbot/v3/BotAccessibility.java <<'EOF'
package com.dustinbot.v3;

import android.accessibilityservice.AccessibilityService;
import android.accessibilityservice.GestureDescription;

import android.graphics.Color;
import android.graphics.Path;
import android.graphics.PixelFormat;

import android.os.Handler;
import android.os.Looper;

import android.view.Gravity;
import android.view.MotionEvent;
import android.view.View;
import android.view.WindowManager;

import android.widget.Button;
import android.widget.LinearLayout;
import android.widget.ScrollView;
import android.widget.TextView;

import android.view.accessibility.AccessibilityEvent;

public class BotAccessibility
        extends AccessibilityService {

    private static BotAccessibility instance;

    private WindowManager windowManager;

    private View overlay;

    private WindowManager.LayoutParams overlayParams;

    private final Handler handler =
            new Handler(Looper.getMainLooper());

    private BotEngine botEngine;

    private TextView statusText;

    private TextView aiText;

    private TextView targetText;

    private TextView characterText;

    private TextView consoleText;

    private boolean overlayVisible = false;

    public static BotAccessibility getInstance() {
        return instance;
    }

    @Override
    protected void onServiceConnected() {

        super.onServiceConnected();

        instance = this;

        windowManager =
                (WindowManager)
                        getSystemService(
                                WINDOW_SERVICE
                        );

        botEngine =
                new BotEngine(
                        this,
                        new BotEngine.Listener() {

                            @Override
                            public void onState(
                                    String state
                            ) {

                                updateAI(state);
                            }

                            @Override
                            public void onConsole(
                                    String message
                            ) {

                                appendConsole(message);
                            }
                        }
                );

        showOverlay();
    }

    @Override
    public void onAccessibilityEvent(
            AccessibilityEvent event
    ) {
        // Reserved for game screen-state reading.
    }

    @Override
    public void onInterrupt() {

        stopBot();
    }

    @Override
    public void onDestroy() {

        stopBot();

        removeOverlay();

        instance = null;

        super.onDestroy();
    }

    public void showOverlay() {

        handler.post(
                () -> {

                    if (overlayVisible) {
                        return;
                    }

                    createOverlay();
                }
        );
    }

    private void createOverlay() {

        if (windowManager == null) {
            return;
        }

        LinearLayout root =
                new LinearLayout(this);

        root.setOrientation(
                LinearLayout.VERTICAL
        );

        root.setPadding(
                12,
                10,
                12,
                10
        );

        root.setBackgroundColor(
                Color.rgb(
                        10,
                        17,
                        27
                )
        );

        LinearLayout header =
                new LinearLayout(this);

        header.setOrientation(
                LinearLayout.HORIZONTAL
        );

        TextView title =
                makeText(
                        "🤖 DUSTINBOT",
                        18
                );

        header.addView(
                title,
                new LinearLayout.LayoutParams(
                        0,
                        -2,
                        1
                )
        );

        Button close =
                makeButton("×");

        header.addView(
                close,
                new LinearLayout.LayoutParams(
                        55,
                        55
                )
        );

        root.addView(header);

        statusText =
                makeText(
                        "● STOPPED",
                        15
                );

        root.addView(statusText);

        characterText =
                makeText(
                        "CHARACTER\n" +
                        "Level: --\n" +
                        "Job: --\n" +
                        "HP: --\n" +
                        "SP: --",
                        13
                );

        root.addView(characterText);

        targetText =
                makeText(
                        "TARGET\n" +
                        "Monster: GAME LOCK\n" +
                        "HP: --\n" +
                        "Distance: --\n" +
                        "State: --",
                        13
                );

        root.addView(targetText);

        aiText =
                makeText(
                        "AI STATUS\nIDLE",
                        13
                );

        root.addView(aiText);

        LinearLayout controls =
                new LinearLayout(this);

        controls.setOrientation(
                LinearLayout.HORIZONTAL
        );

        Button start =
                makeButton("START");

        Button stop =
                makeButton("STOP");

        Button hide =
                makeButton("HIDE");

        controls.addView(
                start,
                new LinearLayout.LayoutParams(
                        0,
                        60,
                        1
                )
        );

        controls.addView(
                stop,
                new LinearLayout.LayoutParams(
                        0,
                        60,
                        1
                )
        );

        controls.addView(
                hide,
                new LinearLayout.LayoutParams(
                        0,
                        60,
                        1
                )
        );

        root.addView(controls);

        Button move =
                makeButton("SET MOVE");

        Button attack =
                makeButton("SET ATTACK");

        Button loot =
                makeButton("SET LOOT");

        root.addView(move);

        root.addView(attack);

        root.addView(loot);

        TextView consoleTitle =
                makeText(
                        "CONSOLE",
                        14
                );

        root.addView(consoleTitle);

        consoleText =
                makeText(
                        "DustinBot ready.",
                        11
                );

        ScrollView scroll =
                new ScrollView(this);

        scroll.addView(
                consoleText
        );

        root.addView(
                scroll,
                new LinearLayout.LayoutParams(
                        -1,
                        180
                )
        );

        start.setOnClickListener(
                v -> startBot()
        );

        stop.setOnClickListener(
                v -> stopBot()
        );

        hide.setOnClickListener(
                v -> minimizeOverlay()
        );

        close.setOnClickListener(
                v -> removeOverlay()
        );

        move.setOnClickListener(
                v -> startCalibration("MOVE")
        );

        attack.setOnClickListener(
                v -> startCalibration("ATTACK")
        );

        loot.setOnClickListener(
                v -> startCalibration("LOOT")
        );

        overlayParams =
                new WindowManager.LayoutParams(
                        720,
                        WindowManager.LayoutParams.WRAP_CONTENT,
                        WindowManager.LayoutParams.TYPE_ACCESSIBILITY_OVERLAY,
                        WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE,
                        PixelFormat.TRANSLUCENT
                );

        overlayParams.gravity =
                Gravity.TOP |
                Gravity.START;

        overlayParams.x = 25;

        overlayParams.y = 120;

        overlay = root;

        windowManager.addView(
                overlay,
                overlayParams
        );

        overlayVisible = true;
    }

    private void minimizeOverlay() {

        if (!overlayVisible) {
            return;
        }

        removeOverlay();

        LinearLayout mini =
                new LinearLayout(this);

        mini.setOrientation(
                LinearLayout.HORIZONTAL
        );

        mini.setPadding(
                15,
                5,
                5,
                5
        );

        mini.setBackgroundColor(
                Color.rgb(
                        10,
                        17,
                        27
                )
        );

        TextView title =
                makeText(
                        "🤖 DUSTINBOT",
                        13
                );

        mini.addView(
                title,
                new LinearLayout.LayoutParams(
                        0,
                        60,
                        1
                )
        );

        Button open =
                makeButton("OPEN");

        mini.addView(
                open,
                new LinearLayout.LayoutParams(
                        120,
                        60
                )
        );

        open.setOnClickListener(
                v -> {

                    removeOverlay();

                    showOverlay();
                }
        );

        overlayParams =
                new WindowManager.LayoutParams(
                        400,
                        WindowManager.LayoutParams.WRAP_CONTENT,
                        WindowManager.LayoutParams.TYPE_ACCESSIBILITY_OVERLAY,
                        WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE,
                        PixelFormat.TRANSLUCENT
                );

        overlayParams.gravity =
                Gravity.TOP |
                Gravity.START;

        overlayParams.x = 25;

        overlayParams.y = 120;

        overlay = mini;

        windowManager.addView(
                overlay,
                overlayParams
        );

        overlayVisible = true;
    }

    public void removeOverlay() {

        handler.post(
                () -> {

                    if (
                            overlay != null &&
                            windowManager != null
                    ) {

                        try {

                            windowManager.removeView(
                                    overlay
                            );

                        } catch (Exception ignored) {
                        }
                    }

                    overlay = null;

                    overlayVisible = false;
                }
        );
    }

    private void startBot() {

        if (botEngine == null) {
            return;
        }

        botEngine.start();

        if (statusText != null) {

            statusText.setText(
                    "● RUNNING"
            );
        }
    }

    private void stopBot() {

        if (botEngine != null) {

            botEngine.stop();
        }

        if (statusText != null) {

            statusText.setText(
                    "● STOPPED"
            );
        }
    }

    private void startCalibration(
            String mode
    ) {

        CalibrationOverlay.show(
                this,
                mode
        );
    }

    private void updateAI(
            String state
    ) {

        handler.post(
                () -> {

                    if (aiText != null) {

                        aiText.setText(
                                "AI STATUS\n" +
                                state
                        );
                    }
                }
        );
    }

    private void appendConsole(
            String message
    ) {

        handler.post(
                () -> {

                    if (consoleText != null) {

                        consoleText.append(
                                "\n> " +
                                message
                        );
                    }
                }
        );
    }

    private TextView makeText(
            String value,
            int size
    ) {

        TextView view =
                new TextView(this);

        view.setText(value);

        view.setTextColor(
                Color.WHITE
        );

        view.setTextSize(
                size
        );

        view.setPadding(
                6,
                6,
                6,
                6
        );

        return view;
    }

    private Button makeButton(
            String value
    ) {

        Button button =
                new Button(this);

        button.setText(value);

        button.setTextSize(11);

        return button;
    }

    public boolean tap(
            float x,
            float y
    ) {

        Path path =
                new Path();

        path.moveTo(
                x,
                y
        );

        GestureDescription.StrokeDescription stroke =
                new GestureDescription.StrokeDescription(
                        path,
                        0,
                        80
                );

        GestureDescription gesture =
                new GestureDescription.Builder()
                        .addStroke(stroke)
                        .build();

        return dispatchGesture(
                gesture,
                null,
                null
        );
    }

    public boolean swipe(
            float x1,
            float y1,
            float x2,
            float y2,
            long duration
    ) {

        Path path =
                new Path();

        path.moveTo(
                x1,
                y1
        );

        path.lineTo(
                x2,
                y2
        );

        GestureDescription.StrokeDescription stroke =
                new GestureDescription.StrokeDescription(
                        path,
                        0,
                        duration
                );

        GestureDescription gesture =
                new GestureDescription.Builder()
                        .addStroke(stroke)
                        .build();

        return dispatchGesture(
                gesture,
                null,
                null
        );
    }
}
EOF

      - name: Create CalibrationOverlay.java
        shell: bash
        run: |
          cat > app/src/main/java/com/dustinbot/v3/CalibrationOverlay.java <<'EOF'
package com.dustinbot.v3;

import android.graphics.Color;
import android.graphics.PixelFormat;

import android.view.Gravity;
import android.view.MotionEvent;
import android.view.View;
import android.view.WindowManager;

import android.widget.Button;
import android.widget.LinearLayout;
import android.widget.TextView;

public final class CalibrationOverlay {

    private CalibrationOverlay() {
    }

    public static void show(
            BotAccessibility service,
            String mode
    ) {

        WindowManager wm =
                (WindowManager)
                        service.getSystemService(
                                BotAccessibility.WINDOW_SERVICE
                        );

        LinearLayout root =
                new LinearLayout(service);

        root.setOrientation(
                LinearLayout.VERTICAL
        );

        root.setPadding(
                15,
                12,
                15,
                12
        );

        root.setBackgroundColor(
                Color.rgb(
                        8,
                        15,
                        24
                )
        );

        TextView title =
                new TextView(service);

        title.setText(
                "CALIBRATION: " +
                mode +
                "\nแตะตำแหน่งบนหน้าเกม"
        );

        title.setTextColor(
                Color.WHITE
        );

        title.setTextSize(
                16
        );

        root.addView(title);

        TextView coordinate =
                new TextView(service);

        coordinate.setText(
                "X: --   Y: --"
        );

        coordinate.setTextColor(
                Color.WHITE
        );

        coordinate.setTextSize(
                14
        );

        root.addView(coordinate);

        Button save =
                new Button(service);

        save.setText("SAVE");

        save.setEnabled(false);

        root.addView(save);

        Button cancel =
                new Button(service);

        cancel.setText("CANCEL");

        root.addView(cancel);

        final float[] point =
                new float[]{-1, -1};

        WindowManager.LayoutParams params =
                new WindowManager.LayoutParams(
                        650,
                        WindowManager.LayoutParams.WRAP_CONTENT,
                        WindowManager.LayoutParams.TYPE_ACCESSIBILITY_OVERLAY,
                        WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE,
                        PixelFormat.TRANSLUCENT
                );

        params.gravity =
                Gravity.TOP |
                Gravity.CENTER_HORIZONTAL;

        params.y = 80;

        View touchView =
                new View(service);

        touchView.setBackgroundColor(
                Color.argb(
                        1,
                        255,
                        255,
                        255
                )
        );

        touchView.setOnTouchListener(
                new View.OnTouchListener() {

                    @Override
                    public boolean onTouch(
                            View v,
                            MotionEvent event
                    ) {

                        if (
                                event.getAction()
                                        == MotionEvent.ACTION_UP
                        ) {

                            point[0] =
                                    event.getRawX();

                            point[1] =
                                    event.getRawY();

                            coordinate.setText(
                                    "X: " +
                                    point[0] +
                                    "   Y: " +
                                    point[1]
                            );

                            save.setEnabled(
                                    true
                            );

                            return true;
                        }

                        return true;
                    }
                }
        );

        LinearLayout.LayoutParams touchParams =
                new LinearLayout.LayoutParams(
                        -1,
                        120
                );

        root.addView(
                touchView,
                0,
                touchParams
        );

        save.setOnClickListener(
                v -> {

                    if (
                            point[0] >= 0 &&
                            point[1] >= 0
                    ) {

                        SettingsStore.savePoint(
                                service,
                                mode,
                                point[0],
                                point[1]
                        );

                        coordinate.setText(
                                "SAVED\n" +
                                "X: " +
                                point[0] +
                                "\nY: " +
                                point[1]
                        );
                    }
                }
        );

        cancel.setOnClickListener(
                v -> {

                    try {

                        wm.removeView(
                                root
                        );

                    } catch (Exception ignored) {
                    }
                }
        );

        wm.addView(
                root,
                params
        );
    }
}
EOF

      - name: Create BotEngine.java
        shell: bash
        run: |
          cat > app/src/main/java/com/dustinbot/v3/BotEngine.java <<'EOF'
package com.dustinbot.v3;

import android.content.Context;
import android.os.Handler;
import android.os.Looper;

public class BotEngine {

    public interface Listener {

        void onState(
                String state
        );

        void onConsole(
                String message
        );
    }

    private final Context context;

    private final Listener listener;

    private final Handler handler =
            new Handler(
                    Looper.getMainLooper()
            );

    private boolean running =
            false;

    private boolean directionRight =
            true;

    public BotEngine(
            Context context,
            Listener listener
    ) {

        this.context =
                context.getApplicationContext();

        this.listener =
                listener;
    }

    public boolean isRunning() {

        return running;
    }

    public void start() {

        if (!SettingsStore.hasPoint(
                context,
                "MOVE"
        )) {

            listener.onConsole(
                    "MOVE ยังไม่ได้ตั้งค่า"
            );

            return;
        }

        if (!SettingsStore.hasPoint(
                context,
                "ATTACK"
        )) {

            listener.onConsole(
                    "ATTACK ยังไม่ได้ตั้งค่า"
            );

            return;
        }

        if (!SettingsStore.hasPoint(
                context,
                "LOOT"
        )) {

            listener.onConsole(
                    "LOOT ยังไม่ได้ตั้งค่า"
            );

            return;
        }

        if (
                BotAccessibility.getInstance()
                        == null
        ) {

            listener.onConsole(
                    "Accessibility Service ยังไม่ทำงาน"
            );

            return;
        }

        running = true;

        listener.onConsole(
                "BOT STARTED"
        );

        loop();
    }

    public void stop() {

        running = false;

        handler.removeCallbacksAndMessages(
                null
        );

        listener.onState(
                "STOP"
        );

        listener.onConsole(
                "BOT STOPPED"
        );
    }

    private void loop() {

        if (!running) {
            return;
        }

        walk();

        handler.postDelayed(
                () -> {

                    if (!running) {
                        return;
                    }

                    attack();

                    handler.postDelayed(
                            () -> {

                                if (!running) {
                                    return;
                                }

                                loot();

                                handler.postDelayed(
                                        this::loop,
                                        1200
                                );

                            },
                            1800
                    );

                },
                2200
        );
    }

    private void walk() {

        BotAccessibility service =
                BotAccessibility.getInstance();

        if (service == null) {
            return;
        }

        listener.onState(
                "WALK"
        );

        listener.onConsole(
                "Walking..."
        );

        float x =
                SettingsStore.getX(
                        context,
                        "MOVE"
                );

        float y =
                SettingsStore.getY(
                        context,
                        "MOVE"
                );

        float x2 =
                directionRight
                        ? x + 220
                        : x - 220;

        service.swipe(
                x,
                y,
                x2,
                y,
                1200
        );

        directionRight =
                !directionRight;
    }

    private void attack() {

        BotAccessibility service =
                BotAccessibility.getInstance();

        if (service == null) {
            return;
        }

        listener.onState(
                "ATTACK"
        );

        listener.onConsole(
                "Attacking game locked target..."
        );

        float x =
                SettingsStore.getX(
                        context,
                        "ATTACK"
                );

        float y =
                SettingsStore.getY(
                        context,
                        "ATTACK"
                );

        for (
                int i = 0;
                i < 5;
                i++
        ) {

            final int index =
                    i;

            handler.postDelayed(
                    () -> {

                        if (!running) {
                            return;
                        }

                        BotAccessibility current =
                                BotAccessibility
                                        .getInstance();

                        if (current != null) {

                            current.tap(
                                    x,
                                    y
                            );
                        }

                    },
                    index * 250L
            );
        }
    }

    private void loot() {

        BotAccessibility service =
                BotAccessibility.getInstance();

        if (service == null) {
            return;
        }

        listener.onState(
                "LOOT"
        );

        listener.onConsole(
                "Loot..."
        );

        float x =
                SettingsStore.getX(
                        context,
                        "LOOT"
                );

        float y =
                SettingsStore.getY(
                        context,
                        "LOOT"
                );

        service.tap(
                x,
                y
        );
    }
}
EOF

      - name: Create MainActivity.java
        shell: bash
