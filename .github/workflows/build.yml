name: Build DustinBot Android V3

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # =========================================================
      # CHECKOUT
      # =========================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # =========================================================
      # JAVA
      # =========================================================

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'


      # =========================================================
      # CREATE PROJECT
      # =========================================================

      - name: Create Android project
        shell: bash
        run: |

          set -e

          mkdir -p app/src/main/java/com/dustinbot/v3
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/xml


      # =========================================================
      # SETTINGS.GRADLE
      # =========================================================

      - name: Create settings.gradle
        shell: bash
        run: |

          cat > settings.gradle <<'EOF'

          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(
                  RepositoriesMode.FAIL_ON_PROJECT_REPOS
              )

              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "DustinBotAndroidV3"

          include(":app")

          EOF


      # =========================================================
      # ROOT BUILD.GRADLE
      # =========================================================

      - name: Create root build.gradle
        shell: bash
        run: |

          cat > build.gradle <<'EOF'

          plugins {
              id 'com.android.application' version '8.6.1' apply false
          }

          EOF


      # =========================================================
      # GRADLE PROPERTIES
      # =========================================================

      - name: Create gradle.properties
        shell: bash
        run: |

          cat > gradle.properties <<'EOF'

          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

          android.useAndroidX=true

          android.nonTransitiveRClass=true

          EOF


      # =========================================================
      # APP BUILD.GRADLE
      # =========================================================

      - name: Create app/build.gradle
        shell: bash
        run: |

          cat > app/build.gradle <<'EOF'

          plugins {
              id 'com.android.application'
          }

          android {

              namespace 'com.dustinbot.v3'

              compileSdk 35

              defaultConfig {

                  applicationId 'com.dustinbot.v3'

                  minSdk 26

                  targetSdk 35

                  versionCode 30

                  versionName '3.0'

              }

              buildTypes {

                  debug {

                      minifyEnabled false

                  }

                  release {

                      minifyEnabled false

                  }

              }

              compileOptions {

                  sourceCompatibility JavaVersion.VERSION_17

                  targetCompatibility JavaVersion.VERSION_17

              }

          }

          dependencies {

              implementation 'androidx.appcompat:appcompat:1.7.0'

              implementation 'androidx.core:core:1.15.0'

              implementation 'com.google.android.material:material:1.12.0'

          }

          EOF


      # =========================================================
      # STRINGS
      # =========================================================

      - name: Create strings.xml
        shell: bash
        run: |

          cat > app/src/main/res/values/strings.xml <<'EOF'

          <?xml version="1.0" encoding="utf-8"?>

          <resources>

              <string name="app_name">
                  DustinBot Android V3
              </string>

              <string name="accessibility_description">
                  DustinBot automation service
              </string>

          </resources>

          EOF


      # =========================================================
      # THEME
      # =========================================================

      - name: Create themes.xml
        shell: bash
        run: |

          cat > app/src/main/res/values/themes.xml <<'EOF'

          <?xml version="1.0" encoding="utf-8"?>

          <resources>

              <style
                  name="Theme.DustinBot"
                  parent="Theme.Material3.DayNight.NoActionBar">

                  <item name="android:fontFamily">sans</item>

                  <item name="android:windowLightStatusBar">
                      false
                  </item>

                  <item name="android:statusBarColor">
                      #070B12
                  </item>

                  <item name="android:navigationBarColor">
                      #070B12
                  </item>

              </style>

          </resources>

          EOF


      # =========================================================
      # ACCESSIBILITY CONFIG
      # =========================================================

      - name: Create accessibility.xml
        shell: bash
        run: |

          cat > app/src/main/res/xml/accessibility.xml <<'EOF'

          <?xml version="1.0" encoding="utf-8"?>

          <accessibility-service
              xmlns:android="http://schemas.android.com/apk/res/android"

              android:accessibilityEventTypes="typeAllMask"

              android:accessibilityFeedbackType="feedbackGeneric"

              android:accessibilityFlags="
                  flagDefault|
                  flagRetrieveInteractiveWindows|
                  flagIncludeNotImportantViews
              "

              android:canRetrieveWindowContent="true"

              android:canPerformGestures="true"

              android:description="@string/accessibility_description"

              android:notificationTimeout="100"

              android:settingsActivity="
                  com.dustinbot.v3.MainActivity
              " />

          EOF


      # =========================================================
      # MANIFEST
      # =========================================================

      - name: Create AndroidManifest.xml
        shell: bash
        run: |

          cat > app/src/main/AndroidManifest.xml <<'EOF'

          <?xml version="1.0" encoding="utf-8"?>

          <manifest
              xmlns:android="http://schemas.android.com/apk/res/android">

              <application

                  android:allowBackup="true"

                  android:label="@string/app_name"

                  android:supportsRtl="true"

                  android:theme="@style/Theme.DustinBot">

                  <activity

                      android:name=".MainActivity"

                      android:exported="true">

                      <intent-filter>

                          <action
                              android:name="android.intent.action.MAIN" />

                          <category
                              android:name="android.intent.category.LAUNCHER" />

                      </intent-filter>

                  </activity>


                  <service

                      android:name=".BotAccessibility"

                      android:exported="false"

                      android:label="@string/app_name"

                      android:permission="
                          android.permission.BIND_ACCESSIBILITY_SERVICE">

                      <intent-filter>

                          <action
                              android:name="
                                  android.accessibilityservice.AccessibilityService" />

                      </intent-filter>

                      <meta-data

                          android:name="
                              android.accessibilityservice"

                          android:resource="
                              @xml/accessibility" />

                  </service>

              </application>

          </manifest>

          EOF


      # =========================================================
      # SETTINGS STORE
      # =========================================================

      - name: Create SettingsStore.java
        shell: bash
        run: |

          cat > app/src/main/java/com/dustinbot/v3/SettingsStore.java <<'EOF'

          package com.dustinbot.v3;

          import android.content.Context;
          import android.content.SharedPreferences;

          public final class SettingsStore {

              private static final String PREF =
                      "dustinbot_v3_settings";

              private SettingsStore() {
              }

              private static SharedPreferences prefs(
                      Context context
              ) {

                  return context.getSharedPreferences(
                      PREF,
                      Context.MODE_PRIVATE
                  );

              }

              public static void savePoint(
                      Context context,
                      String key,
                      float x,
                      float y
              ) {

                  prefs(context)
                      .edit()
                      .putFloat(key + "_x", x)
                      .putFloat(key + "_y", y)
                      .apply();

              }

              public static float getX(
                      Context context,
                      String key
              ) {

                  return prefs(context)
                      .getFloat(key + "_x", -1);

              }

              public static float getY(
                      Context context,
                      String key
              ) {

                  return prefs(context)
                      .getFloat(key + "_y", -1);

              }

              public static boolean hasPoint(
                      Context context,
                      String key
              ) {

                  return getX(context, key) >= 0
                      && getY(context, key) >= 0;

              }

          }

          EOF


      # =========================================================
      # BOT ACCESSIBILITY
      # =========================================================

      - name: Create BotAccessibility.java
        shell: bash
        run: |

          cat > app/src/main/java/com/dustinbot/v3/BotAccessibility.java <<'EOF'

          package com.dustinbot.v3;

          import android.accessibilityservice.AccessibilityService;
          import android.accessibilityservice.GestureDescription;

          import android.graphics.Path;

          import android.graphics.Color;

          import android.graphics.PixelFormat;

          import android.os.Handler;
          import android.os.Looper;

          import android.view.Gravity;
          import android.view.MotionEvent;
          import android.view.View;
          import android.view.WindowManager;

          import android.widget.Button;
          import android.widget.LinearLayout;
          import android.widget.ScrollView;
          import android.widget.TextView;

          import android.view.accessibility.AccessibilityEvent;

          public class BotAccessibility
                  extends AccessibilityService {

              private static BotAccessibility instance;

              private WindowManager windowManager;

              private View overlay;

              private WindowManager.LayoutParams overlayParams;

              private Handler handler =
                      new Handler(Looper.getMainLooper());

              private BotEngine botEngine;

              private TextView statusText;

              private TextView aiText;

              private TextView targetText;

              private TextView characterText;

              private TextView consoleText;

              private boolean overlayVisible = false;

              private boolean minimized = false;


              // =================================================
              // INSTANCE
              // =================================================

              public static BotAccessibility getInstance() {

                  return instance;

              }


              // =================================================
              // SERVICE CONNECTED
              // =================================================

              @Override
              protected void onServiceConnected() {

                  super.onServiceConnected();

                  instance = this;

                  windowManager =
                          (WindowManager)
                          getSystemService(WINDOW_SERVICE);

                  botEngine =
                          new BotEngine(
                              this,
                              new BotEngine.Listener() {

                                  @Override
                                  public void onState(
                                          String state
                                  ) {

                                      updateAI(
                                          state
                                      );

                                  }

                                  @Override
                                  public void onConsole(
                                          String message
                                  ) {

                                      appendConsole(
                                          message
                                      );

                                  }

                              }
                          );

                  showOverlay();

              }


              // =================================================
              // ACCESSIBILITY EVENTS
              // =================================================

              @Override
              public void onAccessibilityEvent(
                      AccessibilityEvent event
              ) {

                  // Game state processing will be added here.
                  // The bot does not inject packets or modify
                  // the game client.

              }


              @Override
              public void onInterrupt() {

                  stopBot();

              }


              @Override
              public void onDestroy() {

                  stopBot();

                  removeOverlay();

                  instance = null;

                  super.onDestroy();

              }


              // =================================================
              // SHOW OVERLAY
              // =================================================

              public void showOverlay() {

                  handler.post(
                      new Runnable() {

                          @Override
                          public void run() {

                              if (overlayVisible) {
                                  return;
                              }

                              createOverlay();

                          }

                      }
                  );

              }


              // =================================================
              // CREATE OVERLAY
              // =================================================

              private void createOverlay() {

                  if (windowManager == null) {
                      return;
                  }

                  LinearLayout root =
                          new LinearLayout(this);

                  root.setOrientation(
                          LinearLayout.VERTICAL
                  );

                  root.setPadding(
                          16,
                          12,
                          16,
                          12
                  );

                  root.setBackgroundColor(
                          Color.rgb(
                              12,
                              20,
                              31
                          )
                  );


                  // =============================================
                  // HEADER
                  // =============================================

                  LinearLayout header =
                          new LinearLayout(this);

                  header.setOrientation(
                          LinearLayout.HORIZONTAL
                  );

                  TextView title =
                          makeText(
                              "🤖 DUSTINBOT",
                              20
                          );

                  header.addView(
                          title,
                          new LinearLayout.LayoutParams(
                              0,
                              -2,
                              1
                          )
                  );


                  Button minimize =
                          makeButton(
                              "—"
                          );

                  header.addView(
                          minimize,
                          new LinearLayout.LayoutParams(
                              55,
                              55
                          )
                  );


                  Button close =
                          makeButton(
                              "×"
                          );

                  header.addView(
                          close,
                          new LinearLayout.LayoutParams(
                              55,
                              55
                          )
                  );

                  root.addView(header);


                  // =============================================
                  // DRAG HEADER
                  // =============================================

                  View.OnTouchListener dragListener =
                          new View.OnTouchListener() {

                              private float downX;

                              private float downY;

                              private int startX;

                              private int startY;


                              @Override
                              public boolean onTouch(
                                      View v,
                                      MotionEvent event
                              ) {

                                  switch (
                                      event.getAction()
                                  ) {

                                      case MotionEvent.ACTION_DOWN:

                                          downX =
                                              event.getRawX();

                                          downY =
                                              event.getRawY();

                                          startX =
                                              overlayParams.x;

                                          startY =
                                              overlayParams.y;

                                          return true;


                                      case MotionEvent.ACTION_MOVE:

                                          overlayParams.x =
                                              startX +
                                              (int)(
                                                  event.getRawX()
                                                  - downX
                                              );

                                          overlayParams.y =
                                              startY +
                                              (int)(
                                                  event.getRawY()
                                                  - downY
                                              );

                                          windowManager.updateViewLayout(
                                              overlay,
                                              overlayParams
                                          );

                                          return true;

                                  }

                                  return false;

                              }

                          };


                  header.setOnTouchListener(
                          dragListener
                  );


                  title.setOnTouchListener(
                          dragListener
                  );


                  // =============================================
                  // STATUS
                  // =============================================

                  statusText =
                          makeText(
                              "● STOPPED",
                              16
                          );

                  root.addView(
                          statusText
                  );


                  // =============================================
                  // MAIN CONTENT
                  // =============================================

                  LinearLayout content =
                          new LinearLayout(this);

                  content.setOrientation(
                          LinearLayout.VERTICAL
                  );


                  // =============================================
                  // CHARACTER
                  // =============================================

                  characterText =
                          makeText(
                              "CHARACTER\n" +
                              "Level: --\n" +
                              "Job: --\n" +
                              "HP: --\n" +
                              "SP: --",
                              14
                          );

                  content.addView(
                          characterText
                  );


                  // =============================================
                  // TARGET
                  // =============================================

                  targetText =
                          makeText(
                              "TARGET\n" +
                              "Monster: GAME LOCK\n" +
                              "HP: --\n" +
                              "Distance: --\n" +
                              "State: --",
                              14
                          );

                  content.addView(
                          targetText
                  );


                  // =============================================
                  // AI
                  // =============================================

                  aiText =
                          makeText(
                              "AI STATUS\n" +
                              "IDLE",
                              14
                          );

                  content.addView(
                          aiText
                  );


                  // =============================================
                  // BUTTON ROW
                  // =============================================

                  LinearLayout buttons =
                          new LinearLayout(this);

                  buttons.setOrientation(
                          LinearLayout.HORIZONTAL
                  );


                  Button start =
                          makeButton(
                              "START"
                          );

                  start.setOnClickListener(
                          v -> startBot()
                  );


                  Button stop =
                          makeButton(
                              "STOP"
                          );

                  stop.setOnClickListener(
                          v -> stopBot()
                  );


                  Button hide =
                          makeButton(
                              "HIDE"
                          );

                  hide.setOnClickListener(
                          v -> minimizeOverlay()
                  );


                  buttons.addView(
                          start,
                          new LinearLayout.LayoutParams(
                              0,
                              65,
                              1
                          )
                  );

                  buttons.addView(
                          stop,
                          new LinearLayout.LayoutParams(
                              0,
                              65,
                              1
                          )
                  );

                  buttons.addView(
                          hide,
                          new LinearLayout.LayoutParams(
                              0,
                              65,
                              1
                          )
                  );


                  content.addView(
                          buttons
                  );


                  // =============================================
                  // CALIBRATION
                  // =============================================

                  Button move =
                          makeButton(
                              "SET MOVE"
                          );

                  move.setOnClickListener(
                          v -> startCalibration(
                              "MOVE"
                          )
                  );


                  Button attack =
                          makeButton(
                              "SET ATTACK"
                          );

                  attack.setOnClickListener(
                          v -> startCalibration(
                              "ATTACK"
                          )
                  );


                  Button loot =
                          makeButton(
                              "SET LOOT"
                          );

                  loot.setOnClickListener(
                          v -> startCalibration(
                              "LOOT"
                          )
                  );


                  content.addView(
                          move
                  );

                  content.addView(
                          attack
                  );

                  content.addView(
                          loot
                  );


                  // =============================================
                  // CONSOLE
                  // =============================================

                  TextView consoleTitle =
                          makeText(
                              "CONSOLE",
                              15
                          );

                  content.addView(
                          consoleTitle
                  );


                  consoleText =
                          makeText(
                              "DustinBot ready.",
                              12
                          );


                  ScrollView consoleScroll =
                          new ScrollView(this);

                  consoleScroll.addView(
                          consoleText
                  );


                  content.addView(
                          consoleScroll,
                          new LinearLayout.LayoutParams(
                              -1,
                              220
                          )
                  );


                  root.addView(
                          content
                  );


                  // =============================================
                  // MINIMIZE
                  // =============================================

                  minimize.setOnClickListener(
                          v -> minimizeOverlay()
                  );


                  close.setOnClickListener(
                          v -> removeOverlay()
                  );


                  // =============================================
                  // WINDOW PARAMS
                  // =============================================

                  overlayParams =
                          new WindowManager.LayoutParams(

                              720,

                              WindowManager.LayoutParams.WRAP_CONTENT,

                              WindowManager.LayoutParams.TYPE_ACCESSIBILITY_OVERLAY,

                              WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE,

                              PixelFormat.TRANSLUCENT

                          );


                  overlayParams.gravity =
                          Gravity.TOP |
                          Gravity.START;

                  overlayParams.x = 30;

                  overlayParams.y = 120;


                  overlay = root;


                  windowManager.addView(
                          overlay,
                          overlayParams
                  );


                  overlayVisible = true;

              }


              // =================================================
              // MINIMIZE
              // =================================================

              private void minimizeOverlay() {

                  if (!overlayVisible) {
                      return;
                  }

                  if (minimized) {
                      showFullOverlay();
                      return;
                  }

                  minimized = true;

                  LinearLayout mini =
                          new LinearLayout(this);

                  mini.setOrientation(
                          LinearLayout.HORIZONTAL
                  );

                  mini.setPadding(
                          18,
                          10,
                          18,
                          10
                  );

                  mini.setBackgroundColor(
                          Color.rgb(
                              10,
                              20,
                              30
                          )
                  );


                  TextView text =
                          makeText(
                              "🤖 DUSTINBOT  ●",
                              14
                          );

                  mini.addView(
                          text,
                          new LinearLayout.LayoutParams(
                              0,
                              65,
                              1
                          )
                  );


                  Button open =
                          makeButton(
                              "OPEN"
                          );


                  open.setOnClickListener(
                          v -> {

                              removeOverlay();

                              showOverlay();

                          }
                  );


                  mini.addView(
                          open,
                          new LinearLayout.LayoutParams(
                              130,
                              65
                          )
                  );


                  overlay =
                          mini;


                  windowManager.updateViewLayout(
                          overlay,
                          overlayParams
                  );

              }


              private void showFullOverlay() {

                  removeOverlay();

                  showOverlay();

              }


              // =================================================
              // REMOVE OVERLAY
              // =================================================

              public void removeOverlay() {

                  handler.post(
                      () -> {

                          if (
                              overlay != null &&
                              windowManager != null
                          ) {

                              try {

                                  windowManager.removeView(
                                      overlay
                                  );

                              } catch (Exception ignored) {
                              }

                          }

                          overlay = null;

                          overlayVisible = false;

                          minimized = false;

                      }
                  );

              }


              // =================================================
              // START BOT
              // =================================================

              private void startBot() {

                  if (botEngine == null) {
                      return;
                  }

                  botEngine.start();

                  statusText.setText(
                      "● RUNNING"
                  );

              }


              // =================================================
              // STOP BOT
              // =================================================

              private void stopBot() {

                  if (botEngine != null) {

                      botEngine.stop();

                  }

                  if (statusText != null) {

                      statusText.setText(
                          "● STOPPED"
                      );

                  }

              }


              // =================================================
              // CALIBRATION
              // =================================================

              private void startCalibration(
                      String mode
              ) {

                  CalibrationOverlay.show(
                      this,
                      mode
                  );

              }


              // =================================================
              // UPDATE AI
              // =================================================

              private void updateAI(
                      String state
              ) {

                  handler.post(
                      () -> {

                          if (aiText != null) {

                              aiText.setText(
                                  "AI STATUS\n" +
                                  state
                              );

                          }

                      }
                  );

              }


              // =================================================
              // CONSOLE
              // =================================================

              private void appendConsole(
                      String message
              ) {

                  handler.post(
                      () -> {

                          if (consoleText == null) {
                              return;
                          }

                          consoleText.append(
                              "\n> " +
                              message
                          );

                      }
                  );

              }


              // =================================================
              // TEXT
              // =================================================

              private TextView makeText(
                      String text,
                      int size
              ) {

                  TextView view =
                          new TextView(this);

                  view.setText(
                          text
                  );

                  view.setTextColor(
                          Color.WHITE
                  );

                  view.setTextSize(
                          size
                  );

                  view.setPadding(
                          8,
                          8,
                          8,
                          8
                  );

                  return view;

              }


              // =================================================
              // BUTTON
              // =================================================

              private Button makeButton(
                      String text
              ) {

                  Button button =
                          new Button(this);

                  button.setText(
                      text
                  );

                  button.setTextSize(
                      12
                  );

                  return button;

              }


              // =================================================
              // TAP
              // =================================================

              public boolean tap(
                      float x,
                      float y
              ) {

                  Path path =
                          new Path();

                  path.moveTo(
                      x,
                      y
                  );


                  GestureDescription.StrokeDescription stroke =
                          new GestureDescription.StrokeDescription(
                              path,
                              0,
                              80
                          );


                  GestureDescription gesture =
                          new GestureDescription.Builder()
                              .addStroke(
                                  stroke
                              )
                              .build();


                  return dispatchGesture(
                      gesture,
                      null,
                      null
                  );

              }


              // =================================================
              // SWIPE
              // =================================================

              public boolean swipe(
                      float x1,
                      float y1,
                      float x2,
                      float y2,
                      long duration
              ) {

                  Path path =
                          new Path();

                  path.moveTo(
                      x1,
                      y1
                  );

                  path.lineTo(
                      x2,
                      y2
                  );


                  GestureDescription.StrokeDescription stroke =
                          new GestureDescription.StrokeDescription(
                              path,
                              0,
                              duration
                          );


                  GestureDescription gesture =
                          new GestureDescription.Builder()
                              .addStroke(
                                  stroke
                              )
                              .build();


                  return dispatchGesture(
                      gesture,
                      null,
                      null
                  );

              }

          }

          EOF


      # =========================================================
      # CALIBRATION OVERLAY
      # =========================================================

      - name: Create CalibrationOverlay.java
        shell: bash
        run: |

          cat > app/src/main/java/com/dustinbot/v3/CalibrationOverlay.java <<'EOF'

          package com.dustinbot.v3;

          import android.graphics.Color;

          import android.view.Gravity;
          import android.view.MotionEvent;
          import android.view.View;
          import android.view.WindowManager;

          import android.widget.Button;
          import android.widget.LinearLayout;
          import android.widget.TextView;


          public final class CalibrationOverlay {

              private CalibrationOverlay() {
              }


              public static void show(
                      BotAccessibility service,
                      String mode
              ) {

                  WindowManager wm =
                          (WindowManager)
                          service.getSystemService(
                              BotAccessibility.WINDOW_SERVICE
                          );


                  LinearLayout root =
                          new LinearLayout(service);

                  root.setOrientation(
                          LinearLayout.VERTICAL
                  );

                  root.setPadding(
                          20,
                          20,
                          20,
                          20
                  );

                  root.setBackgroundColor(
                          Color.argb(
                              210,
                              5,
                              10,
                              18
                          )
                  );


                  TextView title =
                          new TextView(service);

                  title.setText(
                      "CALIBRATION: " +
                      mode +
                      "\n\n" +
                      "แตะตำแหน่งบนหน้าเกม\n" +
                      "เพื่อบันทึกตำแหน่ง"
                  );

                  title.setTextColor(
                      Color.WHITE
                  );

                  title.setTextSize(
                      18
                  );


                  root.addView(
                      title
                  );


                  TextView coordinate =
                          new TextView(service);

                  coordinate.setText(
                      "X: --   Y: --"
                  );

                  coordinate.setTextColor(
                      Color.WHITE
                  );

                  coordinate.setTextSize(
                      16
                  );


                  root.addView(
                      coordinate
                  );


                  Button cancel =
                          new Button(service);

                  cancel.setText(
                      "CANCEL"
                  );


                  root.addView(
                      cancel
                  );


                  WindowManager.LayoutParams params =
                          new WindowManager.LayoutParams(

                              650,

                              WindowManager.LayoutParams.WRAP_CONTENT,

                              WindowManager.LayoutParams.TYPE_ACCESSIBILITY_OVERLAY,

                              WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE,

                              android.graphics.PixelFormat.TRANSLUCENT

                          );


                  params.gravity =
                          Gravity.TOP |
                          Gravity.CENTER_HORIZONTAL;

                  params.y = 100;


                  View touchLayer =
                          new View(service);


                  touchLayer.setBackgroundColor(
                      Color.TRANSPARENT
                  );


                  touchLayer.setOnTouchListener(
                      new View.OnTouchListener() {

                          @Override
                          public boolean onTouch(
                                  View v,
                                  MotionEvent event
                          ) {

                              if (
                                  event.getAction() ==
                                  MotionEvent.ACTION_UP
                              ) {

                                  float x =
                                      event.getRawX();

                                  float y =
                                      event.getRawY();


                                  SettingsStore.savePoint(
                                      service,
                                      mode,
                                      x,
                                      y
                                  );


                                  coordinate.setText(
                                      "SAVED\n" +
                                      "X: " + x +
                                      "   Y: " + y
                                  );


                                  return true;

                              }

                              return true;

                          }

                      }
                  );


                  cancel.setOnClickListener(
                      v -> {

                          try {

                              wm.removeView(
                                  root
                              );

                          } catch (Exception ignored) {
                          }

                      }
                  );


                  wm.addView(
                      root,
                      params
                  );

              }

          }

