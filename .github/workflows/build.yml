name: Build DustinBot RuneClassic OCR V1
run-name: DustinBot OCR V1 APK Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare clean OCR project
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p /tmp/dustinbot-backup

          if [ -f app/src/main/assets/monster_database.json ]; then
            cp app/src/main/assets/monster_database.json \
              /tmp/dustinbot-backup/monster_database.json
          fi

          rm -rf app

          mkdir -p app/src/main/java/com/dustinbot/v1
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/xml
          mkdir -p app/src/main/assets

          if [ -f /tmp/dustinbot-backup/monster_database.json ]; then
            cp /tmp/dustinbot-backup/monster_database.json \
              app/src/main/assets/monster_database.json
          else
            echo "monster_database.json is missing from the repository."
            exit 1
          fi

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = 'DustinBotOCR'
          include ':app'
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.6.1' apply false
          }
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.dustinbot.v1'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.dustinbot.v1'
                  minSdk 26
                  targetSdk 35
                  versionCode 1
                  versionName '1.0'
              }
          }

          dependencies {
              implementation 'com.google.mlkit:text-recognition:16.0.1'
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission
                  android:name="android.permission.SYSTEM_ALERT_WINDOW" />

              <uses-permission
                  android:name="android.permission.FOREGROUND_SERVICE" />

              <uses-permission
                  android:name="android.permission.FOREGROUND_SERVICE_MEDIA_PROJECTION" />

              <application
                  android:allowBackup="false"
                  android:label="DustinBot OCR"
                  android:theme="@style/AppTheme">

                  <activity
                      android:name=".MainActivity"
                      android:screenOrientation="portrait"
                      android:exported="true">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>

                  </activity>

                  <service
                      android:name=".BotAccessibilityService"
                      android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE"
                      android:exported="true">

                      <intent-filter>
                          <action
                              android:name="android.accessibilityservice.AccessibilityService" />
                      </intent-filter>

                      <meta-data
                          android:name="android.accessibilityservice"
                          android:resource="@xml/accessibility_service_config" />

                  </service>

                  <service
                      android:name=".CaptureService"
                      android:exported="false"
                      android:foregroundServiceType="mediaProjection" />

              </application>

          </manifest>
          EOF

          cat > app/src/main/res/values/themes.xml <<'EOF'
          <resources>

              <style
                  name="AppTheme"
                  parent="android:style/Theme.Material.NoActionBar">

                  <item name="android:fontFamily">sans</item>
                  <item name="android:colorAccent">#42A5F5</item>
                  <item name="android:navigationBarColor">#07111F</item>
                  <item name="android:statusBarColor">#07111F</item>

              </style>

          </resources>
          EOF

          cat > app/src/main/res/values/strings.xml <<'EOF'
          <resources>
              <string name="app_name">DustinBot OCR</string>
          </resources>
          EOF

          cat > app/src/main/res/xml/accessibility_service_config.xml <<'EOF'
          <accessibility-service
              xmlns:android="http://schemas.android.com/apk/res/android"
              android:accessibilityEventTypes="typeAllMask"
              android:accessibilityFeedbackType="feedbackGeneric"
              android:canRetrieveWindowContent="true"
              android:canPerformGestures="true"
              android:description="DustinBot game control" />
          EOF

          cat > app/src/main/java/com/dustinbot/v1/BotAccessibilityService.java <<'EOF'
          package com.dustinbot.v1;

          import android.accessibilityservice.AccessibilityService;
          import android.accessibilityservice.GestureDescription;
          import android.graphics.Path;
          import android.view.accessibility.AccessibilityEvent;

          public class BotAccessibilityService extends AccessibilityService {

              static volatile BotAccessibilityService instance;

              @Override
              protected void onServiceConnected() {
                  instance = this;
              }

              @Override
              public void onAccessibilityEvent(AccessibilityEvent event) {
              }

              @Override
              public void onInterrupt() {
                  instance = null;
              }

              static boolean tap(float x, float y) {

                  BotAccessibilityService service = instance;

                  if (service == null) {
                      return false;
                  }

                  Path path = new Path();
                  path.moveTo(x, y);

                  GestureDescription gesture =
                      new GestureDescription.Builder()
                          .addStroke(
                              new GestureDescription.StrokeDescription(
                                  path,
                                  0,
                                  70
                              )
                          )
                          .build();

                  return service.dispatchGesture(
                      gesture,
                      null,
                      null
                  );
              }
          }
          EOF

          cat > app/src/main/java/com/dustinbot/v1/CaptureService.java <<'EOF'
          package com.dustinbot.v1;

          import android.app.Notification;
          import android.app.NotificationChannel;
          import android.app.NotificationManager;
          import android.app.Service;
          import android.content.Intent;
          import android.graphics.Rect;
          import android.hardware.display.DisplayManager;
          import android.hardware.display.VirtualDisplay;
          import android.media.Image;
          import android.media.ImageReader;
          import android.media.projection.MediaProjection;
          import android.media.projection.MediaProjectionManager;
          import android.os.Handler;
          import android.os.IBinder;
          import android.os.Looper;
          import android.util.DisplayMetrics;

          import com.google.mlkit.vision.common.InputImage;
          import com.google.mlkit.vision.text.Text;
          import com.google.mlkit.vision.text.TextRecognition;
          import com.google.mlkit.vision.text.TextRecognizer;
          import com.google.mlkit.vision.text.latin.TextRecognizerOptions;

          import java.util.Collections;
          import java.util.HashSet;
          import java.util.Set;

          public class CaptureService extends Service {

              static final String EXTRA_RESULT = "result";
              static final String EXTRA_DATA = "data";

              static volatile boolean running = false;

              static volatile Set<String> targets =
                  Collections.emptySet();

              private MediaProjection projection;
              private VirtualDisplay virtualDisplay;
              private ImageReader reader;
              private Handler handler;
              private TextRecognizer recognizer;

              private long lastTap = 0;

              @Override
              public int onStartCommand(
                  Intent intent,
                  int flags,
                  int startId
              ) {

                  createChannel();

                  startForeground(
                      1101,
                      new Notification.Builder(
                          this,
                          "dustinbot_capture"
                      )
                          .setContentTitle("DustinBot OCR")
                          .setContentText(
                              "กำลังตรวจจับ Monster บนหน้าจอ"
                          )
                          .setSmallIcon(
                              android.R.drawable.ic_menu_view
                          )
                          .build()
                  );

                  if (intent != null &&
                      intent.hasExtra(EXTRA_RESULT)) {

                      int resultCode =
                          intent.getIntExtra(EXTRA_RESULT, 0);

                      Intent data =
                          intent.getParcelableExtra(EXTRA_DATA);

                      startCapture(
                          resultCode,
                          data
                      );
                  }

                  return START_STICKY;
              }

              private void startCapture(
                  int resultCode,
                  Intent data
              ) {

                  if (projection != null) {
                      return;
                  }

                  DisplayMetrics dm =
                      getResources().getDisplayMetrics();

                  int width = dm.widthPixels;
                  int height = dm.heightPixels;
                  int density = dm.densityDpi;

                  MediaProjectionManager manager =
                      (MediaProjectionManager)
                      getSystemService(
                          MEDIA_PROJECTION_SERVICE
                      );

                  projection =
                      manager.getMediaProjection(
                          resultCode,
                          data
                      );

                  reader =
                      ImageReader.newInstance(
                          width,
                          height,
                          android.graphics.PixelFormat.RGBA_8888,
                          2
                      );

                  handler =
                      new Handler(
                          Looper.getMainLooper()
                      );

                  recognizer =
                      TextRecognition.getClient(
                          TextRecognizerOptions.DEFAULT_OPTIONS
                      );

                  running = true;

                  virtualDisplay =
                      projection.createVirtualDisplay(
                          "DustinBotOCR",
                          width,
                          height,
                          density,
                          DisplayManager.VIRTUAL_DISPLAY_FLAG_AUTO_MIRROR,
                          reader.getSurface(),
                          null,
                          handler
                      );

                  reader.setOnImageAvailableListener(
                      imageReader -> {

                          Image image =
                              imageReader.acquireLatestImage();

                          if (image == null) {
                              return;
                          }

                          processImage(image);

                      },
                      handler
                  );
              }

              private void processImage(Image image) {

                  InputImage input =
                      InputImage.fromMediaImage(
                          image,
                          0
                      );

                  recognizer
                      .process(input)
                      .addOnSuccessListener(
                          result -> {

                              long now =
                                  System.currentTimeMillis();

                              if (now - lastTap < 900) {
                                  return;
                              }

                              for (Text.TextBlock block :
                                  result.getTextBlocks()) {

                                  for (Text.Line line :
                                      block.getLines()) {

                                      String raw =
                                          line.getText();

                                      String detected =
                                          MonsterDatabase.norm(
                                              raw
                                          );

                                      if (detected.length() < 3) {
                                          continue;
                                      }

                                      for (String target :
                                          targets) {

                                          String wanted =
                                              MonsterDatabase.norm(
                                                  target
                                              );

                                          if (wanted.length() < 3) {
                                              continue;
                                          }

                                          boolean match =
                                              detected.equals(wanted)
                                              ||
                                              detected.contains(wanted)
                                              ||
                                              wanted.contains(detected);

                                          if (!match) {
                                              continue;
                                          }

                                          Rect box =
                                              line.getBoundingBox();

                                          if (box == null) {
                                              continue;
                                          }

                                          float x =
                                              box.centerX();

                                          float y =
                                              box.centerY();

                                          if (BotAccessibilityService.tap(
                                              x,
                                              y
                                          )) {

                                              lastTap = now;

                                              MainActivity.postStatus(
                                                  "พบ "
                                                  + raw
                                                  + " → แตะ "
                                                  + (int)x
                                                  + ","
                                                  + (int)y
                                              );

                                              return;
                                          }
                                      }
                                  }
                              }
                          }
                      )
                      .addOnCompleteListener(
                          task -> image.close()
                      );
              }

              private void createChannel() {

                  NotificationManager manager =
                      getSystemService(
                          NotificationManager.class
                      );

                  manager.createNotificationChannel(
                      new NotificationChannel(
                          "dustinbot_capture",
                          "DustinBot Capture",
                          NotificationManager.IMPORTANCE_LOW
                      )
                  );
              }

              @Override
              public void onDestroy() {

                  running = false;

                  try {
                      if (reader != null) {
                          reader.close();
                      }

                      if (virtualDisplay != null) {
                          virtualDisplay.release();
                      }

                      if (projection != null) {
                          projection.stop();
                      }

                      if (recognizer != null) {
                          recognizer.close();
                      }

                  } catch (Exception ignored) {
                  }

                  super.onDestroy();
              }

              @Override
              public IBinder onBind(Intent intent) {
                  return null;
              }
          }
          EOF

          cat > app/src/main/java/com/dustinbot/v1/MainActivity.java <<'EOF'
          package com.dustinbot.v1;

          import android.app.Activity;
          import android.content.Intent;
          import android.graphics.Color;
          import android.media.projection.MediaProjectionManager;
          import android.os.Bundle;
          import android.provider.Settings;
          import android.view.ViewGroup;
          import android.widget.Button;
          import android.widget.CheckBox;
          import android.widget.EditText;
          import android.widget.LinearLayout;
          import android.widget.ScrollView;
          import android.widget.TextView;

          import java.util.ArrayList;
          import java.util.HashSet;

          public class MainActivity extends Activity {

              static MainActivity instance;

              MonsterDatabase database;

              LinearLayout monsterList;

              EditText search;

              TextView status;

              ArrayList<MonsterDatabase.M> selected =
                  new ArrayList<>();

              int dp(int value) {

                  return (int)
                      (
                          value *
                          getResources()
                              .getDisplayMetrics()
                              .density
                          + 0.5f
                      );
              }

              TextView text(
                  String value,
                  int size
              ) {

                  TextView view =
                      new TextView(this);

                  view.setText(value);
                  view.setTextColor(Color.WHITE);
                  view.setTextSize(size);

                  view.setPadding(
                      dp(8),
                      dp(8),
                      dp(8),
                      dp(8)
                  );

                  return view;
              }

              @Override
              public void onCreate(Bundle state) {

                  super.onCreate(state);

                  instance = this;

                  database =
                      new MonsterDatabase(this);

                  buildUI();
              }

              private void buildUI() {

                  LinearLayout root =
                      new LinearLayout(this);

                  root.setOrientation(
                      LinearLayout.VERTICAL
                  );

                  root.setPadding(
                      dp(14),
                      dp(10),
                      dp(14),
                      dp(20)
                  );

                  root.setBackgroundColor(
                      Color.rgb(7, 17, 31)
                  );

                  TextView title =
                      text(
                          "DustinBot OCR V1",
                          26
                      );

                  title.setTextColor(
                      Color.rgb(80, 170, 255)
                  );

                  root.addView(title);

                  root.addView(
                      text(
                          "Rune Classic • อ่านชื่อ Monster จากหน้าจอจริง",
                          14
                      )
                  );

                  status =
                      text(
                          "สถานะ: READY\nMonster DB: "
                          + database.search("").size(),
                          15
                      );

                  root.addView(status);

                  Button accessibility =
                      new Button(this);

                  accessibility.setText(
                      "1. เปิด Accessibility"
                  );

                  accessibility.setOnClickListener(
                      v ->
                          startActivity(
                              new Intent(
                                  Settings.ACTION_ACCESSIBILITY_SETTINGS
                              )
                          )
                  );

                  root.addView(accessibility);

                  Button capture =
                      new Button(this);

                  capture.setText(
                      "2. เริ่มจับหน้าจอ + ตรวจ Monster"
                  );

                  capture.setOnClickListener(
                      v -> requestCapture()
                  );

                  root.addView(capture);

                  search =
                      new EditText(this);

                  search.setHint(
                      "พิมพ์ชื่อ เช่น Poring"
                  );

                  search.setTextColor(Color.WHITE);
                  search.setHintTextColor(Color.GRAY);

                  root.addView(search);

                  Button find =
                      new Button(this);

                  find.setText(
                      "ค้นหา Monster"
                  );

                  find.setOnClickListener(
                      v -> renderMonsters()
                  );

                  root.addView(find);

                  monsterList =
                      new LinearLayout(this);

                  monsterList.setOrientation(
                      LinearLayout.VERTICAL
                  );

                  root.addView(monsterList);

                  Button stop =
                      new Button(this);

                  stop.setText(
                      "หยุดบอท"
                  );

                  stop.setOnClickListener(
                      v ->
                          stopService(
                              new Intent(
                                  this,
                                  CaptureService.class
                              )
                          )
                  );

                  root.addView(stop);

                  ScrollView scroll =
                      new ScrollView(this);

                  scroll.addView(root);

                  setContentView(scroll);

                  renderMonsters();
              }

              private void renderMonsters() {

                  monsterList.removeAllViews();

                  String query =
                      search.getText().toString();

                  int count = 0;

                  for (MonsterDatabase.M monster :
                      database.search(query)) {

                      CheckBox box =
                          new CheckBox(this);

                      box.setText(
                          monster.name
                          + " ["
                          + monster.id
                          + "]"
                      );

                      box.setTextColor(Color.WHITE);

                      box.setChecked(
                          selected.contains(monster)
                      );

                      box.setOnCheckedChangeListener(
                          (button, checked) -> {

                              if (checked &&
                                  !selected.contains(monster)) {

                                  selected.add(monster);
                              }

                              if (!checked) {
                                  selected.remove(monster);
                              }
                          }
                      );

                      monsterList.addView(box);

                      count++;

                      if (count >= 100) {
                          break;
                      }
                  }
              }

              private void requestCapture() {

                  if (selected.isEmpty()) {

                      status.setText(
                          "สถานะ: เลือก Monster ก่อน เช่น Poring"
                      );

                      return;
                  }

                  ArrayList<String> names =
                      new ArrayList<>();

                  for (MonsterDatabase.M monster :
                      selected) {

                      names.add(monster.name);
                  }

                  CaptureService.targets =
                      new HashSet<>(names);

                  MediaProjectionManager manager =
                      (MediaProjectionManager)
                      getSystemService(
                          MEDIA_PROJECTION_SERVICE
                      );

                  startActivityForResult(
                      manager.createScreenCaptureIntent(),
                      9001
                  );
              }

              @Override
              protected void onActivityResult(
                  int requestCode,
                  int resultCode,
                  Intent data
              ) {

                  super.onActivityResult(
                      requestCode,
                      resultCode,
                      data
                  );

                  if (requestCode == 9001 &&
                      resultCode == RESULT_OK) {

                      Intent intent =
                          new Intent(
                              this,
                              CaptureService.class
                          );

                      intent.putExtra(
                          CaptureService.EXTRA_RESULT,
                          resultCode
                      );

                      intent.putExtra(
                          CaptureService.EXTRA_DATA,
                          data
                      );

                      startForegroundService(
                          intent
                      );

                      status.setText(
                          "สถานะ: กำลังหา "
                          + CaptureService.targets
                      );
                  }
              }

              static void postStatus(
                  String message
              ) {

                  if (instance != null) {

                      instance.runOnUiThread(
                          () ->
                              instance.status.setText(
                                  "สถานะ: "
                                  + message
                              )
                      );
                  }
              }
          }
          EOF

          cat > app/src/main/java/com/dustinbot/v1/MonsterDatabase.java <<'EOF'
          package com.dustinbot.v1;

          import android.content.Context;

          import org.json.JSONArray;
          import org.json.JSONObject;

          import java.io.InputStream;
          import java.util.ArrayList;
          import java.util.Locale;

          public class MonsterDatabase {

              public static class M {

                  public int id;
                  public String name;
                  public String code;

                  M(
                      int id,
                      String name,
                      String code
                  ) {

                      this.id = id;
                      this.name = name;
                      this.code = code;
                  }
              }

              private final ArrayList<M> monsters =
                  new ArrayList<>();

              public MonsterDatabase(Context context) {

                  try {

                      InputStream input =
                          context
                              .getAssets()
                              .open(
                                  "monster_database.json"
                              );

                      byte[] bytes =
                          new byte[input.available()];

                      input.read(bytes);
                      input.close();

                      JSONObject root =
                          new JSONObject(
                              new String(
                                  bytes,
                                  "UTF-8"
                              )
                          );

                      JSONArray array =
                          root.getJSONArray(
                              "monsters"
                          );

                      for (int i = 0;
                           i < array.length();
                           i++) {

                          JSONObject object =
                              array.getJSONObject(i);

                          monsters.add(
                              new M(
                                  object.optInt("id"),
                                  object.optString("name"),
                                  object.optString("code")
                              )
                          );
                      }

                  } catch (Exception ignored) {
                  }
              }

              public ArrayList<M> search(
                  String query
              ) {

                  ArrayList<M> result =
                      new ArrayList<>();

                  String q =
                      query == null
                          ? ""
                          : query.trim()
                              .toLowerCase(
                                  Locale.US
                              );

                  for (M monster : monsters) {

                      if (
                          q.isEmpty()
                          ||
                          monster.name
                              .toLowerCase(
                                  Locale.US
                              )
                              .contains(q)
                          ||
                          monster.code
                              .toLowerCase(
                                  Locale.US
                              )
                              .contains(q)
                          ||
                          String.valueOf(
                              monster.id
                          ).equals(q)
                      ) {

                          result.add(monster);
                      }
                  }

                  return result;
              }

              public static String norm(
                  String value
              ) {

                  if (value == null) {
                      return "";
                  }

                  return value
                      .toLowerCase(Locale.US)
                      .replaceAll(
                          "[^a-z0-9]",
                          ""
                      );
              }
          }
          EOF

      - name: Install Gradle 8.10.2
        shell: bash
        run: |
          set -euo pipefail

          curl -fsSL \
            -o /tmp/gradle.zip \
            https://services.gradle.org/distributions/gradle-8.10.2-bin.zip

          unzip -q /tmp/gradle.zip -d /tmp

          echo "/tmp/gradle-8.10.2/bin" >> "$GITHUB_PATH"

      - name: Build debug APK
        run: |
          gradle \
            --no-daemon \
            --stacktrace \
            :app:assembleDebug

      - name: Verify APK
        run: |
          test -f app/build/outputs/apk/debug/app-debug.apk
          ls -lh app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DustinBot-RuneClassic-OCR-V1-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
