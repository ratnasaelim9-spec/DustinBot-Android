name: DustinBot Android V3

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Create Android project
        shell: bash
        run: |
          set -e

          mkdir -p app/src/main/java/com/dustinbot/v3
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/xml

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "DustinBotAndroidV3"
          include(":app")
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.6.1' apply false
          }
          EOF

          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.dustinbot.v3'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.dustinbot.v3'
                  minSdk 26
                  targetSdk 35
                  versionCode 30
                  versionName '3.0'
              }

              buildTypes {
                  debug {
                      minifyEnabled false
                  }

                  release {
                      minifyEnabled false
                  }
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }

          dependencies {
              implementation 'androidx.appcompat:appcompat:1.7.0'
              implementation 'androidx.core:core:1.15.0'
          }
          EOF

          cat > app/src/main/res/values/strings.xml <<'EOF'
          <resources>
              <string name="app_name">DustinBot Android V3</string>
              <string name="accessibility_description">DustinBot Android automation service</string>
          </resources>
          EOF

          cat > app/src/main/res/values/themes.xml <<'EOF'
          <resources>
              <style name="Theme.DustinBot" parent="Theme.AppCompat.NoActionBar">
                  <item name="android:fontFamily">sans</item>
                  <item name="android:windowLightStatusBar">false</item>
                  <item name="android:statusBarColor">#070B12</item>
                  <item name="android:navigationBarColor">#070B12</item>
                  <item name="android:windowBackground">#070B12</item>
              </style>
          </resources>
          EOF

          cat > app/src/main/res/xml/accessibility.xml <<'EOF'
          <accessibility-service
              xmlns:android="http://schemas.android.com/apk/res/android"
              android:accessibilityEventTypes="typeAllMask"
              android:accessibilityFeedbackType="feedbackGeneric"
              android:accessibilityFlags="flagDefault|flagRetrieveInteractiveWindows|flagIncludeNotImportantViews"
              android:canRetrieveWindowContent="true"
              android:canPerformGestures="true"
              android:description="@string/accessibility_description"
              android:notificationTimeout="100" />
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <application
                  android:allowBackup="true"
                  android:label="@string/app_name"
                  android:supportsRtl="true"
                  android:theme="@style/Theme.DustinBot">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>

                  </activity>

                  <service
                      android:name=".BotAccessibility"
                      android:exported="true"
                      android:label="@string/app_name"
                      android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE">

                      <intent-filter>
                          <action android:name="android.accessibilityservice.AccessibilityService" />
                      </intent-filter>

                      <meta-data
                          android:name="android.accessibilityservice"
                          android:resource="@xml/accessibility" />

                  </service>

              </application>

          </manifest>
          EOF

      - name: Create SettingsStore.java
        shell: bash
        run: |
          cat > app/src/main/java/com/dustinbot/v3/SettingsStore.java <<'EOF'
          package com.dustinbot.v3;

          import android.content.Context;
          import android.content.SharedPreferences;

          public final class SettingsStore {

              private static final String PREF = "dustinbot_settings";

              private SettingsStore() {}

              private static SharedPreferences prefs(Context c) {
                  return c.getSharedPreferences(PREF, Context.MODE_PRIVATE);
              }

              public static void savePoint(
                      Context c,
                      String name,
                      float x,
                      float y) {

                  prefs(c)
                          .edit()
                          .putFloat(name + "_x", x)
                          .putFloat(name + "_y", y)
                          .apply();
              }

              public static float getX(Context c, String name) {
                  return prefs(c).getFloat(name + "_x", -1);
              }

              public static float getY(Context c, String name) {
                  return prefs(c).getFloat(name + "_y", -1);
              }

              public static boolean hasPoint(Context c, String name) {
                  return getX(c, name) >= 0 && getY(c, name) >= 0;
              }
          }
          EOF

      - name: Create BotAccessibility.java
        shell: bash
        run: |
          cat > app/src/main/java/com/dustinbot/v3/BotAccessibility.java <<'EOF'
          package com.dustinbot.v3;

          import android.accessibilityservice.AccessibilityService;
          import android.accessibilityservice.GestureDescription;
          import android.graphics.Color;
          import android.graphics.Path;
          import android.graphics.PixelFormat;
          import android.os.Handler;
          import android.os.Looper;
          import android.view.Gravity;
          import android.view.WindowManager;
          import android.widget.Button;
          import android.widget.LinearLayout;
          import android.widget.TextView;
          import android.view.accessibility.AccessibilityEvent;

          public class BotAccessibility extends AccessibilityService {

              private static BotAccessibility instance;

              private WindowManager windowManager;
              private WindowManager.LayoutParams params;
              private LinearLayout panel;
              private TextView status;
              private TextView ai;
              private TextView console;

              private final Handler handler =
                      new Handler(Looper.getMainLooper());

              private BotEngine engine;

              public static BotAccessibility getInstance() {
                  return instance;
              }

              @Override
              protected void onServiceConnected() {
                  super.onServiceConnected();

                  instance = this;

                  windowManager =
                          (WindowManager)getSystemService(WINDOW_SERVICE);

                  engine = new BotEngine(this);

                  showBot();
              }

              @Override
              public void onAccessibilityEvent(AccessibilityEvent event) {
                  // Screen-state reading can be added here.
              }

              @Override
              public void onInterrupt() {
                  if (engine != null) {
                      engine.stop();
                  }
              }

              @Override
              public void onDestroy() {
                  if (engine != null) {
                      engine.stop();
                  }

                  removePanel();

                  instance = null;

                  super.onDestroy();
              }

              private TextView text(String s, int size) {
                  TextView v = new TextView(this);

                  v.setText(s);
                  v.setTextColor(Color.WHITE);
                  v.setTextSize(size);
                  v.setPadding(8, 5, 8, 5);

                  return v;
              }

              private Button button(String s) {
                  Button b = new Button(this);
                  b.setText(s);
                  b.setTextSize(11);
                  return b;
              }

              public void showBot() {
                  handler.post(() -> {

                      if (panel != null) {
                          return;
                      }

                      panel = new LinearLayout(this);

                      panel.setOrientation(
                              LinearLayout.VERTICAL);

                      panel.setPadding(
                              12, 8, 12, 8);

                      panel.setBackgroundColor(
                              Color.rgb(8, 14, 23));

                      TextView title =
                              text("🤖 DUSTINBOT ANDROID V3", 17);

                      panel.addView(title);

                      status =
                              text("● STOPPED", 13);

                      panel.addView(status);

                      panel.addView(
                              text(
                                      "CHARACTER\n" +
                                      "Level: --\n" +
                                      "Job: --\n" +
                                      "HP: --\n" +
                                      "SP: --",
                                      12));

                      panel.addView(
                              text(
                                      "TARGET\n" +
                                      "Monster: GAME LOCK\n" +
                                      "HP: --\n" +
                                      "Distance: --\n" +
                                      "State: GAME LOCK",
                                      12));

                      ai =
                              text(
                                      "AI STATUS\nIDLE",
                                      12);

                      panel.addView(ai);

                      LinearLayout buttons =
                              new LinearLayout(this);

                      buttons.setOrientation(
                              LinearLayout.HORIZONTAL);

                      Button start =
                              button("START");

                      Button stop =
                              button("STOP");

                      Button hide =
                              button("MIN");

                      buttons.addView(
                              start,
                              new LinearLayout.LayoutParams(
                                      0, 60, 1));

                      buttons.addView(
                              stop,
                              new LinearLayout.LayoutParams(
                                      0, 60, 1));

                      buttons.addView(
                              hide,
                              new LinearLayout.LayoutParams(
                                      0, 60, 1));

                      panel.addView(buttons);

                      Button move =
                              button("SET MOVE POSITION");

                      Button attack =
                              button("SET ATTACK POSITION");

                      Button loot =
                              button("SET LOOT POSITION");

                      panel.addView(move);
                      panel.addView(attack);
                      panel.addView(loot);

                      panel.addView(
                              text("CONSOLE", 13));

                      console =
                              text(
                                      "DustinBot initialized.",
                                      11);

                      panel.addView(console);

                      start.setOnClickListener(
                              v -> {

                                  if (engine != null) {
                                      engine.start();
                                  }
                              });

                      stop.setOnClickListener(
                              v -> {

                                  if (engine != null) {
                                      engine.stop();
                                  }

                                  setStatus("● STOPPED");
                              });

                      hide.setOnClickListener(
                              v -> removePanel());

                      move.setOnClickListener(
                              v -> CalibrationOverlay.show(
                                      this,
                                      "MOVE"));

                      attack.setOnClickListener(
                              v -> CalibrationOverlay.show(
                                      this,
                                      "ATTACK"));

                      loot.setOnClickListener(
                              v -> CalibrationOverlay.show(
                                      this,
                                      "LOOT"));

                      params =
                              new WindowManager.LayoutParams(
                                      700,
                                      WindowManager.LayoutParams.WRAP_CONTENT,
                                      WindowManager.LayoutParams.TYPE_ACCESSIBILITY_OVERLAY,
                                      WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE,
                                      PixelFormat.TRANSLUCENT);

                      params.gravity =
                              Gravity.TOP |
                              Gravity.START;

                      params.x = 15;
                      params.y = 80;

                      windowManager.addView(
                              panel,
                              params);
                  });
              }

              public void removePanel() {
                  handler.post(() -> {

                      if (panel != null &&
                              windowManager != null) {

                          try {
                              windowManager.removeView(panel);
                          } catch (Exception ignored) {
                          }
                      }

                      panel = null;
                  });
              }

              public void setStatus(String s) {
                  handler.post(() -> {

                      if (status != null) {
                          status.setText(s);
                      }
                  });
              }

              public void setAI(String s) {
                  handler.post(() -> {

                      if (ai != null) {
                          ai.setText(
                                  "AI STATUS\n" + s);
                      }
                  });
              }

              public void log(String s) {
                  handler.post(() -> {

                      if (console != null) {
                          console.append(
                                  "\n> " + s);
                      }
                  });
              }

              public boolean tap(float x, float y) {

                  Path path = new Path();
                  path.moveTo(x, y);

                  GestureDescription.StrokeDescription stroke =
                          new GestureDescription.StrokeDescription(
                                  path,
                                  0,
                                  80);

                  GestureDescription gesture =
                          new GestureDescription.Builder()
                                  .addStroke(stroke)
                                  .build();

                  return dispatchGesture(
                          gesture,
                          null,
                          null);
              }

              public boolean swipe(
                      float x1,
                      float y1,
                      float x2,
                      float y2,
                      long duration) {

                  Path path = new Path();

                  path.moveTo(x1, y1);
                  path.lineTo(x2, y2);

                  GestureDescription.StrokeDescription stroke =
                          new GestureDescription.StrokeDescription(
                                  path,
                                  0,
                                  duration);

                  GestureDescription gesture =
                          new GestureDescription.Builder()
                                  .addStroke(stroke)
                                  .build();

                  return dispatchGesture(
                          gesture,
                          null,
                          null);
              }
          }
          EOF

      - name: Create BotEngine.java
        shell: bash
        run: |
          cat > app/src/main/java/com/dustinbot/v3/BotEngine.java <<'EOF'
          package com.dustinbot.v3;

          import android.content.Context;
          import android.os.Handler;
          import android.os.Looper;

          public class BotEngine {

              private final Context context;
              private final Handler handler =
                      new Handler(Looper.getMainLooper());

              private boolean running;
              private boolean right = true;

              public BotEngine(Context context) {
                  this.context = context.getApplicationContext();
              }

              public void start() {

                  BotAccessibility bot =
                          BotAccessibility.getInstance();

                  if (bot == null) {
                      return;
                  }

                  if (!SettingsStore.hasPoint(
                          context, "MOVE")) {

                      bot.log("MOVE ยังไม่ได้ตั้งค่า");
                      return;
                  }

                  if (!SettingsStore.hasPoint(
                          context, "ATTACK")) {

                      bot.log("ATTACK ยังไม่ได้ตั้งค่า");
                      return;
                  }

                  if (!SettingsStore.hasPoint(
                          context, "LOOT")) {

                      bot.log("LOOT ยังไม่ได้ตั้งค่า");
                      return;
                  }

                  if (running) {
                      return;
                  }

                  running = true;

                  bot.setStatus("● RUNNING");
                  bot.setAI("WALK");
                  bot.log("BOT STARTED");

                  loop();
              }

              public void stop() {

                  running = false;

                  handler.removeCallbacksAndMessages(null);

                  BotAccessibility bot =
                          BotAccessibility.getInstance();

                  if (bot != null) {
                      bot.setStatus("● STOPPED");
                      bot.setAI("IDLE");
                      bot.log("BOT STOPPED");
                  }
              }

              private void loop() {

                  if (!running) {
                      return;
                  }

                  walk();

                  handler.postDelayed(
                          () -> {

                              if (!running) {
                                  return;
                              }

                              attack();

                              handler.postDelayed(
                                      () -> {

                                          if (!running) {
                                              return;
                                          }

                                          loot();

                                          handler.postDelayed(
                                                  this::loop,
                                                  1200);

                                      },
                                      1800);

                          },
                          2200);
              }

              private void walk() {

                  BotAccessibility bot =
                          BotAccessibility.getInstance();

                  if (bot == null) {
                      return;
                  }

                  bot.setAI("WALK");

                  bot.log("Walking...");

                  float x =
                          SettingsStore.getX(
                                  context,
                                  "MOVE");

                  float y =
                          SettingsStore.getY(
                                  context,
                                  "MOVE");

                  float x2;

                  if (right) {
                      x2 = x + 220;
                  } else {
                      x2 = x - 220;
                  }

                  right = !right;

                  bot.swipe(
                          x,
                          y,
                          x2,
                          y,
                          1200);
              }

              private void attack() {

                  BotAccessibility bot =
                          BotAccessibility.getInstance();

                  if (bot == null) {
                      return;
                  }

                  bot.setAI("ATTACK GAME LOCK");

                  bot.log(
                          "โจมตีเป้าหมายที่เกมล็อก");

                  float x =
                          SettingsStore.getX(
                                  context,
                                  "ATTACK");

                  float y =
                          SettingsStore.getY(
                                  context,
                                  "ATTACK");

                  for (int i = 0; i < 5; i++) {

                      final int n = i;

                      handler.postDelayed(
                              () -> {

                                  if (!running) {
                                      return;
                                  }

                                  BotAccessibility current =
                                          BotAccessibility
                                                  .getInstance();

                                  if (current != null) {
                                      current.tap(x, y);
                                  }

                              },
                              n * 250L);
                  }
              }

              private void loot() {

                  BotAccessibility bot =
                          BotAccessibility.getInstance();

                  if (bot == null) {
                      return;
                  }

                  bot.setAI("LOOT");

                  bot.log("เก็บของ");

                  float x =
                          SettingsStore.getX(
                                  context,
                                  "LOOT");

                  float y =
                          SettingsStore.getY(
                                  context,
                                  "LOOT");

                  bot.tap(x, y);
              }
          }
          EOF

      - name: Create CalibrationOverlay.java
        shell: bash
        run: |
          cat > app/src/main/java/com/dustinbot/v3/CalibrationOverlay.java <<'EOF'
          package com.dustinbot.v3;

          import android.graphics.Color;
          import android.graphics.PixelFormat;
          import android.view.Gravity;
          import android.view.MotionEvent;
          import android.view.View;
          import android.view.WindowManager;
          import android.widget.Button;
          import android.widget.FrameLayout;
          import android.widget.LinearLayout;
          import android.widget.TextView;

          public final class CalibrationOverlay {

              private CalibrationOverlay() {}

              public static void show(
                      BotAccessibility service,
                      String mode) {

                  WindowManager wm =
                          (WindowManager)
                                  service.getSystemService(
                                          BotAccessibility.WINDOW_SERVICE);

                  FrameLayout root =
                          new FrameLayout(service);

                  root.setBackgroundColor(
                          Color.TRANSPARENT);

                  TextView info =
                          new TextView(service);

                  info.setText(
                          "SET " + mode +
                          " POSITION\n\n" +
                          "แตะตำแหน่งบนหน้าเกม\n" +
                          "แล้วกด SAVE");

                  info.setTextColor(
                          Color.WHITE);

                  info.setTextSize(17);

                  info.setPadding(
                          20, 20, 20, 20);

                  info.setBackgroundColor(
                          Color.argb(
                                  235,
                                  8,
                                  15,
                                  25));

                  FrameLayout.LayoutParams infoParams =
                          new FrameLayout.LayoutParams(
                                  650,
                                  180);

                  infoParams.gravity =
                          Gravity.TOP |
                          Gravity.CENTER_HORIZONTAL;

                  infoParams.topMargin = 60;

                  root.addView(
                          info,
                          infoParams);

                  final float[] point =
                          {-1, -1};

                  root.setOnTouchListener(
                          (v, event) -> {

                              if (event.getAction() ==
                                      MotionEvent.ACTION_UP) {

                                  point[0] =
                                          event.getRawX();

                                  point[1] =
                                          event.getRawY();

                                  info.setText(
                                          "SET " + mode +
                                          " POSITION\n\n" +
                                          "X: " + point[0] +
                                          "   Y: " + point[1] +
                                          "\n\n" +
                                          "กด SAVE");

                                  return true;
                              }

                              return true;
                          });

                  LinearLayout buttons =
                          new LinearLayout(service);

                  buttons.setOrientation(
                          LinearLayout.HORIZONTAL);

                  Button save =
                          new Button(service);

                  save.setText("SAVE");

                  Button cancel =
                          new Button(service);

                  cancel.setText("CANCEL");

                  buttons.addView(
                          save,
                          new LinearLayout.LayoutParams(
                                  0, 70, 1));

                  buttons.addView(
                          cancel,
                          new LinearLayout.LayoutParams(
                                  0, 70, 1));

                  FrameLayout.LayoutParams bp =
                          new FrameLayout.LayoutParams(
                                  650,
                                  80);

                  bp.gravity =
                          Gravity.TOP |
                          Gravity.CENTER_HORIZONTAL;

                  bp.topMargin = 250;

                  root.addView(
                          buttons,
                          bp);

                  WindowManager.LayoutParams params =
                          new WindowManager.LayoutParams(
                                  -1,
                                  -1,
                                  WindowManager.LayoutParams.TYPE_ACCESSIBILITY_OVERLAY,
                                  WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE,
                                  PixelFormat.TRANSLUCENT);

                  params.gravity =
                          Gravity.TOP |
                          Gravity.START;

                  save.setOnClickListener(
                          v -> {

                              if (point[0] >= 0 &&
                                      point[1] >= 0) {

                                  SettingsStore.savePoint(
                                          service,
                                          mode,
                                          point[0],
                                          point[1]);

                                  info.setText(
                                          "SAVED\n\n" +
                                          "X: " +
                                          point[0] +
                                          "\nY: " +
                                          point[1]);
                              }
                          });

                  cancel.setOnClickListener(
                          v -> {

                              try {
                                  wm.removeView(root);
                              } catch (Exception ignored) {
                              }
                          });

                  wm.addView(
                          root,
                          params);
              }
          }
          EOF

      - name: Create MainActivity.java
        shell: bash
        run: |
          cat > app/src/main/java/com/dustinbot/v3/MainActivity.java <<'EOF'
          package com.dustinbot.v3;

          import android.app.Activity;
          import android.content.Intent;
          import android.graphics.Color;
          import android.os.Bundle;
          import android.provider.Settings;
          import android.view.Gravity;
          import android.widget.Button;
          import android.widget.LinearLayout;
          import android.widget.TextView;

          public class MainActivity extends Activity {

              private int dp(int n) {
                  return (int)(
                          n *
                          getResources()
                                  .getDisplayMetrics()
                                  .density);
              }

              private TextView text(
                      String s,
                      int size) {

                  TextView t =
                          new TextView(this);

                  t.setText(s);
                  t.setTextColor(Color.WHITE);
                  t.setTextSize(size);
                  t.setPadding(
                          dp(10),
                          dp(10),
                          dp(10),
                          dp(10));

                  return t;
              }

              private Button button(String s) {

                  Button b =
                          new Button(this);

                  b.setText(s);

                  return b;
              }

              @Override
              protected void onCreate(
                      Bundle savedInstanceState) {

                  super.onCreate(
                          savedInstanceState);

                  LinearLayout root =
                          new LinearLayout(this);

                  root.setOrientation(
                          LinearLayout.VERTICAL);

                  root.setPadding(
                          dp(15),
                          dp(15),
                          dp(15),
                          dp(15));

                  root.setBackgroundColor(
                          Color.rgb(
                                  7,
                                  11,
                                  18));

                  TextView title =
                          text(
                                  "🤖 DUSTINBOT\n" +
                                  "ANDROID V3",
                                  26);

                  title.setGravity(
                          Gravity.CENTER);

                  root.addView(title);

                  root.addView(
                          text(
                                  "OpenKore-style Android Bot\n\n" +
                                  "เปิดเกม Dustin RO แล้วใช้ " +
                                  "DustinBot เป็นหน้าต่างลอย",
                                  16));

                  Button accessibility =
                          button(
                                  "OPEN ACCESSIBILITY");

                  accessibility.setOnClickListener(
                          v -> {

                              startActivity(
                                      new Intent(
                                              Settings
                                                      .ACTION_ACCESSIBILITY_SETTINGS));
                          });

                  root.addView(
                          accessibility);

                  Button show =
                          button(
                                  "SHOW BOT OVER GAME");

                  show.setOnClickListener(
                          v -> {

                              BotAccessibility bot =
                                      BotAccessibility
                                              .getInstance();

                              if (bot != null) {
                                  bot.showBot();
                              } else {
                                  accessibility
                                          .performClick();
                              }
                          });

                  root.addView(show);

                  root.addView(
                          text(
                                  "วิธีใช้งาน\n\n" +
                                  "1. เปิด Accessibility\n" +
                                  "2. เปิด DustinBot\n" +
                                  "3. เปิด Dustin RO\n" +
                                  "4. กลับมา DustinBot\n" +
                                  "5. SHOW BOT OVER GAME\n" +
                                  "6. ตั้ง MOVE\n" +
                                  "7. ตั้ง ATTACK\n" +
                                  "8. ตั้ง LOOT\n" +
                                  "9. START\n\n" +
                                  "BOT LOOP\n" +
                                  "WALK → GAME LOCK → ATTACK → LOOT → WALK",
                                  15));

                  setContentView(root);
              }
          }
          EOF

      - name: Validate XML
        shell: bash
        run: |
          set -e

          python3 - <<'PY'
          import xml.etree.ElementTree as ET

          files = [
              "app/src/main/AndroidManifest.xml",
              "app/src/main/res/values/strings.xml",
              "app/src/main/res/values/themes.xml",
              "app/src/main/res/xml/accessibility.xml"
          ]

          for file in files:
              print("Checking:", file)

              with open(file, "rb") as f:
                  data = f.read()

              ET.fromstring(data)

              print("OK:", file)
          PY

      - name: Generate Gradle Wrapper
        shell: bash
        run: |
          set -e

          curl -L \
            https://services.gradle.org/distributions/gradle-8.7-bin.zip \
            -o /tmp/gradle.zip

          mkdir -p /tmp/gradle

          unzip -q \
            /tmp/gradle.zip \
            -d /tmp/gradle

          /tmp/gradle/gradle-8.7/bin/gradle wrapper \
            --gradle-version 8.7

      - name: Build APK
        shell: bash
        run: |
          set -e

          chmod +x gradlew

          ./gradlew \
            clean \
            assembleDebug \
            --stacktrace

      - name: Show APK
        shell: bash
        run: |
          set -e

          find app/build/outputs/apk/debug \
            -type f \
            -name "*.apk" \
            -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DustinBot-Android-V3
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
