name: Build DustinBot Android V2

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:

  build:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4


      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'


      - name: Create Android Project
        shell: bash
        run: |

          rm -rf app
          rm -f build.gradle settings.gradle gradle.properties

          mkdir -p app/src/main/java/com/dustinbot/v2
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/xml


          cat > settings.gradle <<'EOF'

          pluginManagement {

              repositories {

                  google()
                  mavenCentral()
                  gradlePluginPortal()

              }

          }


          dependencyResolutionManagement {

              repositoriesMode.set(
                  RepositoriesMode.FAIL_ON_PROJECT_REPOS
              )

              repositories {

                  google()
                  mavenCentral()

              }

          }


          rootProject.name =
              "DustinBotAndroidV2"

          include(":app")

          EOF


          cat > build.gradle <<'EOF'

          plugins {

              id 'com.android.application'
                  version '8.6.1'
                  apply false

          }

          EOF


          cat > gradle.properties <<'EOF'

          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

          android.useAndroidX=true

          EOF


          cat > app/build.gradle <<'EOF'

          plugins {

              id 'com.android.application'

          }


          android {

              namespace 'com.dustinbot.v2'

              compileSdk 35


              defaultConfig {

                  applicationId 'com.dustinbot.v2'

                  minSdk 26

                  targetSdk 35

                  versionCode 20

                  versionName '2.0'

              }

          }

          EOF


          cat > app/src/main/res/values/strings.xml <<'EOF'

          <resources>

              <string name="app_name">
                  DustinBot Android V2
              </string>

              <string name="accessibility_description">
                  DustinBot Android Controller
              </string>

          </resources>

          EOF


          cat > app/src/main/res/values/themes.xml <<'EOF'

          <resources>

              <style
                  name="AppTheme"
                  parent="android:style/Theme.Material.Light.NoActionBar">

                  <item name="android:fontFamily">
                      sans
                  </item>

                  <item name="android:colorAccent">
                      #1976D2
                  </item>

                  <item name="android:navigationBarColor">
                      #111111
                  </item>

                  <item name="android:statusBarColor">
                      #111111
                  </item>

              </style>

          </resources>

          EOF


          cat > app/src/main/res/xml/accessibility.xml <<'EOF'

          <accessibility-service
              xmlns:android="http://schemas.android.com/apk/res/android"

              android:description="@string/accessibility_description"

              android:accessibilityEventTypes="
                  typeWindowStateChanged|
                  typeWindowContentChanged
              "

              android:accessibilityFeedbackType="feedbackGeneric"

              android:notificationTimeout="100"

              android:canPerformGestures="true"

              android:canRetrieveWindowContent="true" />

          EOF


          cat > app/src/main/AndroidManifest.xml <<'EOF'

          <manifest
              xmlns:android="http://schemas.android.com/apk/res/android">


              <application

                  android:allowBackup="false"

                  android:label="@string/app_name"

                  android:theme="@style/AppTheme">


                  <activity

                      android:name=".MainActivity"

                      android:exported="true">


                      <intent-filter>

