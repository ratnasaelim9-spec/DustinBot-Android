      - name: Check Project
        shell: bash
        run: |

          set -e

          echo "===== PROJECT ====="

          find app/src/main -type f | sort

          echo "===== MANIFEST ====="

          cat app/src/main/AndroidManifest.xml

          echo "===== ACCESSIBILITY XML ====="

          cat app/src/main/res/xml/accessibility_service_config.xml

      - name: Build APK
        shell: bash
        run: |

          set -e

          gradle \
            :app:assembleDebug \
            --no-daemon \
            --stacktrace

      - name: Prepare APK
        shell: bash
        run: |

          set -e

          mkdir -p output

          cp \
            app/build/outputs/apk/debug/app-debug.apk \
            output/DustinBotV9.3-FULL-AUTO.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DUSTIN-BOT-V9.3-FULL-AUTO
          path: output/DustinBotV9.3-FULL-AUTO.apk
          if-no-files-found: error
