name: DustinBot Android AUTO START

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # ==========================================================
      # CHECKOUT
      # ==========================================================

      - name: Checkout
        uses: actions/checkout@v4


      # ==========================================================
      # JAVA
      # ==========================================================

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"


      # ==========================================================
      # CREATE ANDROID PROJECT
      # ==========================================================

      - name: Create Android Project
        shell: bash
        run: |

          set -e


          mkdir -p app/src/main/java/com/dustinbot/auto
          mkdir -p app/src/main/res/xml
          mkdir -p app/src/main/res/values


          # ======================================================
          # settings.gradle
          # ======================================================

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)

              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "DustinBotAuto"

          include(":app")
          EOF


          # ======================================================
          # build.gradle
          # ======================================================

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.6.1' apply false
          }
          EOF


          # ======================================================
          # gradle.properties
          # ======================================================

          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=false
          EOF


          # ======================================================
          # app/build.gradle
          # ======================================================

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {

              namespace 'com.dustinbot.auto'

              compileSdk 35

              defaultConfig {

                  applicationId 'com.dustinbot.auto'

                  minSdk 30

                  targetSdk 35

                  versionCode 72

                  versionName '7.2'
              }

              compileOptions {

                  sourceCompatibility JavaVersion.VERSION_17

                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          EOF


          # ======================================================
          # strings.xml
          # ======================================================

          cat > app/src/main/res/values/strings.xml <<'EOF'
          <resources>

              <string name="app_name">
                  DustinBot AUTO
              </string>

              <string name="accessibility_description">
                  DustinBot automatic screen automation service
              </string>

          </resources>
          EOF


          # ======================================================
          # styles.xml
          # ======================================================

          cat > app/src/main/res/values/styles.xml <<'EOF'
          <resources>

              <style
                  name="DustinBotTheme"
                  parent="@android:style/Theme.Material.NoActionBar">

                  <item name="android:fontFamily">
                      sans
                  </item>

                  <item name="android:windowNoTitle">
                      true
                  </item>

                  <item name="android:colorAccent">
                      #00C853
                  </item>

                  <item name="android:statusBarColor">
                      #000000
                  </item>

                  <item name="android:navigationBarColor">
                      #000000
                  </item>

              </style>

          </resources>
          EOF


          # ======================================================
          # ACCESSIBILITY CONFIG
          # ======================================================

          cat > app/src/main/res/xml/accessibility_service_config.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>

          <accessibility-service
              xmlns:android="http://schemas.android.com/apk/res/android"

              android:accessibilityEventTypes="
                  typeWindowStateChanged|
                  typeWindowContentChanged"

              android:accessibilityFeedbackType="feedbackGeneric"

              android:notificationTimeout="100"

              android:canRetrieveWindowContent="true"

              android:canPerformGestures="true"

              android:canTakeScreenshot="true"

              android:description="@string/accessibility_description" />

          EOF


          # ======================================================
          # AndroidManifest.xml
          # ======================================================

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>

          <manifest
              xmlns:android="http://schemas.android.com/apk/res/android">

              <queries>

                  <intent>

                      <action
                          android:name="android.intent.action.MAIN" />

                      <category
                          android:name="android.intent.category.LAUNCHER" />

                  </intent>

              </queries>


              <application

                  android:allowBackup="false"

                  android:label="DustinBot AUTO"

                  android:theme="@style/DustinBotTheme"


                  <activity

                      android:name=".MainActivity"

                      android:exported="true">

                      <intent-filter>

                          <action
                              android:name="android.intent.action.MAIN" />

                          <category
                              android:name="android.intent.category.LAUNCHER" />

                      </intent-filter>

                  </activity>


                  <service

                      android:name=".BotAccessibility"

                      android:permission="
                          android.permission.BIND_ACCESSIBILITY_SERVICE
                      "

                      android:exported="false">

                      <intent-filter>

                          <action
                              android:name="
                              android.accessibilityservice.AccessibilityService
                              " />

                      </intent-filter>


                      <meta-data

                          android:name="
                          android.accessibilityservice
                          "

                          android:resource="
                          @xml/accessibility_service_config
                          " />

                  </service>

              </application>

          </manifest>
          EOF


          # ======================================================
          # GameLauncher.java
          # ======================================================

          cat > app/src/main/java/com/dustinbot/auto/GameLauncher.java <<'EOF'
          package com.dustinbot.auto;

          import android.content.Context;
          import android.content.Intent;
          import android.content.pm.PackageManager;
          import android.content.pm.ResolveInfo;

          import java.util.List;
          import java.util.Locale;


          public final class GameLauncher {

              private GameLauncher() {
              }


              public static boolean open(
                      Context context) {

                  PackageManager pm =
                      context.getPackageManager();


                  Intent query =
                      new Intent(
                          Intent.ACTION_MAIN);


                  query.addCategory(
                      Intent.CATEGORY_LAUNCHER);


                  List<ResolveInfo> apps =
                      pm.queryIntentActivities(
                          query,
                          PackageManager.MATCH_ALL);


                  String ragnarokPackage = null;


                  for (ResolveInfo info : apps) {

                      String label =
                          String.valueOf(
                              info.loadLabel(pm))
                              .toLowerCase(
                                  Locale.ROOT);


                      String pkg =
                          info.activityInfo
                              .packageName
                              .toLowerCase(
                                  Locale.ROOT);


                      if (label.contains("dustin") ||
                          pkg.contains("dustin")) {

                          return launch(
                              context,
                              info.activityInfo
                                  .packageName);
                      }


                      if (label.contains("ragnarok") ||
                          label.equals("ro")) {

                          ragnarokPackage =
                              info.activityInfo
                                  .packageName;
                      }
                  }


                  if (ragnarokPackage != null) {

                      return launch(
                          context,
                          ragnarokPackage);
                  }


                  return false;
              }


              private static boolean launch(
                      Context context,
                      String packageName) {

                  Intent intent =
                      context.getPackageManager()
                          .getLaunchIntentForPackage(
                              packageName);


                  if (intent == null) {

                      return false;
                  }


                  intent.addFlags(
                      Intent.FLAG_ACTIVITY_NEW_TASK |
                      Intent.FLAG_ACTIVITY_RESET_TASK_IF_NEEDED);


                  context.startActivity(intent);


                  return true;
              }
          }
          EOF


          # ======================================================
          # Vision.java
          # ======================================================

          cat > app/src/main/java/com/dustinbot/auto/Vision.java <<'EOF'
          package com.dustinbot.auto;

          import android.graphics.Bitmap;
          import android.graphics.Color;

          import java.util.ArrayDeque;
          import java.util.ArrayList;
          import java.util.List;


          public final class Vision {


              public static final class Target {

                  public final int x;

                  public final int y;

                  public final int size;


                  public Target(
                          int x,
                          int y,
                          int size) {

                      this.x = x;

                      this.y = y;

                      this.size = size;
                  }
              }


              private Vision() {
              }


              public static List<Target> detect(
                      Bitmap bitmap) {

                  ArrayList<Target> result =
                      new ArrayList<>();


                  if (bitmap == null) {

                      return result;
                  }


                  int width =
                      bitmap.getWidth();

                  int height =
                      bitmap.getHeight();


                  int left =
                      (int)(width * 0.04f);

                  int right =
                      (int)(width * 0.96f);

                  int top =
                      (int)(height * 0.10f);

                  int bottom =
                      (int)(height * 0.70f);


                  int step =
                      Math.max(
                          3,
                          Math.min(
                              width,
                              height) / 320);


                  int gridWidth =
                      (right - left) /
                      step + 1;


                  int gridHeight =
                      (bottom - top) /
                      step + 1;


                  boolean[] active =
                      new boolean[
                          gridWidth *
                          gridHeight];


                  boolean[] visited =
                      new boolean[
                          gridWidth *
                          gridHeight];


                  for (
                      int gy = 0;
                      gy < gridHeight;
                      gy++) {

                      for (
                          int gx = 0;
                          gx < gridWidth;
                          gx++) {


                          int x =
                              Math.min(
                                  width - 1,
                                  left +
                                  gx * step);


                          int y =
                              Math.min(
                                  height - 1,
                                  top +
                                  gy * step);


                          int color =
                              bitmap.getPixel(
                                  x,
                                  y);


                          int r =
                              Color.red(color);

                          int g =
                              Color.green(color);

                          int b =
                              Color.blue(color);


                          int max =
                              Math.max(
                                  r,
                                  Math.max(g, b));


                          int min =
                              Math.min(
                                  r,
                                  Math.min(g, b));


                          int saturation =
                              max - min;


                          int brightness =
                              (r + g + b) / 3;


                          active[
                              gy *
                              gridWidth +
                              gx
                          ] =
                              saturation >= 65 &&
                              brightness >= 35 &&
                              brightness <= 245;
                      }
                  }


                  for (
                      int sy = 0;
                      sy < gridHeight;
                      sy++) {

                      for (
                          int sx = 0;
                          sx < gridWidth;
                          sx++) {


                          int start =
                              sy *
                              gridWidth +
                              sx;


                          if (!active[start] ||
                              visited[start]) {

                              continue;
                          }


                          ArrayDeque<Integer> queue =
                              new ArrayDeque<>();


                          queue.add(start);

                          visited[start] = true;


                          int count = 0;


                          int minX = sx;

                          int maxX = sx;

                          int minY = sy;

                          int maxY = sy;


                          long sumX = 0;

                          long sumY = 0;


                          while (
                              !queue.isEmpty()) {


                              int id =
                                  queue.removeFirst();


                              int x =
                                  id %
                                  gridWidth;


                              int y =
                                  id /
                                  gridWidth;


                              count++;


                              sumX += x;

                              sumY += y;


                              minX =
                                  Math.min(
                                      minX,
                                      x);


                              maxX =
                                  Math.max(
                                      maxX,
                                      x);


                              minY =
                                  Math.min(
                                      minY,
                                      y);


                              maxY =
                                  Math.max(
                                      maxY,
                                      y);


                              for (
                                  int dy = -1;
                                  dy <= 1;
                                  dy++) {

                                  for (
                                      int dx = -1;
                                      dx <= 1;
                                      dx++) {


                                      if (
                                          dx == 0 &&
                                          dy == 0) {

                                          continue;
                                      }


                                      int nx =
                                          x + dx;

                                      int ny =
                                          y + dy;


                                      if (
                                          nx < 0 ||
                                          nx >= gridWidth ||
                                          ny < 0 ||
                                          ny >= gridHeight) {

                                          continue;
                                      }


                                      int next =
                                          ny *
                                          gridWidth +
                                          nx;


                                      if (
                                          active[next] &&
                                          !visited[next]) {

                                          visited[next] =
                                              true;

                                          queue.addLast(
                                              next);
                                      }
                                  }
                              }
                          }


                          int objectWidth =
                              (maxX - minX + 1) *
                              step;


                          int objectHeight =
                              (maxY - minY + 1) *
                              step;


                          if (
                              count < 8 ||
                              count > 700 ||
                              objectWidth < 10 ||
                              objectHeight < 10 ||
                              objectWidth > 180 ||
                              objectHeight > 180) {

                              continue;
                          }


                          int centerX =
                              left +
                              Math.round(
                                  sumX /
                                  (float)count *
                                  step);


                          int centerY =
                              top +
                              Math.round(
                                  sumY /
                                  (float)count *
                                  step);


                          if (
                              centerY >
                              height * 0.58f &&
                              Math.abs(
                                  centerX -
                                  width / 2)
                              <
                              width * 0.20f) {

                              continue;
                          }


                          result.add(
                              new Target(
                                  centerX,
                                  centerY,
                                  Math.max(
                                      objectWidth,
                                      objectHeight)));
                      }
                  }


                  return result;
              }


              public static Target nearest(
                      List<Target> targets,
                      int width,
                      int height) {

                  if (
                      targets == null ||
                      targets.isEmpty()) {

                      return null;
                  }


                  float playerX =
                      width / 2f;


                  float playerY =
                      height * 0.48f;


                  Target best = null;


                  double bestScore =
                      -Double.MAX_VALUE;


                  for (
                      Target target :
                      targets) {


                      double dx =
                          target.x -
                          playerX;


                      double dy =
                          target.y -
                          playerY;


                      double distance =
                          Math.sqrt(
                              dx * dx +
                              dy * dy);


                      double score =
                          target.size * 2.0 -
                          distance * 0.20;


                      if (
                          score >
                          bestScore) {

                          bestScore =
                              score;

                          best =
                              target;
                      }
                  }


                  return best;
              }
          }
          EOF


          # ======================================================
          # BotAccessibility.java
          # ======================================================

          cat > app/src/main/java/com/dustinbot/auto/BotAccessibility.java <<'EOF'
          package com.dustinbot.auto;

          import android.accessibilityservice.AccessibilityService;
          import android.accessibilityservice.GestureDescription;

          import android.graphics.Bitmap;
          import android.graphics.Path;
          import android.graphics.PixelFormat;

          import android.hardware.HardwareBuffer;

          import android.os.Build;
          import android.os.Handler;
          import android.os.Looper;

          import android.view.Gravity;
          import android.view.WindowManager;

          import android.view.accessibility.AccessibilityEvent;

          import android.widget.Button;
          import android.widget.LinearLayout;
          import android.widget.TextView;

          import java.util.concurrent.ExecutorService;
          import java.util.concurrent.Executors;


          public class BotAccessibility
              extends AccessibilityService {


              public static BotAccessibility instance;


              private final Handler handler =
                  new Handler(
                      Looper.getMainLooper());


              private final ExecutorService screenshotExecutor =
                  Executors.newSingleThreadExecutor();


              private WindowManager windowManager;

              private LinearLayout panel;

              private TextView statusText;

              private BotEngine engine;


              public interface ScreenshotCallback {

                  void onResult(Bitmap bitmap);
              }


              @Override
              protected void onServiceConnected() {

                  super.onServiceConnected();


                  instance = this;


                  engine =
                      new BotEngine(
                          this,
                          handler);


                  createPanel();
              }


              /*
               * Required by AccessibilityService.
               */

              @Override
              public void onInterrupt() {
              }


              /*
               * Required by AccessibilityService.
               */

              @Override
              public void onAccessibilityEvent(
                      AccessibilityEvent event) {

                  /*
                   * The bot uses screenshots
                   * instead of accessibility nodes.
                   */
              }


              @Override
              public void onDestroy() {

                  if (engine != null) {

                      engine.stop();
                  }


                  if (panel != null) {

                      try {

                          windowManager.removeView(
                              panel);

                      } catch (Exception ignored) {
                      }
                  }


                  screenshotExecutor.shutdownNow();


                  instance = null;


                  super.onDestroy();
              }


              public void startBot() {

                  if (engine != null) {

                      engine.start();
                  }


                  updatePanel();
              }


              public void stopBot() {

                  if (engine != null) {

                      engine.stop();
                  }


                  updatePanel();
              }


              private void createPanel() {

                  windowManager =
                      (WindowManager)
                      getSystemService(
                          WINDOW_SERVICE);


                  panel =
                      new LinearLayout(this);


                  panel.setOrientation(
                      LinearLayout.VERTICAL);


                  panel.setPadding(
                      14,
                      10,
                      14,
                      10);


                  panel.setBackgroundColor(
                      0xE8202020);


                  statusText =
                      new TextView(this);


                  statusText.setTextColor(
                      0xFFFFFFFF);


                  statusText.setTextSize(14);


                  panel.addView(
                      statusText);


                  LinearLayout buttons =
                      new LinearLayout(this);


                  Button start =
                      new Button(this);


                  start.setText(
                      "START");


                  Button stop =
                      new Button(this);


                  stop.setText(
                      "STOP");


                  buttons.addView(start);

                  buttons.addView(stop);


                  panel.addView(
                      buttons);


                  start.setOnClickListener(
                      v -> startBot());


                  stop.setOnClickListener(
                      v -> stopBot());


                  WindowManager.LayoutParams lp =
                      new WindowManager.LayoutParams(

                          WindowManager.LayoutParams.WRAP_CONTENT,

                          WindowManager.LayoutParams.WRAP_CONTENT,

                          WindowManager.LayoutParams.TYPE_ACCESSIBILITY_OVERLAY,

                          WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE |
                          WindowManager.LayoutParams.FLAG_LAYOUT_IN_SCREEN,

                          PixelFormat.TRANSLUCENT
                      );


                  lp.gravity =
                      Gravity.TOP |
                      Gravity.LEFT;


                  lp.x = 8;

                  lp.y = 50;


                  windowManager.addView(
                      panel,
                      lp);


                  updatePanel();
              }


              public void updatePanel() {

                  if (
                      statusText == null ||
                      engine == null) {

                      return;
                  }


                  statusText.setText(

                      "DUSTIN BOT AUTO\n" +

                      (
                          engine.isRunning()
                          ? "● RUNNING"
                          : "● STOPPED"
                      ) +

                      "\nSTATE: " +

                      engine.getState() +

                      "\nTARGET: " +

                      engine.getTarget()
                  );
              }


              public void screenshot(
                      ScreenshotCallback callback) {


                  if (
                      Build.VERSION.SDK_INT <
                      Build.VERSION_CODES.R) {

                      callback.onResult(null);

                      return;
                  }


                  takeScreenshot(

                      android.view.Display.DEFAULT_DISPLAY,

                      screenshotExecutor,

                      new AccessibilityService
                          .TakeScreenshotCallback() {


                          @Override
                          public void onSuccess(
                                  ScreenshotResult result) {


                              Bitmap bitmap =
                                  null;


                              try {

                                  HardwareBuffer buffer =
                                      result.getHardwareBuffer();


                                  if (buffer != null) {

                                      Bitmap source =
                                          Bitmap.wrapHardwareBuffer(

                                              buffer,

                                              result.getColorSpace()
                                          );


                                      if (source != null) {

                                          bitmap =
                                              source.copy(

                                                  Bitmap.Config.ARGB_8888,

                                                  false
                                              );


                                          source.recycle();
                                      }


                                      buffer.close();
                                  }


                              } catch (
                                  Exception ignored) {
                              }


                              Bitmap finalBitmap =
                                  bitmap;


                              handler.post(
                                  () ->
                                      callback.onResult(
                                          finalBitmap));
                          }


                          @Override
                          public void onFailure(
                                  int errorCode) {


                              handler.post(
                                  () ->
                                      callback.onResult(
                                          null));
                          }
                      });
              }


              public void tap(
                      int x,
                      int y) {


                  Path path =
                      new Path();


                  path.moveTo(
                      x,
                      y);


                  GestureDescription gesture =

                      new GestureDescription
                          .Builder()

                          .addStroke(

                              new GestureDescription
                                  .StrokeDescription(

                                  path,

                                  0,

                                  70))

                          .build();


                  dispatchGesture(
                      gesture,
                      null,
                      null);
              }


              public void swipe(
                      int x1,
                      int y1,
                      int x2,
                      int y2,
                      long duration) {


                  Path path =
                      new Path();


                  path.moveTo(
                      x1,
                      y1);


                  path.lineTo(
                      x2,
                      y2);


                  GestureDescription gesture =

                      new GestureDescription
                          .Builder()

                          .addStroke(

                              new GestureDescription
                                  .StrokeDescription(

                                  path,

                                  0,

                                  Math.max(
                                      120,
                                      duration)))

                          .build();


                  dispatchGesture(
                      gesture,
                      null,
                      null);
              }
          }
          EOF


          # ======================================================
          # BotEngine.java
          # ======================================================

          cat > app/src/main/java/com/dustinbot/auto/BotEngine.java <<'EOF'
          package com.dustinbot.auto;

          import android.graphics.Bitmap;
          import android.os.Handler;

          import java.util.List;


          public final class BotEngine {


              private final BotAccessibility service;

              private final Handler handler;


              private volatile boolean running =
                  false;


              private String state =
                  "IDLE";


              private String target =
                  "-";


              private int searchMisses =
                  0;


              public BotEngine(
                      BotAccessibility service,
                      Handler handler) {

                  this.service =
                      service;

                  this.handler =
                      handler;
              }


              public boolean isRunning() {

                  return running;
              }


              public String getState() {

                  return state;
              }


              public String getTarget() {

                  return target;
              }


              public void start() {


                  if (running) {

                      return;
                  }


                  running = true;


                  state =
                      "OPEN GAME";


                  target =
                      "-";


                  service.updatePanel();


                  boolean opened =
                      GameLauncher.open(
                          service);


                  if (!opened) {

                      state =
                          "GAME NOT FOUND";


                      running =
                          false;


                      service.updatePanel();


                      return;
                  }


                  handler.postDelayed(
                      this::search,
                      5000);
              }


              public void stop() {


                  running =
                      false;


                  handler.removeCallbacksAndMessages(
                      null);


                  state =
                      "STOPPED";


                  target =
                      "-";


                  service.updatePanel();
              }


              private void search() {


                  if (!running) {

                      return;
                  }


                  state =
                      "SEARCH MONSTER";


                  service.updatePanel();


                  service.screenshot(
                      bitmap -> {


                          if (!running) {

                              recycle(bitmap);

                              return;
                          }


                          if (bitmap == null) {

                              retry(1200);

                              return;
                          }


                          List<Vision.Target>
                              targets =

                              Vision.detect(
                                  bitmap);


                          Vision.Target selected =

                              Vision.nearest(

                                  targets,

                                  bitmap.getWidth(),

                                  bitmap.getHeight());


                          int width =
                              bitmap.getWidth();


                          int height =
                              bitmap.getHeight();


                          recycle(bitmap);


                          if (selected == null) {


                              searchMisses++;


                              state =
                                  "SEARCHING";


                              target =
                                  "NONE";


                              service.updatePanel();


                              int joystickX =
                                  (int)(
                                      width *
                                      0.16f);


                              int joystickY =
                                  (int)(
                                      height *
                                      0.80f);


                              int movement =
                                  (int)(
                                      width *
                                      0.18f);


                              if (
                                  searchMisses %
                                  2 == 0) {


                                  service.swipe(

                                      joystickX,

                                      joystickY,

                                      joystickX +
                                      movement,

                                      joystickY,

                                      450);


                              } else {


                                  service.swipe(

                                      joystickX,

                                      joystickY,

                                      joystickX -
                                      movement,

                                      joystickY,

                                      450);
                              }


                              retry(1000);

                              return;
                          }


                          searchMisses = 0;


                          target =
                              selected.x +
                              "," +
                              selected.y;


                          state =
                              "TARGET";


                          service.updatePanel();


                          service.tap(

                              selected.x,

                              selected.y);


                          handler.postDelayed(

                              () ->
                                  attack(

                                      selected.x,

                                      selected.y),

                              500);
                      });
              }


              private void attack(
                      int x,
                      int y) {


                  if (!running) {

                      return;
                  }


                  state =
                      "ATTACK";


                  target =
                      x +
                      "," +
                      y;


                  service.updatePanel();


                  service.tap(
                      x,
                      y);


                  handler.postDelayed(

                      () ->
                          checkTarget(
                              x,
                              y),

                      700);
              }


              private void checkTarget(
                      int x,
                      int y) {


                  if (!running) {

                      return;
                  }


                  service.screenshot(

                      bitmap -> {


                          if (!running) {

                              recycle(bitmap);

                              return;
                          }


                          if (bitmap == null) {


                              service.tap(
                                  x,
                                  y);


                              handler.postDelayed(

                                  () ->
                                      checkTarget(
                                          x,
                                          y),

                                  900);

                              return;
                          }


                          List<Vision.Target>
                              targets =

                              Vision.detect(
                                  bitmap);


                          recycle(bitmap);


                          Vision.Target near =
                              findNear(
                                  targets,
                                  x,
                                  y);


                          if (near == null) {


                              state =
                                  "LOOT";


                              target =
                                  "-";


                              service.updatePanel();


                              handler.postDelayed(

                                  this::loot,

                                  600);


                              return;
                          }


                          service.tap(
                              x,
                              y);


                          handler.postDelayed(

                              () ->
                                  checkTarget(
                                      x,
                                      y),

                              700);
                      });
              }


              private Vision.Target findNear(
                      List<Vision.Target> targets,
                      int x,
                      int y) {


                  Vision.Target best =
                      null;


                  double bestDistance =
                      Double.MAX_VALUE;


                  for (
                      Vision.Target t :
                      targets) {


                      double dx =
                          t.x - x;


                      double dy =
                          t.y - y;


                      double distance =
                          dx * dx +
                          dy * dy;


                      if (
                          distance <
                          bestDistance) {

                          bestDistance =
                              distance;

                          best =
                              t;
                      }
                  }


                  if (
                      best != null &&
                      bestDistance <
                      180 * 180) {

                      return best;
                  }


                  return null;
              }


              private void loot() {


                  if (!running) {

                      return;
                  }


                  state =
                      "LOOT";


                  service.updatePanel();


                  int width =
                      service
                          .getResources()
                          .getDisplayMetrics()
                          .widthPixels;


                  int height =
                      service
                          .getResources()
                          .getDisplayMetrics()
                          .heightPixels;


                  int centerX =
                      width / 2;


                  service.tap(

                      centerX,

                      (int)(
                          height *
                          0.72f));


                  handler.postDelayed(

                      () -> {


                          if (!running) {

                              return;
                          }


                          service.tap(

                              centerX,

                              (int)(
                                  height *
                                  0.64f));


                          handler.postDelayed(

                              () -> {


                                  if (!running) {

                                      return;
                                  }


                                  state =
                                      "SEARCH MONSTER";


                                  service.updatePanel();


                                  retry(700);

                              },

                              450);

                      },

                      400);
              }


              private void retry(
                      long delay) {


                  if (!running) {

                      return;
                  }


                  handler.postDelayed(

                      this::search,

                      delay);
              }


              private void recycle(
                      Bitmap bitmap) {


                  if (
                      bitmap != null &&
                      !bitmap.isRecycled()) {

                      bitmap.recycle();
                  }
              }
          }
          EOF


