          # =====================================================
          # BotAccessibility.java
          # =====================================================

          cat > app/src/main/java/com/dustinbot/v91/BotAccessibility.java <<'EOF'
          package com.dustinbot.v91;

          import android.accessibilityservice.AccessibilityService;
          import android.accessibilityservice.GestureDescription;
          import android.accessibilityservice.AccessibilityService.ScreenshotResult;

          import android.graphics.Bitmap;
          import android.graphics.ColorSpace;
          import android.graphics.Path;
          import android.graphics.PixelFormat;

          import android.hardware.HardwareBuffer;

          import android.os.Build;
          import android.os.Handler;
          import android.os.Looper;

          import android.view.Display;
          import android.view.Gravity;
          import android.view.WindowManager;

          import android.widget.Button;
          import android.widget.LinearLayout;
          import android.widget.TextView;

          import android.graphics.Color;
          import android.graphics.drawable.GradientDrawable;

          import android.view.accessibility.AccessibilityEvent;

          import java.util.concurrent.Executor;
          import java.util.concurrent.Executors;

          public class BotAccessibility
              extends AccessibilityService {

              private static BotAccessibility instance;

              private final Handler handler =
                  new Handler(
                      Looper.getMainLooper()
                  );

              private final Executor screenshotExecutor =
                  Executors.newSingleThreadExecutor();

              private WindowManager windowManager;

              private LinearLayout panel;

              private TextView status;

              private BotEngine engine;

              public static BotAccessibility getInstance() {
                  return instance;
              }

              @Override
              protected void onServiceConnected() {

                  super.onServiceConnected();

                  instance = this;

                  windowManager =
                      (WindowManager)
                      getSystemService(
                          WINDOW_SERVICE
                      );

                  engine =
                      new BotEngine(this);

                  handler.postDelayed(
                      this::createPanel,
                      500
                  );
              }

              private void createPanel() {

                  if (panel != null) {
                      return;
                  }

                  panel =
                      new LinearLayout(this);

                  panel.setOrientation(
                      LinearLayout.VERTICAL
                  );

                  panel.setPadding(
                      12,
                      8,
                      12,
                      8
                  );

                  GradientDrawable bg =
                      new GradientDrawable();

                  bg.setColor(
                      Color.argb(
                          230,
                          0,
                          0,
                          0
                      )
                  );

                  bg.setCornerRadius(
                      18
                  );

                  panel.setBackground(bg);

                  status =
                      new TextView(this);

                  status.setText(
                      "DUSTIN BOT V9.1\nREADY"
                  );

                  status.setTextColor(
                      Color.WHITE
                  );

                  status.setTextSize(11);

                  status.setGravity(
                      Gravity.CENTER
                  );

                  panel.addView(status);

                  LinearLayout row =
                      new LinearLayout(this);

                  row.setOrientation(
                      LinearLayout.HORIZONTAL
                  );

                  Button start =
                      new Button(this);

                  start.setText(
                      "START"
                  );

                  start.setTextSize(9);

                  Button stop =
                      new Button(this);

                  stop.setText(
                      "STOP"
                  );

                  stop.setTextSize(9);

                  Button hide =
                      new Button(this);

                  hide.setText(
                      "×"
                  );

                  hide.setTextSize(11);

                  row.addView(start);
                  row.addView(stop);
                  row.addView(hide);

                  panel.addView(row);

                  start.setOnClickListener(
                      v -> {

                          if (engine != null) {
                              engine.start();
                          }

                      }
                  );

                  stop.setOnClickListener(
                      v -> {

                          if (engine != null) {
                              engine.stop();
                          }

                      }
                  );

                  hide.setOnClickListener(
                      v -> removePanel()
                  );

                  WindowManager.LayoutParams lp =
                      new WindowManager.LayoutParams(
                          WindowManager.LayoutParams.WRAP_CONTENT,
                          WindowManager.LayoutParams.WRAP_CONTENT,
                          WindowManager.LayoutParams.TYPE_ACCESSIBILITY_OVERLAY,
                          WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE,
                          PixelFormat.TRANSLUCENT
                      );

                  lp.gravity =
                      Gravity.TOP |
                      Gravity.RIGHT;

                  lp.x = 10;
                  lp.y = 70;

                  try {

                      windowManager.addView(
                          panel,
                          lp
                      );

                  } catch (Exception ignored) {

                      panel = null;

                      handler.postDelayed(
                          this::createPanel,
                          1000
                      );
                  }
              }

              private void removePanel() {

                  if (
                      panel != null &&
                      windowManager != null
                  ) {

                      try {

                          windowManager.removeView(
                              panel
                          );

                      } catch (Exception ignored) {
                      }
                  }

                  panel = null;
              }

              public void state(
                  String text
              ) {

                  handler.post(
                      () -> {

                          if (status != null) {

                              status.setText(
                                  "DUSTIN BOT V9.1\n"
                                  + text
                              );
                          }

                      }
                  );
              }

              public void later(
                  Runnable runnable,
                  long delay
              ) {

                  if (runnable != null) {

                      handler.postDelayed(
                          runnable,
                          delay
                      );
                  }
              }

              public void tap(
                  float x,
                  float y
              ) {

                  try {

                      Path path =
                          new Path();

                      path.moveTo(
                          x,
                          y
                      );

                      GestureDescription.StrokeDescription stroke =
                          new GestureDescription.StrokeDescription(
                              path,
                              0,
                              70
                          );

                      GestureDescription gesture =
                          new GestureDescription.Builder()
                              .addStroke(stroke)
                              .build();

                      dispatchGesture(
                          gesture,
                          null,
                          null
                      );

                  } catch (Exception ignored) {
                  }
              }

              public void swipe(
                  float x1,
                  float y1,
                  float x2,
                  float y2,
                  long duration
              ) {

                  try {

                      Path path =
                          new Path();

                      path.moveTo(
                          x1,
                          y1
                      );

                      path.lineTo(
                          x2,
                          y2
                      );

                      GestureDescription.StrokeDescription stroke =
                          new GestureDescription.StrokeDescription(
                              path,
                              0,
                              duration
                          );

                      GestureDescription gesture =
                          new GestureDescription.Builder()
                              .addStroke(stroke)
                              .build();

                      dispatchGesture(
                          gesture,
                          null,
                          null
                      );

                  } catch (Exception ignored) {
                  }
              }

              public void screenshot(
                  BotEngine.ScreenCallback callback
              ) {

                  if (Build.VERSION.SDK_INT < 30) {

                      callback.onBitmap(null);

                      return;
                  }

                  try {

                      takeScreenshot(
                          Display.DEFAULT_DISPLAY,
                          screenshotExecutor,
                          new TakeScreenshotCallback() {

                              @Override
                              public void onSuccess(
                                  ScreenshotResult result
                              ) {

                                  Bitmap copy = null;

                                  HardwareBuffer buffer =
                                      null;

                                  try {

                                      buffer =
                                          result.getHardwareBuffer();

                                      if (buffer == null) {

                                          callback.onBitmap(
                                              null
                                          );

                                          return;
                                      }

                                      Bitmap wrapped =
                                          Bitmap.wrapHardwareBuffer(
                                              buffer,
                                              result.getColorSpace()
                                          );

                                      if (
                                          wrapped != null
                                      ) {

                                          copy =
                                              wrapped.copy(
                                                  Bitmap.Config.ARGB_8888,
                                                  false
                                              );

                                          wrapped.recycle();
                                      }

                                  } catch (Throwable ignored) {

                                  } finally {

                                      if (buffer != null) {

                                          try {
                                              buffer.close();
                                          } catch (Exception ignored) {
                                          }
                                      }
                                  }

                                  callback.onBitmap(copy);
                              }

                              @Override
                              public void onFailure(
                                  int errorCode
                              ) {

                                  callback.onBitmap(
                                      null
                                  );
                              }
                          }
                      );

                  } catch (Throwable ignored) {

                      callback.onBitmap(null);
                  }
              }

              @Override
              public void onAccessibilityEvent(
                  AccessibilityEvent event
              ) {
              }

              @Override
              public void onInterrupt() {

                  if (engine != null) {
                      engine.stop();
                  }
              }

              @Override
              public void onDestroy() {

                  if (engine != null) {
                      engine.stop();
                  }

                  removePanel();

                  instance = null;

                  super.onDestroy();
              }
          }
          EOF

          # =====================================================
          # Vision.java
          # =====================================================

          cat > app/src/main/java/com/dustinbot/v91/Vision.java <<'EOF'
          package com.dustinbot.v91;

          import android.graphics.Bitmap;
          import android.graphics.Color;

          public class Vision {

              public static class Target {

                  public float x;
                  public float y;
                  public float confidence;

                  public Target(
                      float x,
                      float y,
                      float confidence
                  ) {

                      this.x = x;
                      this.y = y;
                      this.confidence =
                          confidence;
                  }
              }

              /*
               * ตรวจ marker ที่ใช้ยืนยัน
               * ว่ามีเป้าหมายอยู่บนหน้าจอ
               *
               * ไม่ใช้สีสุ่มทั่วจอ
               */
              public static Target findMarker(
                  Bitmap b
              ) {

                  if (b == null) {
                      return null;
                  }

                  int w =
                      b.getWidth();

                  int h =
                      b.getHeight();

                  int left =
                      (int)(w * 0.20f);

                  int right =
                      (int)(w * 0.88f);

                  int top =
                      (int)(h * 0.10f);

                  int bottom =
                      (int)(h * 0.72f);

                  Target best =
                      null;

                  double bestScore =
                      0;

                  for (
                      int y = top;
                      y < bottom;
                      y += 5
                  ) {

                      for (
                          int x = left;
                          x < right;
                          x += 5
                      ) {

                          int bright = 0;
                          int dark = 0;
                          int total = 0;

                          for (
                              int yy = -8;
                              yy <= 8;
                              yy += 2
                          ) {

                              for (
                                  int xx = -10;
                                  xx <= 10;
                                  xx += 2
                              ) {

                                  int px =
                                      x + xx;

                                  int py =
                                      y + yy;

                                  if (
                                      px < 0 ||
                                      py < 0 ||
                                      px >= w ||
                                      py >= h
                                  ) {
                                      continue;
                                  }

                                  int c =
                                      b.getPixel(
                                          px,
                                          py
                                      );

                                  int r =
                                      Color.red(c);

                                  int g =
                                      Color.green(c);

                                  int bl =
                                      Color.blue(c);

                                  int max =
                                      Math.max(
                                          r,
                                          Math.max(
                                              g,
                                              bl
                                          )
                                      );

                                  int min =
                                      Math.min(
                                          r,
                                          Math.min(
                                              g,
                                              bl
                                          )
                                      );

                                  if (
                                      min > 185 &&
                                      max - min < 45
                                  ) {

                                      bright++;
                                  }

                                  if (
                                      max < 90
                                  ) {

                                      dark++;
                                  }

                                  total++;
                              }
                          }

                          if (total == 0) {
                              continue;
                          }

                          float br =
                              (float)bright /
                              total;

                          float dr =
                              (float)dark /
                              total;

                          if (
                              br < 0.18f ||
                              br > 0.68f
                          ) {
                              continue;
                          }

                          if (
                              dr < 0.04f
                          ) {
                              continue;
                          }

                          int changes = 0;

                          for (
                              int yy = 10;
                              yy <= 32;
                              yy += 4
                          ) {

                              int previous = -1;

                              for (
                                  int xx = -12;
                                  xx <= 12;
                                  xx += 4
                              ) {

                                  int px =
                                      x + xx;

                                  int py =
                                      y + yy;

                                  if (
                                      px < 0 ||
                                      py < 0 ||
                                      px >= w ||
                                      py >= h
                                  ) {
                                      continue;
                                  }

                                  int c =
                                      b.getPixel(
                                          px,
                                          py
                                      );

                                  int v =
                                      (
                                          Color.red(c)
                                          +
                                          Color.green(c)
                                          +
                                          Color.blue(c)
                                      ) / 3;

                                  if (
                                      previous >= 0 &&
                                      Math.abs(
                                          v - previous
                                      ) > 35
                                  ) {

                                      changes++;
                                  }

                                  previous = v;
                              }
                          }

                          if (
                              changes < 2
                          ) {
                              continue;
                          }

                          double score =
                              br * 50
                              +
                              dr * 80
                              +
                              changes * 2;

                          if (
                              score > bestScore
                          ) {

                              bestScore =
                                  score;

                              best =
                                  new Target(
                                      x,
                                      Math.min(
                                          y + 35,
                                          bottom
                                      ),
                                      (float)score
                                  );
                          }
                      }
                  }

                  if (
                      best == null ||
                      best.confidence < 20
                  ) {

                      return null;
                  }

                  return best;
              }

              /*
               * ใช้ดูว่าหน้าจอเปลี่ยนหรือไม่
               */
              public static double difference(
                  Bitmap a,
                  Bitmap b
              ) {

                  if (
                      a == null ||
                      b == null
                  ) {
                      return 0;
                  }

                  int w =
                      Math.min(
                          a.getWidth(),
                          b.getWidth()
                      );

                  int h =
                      Math.min(
                          a.getHeight(),
                          b.getHeight()
                      );

                  long total = 0;
                  long count = 0;

                  for (
                      int y =
                          (int)(h * 0.18f);
                      y <
                          (int)(h * 0.75f);
                      y += 16
                  ) {

                      for (
                          int x =
                              (int)(w * 0.10f);
                          x <
                              (int)(w * 0.90f);
                          x += 16
                      ) {

                          int ca =
                              a.getPixel(
                                  x,
                                  y
                              );

                          int cb =
                              b.getPixel(
                                  x,
                                  y
                              );

                          total +=
                              Math.abs(
                                  Color.red(ca)
                                  -
                                  Color.red(cb)
                              );

                          total +=
                              Math.abs(
                                  Color.green(ca)
                                  -
                                  Color.green(cb)
                              );

                          total +=
                              Math.abs(
                                  Color.blue(ca)
                                  -
                                  Color.blue(cb)
                              );

                          count += 3;
                      }
                  }

                  if (count == 0) {
                      return 0;
                  }

                  return
                      (double)total /
                      count;
              }
          }
          EOF

