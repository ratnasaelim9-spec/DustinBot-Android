package com.dustinbot.v11;

import android.graphics.Rect;
import android.view.accessibility.AccessibilityNodeInfo;
import java.util.ArrayList;
import java.util.HashSet;
import java.util.List;
import java.util.Locale;
import java.util.Set;

/**
 * Accessibility runtime adapter.
 *
 * V11.1 fixes the first scanner's false positives/duplicates by:
 *  - treating generic "Map" labels as UI chrome, not a map name;
 *  - preferring exact monster labels over broad substring matches;
 *  - deduplicating the same monster exposed by parent/child accessibility nodes;
 *  - ignoring zero-size/off-screen nodes;
 *  - checking contentDescription as well as text.
 *
 * This is still an accessibility adapter. If Rune Classic does not expose mob
 * labels through Accessibility, Vision/MediaProjection remains the next layer.
 */
public final class RuntimeScanner implements MapScanner {
    private final MonsterDatabase db;
    private volatile String lastMap = "UNKNOWN";

    public RuntimeScanner(MonsterDatabase db) { this.db = db; }

    @Override public String currentMap() { return lastMap; }

    @Override public List<DetectedMonster> scan() {
        ArrayList<DetectedMonster> out = new ArrayList<>();
        Set<String> seen = new HashSet<>();
        BotAccessibilityService svc = BotAccessibilityService.instance;
        if (svc == null) return out;
        AccessibilityNodeInfo root = svc.getRootNode();
        if (root == null) return out;
        try {
            walk(root, out, seen);
        } finally {
            root.recycle();
        }
        return out;
    }

    private void walk(AccessibilityNodeInfo n, List<DetectedMonster> out, Set<String> seen) {
        if (n == null) return;

        String text = safe(n.getText());
        String desc = safe(n.getContentDescription());

        // Map labels are read only when they look like an actual map name.
        String mapCandidate = bestMapCandidate(text, desc);
        if (mapCandidate != null) lastMap = mapCandidate;

        Monster m = findMonster(text, desc);
        if (m != null) {
            Rect r = new Rect();
            n.getBoundsInScreen(r);
            if (validBounds(r)) {
                float x = r.centerX();
                float y = r.centerY();
                // Parent and child nodes often expose the same label/bounds.
                String key = m.id + "@" + Math.round(x / 8f) + ":" + Math.round(y / 8f);
                if (seen.add(key)) out.add(new DetectedMonster(m.id, x, y, 0f));
            }
        }

        for (int i = 0; i < n.getChildCount(); i++) {
            AccessibilityNodeInfo child = n.getChild(i);
            if (child != null) walk(child, out, seen);
        }
    }

    private Monster findMonster(String text, String desc) {
        String a = normalize(text);
        String b = normalize(desc);
        if (a.isEmpty() && b.isEmpty()) return null;

        // First pass: exact label/code match. This avoids accidental matches
        // when a large UI label contains unrelated words.
        for (Monster m : db.all()) {
            String name = normalize(m.name);
            String code = normalize(m.code);
            if ((!name.isEmpty() && (a.equals(name) || b.equals(name)))
                    || (!code.isEmpty() && (a.equals(code) || b.equals(code)))) {
                return m;
            }
        }

        // Second pass: only accept a substring match when the UI text is a
        // compact label, not a long screen/container description.
        for (Monster m : db.all()) {
            String name = normalize(m.name);
            String code = normalize(m.code);
            if (!name.isEmpty() && (containsAsToken(a, name) || containsAsToken(b, name))) return m;
            if (!code.isEmpty() && (containsAsToken(a, code) || containsAsToken(b, code))) return m;
        }
        return null;
    }

    private String bestMapCandidate(String text, String desc) {
        String[] candidates = {text, desc};
        for (String raw : candidates) {
            String s = safe(raw);
            if (s.isEmpty()) continue;
            String x = s.toLowerCase(Locale.ROOT).trim();
            if (x.equals("map") || x.equals("แผนที่") || x.equals("map:") || x.equals("แผนที่:")) continue;
            if (looksLikeMapName(x)) return s;
        }
        return null;
    }

    private boolean looksLikeMapName(String x) {
        return x.matches(".*\\b(field|dungeon|cave|forest|town|city|prontera|geffen|payon|morocc|alberta|izlude|comodo|aldebaran|pay_fild|prt_fild|gef_fild|moc_fild)\\b.*")
                || x.contains("_fild") || x.contains("_field") || x.contains("map_")
                || x.contains("แมพ") || x.contains("แผนที่");
    }

    private boolean containsAsToken(String haystack, String needle) {
        if (haystack.isEmpty() || needle.isEmpty()) return false;
        if (haystack.length() > Math.max(80, needle.length() * 5)) return false;
        return haystack.contains(needle);
    }

    private boolean validBounds(Rect r) {
        return r != null && r.width() >= 2 && r.height() >= 2
                && r.left < 5000 && r.top < 5000 && r.right > -5000 && r.bottom > -5000;
    }

    private String normalize(String s) {
        return safe(s).toLowerCase(Locale.ROOT).replaceAll("\\s+", " ").trim();
    }

    private String safe(CharSequence cs) { return cs == null ? "" : cs.toString().trim(); }
    private String safe(String s) { return s == null ? "" : s.trim(); }
}



